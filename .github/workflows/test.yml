name: CI

on:
  push:
    branches: [master, integrate/master]
  pull_request:
    branches: [master]

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Core server dependencies. Heavy ML libs (torch, transformers,
          # sentence-transformers, chromadb) are intentionally EXCLUDED — the
          # tests mock them (vector store, embedding model, emotion model), so
          # CI stays fast. numpy + pillow are lightweight hard deps imported at
          # module load (numpy across the server, PIL by the CHARA-card tests).
          pip install \
            fastapi uvicorn starlette python-multipart psutil requests httpx \
            edge-tts huggingface_hub numpy pillow
          # Test runner
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: pytest backend/tests/ -v --tb=short

  # NOTE: the old `lint-frontend` job targeting frontends/neon was removed.
  # Neon is a legacy, archived JS frontend with no package.json / lockfile and
  # no ESLint config, so the job's `cache-dependency-path: frontends/neon/
  # package-lock.json` hard-failed on every run ("Some specified paths were not
  # resolved, unable to cache dependencies") while linting nothing. Sakura is
  # the active frontend and is covered by the Vitest + tsc gates below.

  frontend-tests:
    name: Sakura frontend tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontends/sakura/package-lock.json

      - name: Install dependencies
        working-directory: frontends/sakura
        run: npm ci

      - name: Run Vitest
        working-directory: frontends/sakura
        run: npx vitest run
