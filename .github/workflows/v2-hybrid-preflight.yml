name: v2-hybrid-preflight

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontends/v2/**"
      - "tools/v2_hybrid_preflight.sh"
      - "tools/v2_hybrid_capture_telemetry.sh"
      - "tools/v2_hybrid_collect_gate_evidence.sh"
      - "docs/V2_*.md"
  push:
    branches:
      - master
      - "codex/**"
    paths:
      - "backend/**"
      - "frontends/v2/**"
      - "tools/v2_hybrid_preflight.sh"
      - "tools/v2_hybrid_capture_telemetry.sh"
      - "tools/v2_hybrid_collect_gate_evidence.sh"
      - "docs/V2_*.md"

jobs:
  hybrid-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontends/v2/package-lock.json"

      - name: Install backend test/runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx psutil python-multipart requests huggingface_hub

      - name: Install frontend deps
        working-directory: frontends/v2
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontends/v2
        run: npx playwright install --with-deps chromium

      - name: Run hybrid preflight
        run: ./tools/v2_hybrid_preflight.sh

      - name: Capture telemetry evidence artifact
        env:
          WAIFU_TELEMETRY_AUTOSTART_BACKEND: "1"
          WAIFU_TELEMETRY_BACKEND_CMD: "python backend/server.py"
          WAIFU_TELEMETRY_DISABLE_VECTOR_STORE: "1"
          WAIFU_TELEMETRY_OUTPUT_DIR: "${{ github.workspace }}/tmp/v2-telemetry"
          WAIFU_CUTOVER_MAX_API_ERROR_RATE: "0.05"
          WAIFU_CUTOVER_MAX_MEMORY_FALLBACK_RATE: "1.00"
          WAIFU_CUTOVER_MAX_CHAT_FAILURE_RATE: "1.00"
          WAIFU_CUTOVER_MIN_API_REQUESTS: "1"
          WAIFU_CUTOVER_MIN_MEMORY_GRAPH_REQUESTS: "1"
          WAIFU_TELEMETRY_FAIL_ON_BREACH: "0"
        run: ./tools/v2_hybrid_capture_telemetry.sh

      - name: Upload telemetry evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-hybrid-telemetry-${{ github.run_number }}
          path: |
            tmp/v2-telemetry/v2_hybrid_daily_snapshots.csv
            tmp/v2-telemetry/V2_HYBRID_7DAY_REPORT.md
