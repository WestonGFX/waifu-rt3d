name: v2-hybrid-preflight

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontends/v2/**"
      - "tools/v2_hybrid_preflight.sh"
      - "docs/V2_*.md"
  push:
    branches:
      - master
      - "codex/**"
    paths:
      - "backend/**"
      - "frontends/v2/**"
      - "tools/v2_hybrid_preflight.sh"
      - "docs/V2_*.md"

jobs:
  hybrid-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontends/v2/package-lock.json"

      - name: Install backend test/runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx psutil python-multipart requests huggingface_hub

      - name: Install frontend deps
        working-directory: frontends/v2
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontends/v2
        run: npx playwright install --with-deps chromium

      - name: Run hybrid preflight
        run: ./tools/v2_hybrid_preflight.sh
