<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <linearGradient id="w-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Border glow -->
  <rect width="500" height="500" x="6" y="6" rx="76" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.3"/>
  <!-- W letterform with glow -->
  <g filter="url(#glow)">
    <path d="M100 140 L180 380 L256 220 L332 380 L412 140"
          fill="none" stroke="url(#w-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Decorative circuit dots -->
  <circle cx="100" cy="120" r="6" fill="#00f0ff" opacity="0.5"/>
  <circle cx="412" cy="120" r="6" fill="#ff003c" opacity="0.5"/>
  <circle cx="256" cy="400" r="4" fill="#39ff14" opacity="0.4"/>
</svg>
