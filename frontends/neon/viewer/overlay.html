<!doctype html>
<!--
  OBS Streaming Overlay — waifu-rt3d Phase 6J

  Renders the active VRM character over a fully transparent background.
  Designed to be added as an OBS Browser Source at:
      http://localhost:8080/viewer/overlay.html

  The page connects to the /ws/overlay WebSocket on the backend and reacts
  to AI responses (speech, expressions, animations) in real-time so the
  character is always in sync with the stream interaction.

  CSS background is transparent (requires OBS "Enable transparent background"
  checkbox in Browser Source properties).
-->
<html>
<head>
    <meta charset="utf-8" />
    <title>Waifu Overlay</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: transparent;
            overflow: hidden;
        }
        canvas#c {
            display: block;
            width: 100%; height: 100%;
        }
        /* ── Subtitle bar ────────────────────────────────────────────── */
        #subtitle-bar {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 70%;
            min-height: 36px;
            background: rgba(0, 0, 0, 0.72);
            color: #f0f0ff;
            font: 600 18px/1.45 "Segoe UI", system-ui, sans-serif;
            padding: 8px 20px;
            border-radius: 12px;
            text-align: center;
            word-break: break-word;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid rgba(120, 80, 255, 0.35);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        #subtitle-bar.visible { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="subtitle-bar"></div>

    <script type="importmap">
        { "imports": { "three": "/frontend/lib/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from '/frontend/lib/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '/frontend/lib/three-vrm.module.min.js';
        import { OrbitControls } from '/frontend/lib/OrbitControls.js';

        // ── State ────────────────────────────────────────────────────
        let currentVrm = null;
        let lipSync = null;
        let blinkController = null;
        let headMovement = null;
        let isTalking = false;
        const clock = new THREE.Clock();

        // ── Renderer ─────────────────────────────────────────────────
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            alpha: true,          // Transparent canvas background for OBS
        });
        renderer.setClearAlpha(0);
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        // ── Scene + camera ────────────────────────────────────────────
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.4, 2.8);

        // Lighting (copy of viewer.html studio preset)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 3, 2);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x8080ff, 0.4);
        fillLight.position.set(-2, 1, -1);
        scene.add(fillLight);

        // ── Resize ────────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // ── AudioLipSync (simplified 3-band FFT — same as viewer.html) ─
        class AudioLipSync {
            /**
             * @param {Object} vrm - Loaded VRM instance
             */
            constructor(vrm) {
                this.vrm = vrm;
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 512;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.isPlaying = false;
                this.currentSource = null;
                this.smoothAa = 0;
                this.smoothOu = 0;
                this.smoothEe = 0;
            }

            /**
             * Fetch and play audio URL, driving visemes from FFT analysis.
             * @param {string} url - Audio file URL
             */
            async play(url) {
                this.stop();
                try {
                    const buf = await (await fetch(url)).arrayBuffer();
                    const decoded = await this.audioContext.decodeAudioData(buf);
                    const src = this.audioContext.createBufferSource();
                    src.buffer = decoded;
                    src.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    this.currentSource = src;
                    this.isPlaying = true;
                    isTalking = true;
                    src.start(0);
                    src.onended = () => {
                        this.isPlaying = false;
                        isTalking = false;
                        this._zero();
                    };
                    this._update();
                } catch (e) {
                    console.error('[Overlay] LipSync error:', e);
                    isTalking = false;
                }
            }

            _update() {
                if (!this.isPlaying) return;
                this.analyser.getByteFrequencyData(this.dataArray);
                let low = 0, mid = 0, high = 0;
                for (let i = 0; i <= 5; i++) low += this.dataArray[i];
                for (let i = 6; i <= 23; i++) mid += this.dataArray[i];
                for (let i = 24; i <= 63; i++) high += this.dataArray[i];
                const aa = Math.min(low / 6 / 128, 1);
                const ou = Math.min(mid / 18 / 128, 1);
                const ee = Math.min(high / 40 / 128, 1);
                this.smoothAa = aa * 0.4 + this.smoothAa * 0.6;
                this.smoothOu = ou * 0.35 + this.smoothOu * 0.65;
                this.smoothEe = ee * 0.5 + this.smoothEe * 0.5;
                this._apply(this.smoothAa, this.smoothOu, this.smoothEe);
                requestAnimationFrame(() => this._update());
            }

            _apply(aa, ou, ee) {
                const em = this.vrm?.expressionManager || this.vrm?.blendShapeProxy;
                if (!em) return;
                try { em.setValue('aa', aa); } catch {}
                try { em.setValue('ou', ou); } catch {}
                try { em.setValue('ee', ee); } catch {}
            }

            _zero() {
                this.smoothAa = this.smoothOu = this.smoothEe = 0;
                this._apply(0, 0, 0);
            }

            stop() {
                try { this.currentSource?.stop(); } catch {}
                this.currentSource = null;
                this.isPlaying = false;
                this._zero();
            }
        }

        // ── BlinkController (simplified) ──────────────────────────────
        class BlinkController {
            constructor(vrm) {
                this.vrm = vrm;
                this.timer = 2 + Math.random() * 4;
                this.blinking = false;
                this.progress = 0;
            }
            update(dt) {
                if (this.blinking) {
                    this.progress += dt * 10;
                    const v = this.progress < 0.5 ? this.progress * 2 : 1 - (this.progress - 0.5) * 2;
                    const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                    if (em) try { em.setValue('blink', Math.max(0, Math.min(1, v))); } catch {}
                    if (this.progress >= 1) { this.blinking = false; this.progress = 0; this.timer = 2 + Math.random() * 4; }
                } else {
                    this.timer -= dt;
                    if (this.timer <= 0) this.blinking = true;
                }
            }
        }

        // ── IdleHeadMovement (idle vs. talking params) ─────────────────
        const MOTION_IDLE = { nod: 0.08, turn: 0.12, tilt: 0.05, minI: 4, maxI: 9, lerp: 0.4 };
        const MOTION_TALK = { nod: 0.15, turn: 0.18, tilt: 0.10, minI: 1, maxI: 3, lerp: 0.6 };

        class IdleHeadMovement {
            constructor(vrm) {
                this.vrm = vrm;
                this.target = { x: 0, y: 0, z: 0 };
                this.current = { x: 0, y: 0, z: 0 };
                this.timer = 4;
            }
            update(dt) {
                const mp = isTalking ? MOTION_TALK : MOTION_IDLE;
                this.timer -= dt;
                if (this.timer <= 0) {
                    this.target = {
                        x: (Math.random() - 0.5) * mp.nod * 2,
                        y: (Math.random() - 0.5) * mp.turn * 2,
                        z: (Math.random() - 0.5) * mp.tilt * 2,
                    };
                    this.timer = mp.minI + Math.random() * (mp.maxI - mp.minI);
                }
                const ls = dt * mp.lerp;
                ['x','y','z'].forEach(a => { this.current[a] += (this.target[a] - this.current[a]) * ls; });
                const getBone = n => this.vrm.humanoid.getNormalizedBoneNode
                    ? this.vrm.humanoid.getNormalizedBoneNode(n)
                    : this.vrm.humanoid.getBoneNode(n);
                const head = getBone('head');
                if (head) { head.rotation.x = this.current.x; head.rotation.y = this.current.y; head.rotation.z = this.current.z; }
            }
        }

        // ── VRM Loader ───────────────────────────────────────────────
        function loadVRM(url) {
            const loader = new GLTFLoader();
            loader.register(p => new VRMLoaderPlugin(p));
            loader.load(url, gltf => {
                if (currentVrm) {
                    scene.remove(currentVrm.scene);
                    VRMUtils.deepDispose(currentVrm.scene);
                }
                const vrm = gltf.userData.vrm;
                if (!vrm) return;

                if (typeof VRMUtils.combineMorphs === 'function') VRMUtils.combineMorphs(vrm);
                if ((vrm.meta?.metaVersion ?? '0') === '0') VRMUtils.rotateVRM0(vrm);

                scene.add(vrm.scene);
                currentVrm = vrm;

                // Natural A-pose arms
                const getBone = n => vrm.humanoid.getNormalizedBoneNode
                    ? vrm.humanoid.getNormalizedBoneNode(n)
                    : vrm.humanoid.getBoneNode(n);
                const lArm = getBone('leftUpperArm');
                const rArm = getBone('rightUpperArm');
                if (lArm) lArm.rotation.z = -0.7;
                if (rArm) rArm.rotation.z = 0.7;

                lipSync = new AudioLipSync(vrm);
                blinkController = new BlinkController(vrm);
                headMovement = new IdleHeadMovement(vrm);

                // Frame camera to model
                const headBone = vrm.humanoid.getRawBoneNode('head');
                if (headBone) {
                    const hp = new THREE.Vector3();
                    headBone.getWorldPosition(hp);
                    camera.position.set(0, hp.y - 0.1, 2.4);
                    camera.lookAt(0, hp.y - 0.1, 0);
                }

                console.log('[Overlay] VRM loaded:', url);
            }, undefined, e => console.error('[Overlay] VRM load error:', e));
        }

        // ── Subtitle system ───────────────────────────────────────────
        const subtitleBar = document.getElementById('subtitle-bar');
        let subtitleTimeout = null;

        /**
         * Display text in the subtitle bar for a duration, then fade out.
         * @param {string} text - Text to display
         * @param {number} durationMs - How long to show it (default 8000ms)
         */
        function showSubtitle(text, durationMs = 8000) {
            if (subtitleTimeout) clearTimeout(subtitleTimeout);
            subtitleBar.textContent = text;
            subtitleBar.classList.add('visible');
            subtitleTimeout = setTimeout(() => {
                subtitleBar.classList.remove('visible');
            }, durationMs);
        }

        // ── WebSocket connection to backend ───────────────────────────
        let ws = null;
        let wsReconnectDelay = 2000;

        /**
         * Connect (or reconnect) to the /ws/overlay WebSocket.
         * Auto-reconnects on disconnect with exponential backoff (max 30s).
         */
        function connectOverlayWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const host = location.host;
            ws = new WebSocket(`${proto}://${host}/ws/overlay`);

            ws.onopen = () => {
                console.log('[Overlay] WebSocket connected');
                wsReconnectDelay = 2000;
                // Send keep-alive ping every 20s
                setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send('ping'); }, 20000);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'speak') {
                        if (msg.text) showSubtitle(msg.text, Math.max(4000, msg.text.length * 80));
                        if (msg.audio_url && lipSync) {
                            lipSync.play(msg.audio_url);
                        }
                    } else if (msg.type === 'animate' && msg.name) {
                        console.log('[Overlay] Animation event:', msg.name);
                        // Animation playback via Mixamo (Phase 6F) — stub for now
                    }
                } catch (e) {
                    console.error('[Overlay] WS message parse error:', e);
                }
            };

            ws.onclose = () => {
                console.log(`[Overlay] WS closed, reconnecting in ${wsReconnectDelay}ms...`);
                setTimeout(connectOverlayWS, wsReconnectDelay);
                wsReconnectDelay = Math.min(wsReconnectDelay * 1.5, 30000);
            };

            ws.onerror = e => console.warn('[Overlay] WS error:', e);
        }

        // ── Animation loop ─────────────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (currentVrm) {
                currentVrm.update(delta);
                if (blinkController) blinkController.update(delta);
                if (headMovement) headMovement.update(delta);

                // Breathing
                const t = clock.elapsedTime;
                const getBone = n => currentVrm.humanoid.getNormalizedBoneNode
                    ? currentVrm.humanoid.getNormalizedBoneNode(n)
                    : currentVrm.humanoid.getBoneNode(n);
                const chest = getBone('chest') || getBone('spine');
                if (chest) chest.rotation.x = Math.sin(t * 2) * 0.003;

                // Maintain A-pose arm baseline
                const lArm = getBone('leftUpperArm');
                const rArm = getBone('rightUpperArm');
                if (lArm) lArm.rotation.z = -0.7;
                if (rArm) rArm.rotation.z = 0.7;
            }

            renderer.render(scene, camera);
        }
        animate();

        // ── Bootstrap ─────────────────────────────────────────────────
        // Load the active VRM from the app config, or use URL param ?url=
        (async () => {
            const urlParam = new URLSearchParams(location.search).get('url');
            if (urlParam) {
                loadVRM(urlParam);
            } else {
                // Fetch active character's VRM from backend config
                try {
                    const state = await (await fetch('/api/state')).json();
                    const chars = state.characters || [];
                    const activeId = state.currentCharacterId || (chars[0]?.id);
                    const char = chars.find(c => c.id == activeId) || chars[0];
                    if (char?.vrm_model_url) {
                        loadVRM(char.vrm_model_url);
                    }
                } catch (e) {
                    console.warn('[Overlay] Could not fetch active character:', e);
                }
            }
        })();

        connectOverlayWS();
    </script>
</body>
</html>
