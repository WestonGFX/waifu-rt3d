                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                switch (this.currentGesture) {
                    case 'nod': {
                        const neck = getBone('neck');
                        if (neck) neck.rotation.x = eased * 0.3;
                        break;
                    }
                    case 'tilt': {
                        const head = getBone('head');
                        if (head) head.rotation.z = eased * 0.35;
                        break;
                    }
                    case 'wave': {
                        const rightArm = getBone('rightUpperArm');
                        const rightHand = getBone('rightHand');
                        if (rightArm) {
                            rightArm.rotation.z = -eased * 1.45;
                            rightArm.rotation.x = eased * 0.3;
                        }
                        if (rightHand) rightHand.rotation.z = Math.sin(t * Math.PI * 4) * 0.4;
                        break;
                    }
                    case 'shrug': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        const headBone = getBone('head');
                        if (headBone) headBone.rotation.z = Math.sin(t * Math.PI) * 0.1;
                        break;
                    }
                    case 'bow': {
                        const spine = getBone('spine');
                        const neck = getBone('neck');
                        if (spine) spine.rotation.x = eased * 0.4;
                        if (neck) neck.rotation.x = eased * 0.2;
                        break;
                    }
                    case 'clap': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lForearm = getBone('leftLowerArm');
                        const rForearm = getBone('rightLowerArm');
                        const clapCycle = Math.sin(t * Math.PI * 6); // 3 claps
                        if (lArm) lArm.rotation.z = 0.5 + clapCycle * 0.15;
                        if (rArm) rArm.rotation.z = -0.5 - clapCycle * 0.15;
                        if (lForearm) lForearm.rotation.y = -0.8 + clapCycle * 0.2;
                        if (rForearm) rForearm.rotation.y = 0.8 - clapCycle * 0.2;
                        break;
                    }
                    case 'think': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        const head = getBone('head');
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (rForearm) rForearm.rotation.y = eased * 1.2;
                        if (head) {
                            head.rotation.z = eased * 0.12;
                            head.rotation.x = eased * 0.08;
                        }
                        break;
                    }
                    case 'point': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        if (rArm) {
                            rArm.rotation.z = -eased * 0.8;
                            rArm.rotation.x = eased * 0.3;
                        }
                        if (rForearm) rForearm.rotation.y = eased * 0.4;
                        break;
                    }
                    case 'celebrate': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lHand = getBone('leftHand');
                        const rHand = getBone('rightHand');
                        if (lArm) lArm.rotation.z = eased * 1.5;
                        if (rArm) rArm.rotation.z = -eased * 1.5;
                        if (lHand) lHand.rotation.z = Math.sin(t * Math.PI * 6) * 0.4;
                        if (rHand) rHand.rotation.z = Math.sin(t * Math.PI * 6 + 1) * 0.4;
                        break;
                    }
                    case 'shy': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const head = getBone('head');
                        const spine = getBone('spine');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (head) head.rotation.x = eased * 0.2;
                        if (spine) spine.rotation.z = eased * 0.05;
                        break;
                    }
                    case 'dance': {
                        const hips = getBone('hips');
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const danceBeat = Math.sin(t * Math.PI * 4);
                        if (hips) hips.position.y = danceBeat * 0.02;
                        if (lArm) lArm.rotation.z = 0.3 + danceBeat * 0.4;
                        if (rArm) rArm.rotation.z = -0.3 - danceBeat * 0.4;
                        break;
                    }

                    case 'foot_tap': {
                        // Rapid foot-tap: right leg lifts and drops 3 times.
                        // Each cycle is 0.6s → 3 taps in 1.8s total.
                        const tapFreq = 3;  // taps per gesture duration
                        const tapBeat = Math.sin(t * Math.PI * 2 * tapFreq);
                        const rLeg = getBone('rightUpperLeg');
                        const rLower = getBone('rightLowerLeg');
                        const rFoot = getBone('rightFoot');
                        if (rLeg)   rLeg.rotation.x   = tapBeat * 0.12;   // slight hip kick
                        if (rLower) rLower.rotation.x  = -tapBeat * 0.1;  // knee flex
                        if (rFoot)  rFoot.rotation.x   = tapBeat * 0.15;  // foot strike
                        break;
                    }

                    case 'crossed_arms': {
                        // Bring both upper arms forward and across the chest.
                        // Hold position for the full duration (sustained pose).
                        const holdT = Math.min(1.0, eased * 2.0);  // fast ramp-in, hold, ramp-out at end
                        const releaseT = t > 0.8 ? (1.0 - t) / 0.2 : 1.0;
                        const blend = holdT * releaseT;
                        const lUpper = getBone('leftUpperArm');
                        const rUpper = getBone('rightUpperArm');
                        const lLower = getBone('leftLowerArm');
                        const rLower2 = getBone('rightLowerArm');
                        // Pull arms inward across chest
                        if (lUpper) { lUpper.rotation.x = blend * 1.1; lUpper.rotation.z = blend * -0.5; }
                        if (rUpper) { rUpper.rotation.x = blend * 1.1; rUpper.rotation.z = blend * 0.5; }
                        // Forearms fold to complete the cross
                        if (lLower)  lLower.rotation.x  = blend * 1.2;
                        if (rLower2) rLower2.rotation.x = blend * 1.2;
                        break;
                    }

                    case 'shake': {
                        // Head shake left-right (disagreement / "no" gesture)
                        const shakeBeat = Math.sin(t * Math.PI * 3);
                        const neck = getBone('neck');
                        const head = getBone('head');
                        if (neck) neck.rotation.y = shakeBeat * 0.25;
                        if (head) head.rotation.y = shakeBeat * 0.15;
                        break;
                    }
                }
            }

            resetGesture() {
                if (!this.vrm) return;
                const bones = ['neck', 'head', 'spine', 'hips',
                               'leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm',
                               'leftHand', 'rightHand',
                               'rightUpperLeg', 'rightLowerLeg', 'rightFoot'];
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                bones.forEach(boneName => {
                    const bone = getBone(boneName);
                    if (bone) {
                        bone.rotation.x = 0;
                        bone.rotation.y = 0;
                        bone.rotation.z = 0;
                        if (bone.position) {
                            bone.position.x = 0;
                            bone.position.y = 0;
                            bone.position.z = 0;
                        }
                    }
                });
            }
        }

        // ══════════════════════════════════════════════════════════
        // Lighting Presets
        // ══════════════════════════════════════════════════════════

        const LIGHT_PRESETS = {
            studio: {
                key: { color: 0xffffff, intensity: 1.5, position: [1, 2, 3] },
                fill: { color: 0xffffff, intensity: 0.5, position: [-1, 1, -2] },
                ambient: { color: 0xffffff, intensity: 0.8 }
            },
            warm_sunset: {
                key: { color: 0xffaa44, intensity: 1.8, position: [2, 1, 1] },
                fill: { color: 0xff6633, intensity: 0.4, position: [-2, 0.5, -1] },
                ambient: { color: 0xffddbb, intensity: 0.6 }
            },
            cool_moonlight: {
                key: { color: 0x6688ff, intensity: 1.2, position: [-1, 3, 2] },
                fill: { color: 0x4466cc, intensity: 0.3, position: [1, 0.5, -1] },
                ambient: { color: 0x334488, intensity: 0.5 }
            },
            dramatic: {
                key: { color: 0xff0044, intensity: 2.0, position: [3, 2, 0] },
                fill: { color: 0x0044ff, intensity: 0.6, position: [-3, 1, 0] },
                ambient: { color: 0x111122, intensity: 0.3 }
            },
            neon: {
                key: { color: 0x00ffcc, intensity: 1.6, position: [1, 2, 2] },
                fill: { color: 0xff00ff, intensity: 0.8, position: [-1, 1, -1] },
                ambient: { color: 0x220033, intensity: 0.4 }
            }
        };

        // ══════════════════════════════════════════════════════════
        // Emotion → Auto-Gesture
        // ══════════════════════════════════════════════════════════

        /**
         * Maps emotion names to candidate gesture(s) triggered automatically
         * when the character's emotion changes. Arrays are randomly sampled
         * so the character doesn't always use the same motion for the same feeling.
         * Emotions absent from the map (e.g. 'angry', 'neutral') trigger nothing —
         * stillness is intentional for those states.
         */
        const EMOTION_GESTURE_MAP = {
            happy:     ['wave', 'clap'],
            excited:   ['celebrate'],
            sad:       ['shy'],
            surprised: ['tilt'],
            thinking:  ['think'],
            confused:  ['think'],
        };

        /**
         * Conditionally play a contextual gesture when the character's emotion changes.
         *
         * Guards (all must pass):
         *   1. Emotion changed from last auto-gesture trigger — prevents re-firing
         *   2. No gesture currently playing — avoids interrupting in-progress animation
         *   3. 40% random chance — keeps gestures spontaneous, not mechanical every message
         *   4. Emotion has an entry in EMOTION_GESTURE_MAP
         *
         * @param {string|null} emotion - Incoming emotion name from setEmotion/setExpression
         */
        function _triggerAutoGesture(emotion) {
            const gl = animationDirector?.getLayer('gesture');
            if (!emotion || !gl) return;
            if (emotion === lastAutoGestureEmotion) return;  // dedup
            if (gl.isPlaying) return;                         // don't interrupt
            if (Math.random() > 0.4) return;                  // 40% chance
            const candidates = EMOTION_GESTURE_MAP[emotion];
            if (!candidates || candidates.length === 0) return;
            lastAutoGestureEmotion = emotion;
            const gesture = candidates[Math.floor(Math.random() * candidates.length)];
            gl.playGesture(gesture);
            console.log(`[Viewer] Auto-gesture: ${emotion} → ${gesture}`);
        }

        // ══════════════════════════════════════════════════════════
        // Main Init
        // ══════════════════════════════════════════════════════════

        /**
         * Frame data stored after a VRM model loads so camera presets can
         * compute positions relative to the actual model size.
         * @type {{targetY: number, camZ: number, modelHeight: number, headY: number}|null}
         */
        let _vrmFrameData = null;

        async function init() {
            const canvas = document.getElementById('c');
            const bgVideo = document.getElementById('bg-video');

            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                alpha: true,
                preserveDrawingBuffer: true   // Required for screenshot toDataURL()
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Three.js r150+: outputEncoding → outputColorSpace
            if ('outputColorSpace' in renderer) {
                renderer.outputColorSpace = THREE.SRGBColorSpace;
            } else {
                renderer.outputEncoding = THREE.sRGBEncoding;
            }

            const scene = new THREE.Scene();
            // Default dark background so VRM is visible against the UI
            // (transparent renders as invisible on the dark cyberpunk layout)
            scene.background = new THREE.Color(0x0a0b14);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.25, 1.5);

            // Orbit controls
            const controls = new SimpleOrbitControls(camera, canvas);

            // Lighting (stored as refs for dynamic updates)
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyLight.position.set(1, 2, 3);
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-1, 1, -2);
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(keyLight, fillLight, ambientLight);

            // Disco / party lighting (#25): three RGB point lights, hidden by default.
            // Hue cycles at different speeds when disco mode is active.
            const discoLights = [
                new THREE.PointLight(0xff0000, 0, 4),
                new THREE.PointLight(0x00ff00, 0, 4),
                new THREE.PointLight(0x0000ff, 0, 4),
            ];
            discoLights[0].position.set( 1.5, 2.0,  1.0);
            discoLights[1].position.set(-1.5, 1.5,  0.5);
            discoLights[2].position.set( 0.0, 2.5, -1.0);
            discoLights.forEach(l => scene.add(l));
            let _discoActive = false;
            let _discoTime   = 0;

            /**
             * Apply a lighting configuration to the scene.
             * @param {Object} config - Lighting config with key/fill/ambient properties
             */
            function setLighting(config) {
                if (config.key) {
                    if (config.key.color !== undefined) keyLight.color.set(config.key.color);
                    if (config.key.intensity !== undefined) keyLight.intensity = config.key.intensity;
                    if (config.key.position) keyLight.position.fromArray(config.key.position);
                }
                if (config.fill) {
                    if (config.fill.color !== undefined) fillLight.color.set(config.fill.color);
                    if (config.fill.intensity !== undefined) fillLight.intensity = config.fill.intensity;
                    if (config.fill.position) fillLight.position.fromArray(config.fill.position);
                }
                if (config.ambient) {
                    if (config.ambient.color !== undefined) ambientLight.color.set(config.ambient.color);
                    if (config.ambient.intensity !== undefined) ambientLight.intensity = config.ambient.intensity;
                }
                console.log('[Viewer] Lighting updated');
            }

            /**
             * Set the scene background.
             * @param {string} mode - 'color', 'image', 'video', 'gradient', or 'transparent'
             * @param {string|number} value - Color hex, image URL, video URL, or gradient CSS
             */
            function setBackground(mode, value) {
                console.log("[Viewer] BG_MODE:", mode, value);
                // Hide video by default
                bgVideo.style.display = 'none';
                bgVideo.pause();

                if (mode === 'color') {
                    scene.background = new THREE.Color(value);
                    renderer.setClearAlpha(1);
                } else if (mode === 'image') {
                    new THREE.TextureLoader().load(value, (tex) => {
                        scene.background = tex;
                        renderer.setClearAlpha(1);
                    });
                } else if (mode === 'video') {
                    // Use HTML video element behind canvas
                    scene.background = null;
                    renderer.setClearAlpha(0);
                    bgVideo.src = value;
                    bgVideo.style.display = 'block';
                    bgVideo.play().catch(e => console.warn('[Viewer] Video autoplay blocked:', e));
                } else if (mode === 'gradient') {
                    // Apply CSS gradient to body, keep scene transparent
                    scene.background = null;
                    renderer.setClearAlpha(0);
                    document.body.style.background = value;
                } else {
                    // "transparent" mode — use dark fallback to match UI theme
                    scene.background = new THREE.Color(0x0a0b14);
                    renderer.setClearAlpha(1);
                    document.body.style.background = '#0a0b14';
                }
            }

            /**
             * Capture the current viewport as a PNG data URL.
             * @returns {string} Base64 PNG data URL
             */
            function captureScreenshot() {
                renderer.render(scene, camera);
                return renderer.domElement.toDataURL('image/png');
            }

            /**
             * Get all available blend shape / expression names from the loaded VRM.
             * @returns {string[]} Array of expression names
             */
            function getAvailableBlendShapes() {
                if (!currentVrm) return [];
                const em = currentVrm.expressionManager || currentVrm.blendShapeProxy;
                if (!em) return [];

                // VRM 1.0: expressionManager has _expressionMap
                if (em._expressionMap) return Array.from(em._expressionMap.keys());
                // VRM 0.x: blendShapeProxy has _blendShapeGroups
                if (em._blendShapeGroups) return em._blendShapeGroups.map(g => g.name);
                return [];
            }

            /**
             * Set a single blend shape to a specific value (0-1).
             * @param {string} name - Blend shape name
             * @param {number} value - Value between 0 and 1
             */
            function setBlendShape(name, value) {
                if (!currentVrm) return;
                const em = currentVrm.expressionManager || currentVrm.blendShapeProxy;
                if (!em) return;
                try {
                    em.setValue(name, Math.max(0, Math.min(1, value)));
                } catch (e) {
                    console.warn('[Viewer] Blend shape not found:', name);
                }
            }

            // ── Animation Loop ──────────────────────────────────

            function animate() {
                requestAnimationFrame(animate);
                // FPS cap: skip rendering if the target frame interval hasn't elapsed.
                // rAF still fires at ~60Hz; we just do nothing on the skipped frames.
                if (_fpsTargetMs > 0) {
                    const _now = performance.now();
                    if (_now - _fpsLastRenderTime < _fpsTargetMs) return;
                    _fpsLastRenderTime = _now;
                }
                // Cap delta to 100ms to prevent animation pops when tab regains focus.
                // Browsers throttle rAF to ~1fps while hidden; on resume getDelta() returns
                // the full elapsed time, causing lerp snap and sin() position jumps.
                const delta = Math.min(clock.getDelta(), 0.1);

                controls.update();

                if (currentVrm) {
                    currentVrm.update(delta);

                    // Layered animation system (Phase 6F)
                    if (animationDirector) {
                        // Sync talk state from global isTalking flag
                        const talkLayer = animationDirector.getLayer('talk');
                        if (talkLayer) talkLayer.setTalking(isTalking);

                        animationDirector.update(delta);

                        // NOTE: A-pose arms are set by BasePoseLayer and TalkLayer.
                        // Do NOT reset arms here — it fights with TalkLayer's animated
                        // arm poses and causes visible oscillation.
                    }

                    if (blinkController) blinkController.update(delta);
                    if (expressionController) expressionController.update(delta);
                }

                // Disco mode (#25): cycle hue of three RGB point lights at different speeds
                if (_discoActive) {
                    _discoTime += delta;
                    discoLights[0].color.setHSL((_discoTime * 0.5)        % 1, 1, 0.5);
                    discoLights[1].color.setHSL((_discoTime * 0.5 + 0.33) % 1, 1, 0.5);
                    discoLights[2].color.setHSL((_discoTime * 0.5 + 0.67) % 1, 1, 0.5);
                }

                renderer.render(scene, camera);

                // FPS counter: count frames, update display once per second.
                // Posts to parent window for the right panel, and updates the
                // in-viewport overlay if visible (toggled by showFps postMessage).
                _fpsFrameCount++;
                const _fpsNow = performance.now();
                if (_fpsNow - _fpsLastTime >= 1000) {
                    _fpsDisplay = Math.round(_fpsFrameCount * 1000 / (_fpsNow - _fpsLastTime));
                    _fpsFrameCount = 0;
                    _fpsLastTime = _fpsNow;
                    window.parent?.postMessage({ type: 'fpsUpdate', fps: _fpsDisplay }, '*');
                    const fpsEl = document.getElementById('fps-overlay');
                    if (fpsEl && fpsEl.style.display !== 'none') {
                        fpsEl.textContent = `${_fpsDisplay} FPS`;
                        fpsEl.style.color = _fpsDisplay >= 55 ? '#39ff14'
                                          : _fpsDisplay >= 30 ? '#ffcc00' : '#ff4444';
                    }
                }
            }
            animate();

            // Load VRM from URL parameter if provided (direct link mode)
            const urlParam = new URLSearchParams(location.search).get('url');
            if (urlParam) {
                loadVRM(urlParam, scene, camera);
            }

            // ── Pet Mode ─────────────────────────────────────────────────
            // Detect ?pet=1 URL param. When true the viewer runs as a floating
            // popup window with a minimal chat overlay at the bottom.
            // User input is relayed to the main window via window.opener.postMessage()
            // and AI replies are received back as {type:'petReply', text} messages.
            const PET_MODE = new URLSearchParams(location.search).get('pet') === '1';

            if (PET_MODE) {
                document.body.classList.add('pet-mode');

                // Build chat overlay DOM
                const petOverlay = document.createElement('div');
                petOverlay.id = 'pet-overlay';
                petOverlay.innerHTML = `
                    <div id="pet-bubble" class="pet-bubble hidden"></div>
                    <div id="pet-input-row">
                        <input id="pet-input" type="text" placeholder="Say something\u2026" autocomplete="off">
                        <button id="pet-send">\u2192</button>
                    </div>`;
                document.body.appendChild(petOverlay);

                /**
                 * Show a transient chat bubble in the pet overlay.
                 * Auto-hides after 8 seconds.
                 *
                 * @param {string} text - Message text to display
                 * @param {'user'|'assistant'} role - Bubble style variant
                 */
                function showPetBubble(text, role) {
                    const bubble = document.getElementById('pet-bubble');
                    if (!bubble) return;
                    bubble.textContent = text;
                    bubble.className = `pet-bubble ${role}`;
                    bubble.classList.remove('hidden');
                    clearTimeout(bubble._hideTimer);
                    bubble._hideTimer = setTimeout(() => bubble.classList.add('hidden'), 8000);
                }

                /**
                 * Read the pet input, relay the text to the main window via
                 * window.opener.postMessage, and show a user bubble immediately
                 * for instant visual feedback before the AI responds.
                 */
                function sendPetMessage() {
                    const petInput = document.getElementById('pet-input');
                    const text = petInput?.value?.trim();
                    if (!text) return;
                    petInput.value = '';
                    showPetBubble('You: ' + text, 'user');
                    window.opener?.postMessage({ type: 'petMessage', text }, '*');
                }

                document.getElementById('pet-send')?.addEventListener('click', sendPetMessage);
                document.getElementById('pet-input')?.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') sendPetMessage();
                });

                // Handle AI replies and audio commands forwarded from the main window
                window.addEventListener('message', (evt) => {
                    if (evt.data?.type === 'petReply') {
                        showPetBubble(evt.data.text, 'assistant');
                    }
                });
            }

            /**
             * Apply a natural standing pose to a VRM model.
             * VRM models load in T-pose (arms out). This relaxes the skeleton
             * into a comfortable A-pose / idle standing position with arms at sides,
             * slight hand curl, and natural spine posture.
             *
             * @param {Object} vrm - Loaded VRM instance
             */
            function applyNaturalPose(vrm) {
                // MUST use normalized bones — three-vrm's vrm.update() propagates
                // normalized bone transforms to raw bones each frame. Direct raw bone
                // edits would be overwritten; normalized bone edits persist correctly.
                const bone = (name) => {
                    if (vrm.humanoid.getNormalizedBoneNode) {
                        return vrm.humanoid.getNormalizedBoneNode(name);
                    }
                    return vrm.humanoid.getBoneNode(name);
                };

                // --- Arms: bring down from T-pose to natural hang ---
                // VRM normalized space: negative Z swings arm DOWN toward hip.
                // -1.45 rad ≈ 83° below horizontal — arms hanging at sides naturally.
                const leftUpperArm = bone('leftUpperArm');
                const rightUpperArm = bone('rightUpperArm');
                if (leftUpperArm) leftUpperArm.rotation.z = -1.45;
                if (rightUpperArm) rightUpperArm.rotation.z = 1.45;

                // --- Forearms: slight elbow bend so hands sit in front of thighs ---
                const leftLowerArm = bone('leftLowerArm');
                const rightLowerArm = bone('rightLowerArm');
                if (leftLowerArm) leftLowerArm.rotation.y = 0.15;
                if (rightLowerArm) rightLowerArm.rotation.y = -0.15;

                // --- Hands: relaxed curl (not stiff open paddles) ---
                const leftHand = bone('leftHand');
                const rightHand = bone('rightHand');
                if (leftHand) { leftHand.rotation.z = -0.15; leftHand.rotation.x = 0.1; }
                if (rightHand) { rightHand.rotation.z = 0.15; rightHand.rotation.x = 0.1; }

                // --- Spine: very slight natural S-curve ---
                const spine = bone('spine');
                if (spine) spine.rotation.x = -0.02;

                const chest = bone('chest');
                if (chest) chest.rotation.x = 0.02;

                // Head: tiny downward tilt (looking at user, not sky)
                const head = bone('head');
                if (head) head.rotation.x = 0.03;

                console.log('[Viewer] Natural pose applied (normalized bones) v=FIX-20260219');
            }

            /**
             * Load a VRM model from URL into the scene.
             * Notifies parent window on success or failure via postMessage.
             *
             * @param {string} modelUrl - Path to the .vrm file
             * @param {THREE.Scene} scene - Three.js scene
             * @param {THREE.PerspectiveCamera} camera - Camera to frame the model
             */
            function loadVRM(modelUrl, scene, camera) {
                const loader = new GLTFLoader();
                loader.register((parser) => new VRMLoaderPlugin(parser));

                console.log('[Viewer] Loading VRM:', modelUrl);
                loader.load(
                    modelUrl,
                    (gltf) => {
                        // Remove previous model
                        if (currentVrm && currentVrm.scene) {
                            scene.remove(currentVrm.scene);
                            VRMUtils.deepDispose(currentVrm.scene);
                        }

                        const vrm = gltf.userData.vrm;
                        if (!vrm) {
                            console.error('[Viewer] No VRM data in GLTF');
                            window.parent.postMessage({ type: 'modelFailed', reason: 'no VRM data' }, '*');
                            return;
                        }

                        // VRMUtils.rotateVRM0 is only for VRM 0.x assets (sets scene.rotation.y = π).
                        // VRM 1.x models already face -Z (glTF convention), which is toward our
                        // camera at +Z — so rotateVRM0 would flip them backwards. Skip it for 1.x.
                        const vrmMetaVersion = vrm.meta?.metaVersion ?? '0';
                        if (vrmMetaVersion === '0') {
                            VRMUtils.rotateVRM0(vrm);
                        }
                        // combineMorphs merges duplicate morph targets across meshes in VRM 0.x.
                        // Only available in newer three-vrm builds; skip gracefully if absent.
                        if (typeof VRMUtils.combineMorphs === 'function') {
                            VRMUtils.combineMorphs(vrm);
                        }

                        scene.add(vrm.scene);
                        currentVrm = vrm;

                        // Expose VRM to parent for diagnostics
                        window._vrm = vrm;

                        // Apply natural idle pose (relax arms from T-pose)
                        applyNaturalPose(vrm);

                        // Initialize controllers
                        lipSync = new AudioLipSync(vrm);
                        blinkController = new BlinkController(vrm);
                        expressionController = new ExpressionController(vrm);

                        // Legacy controllers disabled — replaced by AnimationDirector layers
                        headMovement = null;
                        gestureController = null;
                        proceduralAnimator = null;
                        mouseTracker = null;

                        // Initialize layered animation system (Phase 6F)
                        const canvas = document.getElementById('c');
                        animationDirector = new AnimationDirector(vrm);
                        animationDirector.addLayer(new BasePoseLayer(vrm));
                        animationDirector.addLayer(new IdleBehaviorLayer(vrm));
                        animationDirector.addLayer(new EmotionLayer(vrm));
                        animationDirector.addLayer(new TalkLayer(vrm));
                        animationDirector.addLayer(new GestureLayer(vrm));
                        animationDirector.addLayer(new LookAtLayer(vrm, canvas));

                        // Auto-frame camera based on model's actual height
                        const headBone = vrm.humanoid.getRawBoneNode('head');
                        const footBone = vrm.humanoid.getRawBoneNode('leftFoot') || vrm.humanoid.getRawBoneNode('rightFoot');
                        let modelTop = 1.5, modelBottom = 0;
                        if (headBone) {
                            const hp = new THREE.Vector3();
                            headBone.getWorldPosition(hp);
                            modelTop = hp.y + 0.15; // Above head for hair
                        }
                        if (footBone) {
                            const fp = new THREE.Vector3();
                            footBone.getWorldPosition(fp);
                            modelBottom = fp.y;
                        }
                        const modelHeight = modelTop - modelBottom;
                        const targetY = modelBottom + modelHeight * 0.55; // Chest/neck area
                        const camZ = Math.max(modelHeight * 1.0, 0.8);   // Distance scales with height
                        controls.reset(
                            new THREE.Vector3(0, targetY + 0.05, camZ),
                            new THREE.Vector3(0, targetY, 0)
                        );

                        // Store frame data for camera presets (#27)
                        const headY = headBone
                            ? (() => { const hp = new THREE.Vector3(); headBone.getWorldPosition(hp); return hp.y; })()
                            : targetY + modelHeight * 0.35;
                        _vrmFrameData = { targetY, camZ, modelHeight, headY };

                        console.log('[Viewer] VRM loaded successfully');
                        window.parent.postMessage({ type: 'modelLoaded' }, '*');
                    },
                    (progress) => {
                        // Optional: report loading progress
                    },
                    (error) => {
                        console.error('[Viewer] VRM load error:', error);
                        window.parent.postMessage({ type: 'modelFailed', reason: String(error) }, '*');
                    }
                );
            }

            // ── PostMessage API ─────────────────────────────────

            window.addEventListener('message', (e) => {
                const { type, payload } = e.data || {};
                const audioUrl = e.data?.audioUrl;

                // Commands that work without a VRM loaded
                if (type === 'loadCharacter') {
                    const p = payload || {};
                    if (p.modelUrl) loadVRM(p.modelUrl, scene, camera);
                    return;
                }
                if (type === 'updateBackground') {
                    setBackground(e.data.mode, e.data.value);
                    return;
                }
                if (type === 'setLighting') {
                    if (e.data.preset && LIGHT_PRESETS[e.data.preset]) {
                        setLighting(LIGHT_PRESETS[e.data.preset]);
                    } else if (payload) {
                        setLighting(payload);
                    }
                    return;
                }
                if (type === 'getLightingPresets') {
                    window.parent.postMessage({
                        type: 'lightingPresets',
                        presets: Object.keys(LIGHT_PRESETS)
                    }, '*');
                    return;
                }
                if (type === 'captureScreenshot') {
                    const dataUrl = captureScreenshot();
                    window.parent.postMessage({ type: 'screenshotReady', dataUrl }, '*');
                    return;
                }
                if (type === 'setCameraPosition') {
                    if (payload) controls.setState(payload);
                    return;
                }
                if (type === 'getCameraPosition') {
                    window.parent.postMessage({
                        type: 'cameraPosition',
                        state: controls.getState()
                    }, '*');
                    return;
                }
                if (type === 'resetCamera') {
                    controls.reset();
                    _vrmFrameData && controls.tweenTo(
                        new THREE.Vector3(0, _vrmFrameData.targetY + 0.05, _vrmFrameData.camZ),
                        new THREE.Vector3(0, _vrmFrameData.targetY, 0),
                        500
                    );
                    return;
                }
                if (type === 'setCameraPreset') {
                    // Camera preset buttons (#27): bust / fullbody / face
                    // Positions are derived from the loaded model's actual frame data.
                    if (!_vrmFrameData) return;
                    const { targetY, camZ, modelHeight, headY } = _vrmFrameData;
                    const presets = {
                        fullbody: {
                            pos:    new THREE.Vector3(0, targetY + 0.05, camZ),
                            target: new THREE.Vector3(0, targetY, 0),
                        },
                        bust: {
                            pos:    new THREE.Vector3(0, targetY + modelHeight * 0.15, camZ * 0.55),
                            target: new THREE.Vector3(0, targetY + modelHeight * 0.15, 0),
                        },
                        face: {
                            pos:    new THREE.Vector3(0, headY, camZ * 0.28),
                            target: new THREE.Vector3(0, headY, 0),
                        },
                    };
                    const p = presets[payload?.preset];
                    if (p) controls.tweenTo(p.pos, p.target, 500);
                    return;
                }
                if (type === 'setCameraEnabled') {
                    controls.enabled = !!e.data.enabled;
                    return;
                }
                if (type === 'setVrmTransform') {
                    // Character scale/position editor (#86): adjust VRM scale and position.
                    // Offsets are from the model's natural ground position (y=0).
                    if (currentVrm?.scene) {
                        const s = payload?.scale   ?? 1.0;
                        const x = payload?.offsetX ?? 0.0;
                        const y = payload?.offsetY ?? 0.0;
                        currentVrm.scene.scale.setScalar(s);
                        currentVrm.scene.position.x = x;
                        currentVrm.scene.position.y = y;
                    }
                    return;
                }

                // Commands that require a loaded VRM
                if (!currentVrm) return;

                if (type === 'nod') {
                    const getBone = (name) => currentVrm.humanoid.getNormalizedBoneNode ?
                        currentVrm.humanoid.getNormalizedBoneNode(name) :
                        currentVrm.humanoid.getBoneNode(name);
                    const neck = getBone('neck');
                    if (neck) {
                        neck.rotation.x = 0.2;
                        setTimeout(() => neck.rotation.x = 0, 300);
                    }
                }
                else if (type === 'playAudio') {
                    if (lipSync && audioUrl) lipSync.playAudioWithLipSync(audioUrl);
                }
                else if (type === 'stopAudio') {
                    if (lipSync) lipSync.stop();
                }
                else if (type === 'setExpression') {
                    if (expressionController) {
                        expressionController.setExpression(e.data.emotion, e.data.intensity || 1.0, e.data.duration || 0.3);
                    }
                    if (animationDirector) {
                        const emotionLayer = animationDirector.getLayer('emotion');
                        if (emotionLayer) emotionLayer.setEmotion(e.data.emotion, e.data.intensity || 0.7);
                    }
                    _triggerAutoGesture(e.data.emotion);
                }
                else if (type === 'setEmotion') {
                    const emo = payload?.emotion || e.data.emotion;
                    const inten = e.data.intensity || 0.7;
                    if (expressionController && emo) {
                        expressionController.setExpression(emo, inten, e.data.duration || 0.3);
                    }
                    if (animationDirector && emo) {
                        const emotionLayer = animationDirector.getLayer('emotion');
                        if (emotionLayer) emotionLayer.setEmotion(emo, inten);
                    }
                    _triggerAutoGesture(emo);
                }
                else if (type === 'playGesture') {
                    const gesture = payload?.gesture || e.data.gesture;
                    if (animationDirector && gesture) {
                        const gl = animationDirector.getLayer('gesture');
                        if (gl) gl.playGesture(gesture);
                    }
                }
                else if (type === 'playGestureSequence') {
                    if (animationDirector && payload) {
                        const gl = animationDirector.getLayer('gesture');
                        if (gl) gl.playSequence(payload);
                    }
                }
                else if (type === 'setPersonality') {
                    if (animationDirector && payload) {
                        animationDirector.setPersonality(payload);
                    }
                }
                else if (type === 'getAvailableBlendShapes') {
                    const shapes = getAvailableBlendShapes();
                    window.parent.postMessage({ type: 'blendShapeList', shapes }, '*');
                }
                else if (type === 'setBlendShape') {
                    if (payload) setBlendShape(payload.name, payload.value);
                }
                else if (type === 'setBlendShapes') {
                    // Batch set multiple blend shapes at once
                    if (payload && typeof payload === 'object') {
                        Object.entries(payload).forEach(([name, value]) => {
                            setBlendShape(name, value);
                        });
                    }
                }
                else if (type === 'showFpsOverlay') {
                    // Toggle the in-viewport FPS counter overlay.
                    // Does NOT require VRM to be loaded — FPS counter runs regardless.
                    const fpsEl = document.getElementById('fps-overlay');
                    if (fpsEl) {
                        fpsEl.style.display = payload?.visible ? 'block' : 'none';
                    }
                }
                else if (type === 'setFpsTarget') {
                    // Set the render loop FPS cap. 0 = unlimited.
                    // Converts "30"/"60"/"120"/"Unlimited" labels to millisecond intervals.
                    const target = payload?.fps;
                    if (!target || target === 'Unlimited' || target === 0) {
                        _fpsTargetMs = 0;  // unlimited
                    } else {
                        _fpsTargetMs = 1000 / Number(target);
                    }
                    _fpsLastRenderTime = 0;  // reset so next frame renders immediately
                }
                else if (type === 'setDiscoMode') {
                    // Party/disco lighting (#25): cycle RGB point lights hue on beat.
                    _discoActive = !!payload?.enabled;
                    const intensity = _discoActive ? 1.2 : 0;
                    discoLights.forEach(l => { l.intensity = intensity; });
                    if (!_discoActive) {
                        // Restore neutral ambient on disco off
                        ambientLight.intensity = 0.8;
                        ambientLight.color.set(0xffffff);
                    } else {
                        ambientLight.intensity = 0.3; // dim base to let colours pop
                    }
                }
                else if (type === 'setShadowQuality') {
                    // Shadow quality toggle (#26): Off / Soft / Sharp
                    const q = payload?.quality || 'off';
                    if (q === 'off') {
                        renderer.shadowMap.enabled = false;
                        keyLight.castShadow = false;
                    } else {
                        renderer.shadowMap.enabled = true;
                        keyLight.castShadow = true;
                        renderer.shadowMap.type = q === 'sharp'
                            ? THREE.BasicShadowMap
                            : THREE.PCFSoftShadowMap;
                        keyLight.shadow.mapSize.width  = 1024;
                        keyLight.shadow.mapSize.height = 1024;
                    }
                }
            });

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });
        }
        init();
    </script>

    <!-- Fix 8: Camera controls HUD — shown in bottom-left, fades in on canvas hover.
         pointer-events:none keeps it from blocking orbit/zoom/pan interactions. -->
    <style>
        #camera-hud {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: color 0.3s;
        }
        #camera-hud:hover {
            color: rgba(255, 255, 255, 0.55);
        }
        .hud-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-row kbd {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            padding: 0 4px;
            font-family: monospace;
            font-size: 9px;
            min-width: 48px;
            text-align: center;
        }
    </style>
    <div id="camera-hud">
        <div class="hud-row"><kbd>L-Drag</kbd> Orbit</div>
        <div class="hud-row"><kbd>Scroll</kbd> Zoom</div>
        <div class="hud-row"><kbd>R-Drag</kbd> Pan</div>
        <div class="hud-row"><kbd>Ctrl+0</kbd> Reset</div>
    </div>
</body>

</html>
