    <video id="bg-video" loop muted playsinline></video>
    <canvas id="c"></canvas>
    <script type="importmap">
        {
            "imports": {
                "three": "/frontend/lib/three.module.js"
            }

    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from '/frontend/lib/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '/frontend/lib/three-vrm.module.min.js';

        let currentVrm = null;
        let clock = new THREE.Clock();
        let lipSync = null;
        let blinkController = null;
        let headMovement = null;
        let expressionController = null;
        let gestureController = null;
        let proceduralAnimator = null;
        let mouseTracker = null;

        // ══════════════════════════════════════════════════════════
        // Inline OrbitControls (minimal implementation)
        // Provides: left-drag orbit, scroll zoom, right-drag pan
        // ══════════════════════════════════════════════════════════

        /**
         * Minimal orbit camera controller for Three.js.
         * Supports left-click orbit, right-click pan, scroll zoom.
         * No external dependency — written inline to avoid missing lib issues.
         */
        class SimpleOrbitControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                this.enabled = true;

                // Orbit state
                this.target = new THREE.Vector3(0, 1.2, 0);
                this.spherical = new THREE.Spherical();
                this.sphericalDelta = new THREE.Spherical();
                this.panOffset = new THREE.Vector3();

                // Limits
                this.minDistance = 0.3;
                this.maxDistance = 5;
                this.minPolarAngle = 0.1;
                this.maxPolarAngle = Math.PI - 0.1;
                this.rotateSpeed = 1.0;
                this.panSpeed = 1.0;
                this.zoomSpeed = 1.0;

                // Internal state
                this._rotateStart = new THREE.Vector2();
                this._panStart = new THREE.Vector2();
                this._isRotating = false;
                this._isPanning = false;

                this._bindEvents();
                this._updateSpherical();
            }

            /** Sync internal spherical from current camera position. */
            _updateSpherical() {
                const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
                this.spherical.setFromVector3(offset);
            }

            _bindEvents() {
                const el = this.domElement;
                el.addEventListener('pointerdown', (e) => this._onPointerDown(e));
                el.addEventListener('pointermove', (e) => this._onPointerMove(e));
                el.addEventListener('pointerup', () => this._onPointerUp());
                el.addEventListener('pointerleave', () => this._onPointerUp());
                el.addEventListener('wheel', (e) => this._onWheel(e), { passive: false });
                el.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            _onPointerDown(e) {
                if (!this.enabled) return;
                if (e.button === 0) {
                    this._isRotating = true;
                    this._rotateStart.set(e.clientX, e.clientY);
                } else if (e.button === 2) {
                    this._isPanning = true;
                    this._panStart.set(e.clientX, e.clientY);
                }
            }

            _onPointerMove(e) {
                if (!this.enabled) return;
                if (this._isRotating) {
                    const dx = (e.clientX - this._rotateStart.x) / this.domElement.clientHeight * Math.PI * this.rotateSpeed;
                    const dy = (e.clientY - this._rotateStart.y) / this.domElement.clientHeight * Math.PI * this.rotateSpeed;
                    this.sphericalDelta.theta -= dx;
                    this.sphericalDelta.phi -= dy;
                    this._rotateStart.set(e.clientX, e.clientY);
                }
                if (this._isPanning) {
                    const dx = (e.clientX - this._panStart.x) * this.panSpeed * 0.002;
                    const dy = (e.clientY - this._panStart.y) * this.panSpeed * 0.002;
                    // Pan relative to camera orientation
                    const right = new THREE.Vector3();
                    const up = new THREE.Vector3();
                    right.setFromMatrixColumn(this.camera.matrix, 0);
                    up.setFromMatrixColumn(this.camera.matrix, 1);
                    this.panOffset.addScaledVector(right, -dx);
                    this.panOffset.addScaledVector(up, dy);
                    this._panStart.set(e.clientX, e.clientY);
                }
            }

            _onPointerUp() {
                this._isRotating = false;
                this._isPanning = false;
            }

            _onWheel(e) {
                if (!this.enabled) return;
                e.preventDefault();
                if (e.deltaY > 0) {
                    this.spherical.radius *= (1 + 0.05 * this.zoomSpeed);
                } else {
                    this.spherical.radius *= (1 - 0.05 * this.zoomSpeed);
                }
                this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius));
            }

            /** Call each frame to apply accumulated deltas. */
            update() {
                if (!this.enabled) return;

                // Apply pan
                this.target.add(this.panOffset);
                this.panOffset.set(0, 0, 0);

                // Apply rotation
                this.spherical.theta += this.sphericalDelta.theta;
                this.spherical.phi += this.sphericalDelta.phi;
                this.spherical.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, this.spherical.phi));
                this.sphericalDelta.set(0, 0, 0);

                // Compute new camera position
                const offset = new THREE.Vector3().setFromSpherical(this.spherical);
                this.camera.position.copy(this.target).add(offset);
                this.camera.lookAt(this.target);
            }

            /** Reset camera to a specific position + target. */
            reset(position, target) {
                this.target.copy(target || new THREE.Vector3(0, 1.2, 0));
                this.camera.position.copy(position || new THREE.Vector3(0, 1.4, 1.2));
                this._updateSpherical();
            }

            /** Get serializable camera state for presets. */
            getState() {
                return {
                    position: this.camera.position.toArray(),
                    target: this.target.toArray(),
                    radius: this.spherical.radius
                };
            }

            /** Restore camera state from preset. */
            setState(preset) {
                if (preset.position) this.camera.position.fromArray(preset.position);
                if (preset.target) this.target.fromArray(preset.target);
                this._updateSpherical();
            }
        }

        // ══════════════════════════════════════════════════════════
        // Procedural Animation — emotion-driven idle modifiers
        // ══════════════════════════════════════════════════════════

        /**
         * Emotion-driven idle animation modifiers.
         * Blends with existing blink/breathing controllers to make the
         * character feel more alive based on current emotion.
         */
        class ProceduralAnimator {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentEmotion = 'neutral';
                /** @type {number} Amplitude scaling factor (0–1) for all procedural motion */
                this.intensity = 0.7;
                this.breathScale = 1.0;
                this.bounceOffset = 0;
                this.swayAmount = 0;
                this.time = 0;
            }

            /**
             * Set the current emotion and intensity to adjust idle behavior.
             * @param {string} emotion - Emotion name (happy, sad, angry, excited, neutral)
             * @param {number} [intensity=0.7] - Motion amplitude scale (0–1)
             */
            setEmotion(emotion, intensity = 0.7) {
                this.currentEmotion = emotion || 'neutral';
                this.intensity = Math.min(Math.max(intensity, 0), 1);
            }

            /**
             * Per-frame update — applies subtle procedural motion to bones.
             * @param {number} deltaTime - Seconds since last frame
             */
            update(deltaTime) {
                this.time += deltaTime;
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                    this.vrm.humanoid.getNormalizedBoneNode(name) :
                    this.vrm.humanoid.getBoneNode(name);

                const spine = getBone('spine');
                const hips = getBone('hips');
                const intensity = this.intensity;

                // Hip sway — slow weight shift, always active (0.3Hz ± noise)
                if (hips) {
                    const swayNoise = 1 + Math.sin(this.time * 0.09) * 0.2;
                    hips.rotation.y = Math.sin(this.time * 0.3) * 0.02 * swayNoise * intensity;
                }

                switch (this.currentEmotion) {
                    case 'happy':
                    case 'excited':
                        // Subtle bounce + wider sway
                        if (hips) hips.position.y = Math.sin(this.time * 3) * 0.008 * intensity;
                        if (spine) spine.rotation.z = Math.sin(this.time * 1.5) * 0.02 * intensity;
                        break;
                    case 'sad':
                        // Droopy posture, slow breathing
                        if (spine) {
                            spine.rotation.x = 0.03 * intensity;
                            spine.rotation.z = Math.sin(this.time * 0.5) * 0.005 * intensity;
                        }
                        break;
                    case 'angry':
                        // Tense, minimal movement, subtle tremor
                        if (spine) spine.rotation.z = Math.sin(this.time * 8) * 0.003 * intensity;
                        break;
                    case 'thinking':
                        // Slow tilt
                        if (spine) spine.rotation.z = Math.sin(this.time * 0.8) * 0.015 * intensity;
                        break;
                    default:
                        // Neutral — very subtle sway
                        if (spine) spine.rotation.z = Math.sin(this.time * 0.7) * 0.005 * intensity;
                        break;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Audio Lip Sync
        // ══════════════════════════════════════════════════════════

        /**
         * Real-time audio-driven lip sync using Web Audio API.
         * Analyzes audio frequency data to drive the 'aa' blend shape.
         */
        class AudioLipSync {
            constructor(vrm) {
                this.vrm = vrm;
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 256;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.isPlaying = false;
                this.currentSource = null;
                this.lastValue = 0;
            }

            /**
             * Play audio and drive lip sync from volume analysis.
             * @param {string} audioUrl - URL of the audio file to play
             */
            async playAudioWithLipSync(audioUrl) {
                try {
                    this.stop();
                    const response = await fetch(audioUrl);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);

                    const source = this.audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);

                    this.currentSource = source;
                    this.isPlaying = true;
                    source.start(0);

                    source.onended = () => {
                        this.isPlaying = false;
                        this.currentSource = null;
                        this.setMouthOpen(0);
                    };

                    this.updateLipSync();
                } catch (error) {
                    console.error('LIPSYNC_ERROR:', error);
                    this.isPlaying = false;
                    this.setMouthOpen(0);
                }
            }

            updateLipSync() {
                if (!this.isPlaying) return;
                this.analyser.getByteFrequencyData(this.dataArray);
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) sum += this.dataArray[i];
                const average = sum / this.dataArray.length;
                const normalized = Math.min(average / 128, 1.0);
                const smoothed = normalized * 0.7 + this.lastValue * 0.3;
                this.lastValue = smoothed;
                this.setMouthOpen(smoothed);
                requestAnimationFrame(() => this.updateLipSync());
            }

            setMouthOpen(value) {
                if (!this.vrm) return;
                if (this.vrm.expressionManager) {
                    this.vrm.expressionManager.setValue('aa', value);
                } else if (this.vrm.blendShapeProxy) {
                    this.vrm.blendShapeProxy.setValue('aa', value);
                }
            }

            stop() {
                if (this.currentSource) {
                    try { this.currentSource.stop(); } catch (e) {}
                    this.currentSource = null;
                }
                this.isPlaying = false;
                this.setMouthOpen(0);
            }
        }

        // ══════════════════════════════════════════════════════════
        // Blink Controller
        // ══════════════════════════════════════════════════════════

        class BlinkController {
            constructor(vrm) {
                this.vrm = vrm;
                this.nextBlinkTime = this.getNextBlinkDelay();
                this.isBlinking = false;
                this.blinkProgress = 0;
            }

            update(deltaTime) {
                if (this.isBlinking) {
                    this.blinkProgress += deltaTime * 10;
                    if (this.blinkProgress < 0.5) this.setBlinkValue(this.blinkProgress * 2);
                    else this.setBlinkValue(1.0 - ((this.blinkProgress - 0.5) * 2));

                    if (this.blinkProgress >= 1.0) {
                        this.isBlinking = false;
                        this.blinkProgress = 0;
                        this.setBlinkValue(0);
                        this.nextBlinkTime = this.getNextBlinkDelay();
                    }
                } else {
                    this.nextBlinkTime -= deltaTime;
                    if (this.nextBlinkTime <= 0) this.isBlinking = true;
                }
            }

            setBlinkValue(value) {
                if (!this.vrm) return;
                if (this.vrm.expressionManager) this.vrm.expressionManager.setValue('blink', value);
                else if (this.vrm.blendShapeProxy) this.vrm.blendShapeProxy.setValue('blink', value);
            }

            getNextBlinkDelay() { return 2 + Math.random() * 4; }
        }

        // ══════════════════════════════════════════════════════════
        // Idle Head Movement
        // ══════════════════════════════════════════════════════════

        class IdleHeadMovement {
            constructor(vrm) {
                this.vrm = vrm;
                this.headTarget = { x: 0, y: 0, z: 0 };
                this.headCurrent = { x: 0, y: 0, z: 0 };
                this.nextMoveTime = 5;
            }

            update(deltaTime) {
                this.nextMoveTime -= deltaTime;
                if (this.nextMoveTime <= 0) {
                    this.headTarget = {
                        x: (Math.random() - 0.5) * 0.15,
                        y: (Math.random() - 0.5) * 0.25,
                        z: (Math.random() - 0.5) * 0.08
                    };
                    this.nextMoveTime = 3 + Math.random() * 7;
                }
                const lerpSpeed = deltaTime * 0.5;
                this.headCurrent.x += (this.headTarget.x - this.headCurrent.x) * lerpSpeed;
                this.headCurrent.y += (this.headTarget.y - this.headCurrent.y) * lerpSpeed;
                this.headCurrent.z += (this.headTarget.z - this.headCurrent.z) * lerpSpeed;

                const head = this.vrm.humanoid.getNormalizedBoneNode ?
                             this.vrm.humanoid.getNormalizedBoneNode('head') :
                             this.vrm.humanoid.getBoneNode('head');

                if (head) {
                    head.rotation.x = this.headCurrent.x;
                    head.rotation.y = this.headCurrent.y;
                    head.rotation.z = this.headCurrent.z;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Mouse Tracking Controller (Eyes + Subtle Head Follow)
        // ══════════════════════════════════════════════════════════

        /**
         * Tracks mouse cursor position to drive eye bone rotations
         * and add subtle additive head rotation for a "looking at you" effect.
         * Runs AFTER IdleHeadMovement so head follow is additive (+=).
         */
        class MouseTrackingController {
            constructor(vrm, canvas) {
                this.vrm = vrm;
                this.canvas = canvas;
                /** @type {{x: number, y: number}} Normalized cursor -1..1 */
                this.cursor = { x: 0, y: 0 };
                /** @type {{x: number, y: number}} Smoothed eye target */
                this.eyeCurrent = { x: 0, y: 0 };
                /** @type {{x: number, y: number}} Smoothed head offset */
                this.headOffset = { x: 0, y: 0 };
                this.active = true;

                this._onMouseMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.cursor.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    this.cursor.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    this.active = true;
                };
                this._onMouseLeave = () => {
                    this.active = false;
                    this.cursor.x = 0;
                    this.cursor.y = 0;
                };

                canvas.addEventListener('mousemove', this._onMouseMove);
                canvas.addEventListener('mouseleave', this._onMouseLeave);
            }

            /**
             * Per-frame update — lerp eyes and head toward cursor.
             * @param {number} deltaTime - Seconds since last frame
             */
            update(deltaTime) {
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                    this.vrm.humanoid.getNormalizedBoneNode(name) :
                    this.vrm.humanoid.getBoneNode(name);

                const targetX = this.active ? this.cursor.x : 0;
                const targetY = this.active ? this.cursor.y : 0;

                // Eye tracking — fast lerp (responsive feel)
                const eyeSpeed = deltaTime * 3;
                this.eyeCurrent.x += (targetX - this.eyeCurrent.x) * eyeSpeed;
                this.eyeCurrent.y += (targetY - this.eyeCurrent.y) * eyeSpeed;

                const leftEye = getBone('leftEye');
                const rightEye = getBone('rightEye');
                if (leftEye) {
                    leftEye.rotation.y = this.eyeCurrent.x * 0.3;
                    leftEye.rotation.x = -this.eyeCurrent.y * 0.15;
                }
                if (rightEye) {
                    rightEye.rotation.y = this.eyeCurrent.x * 0.3;
                    rightEye.rotation.x = -this.eyeCurrent.y * 0.15;
                }

                // Subtle head follow — slow lerp, ADDITIVE (+=) to blend with idle
                const headSpeed = deltaTime * 1;
                this.headOffset.x += (targetX * 0.12 - this.headOffset.x) * headSpeed;
                this.headOffset.y += (targetY * 0.08 - this.headOffset.y) * headSpeed;

                const head = getBone('head');
                if (head) {
                    head.rotation.y += this.headOffset.x;
                    head.rotation.x += -this.headOffset.y;
                }
            }

            dispose() {
                this.canvas.removeEventListener('mousemove', this._onMouseMove);
                this.canvas.removeEventListener('mouseleave', this._onMouseLeave);
            }
        }

        // ══════════════════════════════════════════════════════════
        // Expression Controller
        // ══════════════════════════════════════════════════════════

        class ExpressionController {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentExpression = "neutral";
                this.targetExpression = "neutral";
                this.currentIntensity = 0;
                this.targetIntensity = 0;
                this.transitionProgress = 1.0;
                this.transitionDuration = 0.5;
            }

            setExpression(emotion, intensity = 1.0, duration = 0.5) {
                if (emotion === this.targetExpression) return;
                this.targetExpression = emotion;
                this.targetIntensity = Math.min(Math.max(intensity, 0), 1);
                this.transitionDuration = duration;
                this.transitionProgress = 0;
            }

            update(deltaTime) {
                if (this.transitionProgress < 1.0) {
                    this.transitionProgress += deltaTime / this.transitionDuration;
                    const t = Math.min(this.transitionProgress, 1.0);
                    const eased = t * t * (3 - 2 * t);
                    const blendedIntensity = this.currentIntensity + (this.targetIntensity - this.currentIntensity) * eased;
                    this.applyExpression(this.targetExpression, blendedIntensity);
                    if (this.transitionProgress >= 1.0) {
                        this.currentExpression = this.targetExpression;
                        this.currentIntensity = this.targetIntensity;
                    }
                }
            }

            applyExpression(emotion, intensity) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;

                ['happy', 'sad', 'surprised', 'angry', 'relaxed'].forEach(expr => {
                    try { em.setValue(expr, 0); } catch(e) {}
                });

                try {
                    if (emotion === "happy") em.setValue('happy', intensity);
                    else if (emotion === "sad") em.setValue('sad', intensity);
                    else if (emotion === "surprised") em.setValue('surprised', intensity);
                    else if (emotion === "angry") em.setValue('angry', intensity);
                    else if (emotion === "confused") {
                        em.setValue('surprised', intensity * 0.4);
                        const head = this.vrm.humanoid.getNormalizedBoneNode ?
                                     this.vrm.humanoid.getNormalizedBoneNode('head') :
                                     this.vrm.humanoid.getBoneNode('head');
                        if (head) head.rotation.z = 0.15 * intensity;
                    }
                    else if (emotion === "thinking") em.setValue('relaxed', intensity * 0.6);
                } catch (e) { console.warn('Expression not available:', emotion); }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Gesture Controller (expanded with new gestures)
        // ══════════════════════════════════════════════════════════

        class GestureController {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentGesture = null;
                this.gestureProgress = 0;
                this.gestureDuration = 0;
                this.gestureQueue = [];
            }

            /**
             * Play a gesture animation on the VRM model.
             * Supports: nod, tilt, wave, shrug, bow, clap, think, point, celebrate, shy, dance
             * @param {string} gesture - Gesture name
             */
            playGesture(gesture) {
                if (this.currentGesture) {
                    this.gestureQueue.push(gesture);
                    return;
                }
                this.currentGesture = gesture;
                this.gestureProgress = 0;
                // Duration varies per gesture
                const durations = {
                    nod: 0.6, tilt: 0.5, wave: 1.0, shrug: 0.8,
                    bow: 1.2, clap: 0.8, think: 1.5, point: 0.7,
                    celebrate: 1.2, shy: 1.0, dance: 2.0
                };
                this.gestureDuration = durations[gesture] || 0.6;
            }

            /**
             * Play a sequence of gestures with timing.
             * @param {Array<{gesture: string, delay?: number}>} sequence
             */
            playSequence(sequence) {
                if (!Array.isArray(sequence) || sequence.length === 0) return;
                this.playGesture(sequence[0].gesture);
                for (let i = 1; i < sequence.length; i++) {
                    this.gestureQueue.push(sequence[i].gesture);
                }
            }

            update(deltaTime) {
                if (!this.currentGesture) return;
                this.gestureProgress += deltaTime;

                if (this.gestureProgress >= this.gestureDuration) {
                    this.resetGesture();
                    this.currentGesture = null;
                    // Check queue
                    if (this.gestureQueue.length > 0) {
                        this.playGesture(this.gestureQueue.shift());
                    }
                    return;
                }

                const t = this.gestureProgress / this.gestureDuration;
                const eased = Math.sin(t * Math.PI);

                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                switch (this.currentGesture) {
                    case 'nod': {
                        const neck = getBone('neck');
                        if (neck) neck.rotation.x = eased * 0.3;
                        break;
                    }
                    case 'tilt': {
                        const head = getBone('head');
                        if (head) head.rotation.z = eased * 0.35;
                        break;
                    }
                    case 'wave': {
                        const rightArm = getBone('rightUpperArm');
                        const rightHand = getBone('rightHand');
                        if (rightArm) {
                            rightArm.rotation.z = -eased * 1.2;
                            rightArm.rotation.x = eased * 0.3;
                        }
                        if (rightHand) rightHand.rotation.z = Math.sin(t * Math.PI * 4) * 0.4;
                        break;
                    }
                    case 'shrug': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        const headBone = getBone('head');
                        if (headBone) headBone.rotation.z = Math.sin(t * Math.PI) * 0.1;
                        break;
                    }
                    case 'bow': {
                        const spine = getBone('spine');
                        const neck = getBone('neck');
                        if (spine) spine.rotation.x = eased * 0.4;
                        if (neck) neck.rotation.x = eased * 0.2;
                        break;
                    }
                    case 'clap': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lForearm = getBone('leftLowerArm');
                        const rForearm = getBone('rightLowerArm');
                        const clapCycle = Math.sin(t * Math.PI * 6); // 3 claps
                        if (lArm) lArm.rotation.z = 0.5 + clapCycle * 0.15;
                        if (rArm) rArm.rotation.z = -0.5 - clapCycle * 0.15;
                        if (lForearm) lForearm.rotation.y = -0.8 + clapCycle * 0.2;
                        if (rForearm) rForearm.rotation.y = 0.8 - clapCycle * 0.2;
                        break;
                    }
                    case 'think': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        const head = getBone('head');
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (rForearm) rForearm.rotation.y = eased * 1.2;
                        if (head) {
                            head.rotation.z = eased * 0.12;
                            head.rotation.x = eased * 0.08;
                        }
                        break;
                    }
                    case 'point': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        if (rArm) {
                            rArm.rotation.z = -eased * 0.8;
                            rArm.rotation.x = eased * 0.3;
                        }
                        if (rForearm) rForearm.rotation.y = eased * 0.4;
                        break;
                    }
                    case 'celebrate': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lHand = getBone('leftHand');
                        const rHand = getBone('rightHand');
                        if (lArm) lArm.rotation.z = eased * 1.5;
                        if (rArm) rArm.rotation.z = -eased * 1.5;
                        if (lHand) lHand.rotation.z = Math.sin(t * Math.PI * 6) * 0.4;
                        if (rHand) rHand.rotation.z = Math.sin(t * Math.PI * 6 + 1) * 0.4;
                        break;
                    }
                    case 'shy': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const head = getBone('head');
                        const spine = getBone('spine');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (head) head.rotation.x = eased * 0.2;
                        if (spine) spine.rotation.z = eased * 0.05;
                        break;
                    }
                    case 'dance': {
                        const hips = getBone('hips');
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const danceBeat = Math.sin(t * Math.PI * 4);
                        if (hips) hips.position.y = danceBeat * 0.02;
                        if (lArm) lArm.rotation.z = 0.3 + danceBeat * 0.4;
                        if (rArm) rArm.rotation.z = -0.3 - danceBeat * 0.4;
                        break;
                    }
                }
            }

            resetGesture() {
                if (!this.vrm) return;
                const bones = ['neck', 'head', 'spine', 'hips',
                               'leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm',
                               'leftHand', 'rightHand'];
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                bones.forEach(boneName => {
                    const bone = getBone(boneName);
                    if (bone) {
                        bone.rotation.x = 0;
                        bone.rotation.y = 0;
                        bone.rotation.z = 0;
                        if (bone.position) {
                            bone.position.x = 0;
                            bone.position.y = 0;
                            bone.position.z = 0;
                        }
                    }
                });
            }
        }

        // ══════════════════════════════════════════════════════════
        // Lighting Presets
        // ══════════════════════════════════════════════════════════

        const LIGHT_PRESETS = {
            studio: {
                key: { color: 0xffffff, intensity: 1.5, position: [1, 2, 3] },
                fill: { color: 0xffffff, intensity: 0.5, position: [-1, 1, -2] },
                ambient: { color: 0xffffff, intensity: 0.8 }
            },
            warm_sunset: {
                key: { color: 0xffaa44, intensity: 1.8, position: [2, 1, 1] },
                fill: { color: 0xff6633, intensity: 0.4, position: [-2, 0.5, -1] },
                ambient: { color: 0xffddbb, intensity: 0.6 }
            },
            cool_moonlight: {
                key: { color: 0x6688ff, intensity: 1.2, position: [-1, 3, 2] },
                fill: { color: 0x4466cc, intensity: 0.3, position: [1, 0.5, -1] },
                ambient: { color: 0x334488, intensity: 0.5 }
            },
            dramatic: {
                key: { color: 0xff0044, intensity: 2.0, position: [3, 2, 0] },
                fill: { color: 0x0044ff, intensity: 0.6, position: [-3, 1, 0] },
                ambient: { color: 0x111122, intensity: 0.3 }
            },
            neon: {
                key: { color: 0x00ffcc, intensity: 1.6, position: [1, 2, 2] },
                fill: { color: 0xff00ff, intensity: 0.8, position: [-1, 1, -1] },
                ambient: { color: 0x220033, intensity: 0.4 }
            }
        };

        // ══════════════════════════════════════════════════════════
        // Main Init
        // ══════════════════════════════════════════════════════════

        async function init() {
            const canvas = document.getElementById('c');
            const bgVideo = document.getElementById('bg-video');

            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                alpha: true,
                preserveDrawingBuffer: true   // Required for screenshot toDataURL()
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Three.js r150+: outputEncoding → outputColorSpace
            if ('outputColorSpace' in renderer) {
                renderer.outputColorSpace = THREE.SRGBColorSpace;
            } else {
                renderer.outputEncoding = THREE.sRGBEncoding;
            }

            const scene = new THREE.Scene();
            // Default dark background so VRM is visible against the UI
            // (transparent renders as invisible on the dark cyberpunk layout)
            scene.background = new THREE.Color(0x0a0b14);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.25, 1.5);

            // Orbit controls
            const controls = new SimpleOrbitControls(camera, canvas);

            // Lighting (stored as refs for dynamic updates)
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyLight.position.set(1, 2, 3);
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-1, 1, -2);
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(keyLight, fillLight, ambientLight);

            /**
             * Apply a lighting configuration to the scene.
             * @param {Object} config - Lighting config with key/fill/ambient properties
             */
            function setLighting(config) {
                if (config.key) {
                    if (config.key.color !== undefined) keyLight.color.set(config.key.color);
                    if (config.key.intensity !== undefined) keyLight.intensity = config.key.intensity;
                    if (config.key.position) keyLight.position.fromArray(config.key.position);
                }
                if (config.fill) {
                    if (config.fill.color !== undefined) fillLight.color.set(config.fill.color);
                    if (config.fill.intensity !== undefined) fillLight.intensity = config.fill.intensity;
                    if (config.fill.position) fillLight.position.fromArray(config.fill.position);
                }
                if (config.ambient) {
                    if (config.ambient.color !== undefined) ambientLight.color.set(config.ambient.color);
                    if (config.ambient.intensity !== undefined) ambientLight.intensity = config.ambient.intensity;
                }
                console.log('[Viewer] Lighting updated');
            }

            /**
             * Set the scene background.
             * @param {string} mode - 'color', 'image', 'video', 'gradient', or 'transparent'
             * @param {string|number} value - Color hex, image URL, video URL, or gradient CSS
             */
            function setBackground(mode, value) {
                console.log("[Viewer] BG_MODE:", mode, value);
                // Hide video by default
                bgVideo.style.display = 'none';
                bgVideo.pause();

                if (mode === 'color') {
                    scene.background = new THREE.Color(value);
                    renderer.setClearAlpha(1);
                } else if (mode === 'image') {
                    new THREE.TextureLoader().load(value, (tex) => {
                        scene.background = tex;
                        renderer.setClearAlpha(1);
                    });
                } else if (mode === 'video') {
                    // Use HTML video element behind canvas
                    scene.background = null;
                    renderer.setClearAlpha(0);
                    bgVideo.src = value;
                    bgVideo.style.display = 'block';
                    bgVideo.play().catch(e => console.warn('[Viewer] Video autoplay blocked:', e));
                } else if (mode === 'gradient') {
                    // Apply CSS gradient to body, keep scene transparent
                    scene.background = null;
                    renderer.setClearAlpha(0);
                    document.body.style.background = value;
                } else {
                    // "transparent" mode — use dark fallback to match UI theme
                    scene.background = new THREE.Color(0x0a0b14);
                    renderer.setClearAlpha(1);
                    document.body.style.background = '#0a0b14';
                }
            }

            /**
             * Capture the current viewport as a PNG data URL.
             * @returns {string} Base64 PNG data URL
             */
            function captureScreenshot() {
                renderer.render(scene, camera);
                return renderer.domElement.toDataURL('image/png');
            }

            /**
             * Get all available blend shape / expression names from the loaded VRM.
             * @returns {string[]} Array of expression names
             */
            function getAvailableBlendShapes() {
                if (!currentVrm) return [];
                const em = currentVrm.expressionManager || currentVrm.blendShapeProxy;
                if (!em) return [];

                // VRM 1.0: expressionManager has _expressionMap
                if (em._expressionMap) return Array.from(em._expressionMap.keys());
                // VRM 0.x: blendShapeProxy has _blendShapeGroups
                if (em._blendShapeGroups) return em._blendShapeGroups.map(g => g.name);
                return [];
            }

            /**
             * Set a single blend shape to a specific value (0-1).
             * @param {string} name - Blend shape name
             * @param {number} value - Value between 0 and 1
             */
            function setBlendShape(name, value) {
                if (!currentVrm) return;
                const em = currentVrm.expressionManager || currentVrm.blendShapeProxy;
                if (!em) return;
                try {
                    em.setValue(name, Math.max(0, Math.min(1, value)));
                } catch (e) {
                    console.warn('[Viewer] Blend shape not found:', name);
                }
            }

            // ── Animation Loop ──────────────────────────────────

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();

                controls.update();

                if (currentVrm) {
                    currentVrm.update(delta);

                    // Breathing — varied rate with occasional deep breaths
                    const getBone = (name) => currentVrm.humanoid.getNormalizedBoneNode ?
                                              currentVrm.humanoid.getNormalizedBoneNode(name) :
                        currentVrm.humanoid.getBoneNode(name);
                    const t = clock.elapsedTime;
                    // Base rate ~2Hz with ±0.3Hz variation via slow modulator
                    const rateModulator = 2 + Math.sin(t * 0.13) * 0.3;
                    // Noise layer at 0.7Hz for organic feel
                    const noiseLayer = Math.sin(t * 0.7) * 0.0008;
                    // Deep breath: amplitude triples when slow cycle > 0.95 (~every 20s)
                    const deepCycle = Math.sin(t * 0.16);
                    const breathAmp = deepCycle > 0.95 ? 0.009 : 0.003;
                    const breathStrength = Math.sin(t * rateModulator) * breathAmp + noiseLayer;
                    const chest = getBone('chest') || getBone('spine');
                    if (chest) {
                        // Use = (not +=) — breathStrength oscillates around 0,
                        // so += would cause unbounded drift at 60fps over time.
                        chest.rotation.x = breathStrength;
                        chest.rotation.z = breathStrength * 0.5;
                    }

                    if (blinkController) blinkController.update(delta);
                    if (headMovement) headMovement.update(delta);
                    if (mouseTracker) mouseTracker.update(delta);
                    if (expressionController) expressionController.update(delta);
                    if (gestureController) gestureController.update(delta);

                    // Maintain A-pose arm baseline every frame when no gesture is playing.
                    // resetGesture() zeros all arm bones on gesture completion; this
                    // immediately restores the ~40° lowered-arm position in the same frame.
                    // NOTE: Positive Z rotation lifts the arm UP (right-hand rule: +X→+Y).
                    // Negative Z rotation swings the arm DOWN toward the hip. -0.7 ≈ 40° below
                    // horizontal, giving a natural A-pose idle stance.
                    if (gestureController && !gestureController.currentGesture) {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        if (lArm) lArm.rotation.z = -0.7;  // ~40° below horizontal — A-pose left arm
                        if (rArm) rArm.rotation.z = 0.7;   // Mirror for right arm
                    }

                    if (proceduralAnimator) proceduralAnimator.update(delta);
                }
                renderer.render(scene, camera);
            }
            animate();

            // Load VRM from URL parameter if provided (direct link mode)
            const urlParam = new URLSearchParams(location.search).get('url');
            if (urlParam) {
                loadVRM(urlParam, scene, camera);
            }

            /**
             * Apply a natural standing pose to a VRM model.
             * VRM models load in T-pose (arms out). This relaxes the skeleton
             * into a comfortable A-pose / idle standing position with arms at sides,
             * slight hand curl, and natural spine posture.
             *
             * @param {Object} vrm - Loaded VRM instance
             */
            function applyNaturalPose(vrm) {
                // MUST use normalized bones — three-vrm's vrm.update() propagates
                // normalized bone transforms to raw bones each frame. Direct raw bone
                // edits would be overwritten; normalized bone edits persist correctly.
                const bone = (name) => {
                    if (vrm.humanoid.getNormalizedBoneNode) {
                        return vrm.humanoid.getNormalizedBoneNode(name);
                    }
                    return vrm.humanoid.getBoneNode(name);
                };

                // --- Arms: bring down from T-pose to relaxed A-pose ---
                // In VRM 1.x normalized space: positive Z rotation RAISES the arm
                // (right-hand rule: arm's local +X toward hand, +Y up → +Z rotates arm tip UP).
                // Negative Z swings the arm DOWN toward the hip.
                // Value -0.7 rad ≈ 40° below horizontal — natural standing A-pose.
                const leftUpperArm = bone('leftUpperArm');
                const rightUpperArm = bone('rightUpperArm');
                if (leftUpperArm) leftUpperArm.rotation.z = -0.7;
                if (rightUpperArm) rightUpperArm.rotation.z = 0.7;

                // --- Spine: very slight natural S-curve ---
                const spine = bone('spine');
                if (spine) spine.rotation.x = -0.02;

                const chest = bone('chest');
                if (chest) chest.rotation.x = 0.02;

                // Head: tiny downward tilt (looking at user, not sky)
                const head = bone('head');
                if (head) head.rotation.x = 0.03;

                console.log('[Viewer] Natural pose applied (normalized bones) v=FIX-20260219');
            }

            /**
             * Load a VRM model from URL into the scene.
             * Notifies parent window on success or failure via postMessage.
             *
             * @param {string} modelUrl - Path to the .vrm file
             * @param {THREE.Scene} scene - Three.js scene
             * @param {THREE.PerspectiveCamera} camera - Camera to frame the model
             */
            function loadVRM(modelUrl, scene, camera) {
                const loader = new GLTFLoader();
                loader.register((parser) => new VRMLoaderPlugin(parser));

                console.log('[Viewer] Loading VRM:', modelUrl);
                loader.load(
                    modelUrl,
                    (gltf) => {
                        // Remove previous model
                        if (currentVrm && currentVrm.scene) {
                            scene.remove(currentVrm.scene);
                            VRMUtils.deepDispose(currentVrm.scene);
                        }

                        const vrm = gltf.userData.vrm;
                        if (!vrm) {
                            console.error('[Viewer] No VRM data in GLTF');
                            window.parent.postMessage({ type: 'modelFailed', reason: 'no VRM data' }, '*');
                            return;
                        }

                        // VRMUtils.rotateVRM0 is only for VRM 0.x assets (sets scene.rotation.y = π).
                        // VRM 1.x models already face -Z (glTF convention), which is toward our
                        // camera at +Z — so rotateVRM0 would flip them backwards. Skip it for 1.x.
                        const vrmMetaVersion = vrm.meta?.metaVersion ?? '0';
                        if (vrmMetaVersion === '0') {
                            VRMUtils.rotateVRM0(vrm);
                        }
                        scene.add(vrm.scene);
                        currentVrm = vrm;

                        // Expose VRM to parent for diagnostics
                        window._vrm = vrm;

                        // Apply natural idle pose (relax arms from T-pose)
                        applyNaturalPose(vrm);

                        // Initialize controllers
                        lipSync = new AudioLipSync(vrm);
                        blinkController = new BlinkController(vrm);
                        headMovement = new IdleHeadMovement(vrm);
                        expressionController = new ExpressionController(vrm);
                        gestureController = new GestureController(vrm);
                        proceduralAnimator = new ProceduralAnimator(vrm);
                        mouseTracker = new MouseTrackingController(vrm, document.getElementById('c'));

                        // Auto-frame camera based on model's actual height
                        const headBone = vrm.humanoid.getRawBoneNode('head');
                        const footBone = vrm.humanoid.getRawBoneNode('leftFoot') || vrm.humanoid.getRawBoneNode('rightFoot');
                        let modelTop = 1.5, modelBottom = 0;
                        if (headBone) {
                            const hp = new THREE.Vector3();
                            headBone.getWorldPosition(hp);
                            modelTop = hp.y + 0.15; // Above head for hair
                        }
                        if (footBone) {
                            const fp = new THREE.Vector3();
                            footBone.getWorldPosition(fp);
                            modelBottom = fp.y;
                        }
                        const modelHeight = modelTop - modelBottom;
                        const targetY = modelBottom + modelHeight * 0.55; // Chest/neck area
                        const camZ = Math.max(modelHeight * 1.0, 0.8);   // Distance scales with height
                        controls.reset(
                            new THREE.Vector3(0, targetY + 0.05, camZ),
                            new THREE.Vector3(0, targetY, 0)
                        );

                        console.log('[Viewer] VRM loaded successfully');
                        window.parent.postMessage({ type: 'modelLoaded' }, '*');
                    },
                    (progress) => {
                        // Optional: report loading progress
                    },
                    (error) => {
                        console.error('[Viewer] VRM load error:', error);
                        window.parent.postMessage({ type: 'modelFailed', reason: String(error) }, '*');
                    }
                );
            }

            // ── PostMessage API ─────────────────────────────────

            window.addEventListener('message', (e) => {
                const { type, payload } = e.data || {};
                const audioUrl = e.data?.audioUrl;

                // Commands that work without a VRM loaded
                if (type === 'loadCharacter') {
                    const p = payload || {};
                    if (p.modelUrl) loadVRM(p.modelUrl, scene, camera);
                    return;
                }
                if (type === 'updateBackground') {
                    setBackground(e.data.mode, e.data.value);
                    return;
                }
                if (type === 'setLighting') {
                    if (e.data.preset && LIGHT_PRESETS[e.data.preset]) {
                        setLighting(LIGHT_PRESETS[e.data.preset]);
                    } else if (payload) {
                        setLighting(payload);
                    }
                    return;
                }
                if (type === 'getLightingPresets') {
                    window.parent.postMessage({
                        type: 'lightingPresets',
                        presets: Object.keys(LIGHT_PRESETS)
                    }, '*');
                    return;
                }
                if (type === 'captureScreenshot') {
                    const dataUrl = captureScreenshot();
                    window.parent.postMessage({ type: 'screenshotReady', dataUrl }, '*');
                    return;
                }
                if (type === 'setCameraPosition') {
                    if (payload) controls.setState(payload);
                    return;
                }
                if (type === 'getCameraPosition') {
                    window.parent.postMessage({
                        type: 'cameraPosition',
                        state: controls.getState()
                    }, '*');
                    return;
                }
                if (type === 'resetCamera') {
                    controls.reset();
                    return;
                }
                if (type === 'setCameraEnabled') {
                    controls.enabled = !!e.data.enabled;
                    return;
                }

                // Commands that require a loaded VRM
                if (!currentVrm) return;

                if (type === 'nod') {
                    const getBone = (name) => currentVrm.humanoid.getNormalizedBoneNode ?
                        currentVrm.humanoid.getNormalizedBoneNode(name) :
                        currentVrm.humanoid.getBoneNode(name);
                    const neck = getBone('neck');
                    if (neck) {
                        neck.rotation.x = 0.2;
                        setTimeout(() => neck.rotation.x = 0, 300);
                    }
                }
                else if (type === 'playAudio') {
                    if (lipSync && audioUrl) lipSync.playAudioWithLipSync(audioUrl);
                }
                else if (type === 'stopAudio') {
                    if (lipSync) lipSync.stop();
                }
                else if (type === 'setExpression') {
                    if (expressionController) {
                        expressionController.setExpression(e.data.emotion, e.data.intensity || 1.0, e.data.duration || 0.5);
                    }
                    if (proceduralAnimator && e.data.emotion) {
                        proceduralAnimator.setEmotion(e.data.emotion, e.data.intensity || 0.7);
                    }
                }
                else if (type === 'setEmotion') {
                    // Alias for setExpression — sent by ViewerBridge
                    const emo = payload?.emotion || e.data.emotion;
                    const inten = e.data.intensity || 0.7;
                    if (expressionController && emo) {
                        expressionController.setExpression(emo, inten, e.data.duration || 0.5);
                    }
                    if (proceduralAnimator && emo) {
                        proceduralAnimator.setEmotion(emo, inten);
                    }
                }
                else if (type === 'playGesture') {
                    const gesture = payload?.gesture || e.data.gesture;
                    if (gestureController && gesture) gestureController.playGesture(gesture);
                }
                else if (type === 'playGestureSequence') {
                    if (gestureController && payload) gestureController.playSequence(payload);
                }
                else if (type === 'getAvailableBlendShapes') {
                    const shapes = getAvailableBlendShapes();
                    window.parent.postMessage({ type: 'blendShapeList', shapes }, '*');
                }
                else if (type === 'setBlendShape') {
                    if (payload) setBlendShape(payload.name, payload.value);
                }
                else if (type === 'setBlendShapes') {
                    // Batch set multiple blend shapes at once
                    if (payload && typeof payload === 'object') {
                        Object.entries(payload).forEach(([name, value]) => {
                            setBlendShape(name, value);
                        });
                    }
                }
            });

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });
        }
        init();
    </script>
</body>

</html>
