                            this.mixer.removeEventListener('finished', onFinished);
                            this.isPlaying = false;
                            this.currentAction = null;
                            console.log(`[ClipLayer] Clip "${name}" finished`);
                        }
                    };
                    this.mixer.addEventListener('finished', onFinished);
                }

                console.log(`[ClipLayer] Playing "${name}" (loop=${loop}, speed=${timeScale}, mask=${mask ? 'yes' : 'none'})`);
                return true;
            }

            /**
             * Stop the currently playing clip with a fade-out.
             * @param {number} [fadeDuration=0.3] - Fade-out duration
             */
            stopClip(fadeDuration = 0.3) {
                if (this.currentAction) {
                    this.currentAction.fadeOut(fadeDuration);
                    // Delayed cleanup after fade completes
                    setTimeout(() => {
                        if (this.currentAction) {
                            this.currentAction.stop();
                            this.currentAction = null;
                        }
                        this.isPlaying = false;
                    }, fadeDuration * 1000 + 50);
                }
            }

            /**
             * List all loaded clips in the library.
             * @returns {Array<{name: string, duration: number, tracks: number}>}
             */
            listClips() {
                return Object.entries(this.clipLibrary).map(([name, clip]) => ({
                    name,
                    duration: clip.duration,
                    tracks: clip.tracks.length,
                }));
            }

            /**
             * Per-frame update — advances the AnimationMixer and drives crossfade/blend.
             * @param {number} dt - Delta time in seconds
             */
            update(dt) {
                if (this.mixer) {
                    this.mixer.update(dt);
                }

                // Phase C: spring-based weight ramp for non-linear crossfade
                if (this.currentAction && this._crossfadeDuration > 0 &&
                    this._crossfadeElapsed < this._crossfadeDuration) {
                    this._crossfadeElapsed += dt;
                    const rawT = Math.min(1, this._crossfadeElapsed / this._crossfadeDuration);
                    // Exponential ease: fast-in, slow-finish — avoids abrupt Three.js linear ramp
                    const easedT = 1 - Math.exp(-5 * rawT);
                    this.currentAction.setEffectiveWeight(easedT * this._crossfadeTarget);
                    if (rawT >= 1) {
                        this._crossfadeDuration = 0;  // done
                        this.currentAction.setEffectiveWeight(this._crossfadeTarget);
                    }
                }

                // Phase C: apply inertialization blend (smooths pop-free transitions)
                if (this._inertBlend?.update(dt) === false) {
                    this._inertBlend = null;  // blend complete
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Phase E: PoseLibrary + TwoBoneIK + FootPlantController
        // ══════════════════════════════════════════════════════════

        /**
         * Tag-based animation clip library that loads from the backend manifest.
         *
         * Provides emotion/intensity/category filtering with anti-repeat logic
         * so the same clip is never played twice in a row. Clips are loaded lazily
         * on first use to avoid upfront network cost.
         *
         * @example
         *   const lib = new PoseLibrary();
         *   await lib.loadManifest('/api/animations/manifest');
         *   const entry = lib.findBest('happy', 'high', 'reaction');
         *   if (entry) clipLayer.playClip(entry.id, { mask: BoneMaskManager.UPPER_BODY });
         */
        class PoseLibrary {
            constructor() {
                /** @type {Array<{id:string,file:string,emotion:string,intensity:string,category:string,loop:boolean,duration:number,tags:string[],available:boolean,url:string|null}>} */
                this._entries = [];
                /** Most recently played clip ID per category (for anti-repeat). */
                this._lastPlayed = {};
                /** Cache of loaded THREE.AnimationClip objects, keyed by clip id. */
                this._cache = {};
                this._manifestLoaded = false;
            }

            /**
             * Load the manifest from the API. Must be called before findBest().
             *
             * @param {string} [url='/api/animations/manifest'] - API URL
             * @returns {Promise<void>}
             */
            async loadManifest(url = '/api/animations/manifest') {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    this._entries = await resp.json();
                    this._manifestLoaded = true;
                    const available = this._entries.filter(e => e.available).length;
                    console.log(`[PoseLibrary] Manifest loaded: ${this._entries.length} clips, ${available} available`);
                } catch (err) {
                    console.warn('[PoseLibrary] Failed to load manifest:', err);
                    this._entries = [];
                }
            }

            /**
             * Find the best matching clip for the given emotion/intensity/category.
             * Excludes the most recently played clip in that category (anti-repeat).
             * Falls back to any available clip in the category if no exact emotion match.
             *
             * @param {string} emotion - Emotion tag (e.g. 'happy', 'sad')
             * @param {'low'|'medium'|'high'} [intensity='medium'] - Intensity tier
             * @param {string} [category='reaction'] - Clip category
             * @returns {{id:string,url:string,loop:boolean,duration:number}|null}
             */
            findBest(emotion, intensity = 'medium', category = 'reaction') {
                const lastId = this._lastPlayed[category];
                const candidates = this._entries.filter(e =>
                    e.available && e.category === category && e.id !== lastId
                );
                if (candidates.length === 0) return null;

                // Exact match: emotion + intensity
                const exact = candidates.filter(e => e.emotion === emotion && e.intensity === intensity);
                if (exact.length > 0) {
                    const pick = exact[Math.floor(Math.random() * exact.length)];
                    this._lastPlayed[category] = pick.id;
                    return pick;
                }
                // Fallback: emotion only
                const emoOnly = candidates.filter(e => e.emotion === emotion);
                if (emoOnly.length > 0) {
                    const pick = emoOnly[Math.floor(Math.random() * emoOnly.length)];
                    this._lastPlayed[category] = pick.id;
                    return pick;
                }
                // Last resort: any in category
                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                this._lastPlayed[category] = pick.id;
                return pick;
            }

            /**
             * Get a random idle clip suitable for looping background animation.
             * @returns {{id:string,url:string,loop:boolean,duration:number}|null}
             */
            getRandomIdle() {
                return this.findBest('neutral', 'low', 'idle');
            }

            /**
             * Get the best reaction clip for the given emotion.
             * @param {string} emotion
             * @returns {{id:string,url:string,loop:boolean,duration:number}|null}
             */
            getReaction(emotion) {
                return this.findBest(emotion, 'high', 'reaction');
            }
        }

        /**
         * Analytical two-bone IK solver.
         *
         * Calculates upper and lower limb joint angles to place the end effector
         * at a world-space target position. Uses the law of cosines for exact,
         * non-iterative solution.
         *
         * @param {THREE.Object3D} upper - Upper bone (hip/shoulder)
         * @param {THREE.Object3D} lower - Lower bone (knee/elbow)
         * @param {THREE.Object3D} end - End effector bone (foot/hand)
         * @param {THREE.Vector3} target - World-space target position for the end effector
         * @param {THREE.Vector3} pole - World-space pole vector (hints knee/elbow bend direction)
         */
        function twoBoneIK(upper, lower, end, target, pole) {
            const _tmp = new THREE.Vector3();
            const _upperWorld = new THREE.Vector3();
            const _lowerWorld = new THREE.Vector3();
            const _endWorld = new THREE.Vector3();

            upper.getWorldPosition(_upperWorld);
            lower.getWorldPosition(_lowerWorld);
            end.getWorldPosition(_endWorld);

            const upperLen = _upperWorld.distanceTo(_lowerWorld);
            const lowerLen = _lowerWorld.distanceTo(_endWorld);
            const targetLen = _upperWorld.distanceTo(target);

            // Clamp target within reach
            const maxReach = (upperLen + lowerLen) * 0.999;
            const clampedTarget = target.clone();
            if (targetLen > maxReach) {
                clampedTarget.sub(_upperWorld).normalize().multiplyScalar(maxReach).add(_upperWorld);
            }

            // Knee angle via law of cosines
            const d = Math.min(targetLen, maxReach);
            const cosUpper = (upperLen * upperLen + d * d - lowerLen * lowerLen) / (2 * upperLen * d);
            const cosLower = (upperLen * upperLen + lowerLen * lowerLen - d * d) / (2 * upperLen * lowerLen);
            const angleUpper = Math.acos(Math.max(-1, Math.min(1, cosUpper)));
            const angleLower = Math.acos(Math.max(-1, Math.min(1, cosLower)));

            // Build IK rotation for upper bone
            const targetDir = clampedTarget.clone().sub(_upperWorld).normalize();
            const poleDir = pole ? pole.clone().sub(_upperWorld).normalize() : new THREE.Vector3(0, 0, -1);

            // Rotate upper bone toward target with knee bend via pole vector
            const up = targetDir.clone().cross(poleDir).normalize();
            const right = up.clone().cross(targetDir).normalize();

            const bentTarget = targetDir.clone()
                .multiplyScalar(Math.cos(angleUpper))
                .addScaledVector(right, Math.sin(angleUpper));

            const lookQ = new THREE.Quaternion();
            const mBent = new THREE.Matrix4().lookAt(_upperWorld, _upperWorld.clone().add(bentTarget), up);
            lookQ.setFromRotationMatrix(mBent);

            // Apply in local space
            const parentQ = new THREE.Quaternion();
            if (upper.parent) upper.parent.getWorldQuaternion(parentQ);
            parentQ.invert();
            upper.quaternion.copy(parentQ).multiply(lookQ);

            // Lower bone: subtract upper angle to get remaining bend
            const lowerBend = Math.PI - angleLower;
            lower.rotation.x = lowerBend;
        }

        /**
         * Foot ground-plane controller using simple analytical IK.
         *
         * Prevents foot sliding during idle and weight-shift animations by
         * detecting when a foot bone drifts below the ground plane and correcting
         * the leg chain with twoBoneIK. Works independently for left and right legs.
         *
         * @param {Object} vrm - The loaded VRM model
         * @param {number} [groundY=0] - Ground plane Y coordinate in world space
         */
        class FootPlantController {
            constructor(vrm, groundY = 0) {
                this.vrm = vrm;
                this.groundY = groundY;
                this._enabled = true;
                this._poleL = new THREE.Vector3(-0.2, 0, 1);   // left knee bends forward-left
                this._poleR = new THREE.Vector3(0.2, 0, 1);    // right knee bends forward-right
                this._footTmp = new THREE.Vector3();
                this._targetL = new THREE.Vector3();
                this._targetR = new THREE.Vector3();
            }

            /**
             * Enable or disable foot planting.
             * @param {boolean} enabled
             */
            setEnabled(enabled) { this._enabled = enabled; }

            /**
             * Set the ground plane Y coordinate.
             * @param {number} y
             */
            setGroundPlane(y) { this.groundY = y; }

            /**
             * Per-frame update. Call after AnimationDirector writes bones.
             * @param {number} _dt - Delta time (unused — IK is frame-rate independent)
             */
            update(_dt) {
                if (!this._enabled || !this.vrm?.humanoid) return;
                const h = this.vrm.humanoid;
                this._correctFoot(
                    h.getNormalizedBoneNode('leftUpperLeg'),
                    h.getNormalizedBoneNode('leftLowerLeg'),
                    h.getNormalizedBoneNode('leftFoot'),
                    this._poleL,
                    this._targetL,
                );
                this._correctFoot(
                    h.getNormalizedBoneNode('rightUpperLeg'),
                    h.getNormalizedBoneNode('rightLowerLeg'),
                    h.getNormalizedBoneNode('rightFoot'),
                    this._poleR,
                    this._targetR,
                );
            }

            _correctFoot(upper, lower, foot, pole, target) {
                if (!upper || !lower || !foot) return;
                foot.getWorldPosition(this._footTmp);
                if (this._footTmp.y < this.groundY) {
                    // Foot has penetrated ground — move target up to ground plane
                    target.copy(this._footTmp);
                    target.y = this.groundY;
                    twoBoneIK(upper, lower, foot, target, pole);
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Phase D: BalanceLayer — Center of Gravity compensation
        // ══════════════════════════════════════════════════════════

        /**
         * L8: Balance — tracks a virtual Center of Gravity and applies a compensating
         * hip shift to keep the character feeling physically grounded.
         *
         * Uses biomechanics-standard mass weights. After all other layers write their
         * bone rotations, this layer calculates the approximate CoG from weighted world
         * positions and applies a spring-damped hip correction so the character always
         * "settles" with weight above the support base.
         *
         * Registered LAST (after FollowThroughLayer) so it reads the final skeleton state.
         * Effect is intentionally subtle — 1-3mm hip displacement — below conscious notice
         * but subconsciously read as natural weight and physical presence.
         */
        class BalanceLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'balance');
                // Biomechanics-standard segment mass ratios (sums to ~1.0)
                this._massWeights = {
                    head:          0.08,
                    chest:         0.25,
                    spine:         0.25,
                    leftUpperArm:  0.03,
                    rightUpperArm: 0.03,
                    leftLowerArm:  0.02,
                    rightLowerArm: 0.02,
                    leftUpperLeg:  0.10,
                    rightUpperLeg: 0.10,
                    leftLowerLeg:  0.06,
                    rightLowerLeg: 0.06,
                };
                // Spring state for smooth hip correction
                this._hipCorrX = { x: 0, v: 0 };
                this._hipCorrZ = { x: 0, v: 0 };
                this._cogOffset = new THREE.Vector3();
                this._tmp = new THREE.Vector3();
            }

            /**
             * Approximate CoG as weighted average of bone world positions.
             * @returns {THREE.Vector3} Center of gravity in world space
             */
            calculateCoG() {
                const humanoid = this.vrm?.humanoid;
                if (!humanoid) return this._cogOffset.set(0, 0, 0);
                let totalX = 0, totalY = 0, totalZ = 0, totalMass = 0;
                for (const [boneName, mass] of Object.entries(this._massWeights)) {
                    try {
                        const node = humanoid.getNormalizedBoneNode(boneName);
                        if (!node) continue;
                        node.getWorldPosition(this._tmp);
                        totalX += this._tmp.x * mass;
                        totalY += this._tmp.y * mass;
                        totalZ += this._tmp.z * mass;
                        totalMass += mass;
                    } catch (_) {}
                }
                if (totalMass > 0) {
                    this._cogOffset.set(totalX / totalMass, totalY / totalMass, totalZ / totalMass);
                }
                return this._cogOffset;
            }

            update(dt) {
                super.update(dt);
                const humanoid = this.vrm?.humanoid;
                if (!humanoid) return;

                const hips = this.getBone('hips');
                if (!hips) return;

                const cog = this.calculateCoG();
                // Target correction: shift hips opposite to CoG lateral drift.
                // Scale factor 0.15 keeps correction very subtle (max ~2mm at ±1cm drift).
                const targetX = -cog.x * 0.15;
                const targetZ = -cog.z * 0.08;

                const rx = springDamperExact(this._hipCorrX.x, this._hipCorrX.v, targetX, 0.25, dt);
                this._hipCorrX = rx;
                const rz = springDamperExact(this._hipCorrZ.x, this._hipCorrZ.v, targetZ, 0.25, dt);
                this._hipCorrZ = rz;

                hips.position.x += rx.x;
                hips.position.z += rz.x;
            }
        }

        // ══════════════════════════════════════════════════════════
        // Phase 17B: AnimationSequencer — emotion-driven sequence orchestrator
        // ══════════════════════════════════════════════════════════

        /**
         * Orchestrates multi-gesture animation sequences driven by emotion context.
         *
         * Sits above the layer system: it does NOT manipulate bones directly but
         * calls GestureLayer.triggerGesture() at timed intervals, creating natural
         * chains of procedural gestures that match the character's emotional state.
         *
         * Usage:
         *   sequencer.triggerEmotion('happy', { energy: 0.8 })
         *   // → selects 2-4 gestures, queues them with randomised gaps
         *
         * @example
         *   const sequencer = new AnimationSequencer(director);
         *   sequencer.triggerEmotion('excited', { timeOfDay: 'morning' });
         */
        class AnimationSequencer {
            /**
             * @param {AnimationDirector} director - The active AnimationDirector instance
             */
            constructor(director) {
                this.director = director;
                /** @type {Array<{gesture: string, gap: number}>} Pending gesture queue */
                this.queue = [];
                /** Index of the gesture currently being waited on. -1 = not started. */
                this.currentIndex = -1;
                /** Seconds remaining until the next gesture fires. */
                this.timer = 0;
                /** When false, update() is a no-op (disable without destroying state). */
                this.enabled = true;
                /** Last emotion that was triggered — for external inspection. */
                this.lastEmotion = 'neutral';
                /** Context used for the last trigger — for external inspection. */
                this.lastContext = {};
            }

            /**
             * Emotion → gesture pool mapping.
             * Each key maps to a pool of procedural gesture names (GestureLayer.GESTURES keys)
             * from which 2-4 are selected at trigger time.
             *
             * @type {Object<string, string[]>}
             */
            static EMOTION_SEQUENCES = {
                happy:    ['bounce', 'peace_sign', 'hair_twirl', 'curtsy_bob'],
                excited:  ['bounce', 'stretch', 'peace_sign', 'dance'],
                sad:      ['deep_breath', 'touch_face', 'shoulder_roll'],
                angry:    ['hand_on_hip', 'foot_tap', 'hand_clasp'],
                shy:      ['touch_hair', 'fidget_hands', 'hand_behind_back', 'touch_face'],
                thinking: ['head_tilt', 'look_around', 'hand_to_chest'],
                love:     ['hand_to_chest', 'hair_twirl', 'curtsy_bob', 'bounce'],
                neutral:  ['subtle_sway', 'weight_shift', 'shoulder_roll', 'look_around'],
                surprised:['bounce', 'look_around', 'deep_breath'],
                tired:    ['deep_breath', 'stretch', 'subtle_sway'],
                nervous:  ['fidget_hands', 'touch_face', 'touch_hair', 'foot_tap'],
                playful:  ['peace_sign', 'curtsy_bob', 'hair_twirl', 'bounce', 'dance'],
                flirty:   ['hair_twirl', 'curtsy_bob', 'hip_cock', 'hand_on_hip'],
            };

            /**
             * Transition compatibility graph — lists which gestures may follow a given one.
             * A null value means any gesture can follow.
             * Used to prevent jarring motion transitions in a sequence.
             *
             * @type {Object<string, string[]|null>}
             */
            static TRANSITION_GRAPH = {
                bounce:      null,      // anything can follow bounce
                dance:       ['bounce', 'curtsy_bob', 'peace_sign'],
                wave:        null,
                nod:         null,
                head_tilt:   ['look_around', 'nod', 'touch_face'],
                deep_breath: ['shoulder_roll', 'stretch', 'subtle_sway'],
                stretch:     ['deep_breath', 'shoulder_roll', 'bounce'],
            };

            /**
             * Select the best animation sequence for the given emotion and context.
             *
             * Applies context filters (time-of-day, energy level) to the emotion's
             * gesture pool before randomly selecting 2-4 gestures.  Falls back to
             * the full pool if filtering empties it.
             *
             * @param {string} emotion - Emotion name (key in EMOTION_SEQUENCES or 'neutral')
             * @param {Object} [context={}] - Optional context modifiers
             * @param {string} [context.timeOfDay] - 'morning'|'afternoon'|'evening'|'night'
             * @param {number} [context.energy] - 0-1 energy level
             * @returns {string[]} Ordered list of gesture names (2-4 items)
             *
             * @example
             *   const seq = AnimationSequencer.prototype.selectSequence('happy', { energy: 0.9 });
             *   // → ['bounce', 'dance', 'peace_sign']
             */
            selectSequence(emotion, context = {}) {
                const pool = AnimationSequencer.EMOTION_SEQUENCES[emotion]
                    || AnimationSequencer.EMOTION_SEQUENCES.neutral;

                let candidates = [...pool];

                // Evening/night: suppress high-energy animations for calmer feel
                if (context.timeOfDay === 'evening' || context.timeOfDay === 'night') {
                    candidates = candidates.filter(
                        g => !['bounce', 'dance', 'foot_tap'].includes(g)
                    );
                    if (candidates.length === 0) candidates = [...pool]; // safety fallback
                }

                // High-energy context: add weight toward energetic gestures
                if (context.energy > 0.7) {
                    candidates.push('bounce', 'dance');
                }

                // Shuffle (Fisher-Yates for unbiased random)
                for (let i = candidates.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                }

                // Select 2-4 gestures from the shuffled pool
                const seqLen = 2 + Math.floor(Math.random() * 3);
                return candidates.slice(0, Math.min(seqLen, candidates.length));
            }

            /**
             * Build the internal queue from a list of gesture names.
             *
             * Each item stores the gesture name and a randomised inter-gesture gap
             * (gapSeconds ± 0–1.0s) so consecutive animations feel natural.
             *
             * @param {string[]} gestures - Ordered list of gesture names
             * @param {number} [gapSeconds=1.5] - Base gap between gestures in seconds
             */
            queueSequence(gestures, gapSeconds = 1.5) {
                this.queue = gestures.map(g => ({
                    gesture: g,
                    gap: gapSeconds + Math.random() * 1.0,
                }));
                this.currentIndex = -1;
                this.timer = 0;
            }

            /**
             * Trigger a multi-gesture sequence for an emotion.
             *
             * Called from the postMessage handler (type: 'triggerSequence') or
             * internally from _triggerAutoAnimation when sequencer integration is desired.
             *
             * @param {string} emotion - Emotion name
             * @param {Object} [context={}] - Context for sequence selection
             */
            triggerEmotion(emotion, context = {}) {
                if (!this.enabled) return;
                this.lastEmotion = emotion;
                this.lastContext = context;
                const seq = this.selectSequence(emotion, context);
                this.queueSequence(seq);
                console.log(`[AnimationSequencer] ${emotion} → [${seq.join(', ')}]`);
            }

            /**
             * Per-frame update — advances the queue by firing gestures at timed intervals.
             *
             * Called from the main animate() loop.  When the timer reaches zero, the
             * next gesture in the queue is triggered via GestureLayer.triggerGesture().
             * The timer is then reset to (gap + approximate gesture duration) so gestures
             * don't overlap.
             *
             * @param {number} dt - Delta time in seconds
             */
            update(dt) {
                if (!this.enabled || this.queue.length === 0) return;

                // Sequence exhausted — clean up
                if (this.currentIndex >= this.queue.length) {
                    this.queue = [];
                    this.currentIndex = -1;
                    return;
                }

                this.timer -= dt;
                if (this.timer <= 0) {
                    this.currentIndex++;
                    if (this.currentIndex < this.queue.length) {
                        const item = this.queue[this.currentIndex];
                        const gestureLayer = this.director.getLayer('gesture');
                        if (gestureLayer && gestureLayer.triggerGesture) {
                            gestureLayer.triggerGesture(item.gesture);
                        }
                        // Wait: inter-gesture gap + estimated gesture duration (~2s average)
                        this.timer = item.gap + 2.0;
                    }
                }
            }

            /**
             * Cancel the current sequence immediately.
             * The gesture layer is NOT interrupted — any in-progress gesture completes.
             */
            cancel() {
                this.queue = [];
                this.currentIndex = -1;
                this.timer = 0;
            }

            /**
             * Returns true when a sequence is actively queued (not yet exhausted).
             * Used by AnimationDirector to detect the 'sequence' state.
             *
             * @returns {boolean}
             */
            get isActive() {
                return this.queue.length > 0 && this.currentIndex < this.queue.length;
            }
        }

        /**
         * L5: LookAt — always additive (+=) on eyes + head.
         * Absorbs MouseTrackingController + IdleHeadMovement into one layer.
         * When mouse is active: track cursor (head + eye gaze). When idle: gentle gaze wander.
         * This layer ALWAYS runs (never suppressed).
         *
         * Phase 6 enhancement: drives VRM lookAt target for eye gaze tracking
         * in addition to head bone rotation. The VRM lookAt system handles eye
         * blend shapes or eye bone rotation depending on the model's setup.
         */
        class LookAtLayer extends AnimationLayer {
            constructor(vrm, canvas) {
                super(vrm, 'lookAt');
                this._mouseX = 0;
                this._mouseY = 0;
                this._mouseActive = false;
                this._mouseTimeout = null;
                /** Phase 6: Whether eye gaze IK is enabled (driven by postMessage). */
                this._eyeGazeEnabled = true;
                /** Persistent Object3D used as the VRM lookAt target (must have getWorldPosition). */
                this._gazeObject3D = new THREE.Object3D();

                if (canvas) {
                    canvas.addEventListener('mousemove', (e) => {
                        const rect = canvas.getBoundingClientRect();
                        this._mouseX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
                        this._mouseY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
                        this._mouseActive = true;
                        clearTimeout(this._mouseTimeout);
                        this._mouseTimeout = setTimeout(() => { this._mouseActive = false; }, 3000);
                    });
                    canvas.addEventListener('mouseleave', () => { this._mouseActive = false; });
                }

                this._gazeTarget = { x: 0, y: 0 };
                this._gazeCurrent = { x: 0, y: 0 };
                this._gazeTimer = 2 + Math.random() * 3;
                this._headTarget = { x: 0, y: 0, z: 0 };
                this._headCurrent = { x: 0, y: 0, z: 0 };
                this._headTimer = 1 + Math.random() * 3;

                // Phase C: Critically damped springs for cursor and gaze smoothing.
                // Eyes use a tighter halflife (0.04s) to lead the head; head uses 0.08s.
                // This mimics the natural eye-leads-head behavior in human tracking.
                this._headSpringX = { x: 0, v: 0 };   // head rotation.y spring
                this._headSpringY = { x: 0, v: 0 };   // head rotation.x spring
                this._gazeSpringX = { x: 0, v: 0 };   // eye gaze world target X
                this._gazeSpringY = { x: 1.3, v: 0 }; // eye gaze world target Y (default head height)
                /** World-space lookAt override. null = cursor mode. */
                this._worldTarget = null;
            }

            /**
             * Override cursor tracking with a world-space position target.
             * Pass null to return to cursor-follow mode.
             *
             * @param {THREE.Vector3|null} position - World-space position to look at
             */
            setWorldTarget(position) {
                this._worldTarget = position;
            }

            update(dt) {
                super.update(dt);
                const head = this.getBone('head');
                const neck = this.getBone('neck');

                // LookAt is L5 (highest priority, last layer) — uses assignment (=)
                // not additive (+=), because these are absolute offsets from neutral
                // that should be the final head pose each frame.
                //
                // Phase C upgrade: all cursor/gaze targets are now spring-smoothed.
                // Eyes use halflife=0.04s (fast, lead the head); head uses 0.08s.
                // This mirrors natural eye-leads-head saccade behavior in humans.
                if (this._mouseActive || this._worldTarget) {
                    let targetX, targetY;   // head rotation targets
                    let gazeX, gazeY;       // world-space gaze target coords

                    if (this._worldTarget) {
                        // World-space override (postMessage lookAt target)
                        gazeX = this._worldTarget.x;
                        gazeY = this._worldTarget.y;
                        // Derive head rotation from world position (character ~at origin, 2m forward)
                        targetX = Math.atan2(gazeX, 2.0) * 0.7;
                        targetY = Math.atan2(gazeY - 1.3, 2.0) * -0.5;
                    } else {
                        // Cursor mode: map normalized mouse (-1..1) to rotation/gaze
                        targetX = this._mouseX * 0.15;
                        targetY = this._mouseY * -0.08;
                        gazeX = this._mouseX * 0.8;
                        gazeY = -this._mouseY * 0.5 + 1.3;
                    }

                    // Spring-smooth head rotation (halflife 0.08s = crisp but not jittery)
                    const rx = springDamperExact(this._headSpringX.x, this._headSpringX.v, targetX, 0.08, dt);
                    this._headSpringX = rx;
                    const ry = springDamperExact(this._headSpringY.x, this._headSpringY.v, targetY, 0.08, dt);
                    this._headSpringY = ry;
                    if (head) {
                        head.rotation.y = rx.x;
                        head.rotation.x = ry.x;
                    }

                    // Spring-smooth eye gaze (halflife 0.04s — eyes lead head)
                    if (this._eyeGazeEnabled && this.vrm.lookAt) {
                        const gx = springDamperExact(this._gazeSpringX.x, this._gazeSpringX.v, gazeX, 0.04, dt);
                        this._gazeSpringX = gx;
                        const gy = springDamperExact(this._gazeSpringY.x, this._gazeSpringY.v, gazeY, 0.04, dt);
                        this._gazeSpringY = gy;
                        this._gazeObject3D.position.set(gx.x, gy.x, 2.0);
                        this.vrm.lookAt.target = this._gazeObject3D;
                    }
                } else {
                    // Gaze wander: pick a new imaginary "point of interest" every 2–5s.
                    // Spread increased to ±0.45 rad yaw (≈26°) and ±0.18 rad pitch (≈10°)
                    // so the head visibly turns — the original ±0.1 was imperceptible.
                    this._gazeTimer -= dt;
                    if (this._gazeTimer <= 0) {
                        this._gazeTarget.x = (Math.random() - 0.5) * 0.9;   // yaw ±26°
                        this._gazeTarget.y = (Math.random() - 0.5) * 0.36;  // pitch ±10°
                        this._gazeTimer = 2 + Math.random() * 3;
                    }
                    // Spring toward wander target (halflife 0.6s — lazy, dreamlike drift)
                    this._gazeCurrent.x += (this._gazeTarget.x - this._gazeCurrent.x) * dt * 1.2;
                    this._gazeCurrent.y += (this._gazeTarget.y - this._gazeCurrent.y) * dt * 1.2;
                    // Spring-smooth wander head rotation
                    const wx = springDamperExact(this._headSpringX.x, this._headSpringX.v, this._gazeCurrent.x, 0.18, dt);
                    this._headSpringX = wx;
                    const wy = springDamperExact(this._headSpringY.x, this._headSpringY.v, this._gazeCurrent.y, 0.18, dt);
                    this._headSpringY = wy;
                    if (head) {
                        head.rotation.y = wx.x;
                        head.rotation.x = wy.x;
                    }
                }

                this._headTimer -= dt;
                if (this._headTimer <= 0) {
                    const isTalkingNow = typeof isTalking !== 'undefined' && isTalking;
                    const range = isTalkingNow ? 0.06 : 0.04;
                    this._headTarget.x = (Math.random() - 0.5) * range;
                    this._headTarget.y = (Math.random() - 0.5) * range;
                    this._headTarget.z = (Math.random() - 0.5) * range * 0.5;
                    const speed = isTalkingNow ? 0.8 : 2;
                    this._headTimer = speed + Math.random() * speed;
                }
                const lerpSpeed = dt * 1.5;
                this._headCurrent.x += (this._headTarget.x - this._headCurrent.x) * lerpSpeed;
                this._headCurrent.y += (this._headTarget.y - this._headCurrent.y) * lerpSpeed;
                this._headCurrent.z += (this._headTarget.z - this._headCurrent.z) * lerpSpeed;
                if (neck) {
                    neck.rotation.x = this._headCurrent.x;
                    neck.rotation.y = this._headCurrent.y;
                    neck.rotation.z = this._headCurrent.z;
                }
            }
        }
        // ══════════════════════════════════════════════════════════
        // Follow-Through Layer — Phase B (Humanoid Motion Quality)
        // ══════════════════════════════════════════════════════════

        /**
         * L7: Follow-Through — cascaded spring lag applied after all SET-mode layers.
         *
         * Registered as the LAST layer in AnimationDirector so it reads the final
         * bone positions written by L0-L6, feeds them through SpringChains, and
         * replaces them with spring-lagged versions. Each bone in a chain follows
         * its parent with increasing delay — spine trails hips, head trails neck, etc.
         *
         * The follow-through effect is deliberately subtle (~60-200ms halflife).
         * At 0.06s base halflife the root bone responds in under 100ms; tip bones
         * (head, hands) respond in ~200ms — below conscious notice but subconsciously
         * read as natural momentum.
         *
         * The layer is adaptive: when animationDirector.state is 'idle' the halflives
         * are reduced by 30% (faster settling for subtle idle motion) and when 'clip'
         * or 'gesture' they are increased by 50% (more pronounced follow-through for
         * active animation).
         */
        class FollowThroughLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'followThrough');

                this.spineChain = new SpringChain(
                    ['hips', 'spine', 'chest', 'neck', 'head'],
                    { baseHalflife: 0.06, halflifeGrowth: 1.5, frequency: 3.0 }
                );
                this.leftArmChain = new SpringChain(
                    ['leftShoulder', 'leftUpperArm', 'leftLowerArm', 'leftHand'],
                    { baseHalflife: 0.04, halflifeGrowth: 1.6, frequency: 4.0 }
                );
                this.rightArmChain = new SpringChain(
                    ['rightShoulder', 'rightUpperArm', 'rightLowerArm', 'rightHand'],
                    { baseHalflife: 0.04, halflifeGrowth: 1.6, frequency: 4.0 }
                );

                /** Set externally by AnimationDirector to modulate spring parameters. */
                this._animState = 'idle';
            }

            /**
             * @param {string} state - AnimationDirector state name (idle/talk/gesture/clip/mocap)
             */
            setAnimState(state) { this._animState = state; }

            update(dt) {
                super.update(dt);

                // Modulate halflives based on animation state.
                // Active states (clip/gesture/mocap) get longer halflives = more dramatic follow-through.
                const stateMul = (this._animState === 'clip' || this._animState === 'mocap')
                    ? 1.5
                    : (this._animState === 'idle' ? 0.7 : 1.0);

                this.spineChain.baseHalflife   = 0.06 * stateMul;
                this.leftArmChain.baseHalflife  = 0.04 * stateMul;
                this.rightArmChain.baseHalflife = 0.04 * stateMul;

                // Build target maps from current bone rotations (set by lower layers).
                const spineTargets = {};
                for (const bname of ['hips', 'spine', 'chest', 'neck', 'head']) {
                    const b = this.getBone(bname);
                    if (b) spineTargets[bname] = { x: b.rotation.x, y: b.rotation.y, z: b.rotation.z };
                }
                const lArmTargets = {};
                for (const bname of ['leftShoulder', 'leftUpperArm', 'leftLowerArm', 'leftHand']) {
                    const b = this.getBone(bname);
                    if (b) lArmTargets[bname] = { x: b.rotation.x, y: b.rotation.y, z: b.rotation.z };
                }
                const rArmTargets = {};
                for (const bname of ['rightShoulder', 'rightUpperArm', 'rightLowerArm', 'rightHand']) {
                    const b = this.getBone(bname);
                    if (b) rArmTargets[bname] = { x: b.rotation.x, y: b.rotation.y, z: b.rotation.z };
                }

                this.spineChain.setTargets(spineTargets);
                this.leftArmChain.setTargets(lArmTargets);
                this.rightArmChain.setTargets(rArmTargets);

                const spineOut   = this.spineChain.update(dt);
                const lArmOut    = this.leftArmChain.update(dt);
                const rArmOut    = this.rightArmChain.update(dt);

                // Apply lagged values back to bones.
                for (const [bname, vals] of Object.entries({ ...spineOut, ...lArmOut, ...rArmOut })) {
                    const b = this.getBone(bname);
                    if (!b) continue;
                    b.rotation.x = vals.x;
                    b.rotation.y = vals.y;
                    b.rotation.z = vals.z;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Procedural Animation — emotion-driven idle modifiers
        // ══════════════════════════════════════════════════════════

        /**
         * Emotion-driven idle animation modifiers.
         * Blends with existing blink/breathing controllers to make the
         * character feel more alive based on current emotion.
         */
        // @deprecated — Replaced by EmotionLayer (L2) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class ProceduralAnimator {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentEmotion = 'neutral';
                /** @type {number} Amplitude scaling factor (0–1) for all procedural motion */
                this.intensity = 0.7;
                this.breathScale = 1.0;
                this.bounceOffset = 0;
                this.swayAmount = 0;
                this.time = 0;
            }

            /**
             * Set the current emotion and intensity to adjust idle behavior.
             * @param {string} emotion - Emotion name (happy, sad, angry, excited, neutral)
             * @param {number} [intensity=0.7] - Motion amplitude scale (0–1)
             */
            setEmotion(emotion, intensity = 0.7) {
                this.currentEmotion = emotion || 'neutral';
                this.intensity = Math.min(Math.max(intensity, 0), 1);
            }

            /**
             * Per-frame update — applies subtle procedural motion to bones.
             * @param {number} deltaTime - Seconds since last frame
             */
            update(deltaTime) {
                this.time += deltaTime;
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                    this.vrm.humanoid.getNormalizedBoneNode(name) :
                    this.vrm.humanoid.getBoneNode(name);

                const spine = getBone('spine');
                const hips = getBone('hips');
                const intensity = this.intensity;

                // Hip sway — slow weight shift, always active (0.3Hz ± noise)
                if (hips) {
                    const swayNoise = 1 + Math.sin(this.time * 0.09) * 0.2;
                    hips.rotation.y = Math.sin(this.time * 0.3) * 0.02 * swayNoise * intensity;
                }

                switch (this.currentEmotion) {
                    case 'happy':
                    case 'excited':
                        // Subtle bounce + wider sway
                        if (hips) hips.position.y = Math.sin(this.time * 3) * 0.008 * intensity;
                        if (spine) spine.rotation.z = Math.sin(this.time * 1.5) * 0.02 * intensity;
                        break;
                    case 'sad':
                        // Droopy posture, slow breathing
                        if (spine) {
                            spine.rotation.x = 0.03 * intensity;
                            spine.rotation.z = Math.sin(this.time * 0.5) * 0.005 * intensity;
                        }
                        break;
                    case 'angry':
                        // Tense, minimal movement, subtle tremor
                        if (spine) spine.rotation.z = Math.sin(this.time * 8) * 0.003 * intensity;
                        break;
                    case 'thinking':
                        // Slow tilt
                        if (spine) spine.rotation.z = Math.sin(this.time * 0.8) * 0.015 * intensity;
                        break;
                    default:
                        // Neutral — very subtle sway
                        if (spine) spine.rotation.z = Math.sin(this.time * 0.7) * 0.005 * intensity;
                        break;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Audio Lip Sync
        // ══════════════════════════════════════════════════════════

        /**
         * Real-time audio-driven lip sync using Web Audio API.
         * Analyzes audio frequency data to drive the 'aa' blend shape.
         */
        /**
         * Real-time audio-driven lip sync using Web Audio API FFT analysis.
         *
         * Splits the frequency spectrum into three speech-formant bands and maps
         * each to a distinct VRM viseme for more natural mouth movement than
         * the previous single-band volume-to-'aa' approach.
         *
         * Band → viseme mapping (at 44.1kHz, fftSize=512 → ~86Hz/bin):
         *   Low  (bins 0–5,   0–430 Hz)  → 'aa'  F1 dominant, open vowels
         *   Mid  (bins 6–23,  516–1978Hz) → 'ou'  F2/F3 range, rounded vowels
         *   High (bins 24–63, 2064–5418Hz)→ 'ee'  fricatives / sibilants
         *
         * Each viseme has independent EMA smoothing to prevent jitter while
         * allowing high-frequency content (fricatives) to be more responsive.
         */
        class AudioLipSync {
            constructor(vrm) {
                this.vrm = vrm;
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                // 512-point FFT → 256 bins at ~86Hz/bin (was 256 → 128 bins at ~172Hz/bin)
                this.analyser.fftSize = 512;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.isPlaying = false;
                this.currentSource = null;
                // Per-viseme EMA state (separate smoothing for each shape)
                this.smoothAa = 0;  // low band  → open mouth
                this.smoothOu = 0;  // mid band  → rounded lips
                this.smoothEe = 0;  // high band → spread / fricative
            }

            /**
             * Play audio and drive multi-viseme lip sync from FFT analysis.
             * @param {string} audioUrl - URL of the audio file to play
             */
            async playAudioWithLipSync(audioUrl) {
                try {
                    this.stop();
                    const response = await fetch(audioUrl);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);

                    const source = this.audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);

                    this.currentSource = source;
                    this.isPlaying = true;
                    isTalking = true;  // Phase 6D: switch to talk motion params
                    if (saccadeController) saccadeController.setTalking(true);
                    source.start(0);

                    source.onended = () => {
                        this.isPlaying = false;
                        this.currentSource = null;
                        isTalking = false;  // Phase 6D: revert to idle motion params
                        if (saccadeController) saccadeController.setTalking(false);
                        this._zeroAllVisemes();
                    };

                    this.updateLipSync();
                } catch (error) {
                    console.error('LIPSYNC_ERROR:', error);
                    this.isPlaying = false;
                    this._zeroAllVisemes();
                }
            }

            /**
             * Per-frame lip sync update — computes band energies and drives visemes.
             * Called via requestAnimationFrame while audio is playing.
             */
            updateLipSync() {
                if (!this.isPlaying) return;
                this.analyser.getByteFrequencyData(this.dataArray);

                // Low band: bins 0–5 (~0–430 Hz), captures F1 for open vowels
                let lowSum = 0;
                for (let i = 0; i <= 5; i++) lowSum += this.dataArray[i];

                // Mid band: bins 6–23 (~516–1978 Hz), captures F2/F3 for rounded vowels
                let midSum = 0;
                for (let i = 6; i <= 23; i++) midSum += this.dataArray[i];

                // High band: bins 24–63 (~2064–5418 Hz), captures fricatives/sibilants
                let highSum = 0;
                for (let i = 24; i <= 63; i++) highSum += this.dataArray[i];

                // Normalize: bin values are 0–255, /128 gives 0–2 range, clamp to 0–1.
                // The /128 threshold biases toward active speech rather than ambient noise.
                const aaRaw = Math.min(lowSum  / 6  / 128, 1.0);
                const ouRaw = Math.min(midSum  / 18 / 128, 1.0);
                const eeRaw = Math.min(highSum / 40 / 128, 1.0);

                // Per-viseme EMA — alphas tuned to physiological movement speed:
                //   'aa' (jaw): moderately responsive, alpha=0.4
                //   'ou' (lip rounding): slowest — sustained posture, alpha=0.35
                //   'ee' (lip spread): most responsive — tracks fast fricatives, alpha=0.5
                this.smoothAa = aaRaw * 0.4  + this.smoothAa * 0.6;
                this.smoothOu = ouRaw * 0.35 + this.smoothOu * 0.65;
                this.smoothEe = eeRaw * 0.5  + this.smoothEe * 0.5;

                this._applyVisemes(this.smoothAa, this.smoothOu, this.smoothEe);
                requestAnimationFrame(() => this.updateLipSync());
            }

            /**
             * Apply computed viseme values to the VRM expression manager.
             * Each viseme uses an individual try/catch so a VRM missing one
             * blend shape doesn't prevent the others from being applied.
             *
             * @param {number} aa - 0–1, open mouth ('aa')
             * @param {number} ou - 0–1, rounded lips ('ou')
             * @param {number} ee - 0–1, spread lips / fricative ('ee')
             */
            _applyVisemes(aa, ou, ee) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;
                try { em.setValue('aa', aa); } catch (e) {}
                try { em.setValue('ou', ou); } catch (e) {}
                try { em.setValue('ee', ee); } catch (e) {}
            }

            /**
             * Zero all viseme blend shapes and reset EMA state.
             * Resets smoothing state so the next utterance starts from 0,
             * not from the decayed value of the previous one.
             */
            _zeroAllVisemes() {
                this.smoothAa = 0;
                this.smoothOu = 0;
                this.smoothEe = 0;
                this._applyVisemes(0, 0, 0);
            }

            /**
             * Stop audio playback and clear all viseme state.
             */
            stop() {
                if (this.currentSource) {
                    try { this.currentSource.stop(); } catch (e) {}
                    this.currentSource = null;
                }
                this.isPlaying = false;
                this._zeroAllVisemes();
            }
        }

        // ══════════════════════════════════════════════════════════
        // Character Audio Engine (Phase 12-P5)
        // ══════════════════════════════════════════════════════════

        /**
         * Emotion-to-audio parameter mapping for procedural breathing synthesis.
         * Each emotion modulates breath cycle time and depth to match the
         * character's emotional state — excited characters breathe faster,
         * tired ones slower and deeper.
         *
         * @type {Object<string, {breathCycle: number, breathDepth: number, breathRate: number}>}
         */
        const EMOTION_AUDIO_PARAMS = {
            neutral:     { breathCycle: 2.3, breathDepth: 0.3, breathRate: 1.0 },
            happy:       { breathCycle: 1.8, breathDepth: 0.4, breathRate: 1.3 },
            sad:         { breathCycle: 3.0, breathDepth: 0.5, breathRate: 0.7 },
            angry:       { breathCycle: 1.5, breathDepth: 0.6, breathRate: 1.5 },
            embarrassed: { breathCycle: 2.0, breathDepth: 0.35, breathRate: 1.2 },
            tired:       { breathCycle: 3.5, breathDepth: 0.6, breathRate: 0.5 },
            excited:     { breathCycle: 1.4, breathDepth: 0.5, breathRate: 1.6 },
            nervous:     { breathCycle: 1.6, breathDepth: 0.25, breathRate: 1.4 },
            thinking:    { breathCycle: 2.5, breathDepth: 0.3, breathRate: 0.9 },
            romantic:    { breathCycle: 2.8, breathDepth: 0.45, breathRate: 0.8 },
        };

        /**
         * Touch zone → interaction sound parameters.
         * Each zone produces a distinct filtered noise burst whose character
         * suggests the physical interaction (soft pat vs sharp poke).
         *
         * freq: center frequency of the bandpass filter (Hz)
         * Q: filter resonance (higher = more tonal)
         * duration: burst length in seconds
         * gain: relative volume 0–1
         *
         * @type {Object<string, {freq: number, Q: number, duration: number, gain: number}>}
         */
        const TOUCH_SOUND_PARAMS = {
            head:      { freq: 800,  Q: 2.0, duration: 0.25, gain: 0.4 },  // soft pat
            face:      { freq: 1200, Q: 3.0, duration: 0.15, gain: 0.3 },  // gentle touch
            shoulders: { freq: 600,  Q: 1.5, duration: 0.20, gain: 0.5 },  // firm touch
            torso:     { freq: 500,  Q: 1.0, duration: 0.18, gain: 0.4 },  // poke
            legs:      { freq: 400,  Q: 1.0, duration: 0.22, gain: 0.35 }, // tap
        };

        /**
         * Vocalization presets for procedural synthesis.
         * Each type specifies oscillator parameters that approximate
         * a short human vocalization (hum, sigh, giggle, etc.)
         * without requiring audio samples.
         *
         * baseFreq: fundamental frequency (Hz)
         * formants: array of formant filter frequencies for vowel shaping
         * duration: vocalization length in seconds
         * gain: relative volume 0–1
         * pitchEnvelope: [start_mult, end_mult] for pitch bend over duration
         *
         * @type {Object<string, {baseFreq: number, formants: number[], duration: number, gain: number, pitchEnvelope: number[]}>}
         */
        const VOCAL_PARAMS = {
            thinking:    { baseFreq: 220, formants: [500, 1500],       duration: 0.5,  gain: 0.25, pitchEnvelope: [1.0, 0.95] },
            agreement:   { baseFreq: 250, formants: [600, 1800],       duration: 0.3,  gain: 0.3,  pitchEnvelope: [0.9, 1.1]  },
            confusion:   { baseFreq: 280, formants: [700, 2000],       duration: 0.3,  gain: 0.3,  pitchEnvelope: [1.0, 1.3]  },
            realization: { baseFreq: 300, formants: [800, 2200],       duration: 0.2,  gain: 0.35, pitchEnvelope: [0.8, 1.2]  },
            contentment: { baseFreq: 180, formants: [400, 1200],       duration: 0.8,  gain: 0.2,  pitchEnvelope: [1.0, 0.85] },
            effort:      { baseFreq: 160, formants: [350, 1000],       duration: 0.12, gain: 0.2,  pitchEnvelope: [1.1, 0.9]  },
            giggle:      { baseFreq: 350, formants: [800, 2200, 3200], duration: 0.4,  gain: 0.3,  pitchEnvelope: [1.0, 1.15] },
        };

        /**
         * Emotion-to-vocalization mapping — which vocal types are likely
         * during idle moments for each emotional state.
         * @type {Object<string, string[]>}
         */
        const EMOTION_VOCALS = {
            neutral:     ['thinking', 'contentment'],
            happy:       ['giggle', 'contentment', 'agreement'],
            sad:         ['contentment', 'thinking'],
            angry:       ['effort', 'thinking'],
            embarrassed: ['effort', 'thinking', 'confusion'],
            tired:       ['contentment', 'effort'],
            excited:     ['giggle', 'realization', 'agreement'],
            nervous:     ['thinking', 'confusion', 'effort'],
            thinking:    ['thinking', 'confusion', 'realization'],
            romantic:    ['contentment', 'giggle', 'thinking'],
        };

        /**
         * Procedural ambient audio engine for character presence.
         *
         * Generates breathing, clothing rustle, vocalizations, and touch-
         * interaction sounds entirely via Web Audio API — no audio files needed.
         *
         * Architecture:
         *   Breathing: White noise → BandpassFilter → GainEnvelope (cyclic)
         *   Interaction: Noise burst → BandpassFilter → GainEnvelope (one-shot)
         *   Vocalizations: Oscillator → FormantFilters → GainEnvelope (one-shot)
         *   Room tone: Noise → LowpassFilter → very low gain (continuous)
         *
         * All layers connect to a master gain node for global volume control.
         * Emotion changes modulate breathing rate/depth and vocalization selection.
         */
        class CharacterAudioEngine {
            /**
             * @param {AudioContext} audioContext - Shared context (reused from AudioLipSync)
             */
            constructor(audioContext) {
                this.ctx = audioContext;
                this.enabled = false;
                this.emotion = 'neutral';

                // Master output
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.15;
                this.masterGain.connect(this.ctx.destination);

                // Layer sub-gains
                this.breathGain = this.ctx.createGain();
                this.breathGain.gain.value = 0.4;
                this.breathGain.connect(this.masterGain);

                this.interactionGain = this.ctx.createGain();
                this.interactionGain.gain.value = 0.7;
                this.interactionGain.connect(this.masterGain);

                this.vocalGain = this.ctx.createGain();
                this.vocalGain.gain.value = 0.5;
                this.vocalGain.connect(this.masterGain);

                this.roomToneGain = this.ctx.createGain();
                this.roomToneGain.gain.value = 0.05;
                this.roomToneGain.connect(this.masterGain);

                // Layer enable flags
                this.breathingEnabled = true;
                this.vocalsEnabled = true;
                this.interactionEnabled = true;

                // Breathing state
                this._breathTimer = null;
                this._breathPhase = 0;       // 0 = inhale, 1 = exhale
                this._breathNoiseNode = null;
                this._breathFilter = null;
                this._breathEnvelope = null;

                // Vocalization scheduling
                this._vocalTimeout = null;

                // Room tone
                this._roomNoiseNode = null;
                this._roomFilter = null;
            }

            /**
             * Enable the audio engine — starts breathing, room tone,
             * and schedules idle vocalizations.
             */
            enable() {
                if (this.enabled) return;
                this.enabled = true;
                if (this.breathingEnabled) this._startBreathing();
                this._startRoomTone();
                if (this.vocalsEnabled) this._scheduleNextVocal();
                console.log('[CharacterAudio] Enabled');
            }

            /**
             * Disable all audio layers and clean up nodes.
             */
            disable() {
                this.enabled = false;
                this._stopBreathing();
                this._stopRoomTone();
                if (this._vocalTimeout) {
                    clearTimeout(this._vocalTimeout);
                    this._vocalTimeout = null;
                }
                console.log('[CharacterAudio] Disabled');
            }

            /**
             * Set master volume for all audio layers.
             * @param {number} v - Volume 0–1
             */
            setVolume(v) {
                this.masterGain.gain.setTargetAtTime(
                    Math.max(0, Math.min(1, v)), this.ctx.currentTime, 0.1
                );
            }

            /**
             * Update emotion — modulates breathing rate/depth and vocalization selection.
             * @param {string} emotion - Emotion name matching EMOTION_AUDIO_PARAMS keys
             */
            setEmotion(emotion) {
                this.emotion = emotion || 'neutral';
                const params = EMOTION_AUDIO_PARAMS[this.emotion] || EMOTION_AUDIO_PARAMS.neutral;

                // Update breathing filter to reflect new emotion
                if (this._breathFilter) {
                    // Shift filter frequency: excited → higher, tired → lower
                    const baseFreq = 200 + params.breathDepth * 400;
                    this._breathFilter.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.5);
                }
            }

            /**
             * Toggle individual audio layers on/off.
             * @param {boolean} breathing - Enable breathing sounds
             * @param {boolean} vocals - Enable idle vocalizations
             * @param {boolean} interaction - Enable touch interaction sounds
             */
            setLayers(breathing, vocals, interaction) {
                this.breathingEnabled = breathing;
                this.vocalsEnabled = vocals;
                this.interactionEnabled = interaction;

                if (this.enabled) {
                    if (breathing && !this._breathNoiseNode) this._startBreathing();
                    else if (!breathing) this._stopBreathing();

                    if (vocals && !this._vocalTimeout) this._scheduleNextVocal();
                    else if (!vocals && this._vocalTimeout) {
                        clearTimeout(this._vocalTimeout);
                        this._vocalTimeout = null;
                    }
                }
            }

            /**
             * Play a touch interaction sound for the given body zone.
             * Produces a short filtered noise burst whose character varies by zone.
             * @param {string} zone - Body zone: 'head', 'face', 'shoulders', 'torso', 'legs'
             */
            playInteractionSound(zone) {
                if (!this.enabled || !this.interactionEnabled) return;

                const params = TOUCH_SOUND_PARAMS[zone] || TOUCH_SOUND_PARAMS.torso;
                const now = this.ctx.currentTime;

                // Create noise source (short burst)
                const bufferSize = Math.ceil(this.ctx.sampleRate * params.duration);
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = noiseBuffer;

                // Bandpass filter gives each zone a distinct tonal character
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = params.freq;
                filter.Q.value = params.Q;

                // Quick attack, natural decay envelope
                const envelope = this.ctx.createGain();
                envelope.gain.setValueAtTime(0, now);
                envelope.gain.linearRampToValueAtTime(params.gain, now + 0.01);
                envelope.gain.exponentialRampToValueAtTime(0.001, now + params.duration);

                noise.connect(filter);
                filter.connect(envelope);
                envelope.connect(this.interactionGain);

                noise.start(now);
                noise.stop(now + params.duration + 0.01);
            }

            /**
             * Play a procedural vocalization.
             * Uses an oscillator + formant filters to approximate short human sounds.
             * @param {string} type - Vocalization type from VOCAL_PARAMS
             */
            playVocalization(type) {
                if (!this.enabled || !this.vocalsEnabled) return;

                const params = VOCAL_PARAMS[type] || VOCAL_PARAMS.thinking;
                const now = this.ctx.currentTime;

                // Oscillator (fundamental voice frequency)
                const osc = this.ctx.createOscillator();
                osc.type = 'sawtooth'; // rich harmonics for voice synthesis
                osc.frequency.setValueAtTime(params.baseFreq * params.pitchEnvelope[0], now);
                osc.frequency.linearRampToValueAtTime(
                    params.baseFreq * params.pitchEnvelope[1],
                    now + params.duration
                );

                // Chain formant filters (simulate vocal tract resonances)
                let lastNode = osc;
                for (const formantFreq of params.formants) {
                    const formant = this.ctx.createBiquadFilter();
                    formant.type = 'bandpass';
                    formant.frequency.value = formantFreq;
                    formant.Q.value = 5;
                    lastNode.connect(formant);
                    lastNode = formant;
                }

                // Amplitude envelope: soft attack → sustain → decay
                const envelope = this.ctx.createGain();
                envelope.gain.setValueAtTime(0, now);
                envelope.gain.linearRampToValueAtTime(params.gain, now + 0.03);
                envelope.gain.setValueAtTime(params.gain, now + params.duration * 0.6);
                envelope.gain.exponentialRampToValueAtTime(0.001, now + params.duration);

                lastNode.connect(envelope);
                envelope.connect(this.vocalGain);

                osc.start(now);
                osc.stop(now + params.duration + 0.01);
            }

            // ── Private: Breathing ───────────────────────────────

            /**
             * Start the continuous breathing cycle.
             * Uses a looping noise source with a cyclic gain envelope
             * that simulates inhale/exhale rhythm.
             */
            _startBreathing() {
                if (this._breathNoiseNode) return;

                // Create a looping noise buffer (2 seconds of white noise)
                const bufLen = this.ctx.sampleRate * 2;
                const noiseBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;

                this._breathNoiseNode = this.ctx.createBufferSource();
                this._breathNoiseNode.buffer = noiseBuf;
                this._breathNoiseNode.loop = true;

                // Bandpass around 200-600Hz range — breathy character
                this._breathFilter = this.ctx.createBiquadFilter();
                this._breathFilter.type = 'bandpass';
                this._breathFilter.frequency.value = 350;
                this._breathFilter.Q.value = 0.8;

                // Gain envelope driven by setInterval for breath cycle
                this._breathEnvelope = this.ctx.createGain();
                this._breathEnvelope.gain.value = 0;

                this._breathNoiseNode.connect(this._breathFilter);
                this._breathFilter.connect(this._breathEnvelope);
                this._breathEnvelope.connect(this.breathGain);
                this._breathNoiseNode.start();

                this._breathPhase = 0;
                this._runBreathCycle();
            }

            /**
             * Run one breath cycle (inhale then exhale), then schedule the next.
             * Breath timing adapts to current emotion via EMOTION_AUDIO_PARAMS.
             */
            _runBreathCycle() {
                if (!this.enabled || !this.breathingEnabled) return;

                const params = EMOTION_AUDIO_PARAMS[this.emotion] || EMOTION_AUDIO_PARAMS.neutral;
                const cycle = params.breathCycle;
                const depth = params.breathDepth;
                const now = this.ctx.currentTime;

                // Inhale: 40% of cycle, ramp gain up
                const inhaleEnd = now + cycle * 0.4;
                this._breathEnvelope.gain.setValueAtTime(0.01, now);
                this._breathEnvelope.gain.linearRampToValueAtTime(depth, inhaleEnd);

                // Brief hold (5% of cycle)
                const holdEnd = inhaleEnd + cycle * 0.05;

                // Exhale: 45% of cycle, ramp gain down
                const exhaleEnd = holdEnd + cycle * 0.45;
                this._breathEnvelope.gain.setValueAtTime(depth, holdEnd);
                this._breathEnvelope.gain.linearRampToValueAtTime(0.01, exhaleEnd);

                // Pause at bottom (10% of cycle), then schedule next
                this._breathTimer = setTimeout(() => {
                    this._runBreathCycle();
                }, cycle * 1000);
            }

            /**
             * Stop breathing loop and disconnect noise source.
             */
            _stopBreathing() {
                if (this._breathTimer) {
                    clearTimeout(this._breathTimer);
                    this._breathTimer = null;
                }
                if (this._breathNoiseNode) {
                    try { this._breathNoiseNode.stop(); } catch (e) {}
                    this._breathNoiseNode.disconnect();
                    this._breathNoiseNode = null;
                }
                if (this._breathFilter) {
                    this._breathFilter.disconnect();
                    this._breathFilter = null;
                }
                if (this._breathEnvelope) {
                    this._breathEnvelope.disconnect();
                    this._breathEnvelope = null;
                }
            }

            // ── Private: Room Tone ───────────────────────────────

            /**
             * Start ultra-subtle room tone — continuous filtered noise
             * at very low volume to prevent dead silence.
             */
            _startRoomTone() {
                if (this._roomNoiseNode) return;

                const bufLen = this.ctx.sampleRate * 2;
                const noiseBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;

                this._roomNoiseNode = this.ctx.createBufferSource();
                this._roomNoiseNode.buffer = noiseBuf;
                this._roomNoiseNode.loop = true;

                this._roomFilter = this.ctx.createBiquadFilter();
                this._roomFilter.type = 'lowpass';
                this._roomFilter.frequency.value = 200;
                this._roomFilter.Q.value = 0.5;

                this._roomNoiseNode.connect(this._roomFilter);
                this._roomFilter.connect(this.roomToneGain);
                this._roomNoiseNode.start();
            }

            /**
             * Stop room tone and disconnect nodes.
             */
            _stopRoomTone() {
                if (this._roomNoiseNode) {
                    try { this._roomNoiseNode.stop(); } catch (e) {}
                    this._roomNoiseNode.disconnect();
                    this._roomNoiseNode = null;
                }
                if (this._roomFilter) {
                    this._roomFilter.disconnect();
                    this._roomFilter = null;
                }
            }

            // ── Private: Vocalizations ───────────────────────────

            /**
             * Schedule the next random idle vocalization.
             * Interval: 15–30 seconds, type selected from emotion-matched pool.
             */
            _scheduleNextVocal() {
                if (!this.enabled || !this.vocalsEnabled) return;

                const delay = 15000 + Math.random() * 15000; // 15-30s
                this._vocalTimeout = setTimeout(() => {
                    const pool = EMOTION_VOCALS[this.emotion] || EMOTION_VOCALS.neutral;
                    const type = pool[Math.floor(Math.random() * pool.length)];
                    this.playVocalization(type);
                    this._scheduleNextVocal();
                }, delay);
            }
        }

        // ══════════════════════════════════════════════════════════
        // Time-of-Day Lighting System (Phase 11A)
        // ══════════════════════════════════════════════════════════

        /**
         * Time-of-day lighting presets.
         *
         * Each hour window defines color temperature and intensity for the
         * 3-point lighting rig + ambient. Colors simulate real daylight:
         * warm golden at sunrise/sunset, cool blue at night, neutral at noon.
         *
         * The system interpolates between adjacent presets for smooth transitions.
         *
         * @type {Object<string, {key: {color: number, intensity: number}, fill: {color: number, intensity: number}, rim: {color: number, intensity: number}, ambient: {color: number, intensity: number}}>}
         */
        const TIME_OF_DAY_PRESETS = {
            // Dawn (5-7): warm gold, low intensity, soft shadows
            dawn: {
                key:     { color: 0xffb347, intensity: 1.0 },
                fill:    { color: 0xffd4a3, intensity: 0.35 },
                rim:     { color: 0xff8c42, intensity: 0.5 },
                ambient: { color: 0xffecd2, intensity: 0.25 },
            },
            // Morning (7-10): warm white, building intensity
            morning: {
                key:     { color: 0xfff0d0, intensity: 1.3 },
                fill:    { color: 0xd8e8ff, intensity: 0.45 },
                rim:     { color: 0xffffff, intensity: 0.6 },
                ambient: { color: 0xfff8f0, intensity: 0.3 },
            },
            // Noon (10-14): neutral white, bright, high contrast
            noon: {
                key:     { color: 0xfff4e0, intensity: 1.6 },
                fill:    { color: 0xd0e8ff, intensity: 0.55 },
                rim:     { color: 0xffffff, intensity: 0.75 },
                ambient: { color: 0xffffff, intensity: 0.3 },
            },
            // Afternoon (14-17): slightly warm, softening
            afternoon: {
                key:     { color: 0xffe8c0, intensity: 1.4 },
                fill:    { color: 0xd4e4ff, intensity: 0.5 },
                rim:     { color: 0xfff0e0, intensity: 0.65 },
                ambient: { color: 0xfff8f0, intensity: 0.3 },
            },
            // Golden hour (17-19): deep warm, cinematic
            golden: {
                key:     { color: 0xffa040, intensity: 1.2 },
                fill:    { color: 0xffc880, intensity: 0.4 },
                rim:     { color: 0xff6820, intensity: 0.7 },
                ambient: { color: 0xffe0b0, intensity: 0.2 },
            },
            // Evening (19-21): cool transition, dimming
            evening: {
                key:     { color: 0xc8b0ff, intensity: 0.9 },
                fill:    { color: 0x8090c0, intensity: 0.3 },
                rim:     { color: 0xa090d0, intensity: 0.5 },
                ambient: { color: 0xd0c0e8, intensity: 0.2 },
            },
            // Night (21-5): cool blue, low, intimate
            night: {
                key:     { color: 0x6080c0, intensity: 0.6 },
                fill:    { color: 0x405080, intensity: 0.2 },
                rim:     { color: 0x8070b0, intensity: 0.4 },
                ambient: { color: 0x303860, intensity: 0.15 },
            },
        };

        /**
         * Map hour (0-23) to the preset name and interpolation factor
         * between the current and next preset.
         *
         * @param {number} hour - Hour in 24h format (0-23, can include fractional minutes)
         * @returns {{from: string, to: string, t: number}} Preset names and blend factor
         */
        function getTimeOfDayBlend(hour) {
            if (hour >= 5  && hour < 7)  return { from: 'night',     to: 'dawn',      t: (hour - 5) / 2 };
            if (hour >= 7  && hour < 10) return { from: 'dawn',      to: 'morning',   t: (hour - 7) / 3 };
            if (hour >= 10 && hour < 14) return { from: 'morning',   to: 'noon',      t: (hour - 10) / 4 };
            if (hour >= 14 && hour < 17) return { from: 'noon',      to: 'afternoon', t: (hour - 14) / 3 };
            if (hour >= 17 && hour < 19) return { from: 'afternoon', to: 'golden',    t: (hour - 17) / 2 };
            if (hour >= 19 && hour < 21) return { from: 'golden',    to: 'evening',   t: (hour - 19) / 2 };
            if (hour >= 21 && hour < 24) return { from: 'evening',   to: 'night',     t: (hour - 21) / 3 };
            // 0-5: solid night
            return { from: 'night', to: 'night', t: 0 };
        }

        /**
         * Manages time-of-day lighting transitions on the 3-point rig.
         *
         * Accepts an hour value (0-23) and smoothly transitions the key,
         * fill, rim, and ambient lights to match the corresponding preset.
         * Interpolates between adjacent presets for smooth color/intensity blending.
         *
         * Uses exponential smoothing (setTargetAtTime) for flicker-free transitions
         * when the hour changes in real-time.
         */
        class TimeOfDayLighting {
            /**
             * @param {THREE.DirectionalLight} key - Key light reference
             * @param {THREE.DirectionalLight} fill - Fill light reference
