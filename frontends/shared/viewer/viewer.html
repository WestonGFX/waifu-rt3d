<!doctype html>

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #loading {
            display: none;
        }

        /* Video background layer (behind canvas) */
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        /* ── Pet Mode Overlay ──────────────────────────────────────── */
        body.pet-mode { background: transparent; }

        #pet-overlay {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 8px; z-index: 100;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: none;
        }
        #pet-overlay > * { pointer-events: auto; }

        .pet-bubble {
            background: rgba(0,0,0,0.75); color: #e0e0ff;
            padding: 6px 12px; border-radius: 12px;
            font: 13px/1.45 system-ui; max-width: 88%;

            align-self: flex-end;
            background: rgba(120,80,255,0.78);
        }
        .pet-bubble.hidden { opacity: 0; pointer-events: none; }

        #pet-input-row { display: flex; gap: 6px; }

        #pet-input {
            flex: 1; background: rgba(0,0,0,0.65); color: #fff;
            border: 1px solid rgba(120,80,255,0.5); border-radius: 10px;
            padding: 7px 12px; font: 13px system-ui; outline: none;
        }
        #pet-input:focus { border-color: rgba(120,80,255,0.9); }

        #pet-send {
            background: rgba(120,80,255,0.85); color: #fff;
            border: none; border-radius: 10px; padding: 7px 14px;
            cursor: pointer; font: 15px system-ui; line-height: 1;
        }
        #pet-send:hover { background: rgba(140,100,255,0.95); }
    </style>
</head>

<body>
    <div id="loading">UPLINKING_VISUAL_FEED...</div>
    <video id="bg-video" loop muted playsinline></video>
    <canvas id="c"></canvas>
    <!-- FPS overlay — hidden by default, shown via showFps postMessage or settings toggle -->

        position:fixed; bottom:8px; right:8px; z-index:9999;

        background:rgba(0,0,0,0.55); padding:2px 8px; border-radius:3px;
        display:none; pointer-events:none; letter-spacing:0.5px;
    "></div>
    <script type="importmap">
        {
            "imports": {
                "three": "/shared/lib/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from '/shared/lib/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '/shared/lib/three-vrm.module.min.js';
        // Phase 5: Post-processing pipeline addons
        import { EffectComposer } from '/shared/lib/postprocessing/EffectComposer.js';
        import { RenderPass } from '/shared/lib/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from '/shared/lib/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from '/shared/lib/postprocessing/ShaderPass.js';
        // Phase 12-P4: Anime shaders
        import { OutlinePass } from '/shared/lib/shaders/OutlineShader.js';
        import { GodRaysShader } from '/shared/lib/shaders/GodRaysShader.js';
        import { injectToonShading, removeToonShading, updateToonParams } from '/shared/lib/shaders/ToonShader.js';
        // Task 3B: Specialty shaders
        import { injectHairShading, removeHairShading, updateHairParams } from '/shared/lib/shaders/HairShader.js';
        import { injectEyeSparkle, removeEyeSparkle, updateEyeSparkleParams } from '/shared/lib/shaders/EyeShader.js';

        let currentVrm = null;
        let currentGlb = null;        // Currently loaded GLB scene (null when VRM or empty)
        let currentGlbMixer = null;   // THREE.AnimationMixer for GLB embedded animations
        let currentGlbClips = [];     // Embedded AnimationClip[] from GLB
        let currentEnvironment = null; // Stage 2a: loaded environment (room/cafe) GLB scene
        let environmentFloor = null;   // Stage 2a: shadow-catching floor plane at world y=0
        let _currentGlbAction = null; // Currently playing GLB AnimationAction (for crossfade)
        let clock = new THREE.Clock();
        let lipSync = null;
        let characterAudio = null;  // Phase 12-P5: ambient audio engine
        let timeOfDayLighting = null; // Phase 11A: time-of-day lighting
        let poseController = null;    // Phase 11A: procedural pose system
        let jiggleManager = null;
        // Maps AnimationDirector state names to jiggle movement multipliers.
        // Lower stiffness + higher gravity = more bounce during active animations.
        const JIGGLE_MOVEMENT_MULTIPLIERS = {
            idle:    { stiffness: 1.0, gravity: 1.0  },
            talk:    { stiffness: 0.9, gravity: 1.05 },
            gesture: { stiffness: 0.7, gravity: 1.1  },
            clip:    { stiffness: 0.6, gravity: 1.3  },
            mocap:   { stiffness: 0.8, gravity: 1.0  },
            sequence:{ stiffness: 0.65,gravity: 1.2  },
        };
        let blinkController = null;
        let saccadeController = null;
        let microTremorController = null;
        let microExpressionController = null;
        let headMovement = null;
        let expressionController = null;
        let gestureController = null;
        let proceduralAnimator = null;
        let mouseTracker = null;
        let animationDirector = null;
        /** Phase 17B: AnimationSequencer instance — emotion→gesture sequence orchestrator. */
        let animationSequencer = null;
        /** Phase E: PoseLibrary — tag-based clip selection for emotion-matched reactions. */
        let poseLibrary = null;
        /** Phase E: FootPlantController — analytical IK to prevent foot sliding. */
        let footPlantController = null;
        // Tracks the last emotion that triggered an auto-gesture, preventing
        // repeat gestures when the same emotion fires on consecutive messages.
        let lastAutoGestureEmotion = null;
        // FPS counter state — updated once per second in the render loop
        let _fpsFrameCount = 0;
        let _fpsLastTime = 0;
        let _fpsDisplay = 0;
        // FPS cap state — 0 means unlimited (default). Set via setFpsTarget postMessage.
        // When set, the animate() loop skips rendering until the target interval elapses.
        let _fpsTargetMs = 0;
        let _fpsLastRenderTime = 0;

        // ══════════════════════════════════════════════════════════
        // Inline OrbitControls (minimal implementation)
        // Provides: left-drag orbit, scroll zoom, right-drag pan
        // ══════════════════════════════════════════════════════════

        /**
         * Minimal orbit camera controller for Three.js.
         * Supports left-click orbit, right-click pan, scroll zoom.
         * No external dependency — written inline to avoid missing lib issues.
         */
        class SimpleOrbitControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                this.enabled = true;

                // Orbit state
                this.target = new THREE.Vector3(0, 1.2, 0);
                this.spherical = new THREE.Spherical();
                this.sphericalDelta = new THREE.Spherical();
                this.panOffset = new THREE.Vector3();

                // Limits
                this.minDistance = 0.5;
                this.maxDistance = 5;
                this.minPolarAngle = 0.1;
                this.maxPolarAngle = Math.PI - 0.1;
                this.rotateSpeed = 1.0;
                this.panSpeed = 1.0;
                this.zoomSpeed = 1.0;

                // Internal state
                this._rotateStart = new THREE.Vector2();
                this._panStart = new THREE.Vector2();
                this._isRotating = false;
                this._isPanning = false;
                this._zoomVelocity = 0;

                this._bindEvents();
                this._updateSpherical();
            }

            /** Sync internal spherical from current camera position. */
            _updateSpherical() {
                const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
                this.spherical.setFromVector3(offset);
            }

            _bindEvents() {
                const el = this.domElement;
                el.addEventListener('pointerdown', (e) => this._onPointerDown(e));
                el.addEventListener('pointermove', (e) => this._onPointerMove(e));
                el.addEventListener('pointerup', () => this._onPointerUp());
                el.addEventListener('pointerleave', () => this._onPointerUp());
                el.addEventListener('wheel', (e) => this._onWheel(e), { passive: false });
                el.addEventListener('contextmenu', (e) => e.preventDefault());
                el.addEventListener('dblclick', () => this._onDoubleClick());
            }

            _onPointerDown(e) {
                if (!this.enabled) return;
                if (e.button === 0) {
                    this._isRotating = true;
                    this._rotateStart.set(e.clientX, e.clientY);
                } else if (e.button === 2) {
                    this._isPanning = true;
                    this._panStart.set(e.clientX, e.clientY);
                }
            }

            _onPointerMove(e) {
                if (!this.enabled) return;
                if (this._isRotating) {
                    const dx = (e.clientX - this._rotateStart.x) / this.domElement.clientHeight * Math.PI * this.rotateSpeed;
                    const dy = (e.clientY - this._rotateStart.y) / this.domElement.clientHeight * Math.PI * this.rotateSpeed;
                    this.sphericalDelta.theta -= dx;
                    this.sphericalDelta.phi -= dy;
                    this._rotateStart.set(e.clientX, e.clientY);
                }
                if (this._isPanning) {
                    const distanceScale = Math.max(this.spherical.radius / 2.0, 0.3);
                    const dx = (e.clientX - this._panStart.x) * this.panSpeed * 0.002 * distanceScale;
                    const dy = (e.clientY - this._panStart.y) * this.panSpeed * 0.002 * distanceScale;
                    const right = new THREE.Vector3();
                    const up = new THREE.Vector3();
                    right.setFromMatrixColumn(this.camera.matrix, 0);
                    up.setFromMatrixColumn(this.camera.matrix, 1);
                    this.panOffset.addScaledVector(right, -dx);
                    this.panOffset.addScaledVector(up, dy);
                    this._panStart.set(e.clientX, e.clientY);
                }
            }

            _onPointerUp() {
                this._isRotating = false;
                this._isPanning = false;
            }

            _onWheel(e) {
                if (!this.enabled) return;
                e.preventDefault();
                // Logarithmic zoom: finer when close, coarser when far
                const zoomFactor = 1 + 0.05 * this.zoomSpeed * Math.max(this.spherical.radius / 2, 0.5);
                if (e.deltaY > 0) {
                    this._zoomVelocity += 0.02 * this.zoomSpeed;
                } else {
                    this._zoomVelocity -= 0.02 * this.zoomSpeed;
                }
            }

            /** Call each frame to apply accumulated deltas and advance any active tween. */
            update() {
                if (!this.enabled) return;

                // Drive smooth camera tween (set by tweenTo). Uses smoothstep easing.
                if (this._tween) {
                    const t = Math.min((performance.now() - this._tween.startTime) / this._tween.duration, 1);
                    // Smoothstep easing: t² × (3 − 2t)
                    const s = t * t * (3 - 2 * t);
                    this.camera.position.lerpVectors(this._tween.fromPos, this._tween.toPos, s);
                    this.target.lerpVectors(this._tween.fromTarget, this._tween.toTarget, s);
                    this._updateSpherical();
                    if (t >= 1) this._tween = null; // tween complete
                    this.camera.lookAt(this.target);
                    return; // skip manual-delta handling while tweening
                }

                // Apply zoom damping (momentum from scroll wheel)
                if (Math.abs(this._zoomVelocity) > 0.0005) {
                    this.spherical.radius *= (1 + this._zoomVelocity);
                    this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius));
                    this._zoomVelocity *= 0.85; // decay
                } else {
                    this._zoomVelocity = 0;
                }

                // Apply pan
                this.target.add(this.panOffset);
                this.panOffset.set(0, 0, 0);

                // Apply rotation
                this.spherical.theta += this.sphericalDelta.theta;
                this.spherical.phi += this.sphericalDelta.phi;
                this.spherical.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, this.spherical.phi));
                this.sphericalDelta.set(0, 0, 0);

                // Compute new camera position
                const offset = new THREE.Vector3().setFromSpherical(this.spherical);
                this.camera.position.copy(this.target).add(offset);
                this.camera.lookAt(this.target);
            }

            /** Reset camera to a specific position + target (instant, no tween). */
            reset(position, target) {
                this._tween = null; // cancel any active tween
                this.target.copy(target || new THREE.Vector3(0, 1.2, 0));
                this.camera.position.copy(position || new THREE.Vector3(0, 1.4, 1.2));
                this._updateSpherical();
            }

            /**
             * Smoothly animate the camera to a new position and target.
             *
             * @param {THREE.Vector3} toPos - Destination camera position
             * @param {THREE.Vector3} toTarget - Destination orbit target (look-at point)
             * @param {number} [durationMs=500] - Animation duration in milliseconds
             */
            tweenTo(toPos, toTarget, durationMs = 500) {
                this._tween = {
                    fromPos:    this.camera.position.clone(),
                    fromTarget: this.target.clone(),
                    toPos:      toPos.clone(),
                    toTarget:   toTarget.clone(),
                    duration:   durationMs,
                    elapsed:    0,
                    startTime:  performance.now(),
                };
            }

            /** Double-click recenters camera to fullbody default view. */
            _onDoubleClick() {
                if (!this.enabled || !_vrmFrameData) return;
                const { targetY, camZ, modelHeight } = _vrmFrameData;
                this.tweenTo(
                    new THREE.Vector3(0, targetY + modelHeight * 0.05, camZ * 1.15),
                    new THREE.Vector3(0, targetY, 0),
                    400
                );
            }

            /** Get serializable camera state for presets. */
            getState() {
                return {
                    position: this.camera.position.toArray(),
                    target: this.target.toArray(),
                    radius: this.spherical.radius
                };
            }

            /** Restore camera state from preset. */
            setState(preset) {
                if (preset.position) this.camera.position.fromArray(preset.position);
                if (preset.target) this.target.fromArray(preset.target);
                this._updateSpherical();
            }

            /**
             * Smoothly transition to a named camera preset.
             * Uses VRM frame data for model-relative positioning.
             *
             * @param {string} presetName - 'fullbody'|'upper'|'face'|'side'|'low'
             * @param {number} [durationMs=600] - Transition duration
             */
            goToPreset(presetName, durationMs = 600) {
                if (!_vrmFrameData) return;
                const { targetY, camZ, modelHeight } = _vrmFrameData;
                const presets = {
                    fullbody: {
                        pos: [0, targetY + modelHeight * 0.05, camZ * 1.15],
                        target: [0, targetY, 0],
                    },
                    upper: {
                        pos: [0, targetY + modelHeight * 0.2, camZ * 0.7],
                        target: [0, targetY + modelHeight * 0.15, 0],
                    },
                    face: {
                        pos: [0, targetY + modelHeight * 0.35, camZ * 0.35],
                        target: [0, targetY + modelHeight * 0.35, 0],
                    },
                    side: {
                        pos: [camZ * 0.8, targetY + modelHeight * 0.1, camZ * 0.6],
                        target: [0, targetY + modelHeight * 0.05, 0],
                    },
                    low: {
                        pos: [0, targetY - modelHeight * 0.1, camZ * 1.0],
                        target: [0, targetY + modelHeight * 0.1, 0],
                    },
                };
                const preset = presets[presetName] || presets.fullbody;
                this.tweenTo(
                    new THREE.Vector3(...preset.pos),
                    new THREE.Vector3(...preset.target),
                    durationMs
                );
            }
        }

        // ══════════════════════════════════════════════════════════
        // Character Touch/Poke Raycaster (Phase 12-P3)
        // ══════════════════════════════════════════════════════════
        // Detects clicks on the character model and maps hit position
        // to body zones (head, cheeks, shoulders, torso).

        const _raycaster = new THREE.Raycaster();
        const _pointerNDC = new THREE.Vector2();
        let _touchCooldowns = {};

        /**
         * Handle pointer click on canvas — raycast to detect character touch.
         * Maps hit Y-coordinate to body zone and posts event to parent.
         *
         * @param {PointerEvent} event
         */
        function _onCharacterTouch(event) {
            if (!currentVrm || !camera) return;

            // Convert screen coords to NDC (-1 to +1)
            const rect = renderer.domElement.getBoundingClientRect();
            _pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            _pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            _raycaster.setFromCamera(_pointerNDC, camera);

            // Get all meshes from VRM scene
            const meshes = [];
            currentVrm.scene.traverse(child => {
                if (child.isMesh) meshes.push(child);
            });

            const hits = _raycaster.intersectObjects(meshes, false);
            if (hits.length === 0) return;

            const hit = hits[0];
            const worldY = hit.point.y;

            // Map world Y to body zone using model bounding box
            const bbox = new THREE.Box3().setFromObject(currentVrm.scene);
            const modelBottom = bbox.min.y;
            const modelTop = bbox.max.y;
            const normalizedY = (worldY - modelBottom) / (modelTop - modelBottom);

            let zone = 'torso';
            if (normalizedY > 0.85) zone = 'head';
            else if (normalizedY > 0.75) zone = 'face';
            else if (normalizedY > 0.65) zone = 'shoulders';
            else if (normalizedY > 0.3) zone = 'torso';
            else zone = 'legs';

            // Cooldown check
            const now = performance.now();
            if (_touchCooldowns[zone] && now - _touchCooldowns[zone] < 2000) return;
            _touchCooldowns[zone] = now;

            // Phase 12-P5: play interaction sound immediately in viewer
            if (characterAudio) characterAudio.playInteractionSound(zone);

            // Notify parent frame
            window.parent.postMessage({
                type: 'characterTouch',
                zone: zone,
                normalizedY: normalizedY,
                worldPosition: hit.point.toArray(),
            }, '*');

            console.log(`[Touch] Zone: ${zone} (Y: ${normalizedY.toFixed(2)})`);
        }


        // ══════════════════════════════════════════════════════════
        // Layered Animation System — Phase 6F + Clip Extension
        // 7 layers processed per frame in order:
        //   L0 BasePose, L1 IdleBehavior, L2 EmotionModifier,
        //   L3 TalkBehavior, L4 GestureOverride, L5 LookAt,
        //   L6 ClipPlayback (AnimationMixer)
        // ══════════════════════════════════════════════════════════

        /**
         * Default animation personality profile.
         * All values 0–1. Used when character has no custom profile.
         */
        const DEFAULT_PERSONALITY = {
            energy: 0.5, confidence: 0.5, nervousness: 0.3,
            expressiveness: 0.5, playfulness: 0.5,
        };

        /**
         * Base class for all animation layers.
         * Each layer writes to specific bones using set (=) or additive (+=) mode.
         * @abstract
         */
        class AnimationLayer {
            /**
             * @param {Object} vrm - The loaded VRM model instance
             * @param {string} name - Layer name for debugging
             */
            constructor(vrm, name) {
                this.vrm = vrm;
                this.name = name;
                this.personality = { ...DEFAULT_PERSONALITY };
                this.enabled = true;
                this.weight = 1.0;
                this.time = 0;
            }

            /**
             * Resolve a VRM humanoid bone by name.
             * @param {string} boneName - Humanoid bone name (e.g. 'spine', 'hips')
             * @returns {Object|null} The bone node or null
             */
            getBone(boneName) {
                return this.vrm.humanoid.getNormalizedBoneNode?.(boneName)
                    || this.vrm.humanoid.getBoneNode?.(boneName)
                    || null;
            }

            /**
             * Update personality parameters from profile object.
             * @param {Object} profile - {energy, confidence, nervousness, expressiveness, playfulness}
             */
            setPersonality(profile) {
                this.personality = { ...DEFAULT_PERSONALITY, ...profile };
            }

            /**
             * Per-frame update. Subclasses override this.
             * @param {number} dt - Delta time in seconds
             */
            update(dt) { this.time += dt; }
        }

        /**
         * Orchestrates all 6 animation layers per frame.
         * Manages suppression rules:
         *   - L3 (Talk) suppresses L1 (Idle) when active
         *   - L4 (Gesture) suppresses L1 and L3 on affected bones during playback
         *   - L5 (LookAt) is always additive
         */
        /* ═══════════════════════════════════════════════════════════════════
           Animation State Machine — Phase 6.5
           Formalizes which layers are active in each state and how transitions
           work. Replaces ad-hoc suppression logic in AnimationDirector.update().

           States:
           ┌──────────┬────────────────────────────────────────────────────────┐
           │ State    │ Active layers                                         │
           ├──────────┼────────────────────────────────────────────────────────┤
           │ idle     │ basePose, idle, emotion, lookAt                       │
           │ talk     │ basePose, emotion, talk, lookAt                       │
           │ gesture  │ basePose, emotion, gesture, lookAt                    │
           │ clip     │ clip, lookAt                                          │
           │ mocap    │ lookAt only (mocap overrides via lookAt layer)        │
           └──────────┴────────────────────────────────────────────────────────┘

           lookAt always runs. clip always updates its mixer (even when
           not the active state) so fadeouts complete naturally.
           ═══════════════════════════════════════════════════════════════════ */

        /**
         * Per-state layer activation table. Each key is a state name;
         * its value is the set of layer names that should be enabled.
         * Layers not listed are disabled. 'lookAt' and 'clip' have
         * special handling (see AnimationDirector.update).
         */
        const STATE_LAYER_TABLE = {
            idle:      new Set(['basePose', 'idle', 'emotion']),
            talk:      new Set(['basePose', 'emotion', 'talk']),
            gesture:   new Set(['basePose', 'emotion', 'gesture']),
            clip:      new Set([]),  // clip mixer runs separately
            mocap:     new Set([]),  // mocap drives via lookAt overrides
            // Phase 17C: Three new states
            sequence:  new Set(['basePose', 'emotion', 'gesture']),  // sequencer-driven multi-gesture chain
            transition:new Set(['basePose', 'emotion']),              // dedicated cross-fade buffer state
            emote:     new Set(['basePose', 'emotion', 'gesture']),  // short single-emotion burst
        };

        /** Crossfade duration (seconds) between states. */
        const STATE_TRANSITIONS = {
            'idle→talk':           0.2,
            'idle→gesture':        0.15,
            'idle→clip':           0.3,
            'idle→mocap':          0.2,
            'talk→idle':           0.3,
            'talk→gesture':        0.15,
            'gesture→idle':        0.25,
            'gesture→talk':        0.2,
            'clip→idle':           0.3,
            'clip→talk':           0.3,
            'mocap→idle':          0.3,
            // Phase 17C: New state transitions
            'idle→sequence':       0.2,
            'sequence→idle':       0.3,
            'sequence→talk':       0.2,
            'talk→sequence':       0.2,
            'idle→emote':          0.15,
            'emote→idle':          0.2,
            'emote→talk':          0.15,
            'idle→transition':     0.25,
            'transition→idle':     0.25,
            'transition→talk':     0.2,
            'transition→gesture':  0.2,
            'transition→sequence': 0.2,
        };

        class AnimationDirector {
            /**
             * @param {Object} vrm - The loaded VRM model
             */
            constructor(vrm) {
                this.vrm = vrm;
                this.layers = [];
                this.personality = { ...DEFAULT_PERSONALITY };
                /** Current animation state name. */
                this._state = 'idle';
                /** Transition fade progress (0 = start, 1 = done). */
                this._transitionProgress = 1.0;
                /** Transition duration in seconds. */
                this._transitionDuration = 0;
            }

            /** @returns {string} Current state name */
            get state() { return this._state; }

            /**
             * Transition to a new animation state with crossfade.
             * If already in the requested state, this is a no-op.
             *
             * @param {string} newState - Target state ('idle'|'talk'|'gesture'|'clip'|'mocap')
             * @param {number} [fadeDuration] - Override crossfade duration (seconds)
             */
            transitionTo(newState, fadeDuration) {
                if (newState === this._state) return;
                if (!STATE_LAYER_TABLE[newState]) {
                    console.warn(`[AnimationDirector] Unknown state: "${newState}"`);
                    return;
                }

                const key = `${this._state}→${newState}`;
                this._transitionDuration = fadeDuration ?? STATE_TRANSITIONS[key] ?? 0.25;
                this._transitionProgress = 0;
                this._state = newState;

                console.log(`[AnimationDirector] State → ${newState} (fade ${this._transitionDuration.toFixed(2)}s)`);

                // Update jiggle physics movement multiplier for the new state.
                if (jiggleManager?.enabled && currentVrm) {
                    const mul = JIGGLE_MOVEMENT_MULTIPLIERS[newState] || JIGGLE_MOVEMENT_MULTIPLIERS.idle;
                    jiggleManager.movementMultiplier = mul.stiffness;
                    jiggleManager._gravityMovementMul = mul.gravity;
                    jiggleManager.applyParams(currentVrm);
                }
                // Keep FollowThroughLayer aware of state so it can modulate spring halflives.
                const ftLayer = this.getLayer('followThrough');
                if (ftLayer) ftLayer.setAnimState(newState);
            }

            /**
             * Register a layer. Layers are processed in array order (index = priority).
             * @param {AnimationLayer} layer
             */
            addLayer(layer) {
                layer.setPersonality(this.personality);
                this.layers.push(layer);
            }

            /**
             * Retrieve a layer by name.
             * @param {string} name - Layer name
             * @returns {AnimationLayer|undefined}
             */
            getLayer(name) {
                return this.layers.find(l => l.name === name);
            }

            /**
             * Apply a personality profile to all layers.
             * @param {Object|null} profile - Personality JSON or null for defaults
             */
            setPersonality(profile) {
                this.personality = { ...DEFAULT_PERSONALITY, ...(profile || {}) };
                for (const layer of this.layers) {
                    layer.setPersonality(this.personality);
                }
            }

            /**
             * Per-frame update — uses state machine to determine active layers.
             *
             * The state machine controls which layers are enabled/disabled.
             * It also auto-detects state transitions from layer activity:
             *   - ClipLayer.isPlaying → auto-enter 'clip' state
             *   - GestureLayer.isPlaying → auto-enter 'gesture' state
             *   - TalkLayer.active → auto-enter 'talk' state
             *   - Otherwise → 'idle' state
             *
             * LookAt (L5) always runs regardless of state.
             * Clip mixer always ticks so fadeouts complete even when not in 'clip' state.
             *
             * @param {number} dt - Delta time in seconds
             */
            update(dt) {
                const clip = this.getLayer('clip');
                const gesture = this.getLayer('gesture');
                const talk = this.getLayer('talk');

                // ── Auto-detect state from layer activity ──
                // Priority (highest to lowest): clip > sequence > gesture > emote > talk > idle
                // Phase 17C: sequence and emote states added.
                //   sequence: driven by external AnimationSequencer (checked via global flag)
                //   emote: short single-emotion burst (currently entered only via postMessage)
                if (clip && clip.isPlaying && this._state !== 'clip') {
                    this.transitionTo('clip');
                } else if (!clip?.isPlaying && this._state === 'clip') {
                    this.transitionTo('idle');
                } else if (gesture && gesture.isPlaying &&
                           (this._state === 'idle' || this._state === 'sequence')) {
                    // Enter 'sequence' when the gesture was triggered by the sequencer,
                    // or 'gesture' for direct one-off triggers.
                    // We check animationSequencer global to distinguish the two origins.
                    const fromSequencer = typeof animationSequencer !== 'undefined'
                        && animationSequencer?.isActive;
                    this.transitionTo(fromSequencer ? 'sequence' : 'gesture');
                } else if (!gesture?.isPlaying && this._state === 'gesture') {
                    this.transitionTo('idle');
                } else if (!gesture?.isPlaying && this._state === 'sequence' &&
                           !(typeof animationSequencer !== 'undefined' && animationSequencer?.isActive)) {
                    this.transitionTo('idle');
                } else if (talk && talk.active &&
                           (this._state === 'idle' || this._state === 'emote')) {
                    this.transitionTo('talk');
                } else if (!talk?.active && this._state === 'talk') {
                    this.transitionTo('idle');
                }

                // ── Advance transition ──
                if (this._transitionProgress < 1.0 && this._transitionDuration > 0) {
                    this._transitionProgress = Math.min(1.0,
                        this._transitionProgress + dt / this._transitionDuration);
                }

                // ── Apply layer activation from state table ──
                const activeLayers = STATE_LAYER_TABLE[this._state] || STATE_LAYER_TABLE.idle;
                for (const layer of this.layers) {
                    if (layer.name === 'lookAt') {
                        // LookAt always runs
                        layer.enabled = true;
                    } else if (layer.name === 'clip') {
                        // Clip mixer always ticks (for fadeouts), but only
                        // drives bones when in 'clip' state
                        layer.enabled = true;
                    } else {
                        layer.enabled = activeLayers.has(layer.name);
                    }
                }

                // ── Update all enabled layers ──
                for (const layer of this.layers) {
                    if (layer.enabled) layer.update(dt);
                }
            }
        }

        /**
         * Smooth value noise — returns value in [-1, 1] that never repeats within a session.
         * Uses a quintic smoothstep between pseudo-random lattice values.
         * Replaces Math.sin() for organic, non-repeating idle motion.
         *
         * @param {number} t - Time coordinate (use elapsed seconds * frequency)
         * @param {number} seed - Seed offset so different channels don't correlate
         * @returns {number} Smooth noise in [-1, 1]
         */
        function noise1D(t, seed = 0) {
            const i = Math.floor(t) + seed * 1000;
            const f = t - Math.floor(t);
            // Quintic smoothstep: 6f^5 - 15f^4 + 10f^3 (zero first and second derivative at edges)
            const u = f * f * f * (f * (f * 6 - 15) + 10);
            // Simple integer hash → float in [0, 1]
            const h = (n) => {
                const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
                return x - Math.floor(x);
            };
            return (h(i) * (1 - u) + h(i + 1) * u) * 2 - 1;
        }

        /**
         * Critically damped spring — reaches goal without overshoot, maintains velocity
         * continuity across target changes (unlike lerp which snaps direction instantly).
         * Algorithm: Daniel Holden's exact formulation (dt-correct at any frame rate).
         *
         * @param {number} x - Current position
         * @param {number} v - Current velocity
         * @param {number} goal - Target position
         * @param {number} halflife - Seconds to halve remaining distance (smaller = snappier)
         * @param {number} dt - Delta time in seconds
         * @returns {{x: number, v: number}} Updated position and velocity
         */
        function springDamperExact(x, v, goal, halflife, dt) {
            const eps = 1e-5;
            const f   = Math.log(2) / (halflife + eps);
            const d   = x - goal;
            const j0  = d;
            const j1  = v + d * f;
            const eydt = Math.exp(-f * dt);
            return {
                x: eydt * (j0 + j1 * dt) + goal,
                v: eydt * (j1 - j0 * f * dt - j1 * f * dt),
            };
        }

        /**
         * Under-damped spring — oscillates around goal before settling.
         * Produces natural overshoot-and-settle on bone rotations (e.g. head nod, arm gesture).
         * Falls back to springDamperExact if the discriminant is non-positive (critically-damped territory).
         *
         * @param {number} x - Current value
         * @param {number} v - Current velocity
         * @param {number} goal - Target value
         * @param {number} frequency - Oscillation frequency in Hz
         * @param {number} halflife - Decay halflife in seconds
         * @param {number} dt - Delta time in seconds
         * @returns {{x: number, v: number}} Updated position and velocity
         */
        function springDamperUnder(x, v, goal, frequency, halflife, dt) {
            const d = (4.0 * 0.69314718056) / (halflife + 1e-5);
            const s = (2.0 * Math.PI * frequency) * (2.0 * Math.PI * frequency);
            const discrim = s - (d * d / 4.0);
            if (discrim <= 0) return springDamperExact(x, v, goal, halflife, dt);
            const w = Math.sqrt(discrim);
            const y = d / 2.0;
            const j = Math.sqrt(
                ((v + y * (x - goal)) / w) * ((v + y * (x - goal)) / w) +
                (x - goal) * (x - goal)
            );
            const p = Math.atan2(v + y * (x - goal), w * (x - goal));
            const eydt = Math.exp(-y * dt);
            return {
                x: j * eydt * Math.cos(w * dt + p) + goal,
                v: -y * j * eydt * Math.cos(w * dt + p) - w * j * eydt * Math.sin(w * dt + p),
            };
        }

        /**
         * Critically damped spring for THREE.Quaternion rotations.
         * Uses scaled angle-axis (log-map) to avoid gimbal lock and ensure shortest-path rotation.
         *
         * @param {THREE.Quaternion} x - Current rotation
         * @param {THREE.Vector3}    v - Current angular velocity (scaled axis)
         * @param {THREE.Quaternion} goal - Target rotation
         * @param {number}           halflife - Seconds
         * @param {number}           dt - Delta time in seconds
         * @returns {{x: THREE.Quaternion, v: THREE.Vector3}} Updated rotation and angular velocity
         */
        function springDamperQuaternion(x, v, goal, halflife, dt) {
            const y = (4.0 * 0.69314718056) / (halflife + 1e-5) / 2.0;
            const diff = new THREE.Quaternion().copy(x).multiply(
                new THREE.Quaternion().copy(goal).invert()
            );
            // Ensure shortest-path rotation
            if (diff.w < 0) { diff.x = -diff.x; diff.y = -diff.y; diff.z = -diff.z; diff.w = -diff.w; }
            const halfAngle = Math.acos(Math.min(1.0, diff.w));
            const sinHalf = Math.sin(halfAngle);
            const j0 = sinHalf < 1e-5
                ? new THREE.Vector3(0, 0, 0)
                : new THREE.Vector3(diff.x, diff.y, diff.z).multiplyScalar(2.0 * halfAngle / sinHalf);
            const j1 = new THREE.Vector3().copy(v).addScaledVector(j0, y);
            const eydt = Math.exp(-y * dt);
            const newAxis = new THREE.Vector3().copy(j0).addScaledVector(j1, dt).multiplyScalar(eydt);
            const angle = newAxis.length();
            const newQuat = angle < 1e-5
                ? new THREE.Quaternion().copy(goal)
                : new THREE.Quaternion().setFromAxisAngle(newAxis.normalize(), angle).multiply(goal);
            const newV = new THREE.Vector3().copy(v).addScaledVector(j1, -y * dt).multiplyScalar(eydt);
            return { x: newQuat, v: newV };
        }

        /**
         * Manages spring-driven settling for primary skeleton bone rotations.
         * Distinct from VRM secondary physics (hair/cloth) — this applies to the MAIN
         * skeleton for smooth overshoot-and-settle on procedural pose changes.
         *
         * Use setCritical() for subtle procedural motion (breathing, head drift).
         * Use setTarget() with under-damped params for reactions that should overshoot.
         *
         * @example
         * const springs = new PoseSpringManager();
         * springs.setCritical('chest', 'x', breathX, 0.25);
         * const out = springs.update(dt);
         * chest.rotation.x = out.chest?.x ?? chest.rotation.x;
         */
        class PoseSpringManager {
            constructor() {
                /** @type {Map<string, {x:number, v:number, goal:number, halflife:number, frequency:number, critical:boolean}>} */
                this._springs = new Map();
            }

            /**
             * Set a critically-damped spring target (no overshoot — smoothest settling).
             *
             * @param {string} boneName - Normalized VRM bone name (e.g. 'chest', 'head')
             * @param {string} axis     - Rotation axis: 'x', 'y', or 'z'
             * @param {number} goal     - Target rotation value in radians
             * @param {number} halflife - Seconds to reduce error by half (default 0.2s = "natural")
             */
            setCritical(boneName, axis, goal, halflife = 0.2) {
                const key = `${boneName}.${axis}`;
                const s = this._springs.get(key);
                if (s) {
                    s.goal = goal;
                    s.halflife = halflife;
                    s.critical = true;
                } else {
                    // Initialise at goal so first-frame is instant (no from-zero spring-in on mount).
                    this._springs.set(key, { x: goal, v: 0, goal, halflife, frequency: 2.0, critical: true });
                }
            }

            /**
             * Set an under-damped spring target (produces natural overshoot-and-settle).
             *
             * @param {string} boneName  - Normalized VRM bone name
             * @param {string} axis      - Rotation axis: 'x', 'y', or 'z'
             * @param {number} goal      - Target rotation value in radians
             * @param {number} frequency - Oscillation frequency in Hz (higher = snappier overshoot)
             * @param {number} halflife  - Decay halflife in seconds
             */
            setTarget(boneName, axis, goal, frequency = 2.0, halflife = 0.2) {
                const key = `${boneName}.${axis}`;
                const s = this._springs.get(key);
                if (s) {
                    s.goal = goal;
                    s.frequency = frequency;
                    s.halflife = halflife;
                    s.critical = false;
                } else {
                    this._springs.set(key, { x: goal, v: 0, goal, halflife, frequency, critical: false });
                }
            }

            /**
             * Advance all springs by dt and return a map of {boneName: {axis: value}}.
             * Apply the returned values to the corresponding bone.rotation axes.
             *
             * @param {number} dt - Delta time in seconds
             * @returns {Record<string, Record<string, number>>} Map of boneName→{axis→value}
             */
            update(dt) {
                const result = {};
                for (const [key, s] of this._springs) {
                    const dot = key.indexOf('.');
                    const bone = key.slice(0, dot);
                    const axis = key.slice(dot + 1);
                    const upd = s.critical
                        ? springDamperExact(s.x, s.v, s.goal, s.halflife, dt)
                        : springDamperUnder(s.x, s.v, s.goal, s.frequency, s.halflife, dt);
                    s.x = upd.x;
                    s.v = upd.v;
                    if (!result[bone]) result[bone] = {};
                    result[bone][axis] = upd.x;
                }
                return result;
            }

            /**
             * @param {number} [threshold=0.001] - Max acceptable error + velocity
             * @returns {boolean} True when all springs have settled
             */
            isSettled(threshold = 0.001) {
                for (const s of this._springs.values()) {
                    if (Math.abs(s.x - s.goal) > threshold || Math.abs(s.v) > threshold) return false;
                }
                return true;
            }

            /** Snap all springs to their current goals (zero velocity). */
            reset() {
                for (const s of this._springs.values()) { s.x = s.goal; s.v = 0; }
            }
        }

        /**
        /**
         * Cascaded spring chain for follow-through animation (Disney principle 6).
         * Each bone in the chain follows its parent with increasing lag,
         * producing natural overlapping action without manual timing.
         *
         * @example
         * const chain = new SpringChain(
         *   ['hips', 'spine', 'chest', 'neck', 'head'],
         *   { baseHalflife: 0.06, halflifeGrowth: 1.5, frequency: 3.0 }
         * );
         * chain.setTargets({ hips: { x: 0.1, y: 0, z: 0 }, ... });
         * const deltas = chain.update(dt);
         * // deltas[boneName] = { x, y, z } — apply to bone.rotation
         */
        class SpringChain {
            /**
             * @param {string[]} boneNames - Ordered list from root to tip
             * @param {object}   opts
             * @param {number}   opts.baseHalflife    - Root bone halflife in seconds
             * @param {number}   opts.halflifeGrowth  - Multiplier per bone along chain
             * @param {number}   opts.frequency       - Under-damped oscillation frequency (Hz)
             */
            constructor(boneNames, opts = {}) {
                this.bones = boneNames;
                this.baseHalflife  = opts.baseHalflife   ?? 0.06;
                this.halflifeGrowth = opts.halflifeGrowth ?? 1.5;
                this.frequency     = opts.frequency       ?? 3.0;
                // Per-bone per-axis spring state { x, v }
                this._state = boneNames.map(() => ({
                    x: { x: 0, v: 0 },
                    y: { x: 0, v: 0 },
                    z: { x: 0, v: 0 },
                }));
                this._targets = {};
                this._initialized = false;
            }

            /**
             * Set the target rotations that the chain should follow.
             * Call once per frame before update().
             *
             * @param {Record<string, {x:number,y:number,z:number}>} targets
             */
            setTargets(targets) {
                this._targets = targets;
            }

            /**
             * Advance chain springs and return the lagged rotation values.
             * On the first call, snaps to targets to avoid cold-start spring-in.
             *
             * @param {number} dt - Delta time in seconds
             * @returns {Record<string, {x:number,y:number,z:number}>}
             */
            update(dt) {
                const result = {};
                for (let i = 0; i < this.bones.length; i++) {
                    const bone   = this.bones[i];
                    const target = this._targets[bone] ?? { x: 0, y: 0, z: 0 };
                    const state  = this._state[i];

                    if (!this._initialized) {
                        // Snap springs to current targets so first frame has no visible spring-in.
                        state.x.x = target.x ?? 0;
                        state.y.x = target.y ?? 0;
                        state.z.x = target.z ?? 0;
                    }

                    const halflife = this.baseHalflife * Math.pow(this.halflifeGrowth, i);
                    for (const axis of ['x', 'y', 'z']) {
                        const upd = springDamperUnder(
                            state[axis].x, state[axis].v,
                            target[axis] ?? 0,
                            this.frequency, halflife, dt
                        );
                        state[axis].x = upd.x;
                        state[axis].v = upd.v;
                    }
                    result[bone] = { x: state.x.x, y: state.y.x, z: state.z.x };
                }
                this._initialized = true;
                return result;
            }

            /** Snap all springs to their current targets (zero velocity). */
            reset() {
                this._initialized = false;
                for (const s of this._state) {
                    for (const ax of ['x', 'y', 'z']) { s[ax].x = 0; s[ax].v = 0; }
                }
            }
        }

        /**
         * L0: Base pose — breathing rhythm and weight distribution.
         * Write mode: SET (=) on chest/spine.
         * Personality influence:
         *   energy → breath speed/depth
         *   confidence → chest-out posture, wider stance
         *   nervousness → faster breathing
         */
        class BasePoseLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'basePose');
                /** Spring system for smooth breathing and head drift transitions. */
                this.springs = new PoseSpringManager();
            }

            update(dt) {
                super.update(dt);
                const t = this.time;
                const p = this.personality;

                // Breath rate: base Hz varies organically with energy/nervousness.
                // noise1D(t*0.8) drives the main breath cycle (~1.25s period).
                // noise1D(t*0.25) adds a slower drift (deeper/shallower breathing).
                // Using different seeds (0, 1) ensures X and Z rotations are
                // independent — this prevents the "wobbling ship" correlated ellipse.
                const rateScale = 1 + (p.energy - 0.5) * 0.6 + p.nervousness * 0.4;
                const breathAmpX = (0.022 + p.energy * 0.012) * rateScale;
                const breathAmpZ = (0.010 + p.energy * 0.006) * rateScale;

                // Forward/back breath (X) and lateral sway (Z) use DIFFERENT seeds
                // so they are uncorrelated — real breathing has independent axes.
                const breathX = noise1D(t * 0.8, 0) * breathAmpX
                              + noise1D(t * 0.25, 2) * breathAmpX * 0.35;
                const breathZ = noise1D(t * 0.55, 1) * breathAmpZ
                              + noise1D(t * 0.18, 3) * breathAmpZ * 0.4;

                // Feed targets into spring system. 0.25s halflife = "natural" breathing feel.
                // When personality changes (energy/nervousness shift), amplitude transitions
                // smoothly rather than snapping, eliminating discontinuities on mood change.
                // NOTE: chest.z is set below (combined breathing + weight shift).
                this.springs.setCritical('chest', 'x', breathX, 0.25);

                // B3: Multi-bone breathing — spine sympathetically follows chest with slight lag.
                // Shoulders rise on inhale (sine > 0), neck micro-extends on exhale.
                const breathPhase = Math.sin(t * 0.8 * Math.PI * 2 * 0.15); // ~0.15 Hz breathing baseline
                const isInhale = breathPhase > 0;
                const shoulderRise = isInhale ? breathAmpX * 0.4 : 0;
                this.springs.setCritical('spine', 'x', breathX * 0.4, 0.35);
                this.springs.setCritical('leftShoulder',  'x', -shoulderRise * 0.6, 0.3);
                this.springs.setCritical('rightShoulder', 'x', -shoulderRise * 0.55, 0.3);
                this.springs.setCritical('neck', 'x', isInhale ? breathAmpX * 0.2 : 0, 0.4);

                // Spine confidence posture — 0.50s halflife for slow postural shifts.
                const spineGoalX = p.confidence > 0.5 ? -(p.confidence - 0.5) * 0.03 : 0;
                this.springs.setCritical('spine', 'x', spineGoalX, 0.50);

                // Head micro-drift — springs smooth any velocity discontinuities when
                // noise targets jump at personality changes. 0.30s = relaxed drift.
                const headX = noise1D(t * 0.2, 10) * 0.010;
                const headY = noise1D(t * 0.15, 11) * 0.014;
                this.springs.setCritical('head', 'x', headX, 0.30);
                this.springs.setCritical('head', 'y', headY, 0.30);

                // Arm drape springs — 0.50s halflife makes arm transitions fluid on pose changes.
                const BASE_Z = 1.4;
                this.springs.setCritical('leftUpperArm',  'z', -BASE_Z, 0.50);
                this.springs.setCritical('leftUpperArm',  'x',   0.08,  0.50);
                this.springs.setCritical('leftUpperArm',  'y',   0.0,   0.50);
                this.springs.setCritical('rightUpperArm', 'z',  BASE_Z, 0.50);
                this.springs.setCritical('rightUpperArm', 'x',   0.08,  0.50);
                this.springs.setCritical('rightUpperArm', 'y',   0.0,   0.50);
                this.springs.setCritical('leftLowerArm',  'z',  -0.08,  0.40);
                this.springs.setCritical('leftLowerArm',  'y',  -0.04,  0.40);
                this.springs.setCritical('leftLowerArm',  'x',   0.0,   0.40);
                this.springs.setCritical('rightLowerArm', 'z',   0.08,  0.40);
                this.springs.setCritical('rightLowerArm', 'y',   0.04,  0.40);
                this.springs.setCritical('rightLowerArm', 'x',   0.0,   0.40);

                // B4: Weight shift — low-frequency lateral hip shift produces S-curve spine counter.
                // hips rotate in z, spine counter-rotates, chest counter-tilts, head stays level.
                // Period ~6s so it's barely perceptible — just enough to break "statue" stillness.
                const weightSide = noise1D(t * 0.17, 20) * 0.6 + noise1D(t * 0.09, 21) * 0.4;
                this.springs.setCritical('hips',  'z', weightSide * 0.03,          0.6);
                this.springs.setCritical('spine', 'z', weightSide * -0.02,         0.6);
                // Combine breathing-z with weight-shift-z so only one spring per axis.
                this.springs.setCritical('chest', 'z', breathZ + weightSide * -0.015, 0.25);
                this.springs.setCritical('head',  'z', weightSide * -0.01,           0.5);

                // Advance all springs and apply outputs to bones.
                const out = this.springs.update(dt);

                const chest = this.getBone('chest') || this.getBone('spine');
                if (chest && out.chest) {
                    if (out.chest.x !== undefined) chest.rotation.x = out.chest.x;
                    if (out.chest.z !== undefined) chest.rotation.z = out.chest.z;
                }

                const spine = this.getBone('spine');
                if (spine) {
                    if (out.spine?.x !== undefined) spine.rotation.x += out.spine.x;
                    if (out.spine?.z !== undefined) spine.rotation.z += out.spine.z; // B4 weight counter
                }

                // B4: Apply hips weight shift
                const hips = this.getBone('hips');
                if (hips && out.hips?.z !== undefined) hips.rotation.z += out.hips.z;

                // B3: Apply shoulder + neck breathing outputs
                const lShoulder = this.getBone('leftShoulder');
                const rShoulder = this.getBone('rightShoulder');
                const neck = this.getBone('neck');
                if (lShoulder && out.leftShoulder?.x !== undefined) lShoulder.rotation.x += out.leftShoulder.x;
                if (rShoulder && out.rightShoulder?.x !== undefined) rShoulder.rotation.x += out.rightShoulder.x;
                if (neck && out.neck?.x !== undefined) neck.rotation.x += out.neck.x;

                const head = this.getBone('head');
                if (head && out.head) {
                    if (out.head.x !== undefined) head.rotation.x += out.head.x;
                    if (out.head.y !== undefined) head.rotation.y += out.head.y;
                    if (out.head.z !== undefined) head.rotation.z += out.head.z; // B4 VOR level
                }

                const lArm  = this.getBone('leftUpperArm');
                const rArm  = this.getBone('rightUpperArm');
                const lFore = this.getBone('leftLowerArm');
                const rFore = this.getBone('rightLowerArm');
                if (lArm && out.leftUpperArm) {
                    if (out.leftUpperArm.z !== undefined) lArm.rotation.z = out.leftUpperArm.z;
                    if (out.leftUpperArm.x !== undefined) lArm.rotation.x = out.leftUpperArm.x;
                    if (out.leftUpperArm.y !== undefined) lArm.rotation.y = out.leftUpperArm.y;
                }
                if (rArm && out.rightUpperArm) {
                    if (out.rightUpperArm.z !== undefined) rArm.rotation.z = out.rightUpperArm.z;
                    if (out.rightUpperArm.x !== undefined) rArm.rotation.x = out.rightUpperArm.x;
                    if (out.rightUpperArm.y !== undefined) rArm.rotation.y = out.rightUpperArm.y;
                }
                if (lFore && out.leftLowerArm) {
                    if (out.leftLowerArm.z !== undefined) lFore.rotation.z = out.leftLowerArm.z;
                    if (out.leftLowerArm.y !== undefined) lFore.rotation.y = out.leftLowerArm.y;
                    if (out.leftLowerArm.x !== undefined) lFore.rotation.x = out.leftLowerArm.x;
                }
                if (rFore && out.rightLowerArm) {
                    if (out.rightLowerArm.z !== undefined) rFore.rotation.z = out.rightLowerArm.z;
                    if (out.rightLowerArm.y !== undefined) rFore.rotation.y = out.rightLowerArm.y;
                    if (out.rightLowerArm.x !== undefined) rFore.rotation.x = out.rightLowerArm.x;
                }
            }
        }

        /**
         * L1: Idle behavior — personality-driven fidget library.
         * Write mode: SET (=) on affected bones.
         * Suppressed when Talk (L3) or Gesture (L4) is active.
         *
         * A random timer (3–8s, scaled by energy) selects from eligible fidgets
         * based on personality thresholds. Each fidget is a micro-animation
         * lasting 1–3 seconds that modifies specific bones.
         */
        class IdleBehaviorLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'idle');
                this._fidgetTimer = 6 + Math.random() * 9;
                this._activeFidget = null;
                this._fidgetTime = 0;
                this._fidgetDuration = 0;
                // Idle clip cycling — triggers a mood-matched clip every 30–90s of pure idle
                this._clipCycleTimer = 30 + Math.random() * 60;
                this._currentMood = 'neutral';
            }

            /** Update the mood tag used for clip filtering. Called by setExpression handler. */
            setEmotion(mood) {
                this._currentMood = mood || 'neutral';
            }

            /**
             * Attempt to play a mood-matched idle clip from ClipLayer's clipLibrary.
             * No-ops if clipLibrary is empty or has no clips tagged for the current mood.
             * Clips must have a "mood" metadata tag — stored as clip.userData.mood array.
             *
             * @param {ClipLayer} clipLayer - The ClipLayer instance that owns clipLibrary.
             * @param {string} mood - Current emotion state ('happy', 'sad', etc.)
             */
            _maybeCycleIdleClip(clipLayer, mood) {
                if (!clipLayer?.clipLibrary) return;
                const entries = Object.entries(clipLayer.clipLibrary);
                if (entries.length === 0) return;

                // Filter to clips tagged "idle" and mood-compatible
                const candidates = entries.filter(([, clip]) => {
                    const tags = clip.userData?.tags;
                    const moods = clip.userData?.mood;
                    if (!Array.isArray(tags) || !tags.includes('idle')) return false;
                    if (Array.isArray(moods) && moods.length > 0) {
                        return moods.includes(mood) || moods.includes('neutral');
                    }
                    return true; // untagged idle clips always eligible
                });
                if (candidates.length === 0) return;

                const [name] = candidates[Math.floor(Math.random() * candidates.length)];
                // Play via ClipLayer — respects blend and AnimationDirector state.
                // loop=false so it returns to procedural idle after one play.
                const played = clipLayer.playClip(name, { fadeIn: 0.4, loop: false });
                if (played) console.log(`[IdleLayer] Clip cycle: "${name}" (mood=${mood})`);
            }

            /** @type {Array<{name:string, duration:number, requires?:(p:Object)=>boolean, apply:(t:number,p:Object,getBone:(s:string)=>any)=>void}>} */
            static get FIDGETS() {
                // Subtle multi-bone body movements for natural idle behavior.
                // Arm-based gestures (wave, point, etc.) are handled by GestureLayer (L4)
                // or ClipLayer (L6) for proper clip-driven arm animation.
                // Each fidget coordinates 2–4 bones for realistic weight distribution.
                return [
                    {
                        name: 'weight_shift', duration: 3.0,
                        apply(t, p, B) {
                            // Full-body weight shift: hips lead, spine counter-rotates,
                            // shoulders follow to maintain balance.
                            // Uses a smooth bell envelope so the movement fades in/out
                            // rather than relying solely on the outer time-scaling envelope.
                            const env = Math.sin(t / 3.0 * Math.PI);
                            const phase = Math.sin(t * Math.PI * 0.67) * env;
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            if (hips) {
                                hips.rotation.y = phase * 0.035;
                                hips.rotation.z = phase * 0.018;
                            }
                            if (spine) spine.rotation.z = phase * -0.012;
                            if (chest) chest.rotation.z = phase * -0.008;
                        }
                    },
                    {
                        name: 'shoulder_roll', duration: 2.5,
                        apply(t, p, B) {
                            // Asymmetric shoulder roll with neck sympathy.
                            // Bell envelope prevents the mid-animation snap from the
                            // time-collapsing outer envelope.
                            const ls = B('leftShoulder'), rs = B('rightShoulder');
                            const neck = B('neck');
                            const env = Math.sin(t / 2.5 * Math.PI);
                            const v = Math.sin(t * Math.PI * 0.8) * 0.03 * env;
                            if (ls) ls.rotation.z = v;
                            if (rs) rs.rotation.z = -v * 0.5;
                            if (neck) neck.rotation.z = v * 0.15;
                        }
                    },
                    {
                        name: 'head_tilt', duration: 1.5,
                        apply(t, p, B) {
                            // Head tilt with subtle neck follow-through
                            const head = B('head'), neck = B('neck');
                            const tilt = Math.sin(t * Math.PI / 1.5) * 0.08;
                            if (neck) neck.rotation.z = tilt * 0.3;
                            if (head) head.rotation.z = tilt;
                        }
                    },
                    {
                        name: 'look_around', duration: 3.5,
                        apply(t, p, B) {
                            // Curious look: neck turns first, head follows with slight delay.
                            // Reduced amplitude (0.08 vs 0.15) and bell envelope for smooth
                            // entry/exit. Head tilt is now correlated with yaw so the motion
                            // feels more organic (people tilt their head slightly when they turn).
                            const head = B('head'), neck = B('neck');
                            const env = Math.sin(t / 3.5 * Math.PI);
                            const yaw = Math.sin(t * Math.PI * 0.57) * 0.08 * env;
                            const tilt = yaw * 0.25; // slight correlated head tilt
                            if (neck) neck.rotation.y = yaw * 0.35;
                            if (head) {
                                head.rotation.y = yaw;
                                head.rotation.z = tilt;
                                head.rotation.x = Math.abs(yaw) * 0.1; // nose dips slightly on turn
                            }
                        }
                    },
                    {
                        name: 'deep_breath', duration: 3.5,
                        apply(t, p, B) {
                            // Full deep breath: chest expands, shoulders lift slightly
                            const chest = B('chest') || B('spine');
                            const ls = B('leftShoulder'), rs = B('rightShoulder');
                            const inhale = Math.sin(t * Math.PI * 0.571) * 0.015;
                            if (chest) chest.rotation.x = inhale;
                            // Shoulders lift on inhale (positive phase)
                            const shoulderLift = Math.max(0, inhale) * 2;
                            if (ls) ls.rotation.z = shoulderLift * 0.03;
                            if (rs) rs.rotation.z = -shoulderLift * 0.03;
                        }
                    },
                    {
                        name: 'subtle_sway', duration: 3,
                        apply(t, p, B) {
                            // Gentle pendulum sway: hips and spine counter-rotate
                            const hips = B('hips'), spine = B('spine');
                            const head = B('head');
                            const s = Math.sin(t * Math.PI * 0.667) * 0.02;
                            if (hips) hips.rotation.z = s;
                            if (spine) spine.rotation.z = s * -0.5;
                            if (head) head.rotation.z = s * -0.3; // head stays level
                        }
                    },
                    {
                        name: 'ankle_cross', duration: 3,
                        apply(t, p, B) {
                            // Leg cross with compensating hip shift
                            const lLeg = B('leftUpperLeg'), hips = B('hips');
                            const v = Math.sin(t * Math.PI * 0.5) * 0.04;
                            if (lLeg) lLeg.rotation.z = v;
                            if (hips) hips.rotation.z = v * 0.3; // lean into it
                        }
                    },
                    {
                        name: 'hip_cock', duration: 2.5,
                        requires: (p) => p.confidence > 0.6,
                        apply(t, p, B) {
                            // Sassy hip pop: hips shift, spine and chest counter-balance
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            const blend = Math.sin(t * Math.PI * 0.4);
                            if (hips) { hips.rotation.z = blend * 0.06; hips.rotation.y = blend * 0.03; }
                            if (spine) spine.rotation.z = blend * -0.03;
                            if (chest) chest.rotation.z = blend * -0.02;
                        }
                    },
                    {
                        name: 'curtsy_bob', duration: 2,
                        requires: (p) => p.playfulness > 0.5,
                        apply(t, p, B) {
                            // Small dip with head bob — playful personality only
                            const hips = B('hips'), spine = B('spine'), head = B('head');
                            const dip = Math.sin(t * Math.PI * 0.5);
                            if (hips) hips.position.y = -dip * 0.02;
                            if (spine) spine.rotation.x = dip * 0.04;
                            if (head) head.rotation.x = dip * 0.03;
                        }
                    },
                    {
                        name: 'bounce', duration: 1.2,
                        requires: (p) => p.energy > 0.6,
                        apply(t, p, B) {
                            // Energetic bounce: hips bob, shoulders bounce in sync
                            const hips = B('hips'), ls = B('leftShoulder'), rs = B('rightShoulder');
                            const v = Math.abs(Math.sin(t * Math.PI * 1.67)) * 0.015;
                            if (hips) hips.position.y = v;
                            if (ls) ls.rotation.z = v * 1.5;
                            if (rs) rs.rotation.z = -v * 1.5;
                        }
                    },
                    {
                        name: 'foot_tap', duration: 2,
                        requires: (p) => p.energy > 0.4,
                        apply(t, p, B) {
                            // Foot tap with matching hip micro-bounce
                            const leg = B('rightUpperLeg'), hips = B('hips');
                            const tap = Math.abs(Math.sin(t * Math.PI * 3)) * 0.03;
                            if (leg) leg.rotation.x = tap;
                            if (hips) hips.position.y = tap * 0.15; // tiny sympathetic lift
                        }
                    },
                    {
                        name: 'neck_stretch', duration: 2,
                        apply(t, p, B) {
                            // Neck roll/stretch — subtle self-comfort behavior
                            const neck = B('neck'), head = B('head');
                            const ls = B('leftShoulder');
                            const phase = t * Math.PI * 0.5;
                            if (neck) {
                                neck.rotation.z = Math.sin(phase) * 0.08;
                                neck.rotation.x = Math.sin(phase * 0.7) * 0.03;
                            }
                            if (head) head.rotation.z = Math.sin(phase) * 0.04;
                            if (ls) ls.rotation.z = -Math.abs(Math.sin(phase)) * 0.03; // dip shoulder
                        }
                    },
                    {
                        name: 'settle', duration: 2,
                        apply(t, p, B) {
                            // Full-body settle: micro-squat then return — like resettling stance
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            const dip = Math.sin(t * Math.PI * 0.5);
                            if (hips) hips.position.y = -Math.abs(dip) * 0.01;
                            if (spine) spine.rotation.x = dip * 0.01;
                            if (chest) chest.rotation.x = dip * -0.005;
                        }
                    },
                    {
                        name: 'head_nod_slow', duration: 2,
                        requires: (p) => p.nervousness < 0.5,
                        apply(t, p, B) {
                            // Slow contemplative nod, as if lost in thought
                            const head = B('head'), neck = B('neck');
                            const v = Math.sin(t * Math.PI * 0.5) * 0.06;
                            if (neck) neck.rotation.x = v * 0.3;
                            if (head) head.rotation.x = v;
                        }
                    },
                    {
                        name: 'gentle_arm_sway', duration: 3.5,
                        apply(t, p, B) {
                            // Subtle pendulum arm swing — complements breathing.
                            // Adds to the BasePoseLayer drape (which sets the base).
                            const lArm = B('leftUpperArm'), rArm = B('rightUpperArm');
                            const amp = 0.05 * (0.6 + p.energy * 0.8);
                            const phase = Math.sin(t * Math.PI * 0.57);
                            // Arms sway slightly counter-phase (natural balanced stance)
                            if (lArm) { lArm.rotation.x += phase * amp;       lArm.rotation.z += phase * -0.015; }
                            if (rArm) { rArm.rotation.x += phase * -amp * 0.7; rArm.rotation.z += phase *  0.015; }
                        }
                    },
                    {
                        name: 'arm_self_hug', duration: 3,
                        requires: (p) => p.nervousness > 0.35,
                        apply(t, p, B) {
                            // Nervous self-hug: arms pull slightly inward and forearms fold in.
                            const lArm = B('leftUpperArm'), rArm = B('rightUpperArm');
                            const lFore = B('leftLowerArm'), rFore = B('rightLowerArm');
                            const blend = Math.sin(t * Math.PI * 0.33) * 0.5 + 0.5;
                            const s = p.nervousness * 0.5;
                            if (lArm)  { lArm.rotation.y  += blend * 0.15 * s; lArm.rotation.z  -= blend * 0.07 * s; }
                            if (rArm)  { rArm.rotation.y  -= blend * 0.15 * s; rArm.rotation.z  += blend * 0.07 * s; }
                            if (lFore) lFore.rotation.y -= blend * 0.35 * s;
                            if (rFore) rFore.rotation.y += blend * 0.35 * s;
                        }
                    },
                    {
                        name: 'hand_to_chin', duration: 2.2,
                        requires: (p) => p.expressiveness > 0.3,
                        apply(t, p, B) {
                            // Thoughtful pose: left arm raises, forearm folds toward chin.
                            const lArm = B('leftUpperArm'), lFore = B('leftLowerArm');
                            const blend = Math.sin(t * Math.PI * 0.45);
                            if (lArm)  { lArm.rotation.z  += blend * -0.18; lArm.rotation.x += blend * 0.12; }
                            if (lFore) lFore.rotation.y -= blend * 0.55;
                        }
                    },
                    // ── Phase 17A: Procedural Fidgets v2 (14 new animations) ──────────────
                    {
                        name: 'wrist_flex', duration: 1.5,
                        apply(t, p, B) {
                            // One hand flexes/extends wrist — idle self-awareness gesture.
                            const rHand = B('rightHand');
                            if (rHand) rHand.rotation.x = Math.sin(t * Math.PI * 2) * 0.2;
                        }
                    },
                    {
                        name: 'lean_back', duration: 3.0,
                        apply(t, p, B) {
                            // Subtle lean backward then return — idle postural adjustment.
                            const spine = B('spine'), hips = B('hips');
                            const ease = Math.sin(t * Math.PI);
                            if (spine) spine.rotation.x = -ease * 0.04;
                            if (hips) hips.position.z = -ease * 0.02;
                        }
                    },
                    {
                        name: 'head_shake', duration: 1.5,
                        apply(t, p, B) {
                            // Quick head shake (like "no") — amplitude decays so it doesn't loop.
                            const head = B('head'), neck = B('neck');
                            const decay = 1 - t;
                            if (head) head.rotation.y = Math.sin(t * Math.PI * 4) * 0.08 * decay;
                            if (neck) neck.rotation.y = Math.sin(t * Math.PI * 4) * 0.04 * decay;
                        }
                    },
                    {
                        name: 'arm_fold', duration: 3.0,
                        requires: (p) => p.confidence > 0.5,
                        apply(t, p, B) {
                            // Cross arms — confident/defensive resting posture.
                            const lArm = B('leftUpperArm'), rArm = B('rightUpperArm');
                            const ease = t < 0.3 ? t / 0.3 : t > 0.7 ? (1 - t) / 0.3 : 1;
                            if (lArm) { lArm.rotation.z += ease * 0.8; lArm.rotation.x += ease * 0.3; }
                            if (rArm) { rArm.rotation.z -= ease * 0.8; rArm.rotation.x += ease * 0.3; }
                        }
                    },
                    {
                        name: 'collar_tug', duration: 1.8,
                        requires: (p) => p.nervousness > 0.4,
                        apply(t, p, B) {
                            // Nervous collar/neckline tug — right hand reaches toward collar.
                            const rArm = B('rightUpperArm'), rHand = B('rightHand');
                            const ease = Math.sin(t * Math.PI);
                            if (rArm) { rArm.rotation.z -= ease * 0.5; rArm.rotation.x += ease * 0.4; }
                            if (rHand) rHand.rotation.x += ease * 0.3;
                        }
                    },
                    {
                        name: 'chin_rest', duration: 3.5,
                        requires: (p) => p.confidence > 0.3,
                        apply(t, p, B) {
                            // Rest chin on one hand (thinking pose) — slow entry and exit.
                            const rArm = B('rightUpperArm'), rHand = B('rightHand'), head = B('head');
                            const ease = t < 0.2 ? t / 0.2 : t > 0.8 ? (1 - t) / 0.2 : 1;
                            if (rArm) { rArm.rotation.z -= ease * 0.7; rArm.rotation.x += ease * 0.5; }
                            if (rHand) rHand.rotation.x -= ease * 0.2;
                            if (head) head.rotation.x += ease * 0.05;
                        }
                    },
                    {
                        name: 'knee_bounce', duration: 2.0,
                        requires: (p) => p.energy > 0.5,
                        apply(t, p, B) {
                            // Rhythmic knee bounce — energetic sitting/standing restlessness.
                            const hips = B('hips');
                            const bounce = Math.abs(Math.sin(t * Math.PI * 6)) * 0.02;
                            if (hips) hips.position.y += bounce;
                        }
                    },
                    {
                        name: 'hand_wave_small', duration: 1.0,
                        requires: (p) => p.playfulness > 0.3,
                        apply(t, p, B) {
                            // Small cute wave — playful acknowledgment gesture.
                            const rArm = B('rightUpperArm'), rHand = B('rightHand');
                            const ease = Math.sin(t * Math.PI);
                            if (rArm) rArm.rotation.z -= ease * 0.6;
                            if (rHand) rHand.rotation.z += Math.sin(t * Math.PI * 4) * 0.2 * ease;
                        }
                    },
                    {
                        name: 'ear_tuck', duration: 1.5,
                        requires: (p) => p.nervousness > 0.3,
                        apply(t, p, B) {
                            // Tuck hair behind ear — self-soothing nervous habit.
                            const rArm = B('rightUpperArm'), rHand = B('rightHand');
                            const ease = Math.sin(t * Math.PI);
