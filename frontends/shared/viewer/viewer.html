                            animationDirector.addLayer(new IdleBehaviorLayer(vrm));
                            animationDirector.addLayer(new EmotionLayer(vrm));
                            animationDirector.addLayer(new TalkLayer(vrm));
                            animationDirector.addLayer(new GestureLayer(vrm));
                            animationDirector.addLayer(new LookAtLayer(vrm, canvas));
                            animationDirector.addLayer(new ClipLayer(vrm, scene));
                            // L7: Follow-through — cascaded spring lag after all SET-mode layers.
                            animationDirector.addLayer(new FollowThroughLayer(vrm));
                            // L8: Balance — CoG compensation (subtle hip shifts for physical grounding).
                            animationDirector.addLayer(new BalanceLayer(vrm));

                            // Phase 17B: AnimationSequencer sits above the layer system
                            // and chains gestures via GestureLayer.triggerGesture().
                            animationSequencer = new AnimationSequencer(animationDirector);

                            // Phase E: PoseLibrary — load manifest for emotion-matched clip reactions.
                            poseLibrary = new PoseLibrary();
                            poseLibrary.loadManifest('/api/animations/manifest');

                            // Phase E: FootPlantController — prevents foot penetrating ground plane.
                            footPlantController = new FootPlantController(vrm, 0);

                            // Auto-frame camera based on model's actual height
                            const headBone = vrm.humanoid.getRawBoneNode('head');
                            const footBone = vrm.humanoid.getRawBoneNode('leftFoot') || vrm.humanoid.getRawBoneNode('rightFoot');
                            let modelTop = 1.5, modelBottom = 0;
                            if (headBone) {
                                const hp = new THREE.Vector3();
                                headBone.getWorldPosition(hp);
                                modelTop = hp.y + 0.15;
                            }
                            if (footBone) {
                                const fp = new THREE.Vector3();
                                footBone.getWorldPosition(fp);
                                modelBottom = fp.y;
                            }
                            const modelHeight = modelTop - modelBottom;
                            const targetY = modelBottom + modelHeight * 0.48;
                            const camZ = Math.max(modelHeight * 1.15, 0.8);
                            controls.reset(
                                new THREE.Vector3(0, targetY + modelHeight * 0.05, camZ * 1.15),
                                new THREE.Vector3(0, targetY, 0)
                            );

                            const headY = headBone
                                ? (() => { const hp = new THREE.Vector3(); headBone.getWorldPosition(hp); return hp.y; })()
                                : targetY + modelHeight * 0.35;

                            // Compute eye-level faceY for accurate face preset framing
                            const leftEye = vrm.humanoid.getRawBoneNode('leftEye');
                            const rightEye = vrm.humanoid.getRawBoneNode('rightEye');
                            let faceY = headY + modelHeight * 0.06; // fallback: slightly above head bone
                            if (leftEye && rightEye) {
                                const lp = new THREE.Vector3(), rp = new THREE.Vector3();
                                leftEye.getWorldPosition(lp);
                                rightEye.getWorldPosition(rp);
                                faceY = (lp.y + rp.y) / 2;
                            }
                            _vrmFrameData = { targetY, camZ, modelHeight, headY, faceY };

                            console.log('[Viewer] VRM loaded successfully');

                            // Jiggle physics: detect and auto-apply on model load
                            jiggleManager = new JigglePhysicsManager();
                            const jiggleDetected = jiggleManager.detectBones(vrm);
                            if (jiggleManager.enabled && jiggleDetected.breast.length > 0) {
                                jiggleManager.saveOriginalParams(vrm);
                                jiggleManager.applyParams(vrm);
                            }
                            window.parent.postMessage({
                                type: 'jiggleDetection',
                                detected: jiggleDetected,
                                jointCount: {
                                    breast: jiggleManager.bodyPartJoints.breast.length,
                                    butt:   jiggleManager.bodyPartJoints.butt.length,
                                    thigh:  jiggleManager.bodyPartJoints.thigh.length,
                                },
                            }, '*');

                            // Collect geometry statistics
                            let triCount = 0, vertCount = 0, meshCount = 0;
                            vrm.scene.traverse((child) => {
                                if (child.isMesh && child.geometry) {
                                    meshCount++;
                                    const geo = child.geometry;
                                    vertCount += geo.attributes.position?.count || 0;
                                    triCount += geo.index
                                        ? geo.index.count / 3
                                        : (geo.attributes.position?.count || 0) / 3;
                                }
                            });
                            const em = vrm.expressionManager || vrm.blendShapeProxy;
                            let blendShapeCount = 0;
                            if (em?._expressionMap) {
                                const exprMap = em._expressionMap;
                                blendShapeCount = exprMap instanceof Map
                                    ? exprMap.size
                                    : Object.keys(exprMap).length;
                            }
                            else if (em?._blendShapeGroups) blendShapeCount = em._blendShapeGroups.length;
                            const boneCount = vrm.humanoid?.humanBones
                                ? Object.keys(vrm.humanoid.humanBones).length : 0;
                            const vrmVersion = vrm.meta?.metaVersion
                                ? String(vrm.meta.metaVersion)
                                : (vrm.expressionManager ? '1.x' : '0.x');

                            window.parent.postMessage({
                                type: 'modelLoaded',
                                stats: {
                                    triangles: Math.round(triCount),
                                    vertices: vertCount,
                                    meshes: meshCount,
                                    blendShapes: blendShapeCount,
                                    bones: boneCount,
                                    vrmVersion,
                                }
                            }, '*');

                            // Notify parent that spring bones are ready for preset auto-apply
                            window.parent.postMessage({
                                type: 'vrmSpringBonesReady',
                                jointCount: vrm.springBoneManager?.joints?.length || 0,
                            }, '*');

                            // Auto-apply fullbody camera so first frame isn't black.
                            // Without this the camera sits at origin (identity matrix)
                            // until the user clicks a preset button.
                            controls.goToPreset('fullbody', 0);

                            // Auto-load animation manifest so clips are available
                            // immediately when emotions start firing
                            fetch('/api/animations')
                                .then(r => r.ok ? r.json() : null)
                                .then(manifest => {
                                    if (manifest && manifest.packs) {
                                        animationRegistry.loadManifest(manifest);
                                        window.parent.postMessage({
                                            type: 'animationManifestLoaded',
                                            clipCount: animationRegistry.clips.size,
                                            emotions: [...animationRegistry.emotionIndex.keys()],
                                            categories: [...animationRegistry.categoryIndex.keys()],
                                        }, '*');
                                    }
                                })
                                .catch(err => console.warn('[Viewer] Animation manifest load failed:', err));

                            // Start entrance animation (style-aware)
                            if (entranceConfig.enabled) {
                                entranceAnimator = new EntranceAnimator(vrm.scene, vrm, {
                                    direction: entranceConfig.direction,
                                    duration: entranceConfig.duration,
                                    style: entranceConfig.style,
                                    emotion: entranceConfig.emotion,
                                    onComplete: () => {
                                        // Play queued greeting gesture after entrance
                                        if (_pendingGreetingGesture && animationDirector) {
                                            const gl = animationDirector.getLayer('gesture');
                                            if (gl) gl.playGesture(_pendingGreetingGesture);
                                            _pendingGreetingGesture = null;
                                        }
                                        window.parent.postMessage({ type: 'entranceComplete' }, '*');
                                    },
                                });
                            }
                            return;
                        }

                        // ════════════════════════════════════════════
                        // PATH B: GLB/GLTF Fallback (generic 3D model)
                        // ════════════════════════════════════════════
                        if (!gltf.scene) {
                            console.error('[Viewer] No scene data in GLTF');
                            window.parent.postMessage({ type: 'modelFailed', reason: 'no scene data' }, '*');
                            return;
                        }

                        console.log('[Viewer] Loading as GLB/GLTF (no VRM data)');
                        const glbScene = gltf.scene;

                        // Force Y-up orientation — some game rips export Z-up
                        // Detect by checking if bounding box is wider than tall
                        glbScene.updateMatrixWorld(true);
                        const testBox = new THREE.Box3().setFromObject(glbScene);
                        const testSize = testBox.getSize(new THREE.Vector3());
                        if (testSize.z > testSize.y * 2.0) {
                            // Model appears to be Z-up (lying on its back) — rotate to Y-up
                            glbScene.rotation.x = -Math.PI / 2;
                            glbScene.updateMatrixWorld(true);
                            console.log('[Viewer] GLB: Applied Z-up → Y-up rotation');
                        }

                        scene.add(glbScene);
                        currentGlb = glbScene;

                        // Auto-frame camera using bounding box
                        const bbox = new THREE.Box3().setFromObject(glbScene);
                        const bboxSize = bbox.getSize(new THREE.Vector3());
                        const bboxCenter = bbox.getCenter(new THREE.Vector3());
                        const modelHeight = bboxSize.y;

                        // Clamp camera distance to prevent extreme zoom on outlier geometry
                        const maxDim = Math.max(bboxSize.x, bboxSize.y, bboxSize.z);
                        const camDist = Math.min(Math.max(maxDim * 1.2, 0.8), 10.0);
                        const targetY = bboxCenter.y;
                        controls.reset(
                            new THREE.Vector3(bboxCenter.x, targetY + 0.05, bboxCenter.z + camDist),
                            new THREE.Vector3(bboxCenter.x, targetY, bboxCenter.z)
                        );

                        // Store frame data for camera presets (reuse _vrmFrameData)
                        const headY = bbox.max.y - modelHeight * 0.1;
                        _vrmFrameData = { targetY, camZ: camDist, modelHeight, headY };

                        // Set up AnimationMixer for embedded animations
                        if (gltf.animations && gltf.animations.length > 0) {
                            currentGlbMixer = new THREE.AnimationMixer(glbScene);
                            currentGlbClips = gltf.animations;
                            // Auto-play the first animation (usually idle)
                            const action = currentGlbMixer.clipAction(gltf.animations[0]);
                            action.play();
                            _currentGlbAction = action;
                            console.log(`[Viewer] GLB: Playing ${gltf.animations.length} embedded animation(s):`,
                                gltf.animations.map(a => a.name || '(unnamed)'));
                        }

                        // Count morph targets across meshes
                        let morphTargetCount = 0;
                        let triCount = 0, vertCount = 0, meshCount = 0;
                        glbScene.traverse((child) => {
                            if (child.isMesh) {
                                meshCount++;
                                if (child.geometry) {
                                    const geo = child.geometry;
                                    vertCount += geo.attributes.position?.count || 0;
                                    triCount += geo.index
                                        ? geo.index.count / 3
                                        : (geo.attributes.position?.count || 0) / 3;
                                }
                                if (child.morphTargetInfluences) {
                                    morphTargetCount += child.morphTargetInfluences.length;
                                }
                            }
                        });

                        // Count bones from skeleton (if present)
                        let boneCount = 0;
                        glbScene.traverse((child) => {
                            if (child.isSkinnedMesh && child.skeleton) {
                                boneCount = Math.max(boneCount, child.skeleton.bones.length);
                            }
                        });

                        console.log(`[Viewer] GLB loaded: ${meshCount} meshes, ${Math.round(triCount)} tris, ` +
                            `${morphTargetCount} morph targets, ${boneCount} bones, ` +
                            `${gltf.animations?.length || 0} animations`);

                        window.parent.postMessage({
                            type: 'modelLoaded',
                            stats: {
                                triangles: Math.round(triCount),
                                vertices: vertCount,
                                meshes: meshCount,
                                blendShapes: morphTargetCount,
                                bones: boneCount,
                                vrmVersion: 'glb',
                                animations: (gltf.animations || []).map(a => a.name || '(unnamed)'),
                            }
                        }, '*');

                        // Auto-apply fullbody camera so first frame isn't black.
                        controls.goToPreset('fullbody', 0);

                        // Start entrance animation for GLB (style-aware)
                        if (entranceConfig.enabled) {
                            entranceAnimator = new EntranceAnimator(glbScene, null, {
                                direction: entranceConfig.direction,
                                duration: entranceConfig.duration,
                                style: entranceConfig.style,
                                emotion: entranceConfig.emotion,
                                onComplete: () => {
                                    _pendingGreetingGesture = null; // GLB has no gesture layer
                                    window.parent.postMessage({ type: 'entranceComplete' }, '*');
                                },
                            });
                        }
                    },
                    (progress) => {
                        // Optional: report loading progress
                    },
                    (error) => {
                        console.error('[Viewer] Model load error:', error);
                        window.parent.postMessage({ type: 'modelFailed', reason: String(error) }, '*');
                    }
                );
            }

            // Backward-compat alias
            const loadVRM = loadModel;

            // ── Jiggle Physics ─────────────────────────────────

            /** Regex patterns for auto-detecting jiggle-capable spring bone joints by name. */
            const JIGGLE_BONE_PATTERNS = {
                breast: [
                    /^Breast[_.]?[LR]$/i, /^Breast[_.]?(Left|Right)$/i,
                    /^J_Sec_[LR]_Bust\d?$/i, /^J_Sec_(Left|Right)_Bust\d?$/i,
                    /^breast[_.]?[lr]$/i, /^breast[_.]?(left|right)$/i,
                    /^[左右]胸$/, /bust[_.]?[lr]\d?$/i, /boob[_.]?[lr]\d?$/i,
                    /chest[_.]?jiggle[_.]?[lr]$/i, /^Breast_[LR]_injected$/i,
                ],
                butt: [
                    /^Butt[_.]?[LR]$/i, /^Butt[_.]?(Left|Right)$/i,
                    /^J_Sec_[LR]_Butt\d?$/i, /^hip[_.]?jiggle[_.]?[lr]$/i,
                    /^ass[_.]?[lr]$/i, /^glute[_.]?[lr]$/i,
                ],
                thigh: [
                    /^ThighJiggle[_.]?[LR]$/i, /^ThighJiggle[_.]?(Left|Right)$/i,
                    /^J_Sec_[LR]_Thigh\d?$/i, /^leg[_.]?jiggle[_.]?[lr]$/i,
                    /^upper[_.]?leg[_.]?jiggle[_.]?[lr]$/i,
                ],
            };

            /** Base spring bone parameters for each jiggle intensity preset. */
            const JIGGLE_PRESETS = {
                subtle:  { stiffness: 1.2, drag: 0.6, gravityPower: 0.3, hitRadius: 0.03 },
                natural: { stiffness: 0.8, drag: 0.4, gravityPower: 0.5, hitRadius: 0.04 },
                anime:   { stiffness: 0.5, drag: 0.3, gravityPower: 0.6, hitRadius: 0.05 },
                bouncy:  { stiffness: 0.3, drag: 0.2, gravityPower: 0.7, hitRadius: 0.06 },
                extreme: { stiffness: 0.15, drag: 0.1, gravityPower: 0.8, hitRadius: 0.07 },
            };

            /**
             * Calculate final spring bone parameters for a jiggle joint.
             *
             * @param {string} preset - Preset tier ('subtle'|'natural'|'anime'|'bouncy'|'extreme')
             * @param {number} intensity - Master intensity 0-1
             * @param {number} emotionMul - Emotion state multiplier (1.0 = neutral)
             * @param {number} movementMul - Animation state multiplier
             * @returns {{ stiffness: number, dragForce: number, gravityPower: number }}
             */
            function calculateJiggleParams(preset, intensity, emotionMul, movementMul, movementGravityMul) {
                const base = JIGGLE_PRESETS[preset] || JIGGLE_PRESETS.natural;
                const gMul = movementGravityMul ?? 1.0;
                return {
                    stiffness:    base.stiffness * (2.0 - intensity) * movementMul,
                    dragForce:    base.drag * (1.0 - intensity * 0.5),
                    gravityPower: base.gravityPower * intensity * emotionMul * gMul,
                };
            }

            /**
             * Manages jiggle physics for breast, butt, and thigh spring bone joints.
             * Wraps VRM SpringBoneManager with presets, intensity scaling,
             * and per-body-part controls. Does not replace the spring bone system —
             * it adds a higher-level abstraction on top.
             */
            class JigglePhysicsManager {
                constructor() {
                    this.enabled = true;
                    this.preset = 'subtle';
                    this.intensity = 0.5;
                    this.bodyPartJoints = { breast: [], butt: [], thigh: [] };
                    this.bodyPartIntensity = { breast: 0.65, butt: 0.40, thigh: 0.20 };
                    /** @type {Map<number, object>} Saved original params before jiggle override. */
                    this._originalParams = new Map();
                    this.emotionMultiplier = 1.0;
                    this.movementMultiplier = 1.0;
                    /** Gravity multiplier from animation state (higher = bouncier during clips). */
                    this._gravityMovementMul = 1.0;
                }

                /**
                 * Scan VRM spring bone joints for breast/butt/thigh bones using
                 * name patterns. Stores joint indices in bodyPartJoints.
                 *
                 * @param {object} vrm - Loaded VRM instance
                 * @returns {{ breast: string[], butt: string[], thigh: string[] }}
                 */
                detectBones(vrm) {
                    const sbm = vrm?.springBoneManager;
                    if (!sbm?.joints) return { breast: [], butt: [], thigh: [] };

                    const result = { breast: [], butt: [], thigh: [] };
                    this.bodyPartJoints = { breast: [], butt: [], thigh: [] };

                    sbm.joints.forEach((joint, index) => {
                        const name = joint.bone?.name || '';
                        if (!name) return;
                        for (const [part, patterns] of Object.entries(JIGGLE_BONE_PATTERNS)) {
                            for (const pattern of patterns) {
                                if (pattern.test(name)) {
                                    this.bodyPartJoints[part].push(index);
                                    result[part].push(name);
                                    return;
                                }
                            }
                        }
                    });

                    // Fallback: hierarchy-based breast detection when name patterns fail
                    if (result.breast.length === 0) {
                        const chest = vrm.humanoid?.getNormalizedBoneNode('upperChest')
                                    || vrm.humanoid?.getNormalizedBoneNode('chest');
                        if (chest) {
                            sbm.joints.forEach((joint, index) => {
                                const bone = joint.bone;
                                if (!bone?.parent) return;
                                if (bone.parent === chest || bone.parent.parent === chest) {
                                    const pos = bone.position;
                                    if (Math.abs(pos.x) > 0.03 && Math.abs(pos.z) > 0.01) {
                                        this.bodyPartJoints.breast.push(index);
                                        result.breast.push(bone.name);
                                    }
                                }
                            });
                        }
                    }

                    console.log('[JigglePhysics] Detected bones:', result);
                    return result;
                }

                /**
                 * Store original spring bone params before applying jiggle overrides.
                 * @param {object} vrm - Loaded VRM instance
                 */
                saveOriginalParams(vrm) {
                    const joints = vrm?.springBoneManager?.joints;
                    if (!joints) return;
                    this._originalParams.clear();
                    joints.forEach((joint, index) => {
                        this._originalParams.set(index, {
                            stiffness:    joint.settings.stiffness,
                            dragForce:    joint.settings.dragForce,
                            gravityPower: joint.settings.gravityPower,
                        });
                    });
                }

                /**
                 * Restore original spring bone params, undoing jiggle overrides.
                 * @param {object} vrm - Loaded VRM instance
                 */
                restoreOriginalParams(vrm) {
                    const joints = vrm?.springBoneManager?.joints;
                    if (!joints) return;
                    for (const [index, orig] of this._originalParams) {
                        if (joints[index]) {
                            joints[index].settings.stiffness    = orig.stiffness;
                            joints[index].settings.dragForce    = orig.dragForce;
                            joints[index].settings.gravityPower = orig.gravityPower;
                        }
                    }
                }

                /**
                 * Apply the current preset + intensity to all detected jiggle joints.
                 * Per-body-part intensity scales the master intensity for each region.
                 *
                 * @param {object} vrm - Loaded VRM instance
                 */
                applyParams(vrm) {
                    const joints = vrm?.springBoneManager?.joints;
                    if (!joints) return;

                    for (const [part, indices] of Object.entries(this.bodyPartJoints)) {
                        const partScale = this.bodyPartIntensity[part] ?? 1.0;
                        const effectiveIntensity = this.intensity * partScale;
                        const params = calculateJiggleParams(
                            this.preset, effectiveIntensity,
                            this.emotionMultiplier, this.movementMultiplier,
                            this._gravityMovementMul,
                        );
                        indices.forEach((idx, chainPos) => {
                            const joint = joints[idx];
                            if (!joint) return;
                            // Decay stiffness/drag along multi-bone chain
                            const decay = Math.pow(0.6, chainPos);
                            joint.settings.stiffness    = params.stiffness * decay;
                            joint.settings.dragForce    = params.dragForce * (1.0 - chainPos * 0.2);
                            joint.settings.gravityPower = params.gravityPower * (1.0 + chainPos * 0.15);
                        });
                    }
                }
            }

            // ── PostMessage API ─────────────────────────────────

            window.addEventListener('message', (e) => {
                const { type, payload } = e.data || {};
                const audioUrl = e.data?.audioUrl;

                // Commands that work without a VRM loaded
                if (type === 'loadCharacter') {
                    const p = payload || {};
                    if (p.modelUrl) loadModel(p.modelUrl, scene, camera);
                    return;
                }
                if (type === 'setEntranceConfig') {
                    // Configure entrance animation.
                    // payload: { enabled?, direction?, duration?, style?, emotion? }
                    if (payload) {
                        if (typeof payload.enabled === 'boolean') entranceConfig.enabled = payload.enabled;
                        if (payload.direction === 'left' || payload.direction === 'right') entranceConfig.direction = payload.direction;
                        if (typeof payload.duration === 'number' && payload.duration > 0) entranceConfig.duration = payload.duration;
                        if (payload.style) entranceConfig.style = payload.style;
                        if (payload.emotion) entranceConfig.emotion = payload.emotion;
                    }
                    return;
                }
                if (type === 'exitAnimation') {
                    // Trigger an exit animation on the current model.
                    // payload: { style?: string, direction?: string, duration?: number }
                    const modelScene = currentVrm?.scene || currentGlb;
                    if (!modelScene) return;
                    exitAnimator = new ExitAnimator(modelScene, {
                        style: payload?.style || 'fade',
                        direction: payload?.direction || entranceConfig.direction,
                        duration: payload?.duration,
                        onComplete: () => {
                            exitAnimator = null;
                        },
                    });
                    return;
                }
                if (type === 'queueGreetingGesture') {
                    // Queue a gesture to play after the entrance animation completes.
                    // payload: { gesture: string }
                    _pendingGreetingGesture = payload?.gesture || null;
                    return;
                }
                if (type === 'updateBackground') {
                    setBackground(e.data.mode, e.data.value);
                    return;
                }
                if (type === 'loadEnvironment') {
                    // Stage 2a: render a static room/cafe GLB behind the avatar.
                    // payload: { url: string | null }  (null clears it)
                    loadEnvironment(payload?.url || null);
                    return;
                }
                if (type === 'clearEnvironment') {
                    loadEnvironment(null);
                    return;
                }
                if (type === 'setLighting') {
                    if (e.data.preset && LIGHT_PRESETS[e.data.preset]) {
                        setLighting(LIGHT_PRESETS[e.data.preset]);
                    } else if (payload) {
                        setLighting(payload);
                    }
                    return;
                }
                if (type === 'getLightingPresets') {
                    window.parent.postMessage({
                        type: 'lightingPresets',
                        presets: Object.keys(LIGHT_PRESETS)
                    }, '*');
                    return;
                }
                if (type === 'captureScreenshot') {
                    const dataUrl = captureScreenshot(payload || {});
                    window.parent.postMessage({
                        type: 'screenshotReady',
                        dataUrl,
                        requestId: payload?.requestId,
                        width: renderer.domElement.width * (payload?.quality || 1),
                        height: renderer.domElement.height * (payload?.quality || 1),
                    }, '*');
                    return;
                }

                // ── Photo Mode Handlers ──────────────────────────────────
                if (type === 'enterPhotoMode') {
                    enterPhotoMode();
                    return;
                }
                if (type === 'exitPhotoMode') {
                    exitPhotoMode();
                    return;
                }
                if (type === 'holdGesture') {
                    if (animationDirector) {
                        const gesture = animationDirector.getLayer('gesture');
                        if (gesture) gesture._frozen = true;
                    }
                    return;
                }
                if (type === 'releaseGesture') {
                    if (animationDirector) {
                        const gesture = animationDirector.getLayer('gesture');
                        if (gesture) gesture._frozen = false;
                    }
                    return;
                }
                if (type === 'getCameraState') {
                    window.parent.postMessage({
                        type: 'cameraState',
                        position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
                        target: { x: controls.target.x, y: controls.target.y, z: controls.target.z },
                    }, '*');
                    return;
                }
                if (type === 'setCameraState') {
                    const pos = payload?.position;
                    const tgt = payload?.target;
                    if (pos && tgt) {
                        controls.tweenTo(
                            new THREE.Vector3(pos.x, pos.y, pos.z),
                            new THREE.Vector3(tgt.x, tgt.y, tgt.z),
                            payload?.duration || 500
                        );
                    }
                    return;
                }

                // ── Phase 5: Post-Processing & Particle Handlers ──────────
                if (type === 'setEffects') {
                    updateEffects(payload || {});
                    return;
                }
                if (type === 'getEffects') {
                    window.parent.postMessage({
                        type: 'effectsConfig',
                        config: _effectsConfig,
                        enabled: _effectsEnabled,
                    }, '*');
                    return;
                }
                if (type === 'spawnParticles') {
                    spawnParticles(payload || {});
                    return;
                }
                if (type === 'clearParticles') {
                    clearAllParticles();
                    return;
                }
                if (type === 'setAmbientParticles') {
                    setAmbientParticles(payload?.type ?? null);
                    return;
                }
                if (type === 'setEmotionParticles') {
                    _emotionParticlesEnabled = payload?.enabled !== false;
                    return;
                }

                // ── Phase 12-P4: Emotion-Driven Visual Effects ────────────
                if (type === 'setEmotionGradient') {
                    _effectsConfig.emotionGradient.enabled = payload?.enabled !== false;
                    if (!_effectsConfig.emotionGradient.enabled) {
                        _gradientBgMesh.visible = false;
                    }
                    console.log('[Viewer] Emotion gradient:', _effectsConfig.emotionGradient.enabled);
                    return;
                }
                if (type === 'setEmotionAmbientParticles') {
                    _effectsConfig.emotionAmbient.enabled = payload?.enabled !== false;
                    if (!_effectsConfig.emotionAmbient.enabled) {
                        setAmbientParticles(null); // clear ambient when disabling
                    }
                    console.log('[Viewer] Emotion ambient:', _effectsConfig.emotionAmbient.enabled);
                    return;
                }

                // ── Phase 6: IK & Animation Handlers ──────────────────────
                if (type === 'setEyeGaze') {
                    if (animationDirector) {
                        const lookAt = animationDirector.getLayer('lookAt');
                        if (lookAt) lookAt._eyeGazeEnabled = payload?.enabled !== false;
                    }
                    return;
                }
                // Phase C: VRMLookAt postMessage API
                // Payloads:
                //   { type: 'lookAt', target: { x, y, z } }     — world-space target override
                //   { type: 'lookAt', mode: 'cursor' }           — return to cursor tracking
                //   { type: 'lookAt', enabled: false }           — disable eye gaze + clear target
                if (type === 'lookAt') {
                    if (animationDirector) {
                        const lookAtLayer = animationDirector.getLayer('lookAt');
                        if (lookAtLayer) {
                            if (payload?.target) {
                                lookAtLayer.setWorldTarget(new THREE.Vector3(
                                    payload.target.x ?? 0,
                                    payload.target.y ?? 1.3,
                                    payload.target.z ?? 2.0,
                                ));
                            } else if (payload?.mode === 'cursor' || payload?.mode === 'point' && !payload?.target) {
                                lookAtLayer.setWorldTarget(null);
                            } else if (payload?.enabled !== undefined) {
                                lookAtLayer._eyeGazeEnabled = payload.enabled !== false;
                                if (!payload.enabled) lookAtLayer.setWorldTarget(null);
                            }
                        }
                    }
                    return;
                }
                // Listening cue — reflect the voice-duplex listening state.
                // Strictly ADDITIVE: while listening she attends (gaze settles
                // toward the user via the existing LookAt world-target, blink
                // calms); on release she returns to cursor-follow + neutral
                // blink so idle behaviour resumes. No new animation engine.
                if (type === 'listeningState') {
                    const listening = payload?.active === true;
                    if (animationDirector) {
                        const lookAtLayer = animationDirector.getLayer('lookAt');
                        if (lookAtLayer) {
                            lookAtLayer.setWorldTarget(
                                listening ? new THREE.Vector3(0, 1.3, 2.0) : null
                            );
                        }
                    }
                    if (blinkController) {
                        blinkController.setEmotion(listening ? 'calm' : 'neutral');
                    }
                    return;
                }
                // ── Webcam Motion Capture (Phase 6.1 — stub) ──────────────
                // Mocap requires @mediapipe/face_mesh + kalidokit at runtime.
                // These handlers manage the mocap lifecycle. The actual webcam
                // processing pipeline is loaded on-demand when startMocap is
                // called (lazy-loaded to avoid shipping 4MB WASM upfront).
                if (type === 'startMocap') {
                    if (!window._mocapActive) {
                        window._mocapActive = false;
                        // Check if MediaPipe is available
                        if (typeof FaceMesh === 'undefined') {
                            console.warn('[Mocap] @mediapipe/face_mesh not loaded. Add script to enable webcam tracking.');
                            window.parent.postMessage({
                                type: 'mocapStatus',
                                active: false,
                                error: 'MediaPipe Face Mesh not available. Install @mediapipe/face_mesh to enable webcam tracking.',
                            }, '*');
                            return;
                        }
                    }
                    // Future: init webcam + FaceMesh + Kalidokit pipeline here
                    // For now, report status so the UI can show the correct state
                    window.parent.postMessage({
                        type: 'mocapStatus',
                        active: window._mocapActive || false,
                        error: 'Webcam face tracking requires additional dependencies. Coming in a future update.',
                    }, '*');
                    return;
                }
                if (type === 'stopMocap') {
                    window._mocapActive = false;
                    // Future: release MediaStream, stop FaceMesh processing loop
                    if (animationDirector && animationDirector.state === 'mocap') {
                        animationDirector.transitionTo('idle');
                    }
                    window.parent.postMessage({ type: 'mocapStatus', active: false }, '*');
                    return;
                }
                if (type === 'getMocapStatus') {
                    window.parent.postMessage({
                        type: 'mocapStatus',
                        active: window._mocapActive || false,
                    }, '*');
                    return;
                }
                if (type === 'setCameraPosition') {
                    if (payload) controls.setState(payload);
                    return;
                }
                if (type === 'getCameraPosition') {
                    window.parent.postMessage({
                        type: 'cameraPosition',
                        state: controls.getState()
                    }, '*');
                    return;
                }
                if (type === 'resetCamera') {
                    controls.reset();
                    _vrmFrameData && controls.tweenTo(
                        new THREE.Vector3(0, _vrmFrameData.targetY + _vrmFrameData.modelHeight * 0.05, _vrmFrameData.camZ * 1.15),
                        new THREE.Vector3(0, _vrmFrameData.targetY, 0),
                        400
                    );
                    return;
                }
                if (type === 'setCameraPreset') {
                    if (!_vrmFrameData) return;
                    const { targetY, camZ, modelHeight, headY, faceY } = _vrmFrameData;
                    const presets = {
                        fullbody: {
                            pos:    new THREE.Vector3(0, targetY + modelHeight * 0.05, camZ * 1.15),
                            target: new THREE.Vector3(0, targetY, 0),
                        },
                        bust: {
                            pos:    new THREE.Vector3(camZ * 0.03, targetY + modelHeight * 0.20, camZ * 0.60),
                            target: new THREE.Vector3(0, targetY + modelHeight * 0.20, 0),
                        },
                        face: {
                            pos:    new THREE.Vector3(camZ * 0.04, (faceY || headY) + modelHeight * 0.02, camZ * 0.38),
                            target: new THREE.Vector3(0, (faceY || headY) + modelHeight * 0.02, 0),
                        },
                        threeQuarter: {
                            pos:    new THREE.Vector3(camZ * 0.35, targetY + modelHeight * 0.20, camZ * 0.50),
                            target: new THREE.Vector3(0, targetY + modelHeight * 0.20, 0),
                        },
                        sideProfile: {
                            pos:    new THREE.Vector3(camZ * 0.55, headY, camZ * 0.05),
                            target: new THREE.Vector3(0, headY, 0),
                        },
                        lowAngle: {
                            pos:    new THREE.Vector3(0, targetY - modelHeight * 0.1, camZ * 0.8),
                            target: new THREE.Vector3(0, targetY + modelHeight * 0.15, 0),
                        },
                    };
                    const p = presets[payload?.preset];
                    if (p) controls.tweenTo(p.pos, p.target, 500);
                    return;
                }
                // Phase 11A: Time-of-day lighting
                if (type === 'setTimeOfDay') {
                    if (timeOfDayLighting) {
                        const hour = payload?.hour ?? e.data.hour;
                        const auto = payload?.auto ?? e.data.auto;
                        if (auto === true) {
                            timeOfDayLighting.enableAuto();
                        } else if (auto === false) {
                            timeOfDayLighting.disableAuto();
                        }
                        if (hour !== undefined) {
                            timeOfDayLighting.setHour(Number(hour));
                        }
                    }
                    return;
                }
                // Phase 11A: Procedural pose system
                if (type === 'setPose') {
                    if (poseController) {
                        const poseName = payload?.pose || e.data.pose || 'standing';
                        const result = poseController.setPose(poseName);
                        if (result) {
                            // Apply Y-offset by moving VRM root
                            if (currentVrm?.scene) {
                                const targetY = result.yOffset || 0;
                                // Animate Y offset over 0.4s via requestAnimationFrame
                                const startY = currentVrm.scene.position.y;
                                const startTime = performance.now();
                                const duration = 400;
                                function animateY(now) {
                                    const t = Math.min((now - startTime) / duration, 1);
                                    const eased = t * t * (3 - 2 * t); // smoothstep
                                    currentVrm.scene.position.y = startY + (targetY - startY) * eased;
                                    if (t < 1) requestAnimationFrame(animateY);
                                }
                                requestAnimationFrame(animateY);
                            }
                            // Suggest camera preset for this pose
                            if (result.camera && _vrmFrameData) {
                                // Re-dispatch as a camera preset command
                                window.postMessage({ type: 'setCameraPreset', payload: { preset: result.camera } }, '*');
                            }
                            // Notify parent with pose metadata
                            window.parent.postMessage({
                                type: 'poseChanged',
                                pose: poseName,
                                description: result.description,
                            }, '*');
                            console.log(`[Pose] Set: ${poseName}`);
                        }
                    }
                    return;
                }
                if (type === 'setFOV') {
                    const fov = Math.max(30, Math.min(90, Number(payload?.fov) || 50));
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                    return;
                }
                if (type === 'setCameraEnabled') {
                    controls.enabled = !!e.data.enabled;
                    return;
                }
                if (type === 'setVrmTransform') {
                    // Character scale/position editor (#86): adjust model scale and position.
                    // Works for both VRM and GLB models.
                    const modelScene = currentVrm?.scene || currentGlb;
                    if (modelScene) {
                        const s = payload?.scale   ?? 1.0;
                        const x = payload?.offsetX ?? 0.0;
                        const y = payload?.offsetY ?? 0.0;
                        modelScene.scale.setScalar(s);
                        modelScene.position.x = x;
                        modelScene.position.y = y;
                    }
                    return;
                }
                // ── GLB-specific commands ─────────────────────────
                if (type === 'playGlbAnimation') {
                    // Play a specific embedded animation clip by name or index.
                    // Uses crossFadeTo for smooth transitions between animations.
                    // payload: { name?: string, index?: number, loop?: boolean, fadeIn?: number }
                    if (!currentGlbMixer || currentGlbClips.length === 0) return;
                    let clip = null;
                    if (payload?.name) {
                        clip = currentGlbClips.find(c => c.name === payload.name);
                    } else if (typeof payload?.index === 'number') {
                        clip = currentGlbClips[payload.index];
                    }
                    if (clip) {
                        const fadeDuration = payload?.fadeIn ?? 0.3;
                        const newAction = currentGlbMixer.clipAction(clip);
                        newAction.loop = payload?.loop === false ? THREE.LoopOnce : THREE.LoopRepeat;
                        if (payload?.loop === false) newAction.clampWhenFinished = true;
                        newAction.reset();
                        if (_currentGlbAction && _currentGlbAction !== newAction && fadeDuration > 0) {
                            _currentGlbAction.crossFadeTo(newAction, fadeDuration, true);
                            newAction.play();
                        } else {
                            currentGlbMixer.stopAllAction();
                            newAction.play();
                        }
                        _currentGlbAction = newAction;
                    }
                    return;
                }
                if (type === 'stopGlbAnimation') {
                    // Fade out and stop the current GLB animation.
                    // payload: { fadeOut?: number }
                    if (!currentGlbMixer || !_currentGlbAction) return;
                    const fadeOut = payload?.fadeOut ?? 0.3;
                    _currentGlbAction.fadeOut(fadeOut);
                    setTimeout(() => {
                        if (_currentGlbAction) {
                            _currentGlbAction.stop();
                            _currentGlbAction = null;
                        }
                    }, fadeOut * 1000 + 50);
                    return;
                }
                if (type === 'getGlbMorphTargets') {
                    // Enumerate all morph targets across GLB meshes.
                    // Returns: { type: 'glbMorphTargetList', targets: [{ meshName, targetName, index, value }] }
                    const targets = [];
                    if (currentGlb) {
                        currentGlb.traverse((child) => {
                            if (child.isMesh && child.morphTargetDictionary && child.morphTargetInfluences) {
                                for (const [targetName, idx] of Object.entries(child.morphTargetDictionary)) {
                                    targets.push({
                                        meshName: child.name || '(unnamed)',
                                        targetName,
                                        index: idx,
                                        value: child.morphTargetInfluences[idx] || 0,
                                    });
                                }
                            }
                        });
                    }
                    window.parent.postMessage({ type: 'glbMorphTargetList', targets }, '*');
                    return;
                }
                if (type === 'setGlbMorphTarget') {
                    // Set a morph target value on a GLB mesh.
                    // payload: { meshName?: string, targetIndex: number, value: number }
                    // If meshName is omitted, applies to the first mesh that has the targetIndex.
                    if (!currentGlb) return;
                    const targetIndex = payload?.targetIndex;
                    const value = Math.max(0, Math.min(1, payload?.value ?? 0));
                    const meshName = payload?.meshName;
                    currentGlb.traverse((child) => {
                        if (!child.isMesh || !child.morphTargetInfluences) return;
                        if (meshName && child.name !== meshName) return;
                        if (typeof targetIndex === 'number' && targetIndex < child.morphTargetInfluences.length) {
                            child.morphTargetInfluences[targetIndex] = value;
                        }
                    });
                    return;
                }
                if (type === 'listGlbAnimations') {
                    // Return embedded animation clip names for GLB models.
                    window.parent.postMessage({
                        type: 'glbAnimationList',
                        clips: currentGlbClips.map((c, i) => ({
                            name: c.name || `clip_${i}`,
                            index: i,
                            duration: c.duration,
                        })),
                    }, '*');
                    return;
                }
                if (type === 'getModelInfo') {
                    // Report what kind of model is loaded.
                    window.parent.postMessage({
                        type: 'modelInfo',
                        modelType: currentVrm ? 'vrm' : (currentGlb ? 'glb' : 'none'),
                        hasAnimations: currentGlbClips.length > 0 || !!animationDirector,
                    }, '*');
                    return;
                }

                // Commands that require a loaded VRM (GLB commands handled above)
                if (!currentVrm) return;

                if (type === 'nod') {
                    const getBone = (name) => currentVrm.humanoid.getNormalizedBoneNode ?
                        currentVrm.humanoid.getNormalizedBoneNode(name) :
                        currentVrm.humanoid.getBoneNode(name);
                    const neck = getBone('neck');
                    if (neck) {
                        neck.rotation.x = 0.2;
                        setTimeout(() => neck.rotation.x = 0, 300);
                    }
                }
                else if (type === 'playAudio') {
                    if (lipSync && audioUrl) lipSync.playAudioWithLipSync(audioUrl);
                }
                else if (type === 'stopAudio') {
                    if (lipSync) lipSync.stop();
                }
                // Phase 12-P5: Character ambient audio commands
                else if (type === 'characterAudio') {
                    if (characterAudio) {
                        const action = e.data.action || payload?.action;
                        if (action === 'enable') characterAudio.enable();
                        else if (action === 'disable') characterAudio.disable();
                        else if (action === 'setVolume') characterAudio.setVolume(e.data.volume ?? payload?.volume ?? 0.15);
                        else if (action === 'setEmotion') characterAudio.setEmotion(e.data.emotion || payload?.emotion || 'neutral');
                        else if (action === 'setLayers') characterAudio.setLayers(
                            e.data.breathing ?? payload?.breathing ?? true,
                            e.data.vocals ?? payload?.vocals ?? true,
                            e.data.interaction ?? payload?.interaction ?? true
                        );
                        else if (action === 'playInteraction') characterAudio.playInteractionSound(e.data.zone || payload?.zone || 'torso');
                        else if (action === 'playVocal') characterAudio.playVocalization(e.data.vocalType || payload?.vocalType || 'thinking');
                    }
                }
                else if (type === 'setExpression') {
                    if (expressionController) {
                        expressionController.setExpression(e.data.emotion, e.data.intensity || 1.0, e.data.duration || 0.3);
                    }
                    if (animationDirector) {
                        const emotionLayer = animationDirector.getLayer('emotion');
                        if (emotionLayer) emotionLayer.setEmotion(e.data.emotion, e.data.intensity || 0.7);
                        // Phase 4: update idle clip cycling mood filter
                        const idleLayer = animationDirector.getLayer('idle');
                        if (idleLayer) idleLayer.setEmotion(e.data.emotion || 'neutral');
                    }
                    // Phase 12-P1/P2: modulate blink + micro-expression rate by emotion
                    if (blinkController) blinkController.setEmotion(e.data.emotion || 'neutral');
                    if (microExpressionController) microExpressionController.setEmotion(e.data.emotion || 'neutral');
                    _triggerAutoAnimation(e.data.emotion);
                    // Phase 5: emotion-reactive particles
                    triggerEmotionParticles(e.data.emotion);
                    // Phase 12-P4: emotion-driven visual effects
                    applyEmotionColorGrade(e.data.emotion);
                    applyEmotionGradient(e.data.emotion);
                    setEmotionAmbientParticles(e.data.emotion);
                    applyEmotionGodRayTint(e.data.emotion);
                    applyEmotionRimLight(e.data.emotion);
                    // Phase 12-P5: sync audio engine with emotion
                    if (characterAudio) characterAudio.setEmotion(e.data.emotion);
                    // B2: auto-reset to neutral after 8s so the expression doesn't freeze permanently
                    if (window._b2ResetTimer) clearTimeout(window._b2ResetTimer);
                    if (e.data.emotion && e.data.emotion !== 'neutral') {
                        window._b2ResetTimer = setTimeout(() => {
                            if (expressionController) expressionController.setExpression('neutral', 0);
                        }, 8000);
                    }
                }
                else if (type === 'setEmotion') {
                    const emo = payload?.emotion || e.data.emotion;
                    const inten = e.data.intensity || 0.7;
                    if (expressionController && emo) {
                        expressionController.setExpression(emo, inten, e.data.duration || 0.3);
                    }
                    if (animationDirector && emo) {
                        const emotionLayer = animationDirector.getLayer('emotion');
                        if (emotionLayer) emotionLayer.setEmotion(emo, inten);
                    }
                    _triggerAutoAnimation(emo);
                    // Phase 12-P5: sync audio engine with emotion
                    if (characterAudio) characterAudio.setEmotion(emo);
                }
                else if (type === 'triggerGazeFlick') {
                    // Character glances downward briefly, as if noticing the user typing.
                    if (saccadeController) saccadeController.triggerGazeFlick();
                }
                else if (type === 'playGesture') {
                    const gesture = payload?.gesture || e.data.gesture;
                    if (animationDirector && gesture) {
                        const gl = animationDirector.getLayer('gesture');
                        if (gl) gl.playGesture(gesture);
                    }
                }
                else if (type === 'playGestureSequence') {
                    if (animationDirector && payload) {
                        const gl = animationDirector.getLayer('gesture');
                        if (gl) gl.playSequence(payload);
                    }
                }
                // ── Phase 17B: AnimationSequencer API ──────────────────────────
                // triggerSequence: Start an emotion-driven multi-gesture sequence.
                //   payload: { emotion: string, context?: { timeOfDay?, energy? } }
                // cancelSequence: Cancel any queued gesture sequence.
                // triggerEmote: Immediately enter 'emote' state (short emotion burst).
                //   payload: { emotion: string }
                else if (type === 'triggerSequence') {
                    if (animationSequencer && payload?.emotion) {
                        animationSequencer.triggerEmotion(
                            payload.emotion,
                            payload.context || {}
                        );
                    }
                }
                else if (type === 'cancelSequence') {
                    if (animationSequencer) {
                        animationSequencer.cancel();
                    }
                }
                else if (type === 'triggerEmote') {
                    // Enter 'emote' state for a short burst, then return to idle.
                    // The actual expression/gesture is handled by the existing setEmotion path;
                    // this only transitions the state machine so other layers stay active.
                    if (animationDirector && payload?.emotion) {
                        animationDirector.transitionTo('emote', 0.15);
                        // Auto-return to idle after a short window (1.5s)
                        setTimeout(() => {
                            if (animationDirector?.state === 'emote') {
                                animationDirector.transitionTo('idle', 0.2);
                            }
                        }, 1500);
                    }
                }
                // ── Clip Animation API (AnimationMixer) ──────────────
                else if (type === 'loadAnimation') {
                    // Load a .glb/.gltf/.vrma animation clip into the library.
                    // payload: { url: string, name: string, retarget?: boolean, tags?: string[], mood?: string[] }
                    // When retarget=true, Mixamo bone names are remapped to VRM humanoid bones.
                    // tags/mood are stored as clip.userData for idle cycling filter.
                    // Responds with: { type: 'animationLoaded', name, duration, tracks } or error
                    if (animationDirector && payload?.url && payload?.name) {
                        const cl = animationDirector.getLayer('clip');
                        if (cl) {
                            cl.loadClip(payload.url, payload.name, {
                                retarget: !!payload.retarget,
                                tags: payload.tags,
                                mood: payload.mood,
                            })
                                .then(info => {
                                    window.parent.postMessage({ type: 'animationLoaded', ...info }, '*');
                                })
                                .catch(err => {
                                    window.parent.postMessage({ type: 'animationError', name: payload.name, error: err.message }, '*');
                                });
                        }
                    }
                }
                else if (type === 'playAnimation') {
                    // Play a loaded clip. payload: { name, loop?, fadeIn?, timeScale?, weight? }
                    if (animationDirector && payload?.name) {
                        const cl = animationDirector.getLayer('clip');
                        if (cl) cl.playClip(payload.name, payload);
                    }
                }
                else if (type === 'stopAnimation') {
                    // Stop current clip. payload: { fadeDuration? }
                    if (animationDirector) {
                        const cl = animationDirector.getLayer('clip');
                        if (cl) cl.stopClip(payload?.fadeDuration || 0.3);
                    }
                }
                else if (type === 'listAnimations') {
                    // Return all loaded clips. Responds with: { type: 'animationList', clips: [...] }
                    if (animationDirector) {
                        const cl = animationDirector.getLayer('clip');
                        const clips = cl ? cl.listClips() : [];
                        window.parent.postMessage({ type: 'animationList', clips }, '*');
                    }
                }
                else if (type === 'loadAnimationManifest') {
                    // Load clip metadata from animation manifest into the registry.
                    // payload: { manifest: Object } (from /api/animations response)
                    // Responds with: { type: 'animationManifestLoaded', clipCount, emotions }
                    if (payload?.manifest) {
                        animationRegistry.loadManifest(payload.manifest);
                        window.parent.postMessage({
                            type: 'animationManifestLoaded',
                            clipCount: animationRegistry.clips.size,
                            emotions: [...animationRegistry.emotionIndex.keys()],
                            categories: [...animationRegistry.categoryIndex.keys()],
                        }, '*');
                    }
                }
                else if (type === 'browseAnimations') {
                    // Return all registry clips grouped by category.
                    // Responds with: { type: 'animationBrowse', categories: { idle: [...], ... } }
                    const categories = {};
                    for (const [cat, ids] of animationRegistry.categoryIndex) {
                        categories[cat] = ids.map(id => animationRegistry.clips.get(id)).filter(Boolean);
                    }
                    window.parent.postMessage({
                        type: 'animationBrowse',
                        categories,
                        totalClips: animationRegistry.clips.size,
                    }, '*');
                }
                // ── Animation State Machine (Phase 6.5) ──────────────
                else if (type === 'setAnimationState') {
                    // Force a specific animation state.
                    // payload: { state: 'idle'|'talk'|'gesture'|'clip'|'mocap', fadeDuration?: number }
                    if (animationDirector && payload?.state) {
                        animationDirector.transitionTo(payload.state, payload.fadeDuration);
                    }
                }
                else if (type === 'getAnimationState') {
                    // Query current animation state.
                    // Responds with: { type: 'animationState', state, layers: [...] }
                    if (animationDirector) {
                        const layerInfo = animationDirector.layers.map(l => ({
                            name: l.name,
                            enabled: l.enabled,
                            isPlaying: l.isPlaying ?? false,
                            active: l.active ?? false,
                        }));
                        window.parent.postMessage({
                            type: 'animationState',
                            state: animationDirector.state,
                            layers: layerInfo,
                        }, '*');
                    }
                }
                // ── AI-generated motion: apply JSON keyframe data as a runtime clip ──
                // The backend sends { keyframes: [{time, bones: {boneName: {x,y,z}}}],
                //                     duration, loop?, label? }
                // Keyframe rotations are in radians (Euler XYZ).  The viewer converts
                // them to quaternion tracks and plays them through ClipLayer.
                else if (type === 'applyKeyframes') {
                    const { keyframes, duration, loop = false, label = 'ai_motion' } = (payload || e.data);
                    if (!keyframes || !Array.isArray(keyframes) || !animationDirector || !currentVrm) return;

                    const cl = animationDirector.getLayer('clip');
                    if (!cl) return;

                    // Group keyframe data by bone name
                    const boneData = {};
                    for (const frame of keyframes) {
                        if (!frame.bones) continue;
                        for (const [boneName, euler] of Object.entries(frame.bones)) {
                            if (!boneData[boneName]) boneData[boneName] = { times: [], quats: [] };
                            const q = new THREE.Quaternion().setFromEuler(
                                new THREE.Euler(euler.x || 0, euler.y || 0, euler.z || 0, 'XYZ')
                            );
                            boneData[boneName].times.push(frame.time);
                            boneData[boneName].quats.push(q.x, q.y, q.z, q.w);
                        }
                    }

                    // Build QuaternionKeyframeTracks targeting scene node names
                    const tracks = [];
                    for (const [boneName, data] of Object.entries(boneData)) {
                        const boneNode = currentVrm.humanoid.getNormalizedBoneNode?.(boneName)
                                      || currentVrm.humanoid.getBoneNode?.(boneName);
                        if (!boneNode) continue;
                        tracks.push(new THREE.QuaternionKeyframeTrack(
                            `${boneNode.name}.quaternion`,
                            new Float32Array(data.times),
                            new Float32Array(data.quats)
                        ));
                    }

                    if (tracks.length === 0) {
                        console.warn('[Viewer] applyKeyframes: no matching bones found');
                    } else {
                        const clip = new THREE.AnimationClip(label, duration || -1, tracks);
                        cl.clipLibrary[label] = clip;
                        cl.playClip(label, { loop, fadeIn: 0.5 });
                        console.log(`[Viewer] applyKeyframes: playing "${label}" (${tracks.length} bone tracks, ${keyframes.length} frames)`);
                    }
                }
                // ── End Clip Animation API ────────────────────────────
                else if (type === 'setPersonality') {
                    if (animationDirector && payload) {
                        animationDirector.setPersonality(payload);
                    }
                }
                else if (type === 'getAvailableBlendShapes') {
                    const shapes = getAvailableBlendShapes();
                    window.parent.postMessage({ type: 'blendShapeList', shapes }, '*');
                }
                else if (type === 'setBlendShape') {
                    if (payload) setBlendShape(payload.name, payload.value);
                }
                else if (type === 'setBlendShapes') {
                    // Batch set multiple blend shapes at once
                    if (payload && typeof payload === 'object') {
                        Object.entries(payload).forEach(([name, value]) => {
                            setBlendShape(name, value);
                        });
                    }
                }
                // ── Spring Bone Physics API ──────────────────────
                else if (type === 'getSpringBoneInfo') {
                    // Return spring bone joint and collider group data.
                    const sbm = currentVrm?.springBoneManager;
                    if (!sbm) {
                        window.parent.postMessage({ type: 'springBoneInfo', joints: [], colliderGroups: [] }, '*');
                        return;
                    }
                    const joints = (sbm.joints || []).map((j, i) => ({
                        index: i,
                        boneName: j.bone?.name || `joint_${i}`,
                        stiffness: j.settings.stiffness,
                        drag: j.settings.dragForce,
                        gravityPower: j.settings.gravityPower,
                        gravityDir: { x: j.settings.gravityDir.x, y: j.settings.gravityDir.y, z: j.settings.gravityDir.z },
                        hitRadius: j.settings.hitRadius,
                    }));
                    const colliderGroups = (sbm.colliderGroups || []).map((cg, i) => ({
                        index: i,
                        name: cg.name || `group_${i}`,
                        colliders: (cg.colliders || []).map(c => ({
                            type: c.shape?.constructor?.name || 'unknown',
                            radius: c.shape?.radius || 0,
                            offset: c.shape?.offset ? { x: c.shape.offset.x, y: c.shape.offset.y, z: c.shape.offset.z } : null,
                        })),
                    }));
                    window.parent.postMessage({ type: 'springBoneInfo', joints, colliderGroups }, '*');
                }
                else if (type === 'setSpringBoneParams') {
                    // Set stiffness/drag/gravityPower on a specific joint.
                    // payload: { jointIndex: number, stiffness?: number, drag?: number, gravityPower?: number }
                    const sbm = currentVrm?.springBoneManager;
                    if (!sbm?.joints) return;
                    const joint = sbm.joints[payload?.jointIndex];
                    if (!joint) return;
                    if (typeof payload.stiffness === 'number') joint.settings.stiffness = payload.stiffness;
                    if (typeof payload.drag === 'number') joint.settings.dragForce = payload.drag;
                    if (typeof payload.gravityPower === 'number') joint.settings.gravityPower = payload.gravityPower;
                }
                else if (type === 'setWind') {
                    // Set wind force vector for spring bone simulation.
                    // payload: { x, y, z, strength } — direction is normalized, strength scales it.
                    const p = payload || {};
                    _windForce.x = p.x ?? 0;
                    _windForce.y = p.y ?? 0;
                    _windForce.z = p.z ?? 0;
                    _windForce.strength = p.strength ?? 0;
                    // If wind was turned off, restore original gravity values
                    if (_windForce.strength === 0 && _originalGravity.size > 0) {
                        for (const [joint, orig] of _originalGravity) {
                            joint.settings.gravityDir.x = orig.x;
                            joint.settings.gravityDir.y = orig.y;
                            joint.settings.gravityDir.z = orig.z;
                            joint.settings.gravityPower = orig.power;
                        }
                        _originalGravity.clear();
                    }
                }
                else if (type === 'setSpringBoneEmotion') {
                    // Modulate spring bone physics to reflect current emotion state.
                    // Multipliers adjust stiffness/drag/gravity from model defaults.
                    const sbm = currentVrm?.springBoneManager;
                    if (!sbm?.joints?.length) return;
                    const emotion = payload?.emotion || 'neutral';
                    const MODS = {
                        happy:   { s: 0.8, d: 0.8, g: 0.9 },
                        excited: { s: 0.6, d: 0.6, g: 0.7 },
                        sad:     { s: 1.3, d: 1.2, g: 1.3 },
                        angry:   { s: 1.5, d: 0.7, g: 1.0 },
                        calm:    { s: 1.1, d: 1.1, g: 1.0 },
                        neutral: { s: 1.0, d: 1.0, g: 1.0 },
                    };
                    const mod = MODS[emotion] || MODS.neutral;
                    // Capture base params on first call (preserve model defaults)
                    if (!_springBoneBaseParams) {
                        _springBoneBaseParams = sbm.joints.map(j => ({
                            stiffness: j.settings.stiffness,
                            dragForce: j.settings.dragForce,
                            gravityPower: j.settings.gravityPower,
                        }));
                    }
                    for (let i = 0; i < sbm.joints.length; i++) {
                        const base = _springBoneBaseParams[i];
                        if (!base) continue;
                        const j = sbm.joints[i];
                        j.settings.stiffness    = base.stiffness   * mod.s;
                        j.settings.dragForce    = base.dragForce   * mod.d;
                        j.settings.gravityPower = base.gravityPower * mod.g;
                    }
                }
                else if (type === 'toggleColliderDebug') {
                    // Toggle wireframe visualization of spring bone colliders.
                    _colliderDebugActive = !_colliderDebugActive;
                    if (_colliderDebugActive) {
                        // Create debug spheres for each collider
                        const sbm = currentVrm?.springBoneManager;
                        if (sbm?.colliderGroups) {
                            for (const cg of sbm.colliderGroups) {
                                for (const collider of (cg.colliders || [])) {
                                    const shape = collider.shape;
                                    const radius = shape?.radius || 0.05;
                                    let mesh;

                                    // Capsule collider: has a .tail property (VRM 1.0)
                                    if (shape?.tail && (shape.tail.x !== 0 || shape.tail.y !== 0 || shape.tail.z !== 0)) {
                                        const tailVec = new THREE.Vector3().copy(shape.tail);
                                        const length = tailVec.length();
                                        const geo = new THREE.CapsuleGeometry(radius, length, 4, 8);
                                        const mat = new THREE.MeshBasicMaterial({
                                            color: 0xff8800, wireframe: true, transparent: true, opacity: 0.5,
                                        });
                                        mesh = new THREE.Mesh(geo, mat);
                                        // Position at midpoint of the capsule axis; orient along tail vector
                                        const offset = shape.offset ? new THREE.Vector3().copy(shape.offset) : new THREE.Vector3();
                                        mesh.position.copy(offset.clone().add(tailVec.clone().multiplyScalar(0.5)));
                                        const quat = new THREE.Quaternion().setFromUnitVectors(
                                            new THREE.Vector3(0, 1, 0),
                                            tailVec.clone().normalize()
                                        );
                                        mesh.quaternion.copy(quat);
                                    } else {
                                        // Sphere collider (VRM 0.x and 1.0)
                                        const geo = new THREE.SphereGeometry(radius, 12, 8);
                                        const mat = new THREE.MeshBasicMaterial({
                                            color: 0x00ff88, wireframe: true, transparent: true, opacity: 0.5,
                                        });
                                        mesh = new THREE.Mesh(geo, mat);
                                        if (shape?.offset) mesh.position.copy(shape.offset);
                                    }

                                    // Parent to the collider's bone so it follows animation
                                    if (collider.bone) {
                                        collider.bone.add(mesh);
                                    } else {
                                        scene.add(mesh);
                                    }
                                    _colliderDebugMeshes.push({ mesh, parent: collider.bone || scene });
                                }
                            }
                        }
