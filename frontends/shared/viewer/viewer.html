                            if (rArm) { rArm.rotation.z -= ease * 0.6; rArm.rotation.x += ease * 0.5; }
                            if (rHand) rHand.rotation.z += ease * 0.2;
                        }
                    },
                    {
                        name: 'spine_twist', duration: 2.5,
                        apply(t, p, B) {
                            // Gentle spinal twist — full-body stretch in one direction.
                            // Spine leads, chest follows, head counter-rotates for balance.
                            const spine = B('spine'), chest = B('chest'), head = B('head');
                            const twist = Math.sin(t * Math.PI) * 0.06;
                            if (spine) spine.rotation.y += twist;
                            if (chest) chest.rotation.y += twist * 0.5;
                            if (head) head.rotation.y -= twist * 0.3; // counter-rotate
                        }
                    },
                    {
                        name: 'yawn_stretch', duration: 3.0,
                        requires: (p) => p.energy < 0.3,
                        apply(t, p, B) {
                            // Big yawn with arm stretch — low energy/tiredness indicator.
                            const lArm = B('leftUpperArm'), rArm = B('rightUpperArm');
                            const chest = B('chest'), head = B('head');
                            const ease = Math.sin(t * Math.PI);
                            if (lArm) lArm.rotation.z += ease * 0.8;
                            if (rArm) rArm.rotation.z -= ease * 0.8;
                            if (chest) chest.rotation.x -= ease * 0.05;
                            if (head) head.rotation.x -= ease * 0.1;
                        }
                    },
                    {
                        name: 'finger_drumming', duration: 2.0,
                        requires: (p) => p.nervousness > 0.4,
                        apply(t, p, B) {
                            // Drumming fingers on implied surface — impatient or nervous habit.
                            const rHand = B('rightHand');
                            if (rHand) {
                                rHand.rotation.x += Math.sin(t * Math.PI * 8) * 0.05;
                                rHand.rotation.z += Math.sin(t * Math.PI * 8 + 1) * 0.03;
                            }
                        }
                    },
                    {
                        name: 'hip_sway', duration: 3.0,
                        requires: (p) => p.playfulness > 0.4,
                        apply(t, p, B) {
                            // Playful hip swaying — figure-8 hip movement with spine counter-rotation.
                            const hips = B('hips'), spine = B('spine');
                            const sway = Math.sin(t * Math.PI * 2) * 0.03;
                            if (hips) { hips.rotation.y += sway; hips.position.x += sway * 0.5; }
                            if (spine) spine.rotation.y -= sway * 0.3;
                        }
                    },
                ];
            }

            update(dt) {
                // Photo Mode: skip fidget scheduling when frozen
                if (this._frozen) return;
                super.update(dt);
                const p = this.personality;

                if (this._activeFidget) {
                    this._fidgetTime += dt;
                    const progress = this._fidgetTime / this._fidgetDuration;
                    if (progress >= 1) {
                        this._activeFidget = null;
                        this._fidgetTime = 0;
                        const baseWait = 6 + Math.random() * 9;
                        this._fidgetTimer = baseWait * (1.3 - p.energy * 0.6);
                    } else {
                        let envelope = 1;
                        if (progress < 0.15) envelope = progress / 0.15;
                        else if (progress > 0.85) envelope = (1 - progress) / 0.15;

                        this._activeFidget.apply(
                            this._fidgetTime * envelope,
                            p,
                            (name) => this.getBone(name)
                        );
                    }
                    return;
                }

                this._fidgetTimer -= dt;
                if (this._fidgetTimer <= 0) {
                    const inPetMode = new URLSearchParams(location.search).get('pet') === '1';
                    const eligible = IdleBehaviorLayer.FIDGETS.filter(
                        f => (!f.requires || f.requires(p)) && (!f.petModeOnly || inPetMode)
                    );
                    if (eligible.length > 0) {
                        const pick = eligible[Math.floor(Math.random() * eligible.length)];
                        this._activeFidget = pick;
                        this._fidgetTime = 0;
                        // Blend-in/out duration: minimum 0.6s for slow, natural entrances
                        this._fidgetDuration = Math.max(pick.duration, 0.6) * (0.8 + p.expressiveness * 0.4);
                    }
                    // Increased minimum wait: 8–18s so fidgets feel occasional, not mechanical.
                    // Energy personality reduces wait (energetic chars fidget more).
                    const baseWait = 8 + Math.random() * 10;
                    this._fidgetTimer = baseWait * (1.3 - p.energy * 0.5);
                }

                // Idle clip cycling — every 30–90s of sustained idle, play a mood-matched clip.
                // Only fires when AnimationDirector is in idle state (no talk/gesture/clip active).
                if (animationDirector && animationDirector.state === 'idle') {
                    this._clipCycleTimer -= dt;
                    if (this._clipCycleTimer <= 0) {
                        const cl = animationDirector.getLayer('clip');
                        this._maybeCycleIdleClip(cl, this._currentMood);
                        this._clipCycleTimer = 30 + Math.random() * 60;
                    }
                } else {
                    // Reset timer when non-idle so the first idle cycle isn't immediate
                    this._clipCycleTimer = Math.max(this._clipCycleTimer, 15);
                }
            }
        }

        /**
         * L2: Emotion modifier — posture bias from current emotion.
         * Write mode: ADDITIVE (+=) on spine, hips, shoulders.
         * Replaces the old ProceduralAnimator class.
         */
        class EmotionLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'emotion');
                this.currentEmotion = 'neutral';
                this.intensity = 0.7;
            }

            setEmotion(emotion, intensity = 0.7) {
                this.currentEmotion = emotion || 'neutral';
                this.intensity = Math.max(0, Math.min(1, intensity));
            }

            update(dt) {
                // Photo Mode: hold current emotion posture when frozen
                if (this._frozen) return;
                super.update(dt);
                const t = this.time;
                const p = this.personality;
                const hips = this.getBone('hips');
                const spine = this.getBone('spine');
                const expressScale = 0.5 + p.expressiveness * 1.0;
                const intensity = this.intensity * expressScale;

                // Emotion layer uses assignment (=) not additive (+=).
                // These are absolute offsets from neutral, not per-frame deltas.
                if (hips) {
                    const swayNoise = 1 + Math.sin(t * 0.09) * 0.2;
                    hips.rotation.y = Math.sin(t * 0.3) * 0.02 * swayNoise * intensity;
                }

                const emo = this.currentEmotion;
                const effectiveEmo = (p.playfulness > 0.6 && emo === 'angry') ? 'pouty' : emo;

                switch (effectiveEmo) {
                    case 'happy':
                    case 'excited': {
                        const scale = emo === 'excited' ? 1.3 : 1.0;
                        const happyBoost = 1 + p.playfulness * 0.5;
                        if (hips) hips.position.y = Math.sin(t * 3) * 0.008 * intensity * scale * happyBoost;
                        if (spine) spine.rotation.z = Math.sin(t * 1.5) * 0.02 * intensity * happyBoost;
                        break;
                    }
                    case 'sad': {
                        const nervBoost = 1 + p.nervousness * 0.5;
                        if (spine) {
                            spine.rotation.x = 0.03 * intensity * nervBoost;
                            spine.rotation.z = Math.sin(t * 0.5) * 0.005 * intensity;
                        }
                        break;
                    }
                    case 'angry': {
                        const nervBoost = 1 + p.nervousness * 0.4;
                        if (spine) spine.rotation.z = Math.sin(t * 8) * 0.003 * intensity * nervBoost;
                        break;
                    }
                    case 'pouty': {
                        if (spine) spine.rotation.z = Math.sin(t * 1.2) * 0.015 * intensity;
                        if (hips) hips.rotation.y = Math.sin(t * 0.8) * 0.015 * intensity;
                        break;
                    }
                    case 'embarrassed':
                    case 'shy': {
                        if (spine) spine.rotation.x = 0.04 * intensity;
                        const ls = this.getBone('leftShoulder'), rs = this.getBone('rightShoulder');
                        if (ls) ls.rotation.z = 0.03 * intensity;
                        if (rs) rs.rotation.z = -0.03 * intensity;
                        break;
                    }
                }

                // ── Emotion-driven arm language (additive onto BasePoseLayer drape) ──
                // BasePoseLayer sets the base arm position each frame; these are small
                // deltas layered on top so arms always stay within a natural range.
                const lArm  = this.getBone('leftUpperArm');
                const rArm  = this.getBone('rightUpperArm');
                const lFore = this.getBone('leftLowerArm');
                const rFore = this.getBone('rightLowerArm');

                switch (this.currentEmotion) {
                    case 'happy':
                    case 'excited': {
                        // Open, expansive — arms lift slightly (positive z delta raises arm)
                        const lift = 0.13 * intensity * (this.currentEmotion === 'excited' ? 1.4 : 1.0);
                        if (lArm) lArm.rotation.z += lift;
                        if (rArm) rArm.rotation.z -= lift;
                        break;
                    }
                    case 'sad': {
                        // Arms heavier, drooped further down, slight inward turn
                        if (lArm)  { lArm.rotation.z  -= 0.09 * intensity; lArm.rotation.x  -= 0.04 * intensity; }
                        if (rArm)  { rArm.rotation.z  += 0.09 * intensity; rArm.rotation.x  -= 0.04 * intensity; }
                        if (lFore) lFore.rotation.z -= 0.04 * intensity;
                        if (rFore) rFore.rotation.z += 0.04 * intensity;
                        break;
                    }
                    case 'embarrassed':
                    case 'shy': {
                        // Arms pulled close to body — protective, self-conscious posture
                        if (lArm) { lArm.rotation.y +=  0.14 * intensity; lArm.rotation.z -= 0.06 * intensity; }
                        if (rArm) { rArm.rotation.y -= 0.14 * intensity; rArm.rotation.z += 0.06 * intensity; }
                        break;
                    }
                    case 'angry': {
                        // Tense, arms raised slightly — confrontational stance
                        if (lArm) { lArm.rotation.z += 0.08 * intensity; lArm.rotation.y -= 0.05 * intensity; }
                        if (rArm) { rArm.rotation.z -= 0.08 * intensity; rArm.rotation.y += 0.05 * intensity; }
                        break;
                    }
                    case 'surprised': {
                        // Slight arm startle — both arms pull in briefly
                        const startle = Math.min(1, this.time * 2) * intensity * 0.07;
                        if (lArm) lArm.rotation.x += startle;
                        if (rArm) rArm.rotation.x += startle;
                        break;
                    }
                }
            }
        }

        /**
         * L3: Talk behavior — conversational body language when isTalking is true.
         * Write mode: SET (=) on hands, head, spine.
         * Suppresses L1 (Idle) when active.
         */
        class TalkLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'talk');
                this.active = false;
                this._nodTimer = 0;
                this._nodCooldown = 1.5 + Math.random() * 2;
                this._shiftTimer = 0;
            }

            setTalking(talking) {
                this.active = !!talking;
                if (!talking) {
                    this._nodTimer = 0;
                    this._shiftTimer = 0;
                }
            }

            update(dt) {
                if (!this.active) return;
                super.update(dt);
                const t = this.time;
                const p = this.personality;
                const expressScale = 0.5 + p.expressiveness;
                const spread = 0.5 + p.confidence * 0.5 - p.nervousness * 0.3;

                // Arms: subtle gestural movement while speaking.
                // Upper arms oscillate at slightly different frequencies for asymmetry.
                const lArm = this.getBone('leftUpperArm');
                const rArm = this.getBone('rightUpperArm');
                const handAmp = 0.08 * spread * expressScale;
                if (lArm) {
                    lArm.rotation.z = -1.3 + Math.sin(t * 1.8) * handAmp;
                    lArm.rotation.x = Math.sin(t * 1.3) * handAmp * 0.5;
                }
                if (rArm) {
                    rArm.rotation.z = 1.3 - Math.sin(t * 2.1 + 1) * handAmp;
                    rArm.rotation.x = Math.sin(t * 1.5 + 0.5) * handAmp * 0.5;
                }

                // Forearms: gentle wrist rotation that accompanies speech gestures
                const lFore = this.getBone('leftLowerArm');
                const rFore = this.getBone('rightLowerArm');
                if (lFore) lFore.rotation.y = 0.15 + Math.sin(t * 1.4) * handAmp * 0.3;
                if (rFore) rFore.rotation.y = -0.15 - Math.sin(t * 1.7 + 0.8) * handAmp * 0.3;

                // Head nods: periodic agreement nods, more frequent with playfulness
                this._nodTimer += dt;
                const head = this.getBone('head');
                const neck = this.getBone('neck');
                if (this._nodTimer >= this._nodCooldown && head) {
                    const nodProgress = (this._nodTimer - this._nodCooldown) / 0.3;
                    if (nodProgress < 1) {
                        const nodV = Math.sin(nodProgress * Math.PI) * 0.08;
                        head.rotation.x = nodV;
                        if (neck) neck.rotation.x = nodV * 0.3; // neck follows head
                    } else {
                        this._nodTimer = 0;
                        const playBoost = 1 + p.playfulness * 0.5;
                        this._nodCooldown = (1.2 + Math.random() * 1.5) / playBoost;
                    }
                }

                // Playful head tilt while talking
                if (head && p.playfulness > 0.4) {
                    head.rotation.z = Math.sin(t * 0.7) * 0.04 * p.playfulness;
                }

                // Spine: slight forward lean (engaged posture) during speech
                const spine = this.getBone('spine');
                if (spine) {
                    spine.rotation.x = -0.015 * expressScale;
                }

                // Shoulders: micro-movement that accompanies expressive speech
                const ls = this.getBone('leftShoulder');
                const rs = this.getBone('rightShoulder');
                if (ls) ls.rotation.z = Math.sin(t * 1.1) * 0.015 * expressScale;
                if (rs) rs.rotation.z = -Math.sin(t * 1.3 + 0.5) * 0.015 * expressScale;

                // Periodic weight shift (every ~4s) — restless energy while speaking
                this._shiftTimer += dt;
                if (this._shiftTimer > 4) {
                    const hips = this.getBone('hips');
                    const shiftProgress = (this._shiftTimer - 4) / 2;
                    if (shiftProgress < 1 && hips) {
                        hips.rotation.y = Math.sin(shiftProgress * Math.PI) * 0.03;
                    } else {
                        this._shiftTimer = 0;
                    }
                }
            }
        }

        /**
         * L4: Gesture override — triggered animations (wave, dance, etc.).
         * Write mode: SET (=) on affected bones during playback.
         * Suppresses L1 and L3 on affected bones when playing.
         * Uses smooth 3-phase blend: 15% ease-in, 70% hold, 15% ease-out.
         */
        class GestureLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'gesture');
                this.isPlaying = false;
                this.currentGesture = null;
                this._gestureTime = 0;
                this._gestureDuration = 0;
                this._gestureSequence = [];
                this._sequenceIndex = 0;
            }

            _envelope(progress) {
                if (progress < 0.15) return progress / 0.15;
                if (progress > 0.85) return (1 - progress) / 0.15;
                return 1;
            }

            playGesture(gestureName) {
                const gestureDef = GestureLayer.GESTURES[gestureName];
                if (!gestureDef) return;
                this.currentGesture = gestureName;
                this.isPlaying = true;
                this._gestureTime = 0;
                this._gestureDuration = gestureDef.duration;
            }

            playSequence(sequence) {
                if (!Array.isArray(sequence) || sequence.length === 0) return;
                this._gestureSequence = sequence;
                this._sequenceIndex = 0;
                this.playGesture(sequence[0].gesture || sequence[0]);
            }

            /**
             * Trigger a gesture by name — used by AnimationSequencer to drive
             * gestures programmatically without constructing a full sequence object.
             * Falls back silently if the gesture name is not in GESTURES.
             *
             * @param {string} name - Gesture name (key in GestureLayer.GESTURES)
             */
            triggerGesture(name) {
                const gestureDef = GestureLayer.GESTURES[name];
                if (!gestureDef) {
                    console.warn(`[GestureLayer] triggerGesture: unknown gesture "${name}"`);
                    return;
                }
                // Don't interrupt a running gesture — let the sequencer's timer handle spacing
                if (this.isPlaying) return;
                this.playGesture(name);
            }

            update(dt) {
                if (!this.isPlaying || !this.currentGesture) return;
                // Photo Mode: hold gesture at current frame when frozen
                if (this._frozen) {
                    const gestureDef = GestureLayer.GESTURES[this.currentGesture];
                    if (gestureDef) {
                        const progress = this._gestureTime / this._gestureDuration;
                        const envelope = this._envelope(Math.min(progress, 0.5));
                        const expressScale = 0.5 + this.personality.expressiveness;
                        gestureDef.apply(this._gestureTime, envelope * expressScale, (name) => this.getBone(name));
                    }
                    return;
                }
                super.update(dt);

                this._gestureTime += dt;
                const progress = this._gestureTime / this._gestureDuration;

                if (progress >= 1) {
                    this.isPlaying = false;
                    this.currentGesture = null;
                    this._gestureTime = 0;

                    if (this._gestureSequence.length > 0) {
                        this._sequenceIndex++;
                        if (this._sequenceIndex < this._gestureSequence.length) {
                            const next = this._gestureSequence[this._sequenceIndex];
                            const delay = next.delay || 0.3;
                            setTimeout(() => {
                                this.playGesture(next.gesture || next);
                            }, delay * 1000);
                        } else {
                            this._gestureSequence = [];
                            this._sequenceIndex = 0;
                        }
                    }
                    return;
                }

                const envelope = this._envelope(progress);
                const expressScale = 0.5 + this.personality.expressiveness;
                const amp = envelope * expressScale;
                const t = this._gestureTime;
                const gestureDef = GestureLayer.GESTURES[this.currentGesture];
                if (gestureDef) {
                    gestureDef.apply(t, amp, (name) => this.getBone(name));
                }
            }

            static get GESTURES() {
                return {
                    nod: {
                        duration: 0.8,
                        apply(t, amp, B) {
                            const head = B('head');
                            if (head) head.rotation.x = Math.sin(t * Math.PI * 2.5) * 0.15 * amp;
                        }
                    },
                    tilt: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const head = B('head');
                            if (head) head.rotation.z = Math.sin(t * Math.PI) * 0.2 * amp;
                        }
                    },
                    wave: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const arm = B('rightUpperArm');
                            if (arm) {
                                arm.rotation.z = (1.3 - 1.3 * amp);
                                arm.rotation.x = Math.sin(t * Math.PI * 3) * 0.3 * amp;
                            }
                        }
                    },
                    shrug: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ls = B('leftShoulder'), rs = B('rightShoulder');
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const v = Math.sin(t * Math.PI / 1.2) * amp;
                            if (ls) ls.rotation.y = -0.15 * v;
                            if (rs) rs.rotation.y = 0.15 * v;
                            if (la) la.rotation.z = -1.3 + 0.2 * v;
                            if (ra) ra.rotation.z = 1.3 - 0.2 * v;
                        }
                    },
                    bow: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const spine = B('spine'), head = B('head');
                            const v = Math.sin(t * Math.PI / 2) * amp;
                            if (spine) spine.rotation.x = 0.3 * v;
                            if (head) head.rotation.x = 0.15 * v;
                        }
                    },
                    clap: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const cycle = Math.sin(t * Math.PI * 4) * amp;
                            if (la) { la.rotation.z = -1.3 + 0.5 * amp; la.rotation.x = 0.3 * amp + cycle * 0.1; }
                            if (ra) { ra.rotation.z = 1.3 - 0.5 * amp; ra.rotation.x = 0.3 * amp - cycle * 0.1; }
                        }
                    },
                    think: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            if (ra) { ra.rotation.z = 1.3 - 0.6 * amp; ra.rotation.x = 0.3 * amp; }
                            if (head) head.rotation.z = Math.sin(t * 0.5) * 0.1 * amp;
                        }
                    },
                    point: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm');
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.9 * amp;
                                ra.rotation.x = -0.2 * amp;
                            }
                        }
                    },
                    celebrate: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const hips = B('hips');
                            if (la) la.rotation.z = -1.3 - 0.8 * amp;
                            if (ra) ra.rotation.z = 1.3 + 0.8 * amp;
                            if (hips) hips.position.y = Math.sin(t * Math.PI * 3) * 0.01 * amp;
                        }
                    },
                    shy: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const head = B('head'), spine = B('spine');
                            if (head) { head.rotation.x = 0.15 * amp; head.rotation.z = 0.1 * amp; }
                            if (spine) spine.rotation.x = 0.05 * amp;
                        }
                    },
                    dance: {
                        duration: 3.0,
                        apply(t, amp, B) {
                            const hips = B('hips'), la = B('leftUpperArm'), ra = B('rightUpperArm');
                            if (hips) {
                                hips.rotation.y = Math.sin(t * Math.PI * 2) * 0.1 * amp;
                                hips.position.y = Math.abs(Math.sin(t * Math.PI * 3)) * 0.015 * amp;
                            }
                            if (la) la.rotation.z = -1.3 + Math.sin(t * Math.PI * 2.5) * 0.4 * amp;
                            if (ra) ra.rotation.z = 1.3 - Math.sin(t * Math.PI * 2.5 + 1) * 0.4 * amp;
                        }
                    },
                    foot_tap: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const leg = B('rightUpperLeg');
                            if (leg) leg.rotation.x = Math.abs(Math.sin(t * Math.PI * 3)) * 0.06 * amp;
                        }
                    },
                    crossed_arms: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            if (la) { la.rotation.z = -1.3 + 0.4 * amp; la.rotation.x = 0.5 * amp; }
                            if (ra) { ra.rotation.z = 1.3 - 0.4 * amp; ra.rotation.x = 0.5 * amp; }
                        }
                    },
                    shake: {
                        duration: 0.8,
                        apply(t, amp, B) {
                            const head = B('head');
                            if (head) head.rotation.y = Math.sin(t * Math.PI * 5) * 0.12 * amp;
                        }
                    },
                    // ── Phase 6: Expanded Gesture Library (15 new gestures) ──
                    facepalm: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.5) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.7 * v; ra.rotation.x = 0.4 * v; }
                            if (head) head.rotation.x = 0.2 * v;
                        }
                    },
                    stretch: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), spine = B('spine');
                            const v = Math.sin(t * Math.PI / 2.5) * amp;
                            if (la) la.rotation.z = -1.3 - 0.6 * v;
                            if (ra) ra.rotation.z = 1.3 + 0.6 * v;
                            if (spine) spine.rotation.x = -0.1 * v;
                        }
                    },
                    wink: {
                        duration: 0.6,
                        apply(t, amp, B) {
                            // Wink is expression-based (handled via expressionController)
                            // but we add a slight head tilt for physicality
                            const head = B('head');
                            if (head) head.rotation.z = Math.sin(t * Math.PI) * 0.06 * amp;
                        }
                    },
                    yawn: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), head = B('head'), spine = B('spine');
                            const v = Math.sin(t * Math.PI / 2) * amp;
                            if (la) la.rotation.z = -1.3 - 0.5 * v;
                            if (ra) ra.rotation.z = 1.3 + 0.5 * v;
                            if (head) head.rotation.x = -0.1 * v;
                            if (spine) spine.rotation.x = -0.05 * v;
                        }
                    },
                    // ── Pet-mode exclusive fidgets ──────────────────────────────────────
                    // These are NOT auto-scheduled by IdleBehaviorLayer. They are triggered
                    // externally from PetView.tsx via postMessage({ type: 'playGesture', gesture: '...' }).
                    // petModeOnly: true — excluded from the random auto-scheduler's eligible pool.
                    doze: {
                        duration: 4.0,
                        petModeOnly: true,
                        apply(t, amp, B) {
                            // Gradual head droop with slow hold — simulates the character dozing.
                            // Head tips forward over the first 60% then holds slightly drooped.
                            const head = B('head'), spine = B('spine'), neck = B('neck');
                            const droop = Math.min(1.0, t / 0.6);  // ramp in over first 60%
                            const breathe = Math.sin(t * Math.PI * 1.5) * 0.015;  // slow breathing
                            if (head) { head.rotation.x = droop * 0.35 * amp; head.rotation.z = droop * 0.05 * amp; }
                            if (neck) neck.rotation.x = droop * 0.18 * amp;
                            if (spine) spine.rotation.x = droop * 0.08 * amp + breathe;
                        }
                    },
                    wake_up: {
                        duration: 1.2,
                        petModeOnly: true,
                        apply(t, amp, B) {
                            // Quick startle — head snaps up, then settles back to neutral.
                            // Sharp surprised recoil in first 30%, gradual settle in remaining 70%.
                            const head = B('head'), spine = B('spine'), neck = B('neck');
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const snapT = t < 0.3 ? t / 0.3 : 1.0 - (t - 0.3) / 0.7;
                            const recoil = Math.sin(snapT * Math.PI) * amp;
                            if (head) { head.rotation.x = -recoil * 0.25; head.rotation.y = recoil * 0.04; }
                            if (neck) neck.rotation.x = -recoil * 0.12;
                            if (spine) spine.rotation.x = -recoil * 0.06;
                            // Arms raise slightly from the startle before settling
                            if (la) la.rotation.z = -1.3 - recoil * 0.2;
                            if (ra) ra.rotation.z = 1.3 + recoil * 0.2;
                        }
                    },
                    wave_at_cursor: {
                        duration: 2.5,
                        petModeOnly: true,
                        apply(t, amp, B) {
                            // Friendly wave toward the user's cursor.
                            // Right arm raises (first 25%), then waves 2.5 cycles, then lowers.
                            const ra = B('rightUpperArm'), rLower = B('rightLowerArm'), head = B('head');
                            const raiseT = Math.min(1.0, t / 0.25);              // arm-up ramp
                            const wave = Math.sin(t * Math.PI * 5) * 0.22;       // wave oscillation
                            const lowerT = t > 0.75 ? (t - 0.75) / 0.25 : 0;   // arm-down ramp
                            const armUp = (raiseT - lowerT) * amp;
                            if (ra) {
                                ra.rotation.z = (1.3 - 0.95 * armUp);
                                ra.rotation.x = armUp * 0.3 + wave * armUp;
                            }
                            if (rLower) rLower.rotation.x = armUp * 0.4;
                            // Slight head turn toward the wave (friendly acknowledgment)
                            if (head) head.rotation.z = -armUp * 0.06;
                        }
                    },
                    scratch: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.2) * amp;
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.6 * v;
                                ra.rotation.x = Math.sin(t * Math.PI * 4) * 0.1 * amp;
                            }
                            if (head) head.rotation.z = 0.08 * v;
                        }
                    },
                    peek: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const head = B('head'), spine = B('spine');
                            const v = Math.sin(t * Math.PI) * amp;
                            if (spine) spine.rotation.x = 0.15 * v;
                            if (head) { head.rotation.x = 0.1 * v; head.rotation.z = 0.05 * v; }
                        }
                    },
                    hug_self: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), spine = B('spine');
                            const v = Math.sin(t * Math.PI / 1.5) * amp;
                            if (la) { la.rotation.z = -1.3 + 0.6 * v; la.rotation.x = 0.4 * v; }
                            if (ra) { ra.rotation.z = 1.3 - 0.6 * v; ra.rotation.x = 0.4 * v; }
                            if (spine) spine.rotation.x = 0.05 * v;
                        }
                    },
                    finger_wag: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm');
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.7 * amp;
                                ra.rotation.y = Math.sin(t * Math.PI * 4) * 0.15 * amp;
                            }
                        }
                    },
                    peace_sign: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.2) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.8 * v; ra.rotation.x = -0.1 * v; }
                            if (head) head.rotation.z = -0.08 * v;
                        }
                    },
                    thumbs_up: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm');
                            const v = Math.sin(t * Math.PI) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.7 * v; ra.rotation.x = -0.15 * v; }
                        }
                    },
                    blow_kiss: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.5) * amp;
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.6 * v;
                                ra.rotation.x = 0.3 * v;
                            }
                            // Blow phase: arm extends outward in second half
                            if (t > 0.5 && ra) ra.rotation.z -= 0.3 * (t - 0.5) * 2 * amp;
                            if (head) head.rotation.z = -0.05 * v;
                        }
                    },
                    head_bang: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const head = B('head'), spine = B('spine');
                            const v = Math.sin(t * Math.PI * 4) * amp;
                            if (head) head.rotation.x = 0.2 * v;
                            if (spine) spine.rotation.x = 0.05 * v;
                        }
                    },
                    curtsy: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const spine = B('spine'), head = B('head');
                            const ll = B('leftUpperLeg'), rl = B('rightUpperLeg');
                            const v = Math.sin(t * Math.PI / 2) * amp;
                            if (spine) spine.rotation.x = 0.2 * v;
                            if (head) head.rotation.x = 0.1 * v;
                            if (ll) ll.rotation.x = -0.15 * v;
                            if (rl) rl.rotation.x = -0.15 * v;
                        }
                    },
                    jumping_jack: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), hips = B('hips');
                            const cycle = Math.sin(t * Math.PI * 3) * amp;
                            if (la) la.rotation.z = -1.3 - 0.7 * Math.abs(cycle);
                            if (ra) ra.rotation.z = 1.3 + 0.7 * Math.abs(cycle);
                            if (hips) hips.position.y = Math.abs(cycle) * 0.02;
                        }
                    },
                    tai_chi: {
                        duration: 3.0,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), spine = B('spine');
                            const slow = Math.sin(t * Math.PI * 0.8) * amp;
                            const offset = Math.sin(t * Math.PI * 0.8 + 1.5) * amp;
                            if (la) { la.rotation.z = -1.3 + 0.4 * slow; la.rotation.x = 0.3 * offset; }
                            if (ra) { ra.rotation.z = 1.3 - 0.4 * offset; ra.rotation.x = 0.3 * slow; }
                            if (spine) spine.rotation.y = slow * 0.08;
                        }
                    },
                    // ── Phase D: Gestures referenced by AnimationSequencer.EMOTION_SEQUENCES ──
                    // Mirrored from IdleLayer.FIDGETS (same motion, GestureLayer amp format)
                    bounce: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const hips = B('hips'), ls = B('leftShoulder'), rs = B('rightShoulder');
                            const v = Math.abs(Math.sin(t * Math.PI * 1.67)) * 0.015 * amp;
                            if (hips) hips.position.y = v;
                            if (ls) ls.rotation.z = v * 1.5;
                            if (rs) rs.rotation.z = -v * 1.5;
                        }
                    },
                    curtsy_bob: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const hips = B('hips'), spine = B('spine'), head = B('head');
                            const dip = Math.sin(t * Math.PI * 0.5) * amp;
                            if (hips) hips.position.y = -dip * 0.02;
                            if (spine) spine.rotation.x = dip * 0.04;
                            if (head) head.rotation.x = dip * 0.03;
                        }
                    },
                    hip_cock: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            const blend = Math.sin(t * Math.PI * 0.4) * amp;
                            if (hips) { hips.rotation.z = blend * 0.06; hips.rotation.y = blend * 0.03; }
                            if (spine) spine.rotation.z = blend * -0.03;
                            if (chest) chest.rotation.z = blend * -0.02;
                        }
                    },
                    weight_shift: {
                        duration: 3.0,
                        apply(t, amp, B) {
                            const env = Math.sin(t / 3.0 * Math.PI);
                            const phase = Math.sin(t * Math.PI * 0.67) * env * amp;
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            if (hips) { hips.rotation.y = phase * 0.035; hips.rotation.z = phase * 0.018; }
                            if (spine) spine.rotation.z = phase * -0.012;
                            if (chest) chest.rotation.z = phase * -0.008;
                        }
                    },
                    shoulder_roll: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const ls = B('leftShoulder'), rs = B('rightShoulder'), neck = B('neck');
                            const v = Math.sin(t * Math.PI * 0.8) * 0.03 * amp;
                            if (ls) ls.rotation.z = v;
                            if (rs) rs.rotation.z = -v * 0.5;
                            if (neck) neck.rotation.z = v * 0.15;
                        }
                    },
                    subtle_sway: {
                        duration: 3.0,
                        apply(t, amp, B) {
                            const hips = B('hips'), spine = B('spine'), head = B('head');
                            const s = Math.sin(t * Math.PI * 0.667) * 0.02 * amp;
                            if (hips) hips.rotation.z = s;
                            if (spine) spine.rotation.z = s * -0.5;
                            if (head) head.rotation.z = s * -0.3;
                        }
                    },
                    head_tilt: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const head = B('head'), neck = B('neck');
                            const tilt = Math.sin(t * Math.PI / 1.5) * 0.08 * amp;
                            if (neck) neck.rotation.z = tilt * 0.3;
                            if (head) head.rotation.z = tilt;
                        }
                    },
                    look_around: {
                        duration: 3.5,
                        apply(t, amp, B) {
                            const head = B('head'), neck = B('neck');
                            const env = Math.sin(t / 3.5 * Math.PI);
                            const yaw = Math.sin(t * Math.PI * 0.57) * 0.08 * env * amp;
                            if (neck) neck.rotation.y = yaw * 0.35;
                            if (head) { head.rotation.y = yaw; head.rotation.z = yaw * 0.25; }
                        }
                    },
                    deep_breath: {
                        duration: 3.5,
                        apply(t, amp, B) {
                            const chest = B('chest') || B('spine');
                            const ls = B('leftShoulder'), rs = B('rightShoulder');
                            const inhale = Math.sin(t * Math.PI * 0.571) * 0.015 * amp;
                            if (chest) chest.rotation.x = inhale;
                            const lift = Math.max(0, inhale) * 2;
                            if (ls) ls.rotation.z = lift * 0.03;
                            if (rs) rs.rotation.z = -lift * 0.03;
                        }
                    },
                    foot_tap: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const leg = B('rightUpperLeg'), hips = B('hips');
                            const tap = Math.abs(Math.sin(t * Math.PI * 3)) * 0.03 * amp;
                            if (leg) leg.rotation.x = tap;
                            if (hips) hips.rotation.z = tap * 0.15;

                    },
                    // Phase D: New gestures (not in FIDGETS — need fresh implementations)
                    hair_twirl: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            // Right hand reaches toward head — gentle, playful
                            const ra = B('rightUpperArm'), rla = B('rightLowerArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 2.0) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.55 * v; ra.rotation.x = 0.25 * v; }
                            if (rla) rla.rotation.x = -0.15 * v;

                        }
                    },
                    touch_face: {
                        duration: 1.8,
                        apply(t, amp, B) {
                            // Hand rises toward chin/cheek — contemplative or shy
                            const ra = B('rightUpperArm'), rla = B('rightLowerArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.8) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.45 * v; ra.rotation.x = 0.35 * v; }
                            if (rla) rla.rotation.x = -0.2 * v;
                            if (head) head.rotation.z = 0.05 * v;
                        }
                    },
                    hand_on_hip: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            // Confident pose: one hand on hip, slight hip cant
                            const ra = B('rightUpperArm'), rla = B('rightLowerArm');
                            const hips = B('hips'), spine = B('spine');
                            const v = Math.sin(t * Math.PI / 2.0) * amp;
                            if (ra) { ra.rotation.z = 1.1 * v; ra.rotation.x = 0.1 * v; }
                            if (rla) rla.rotation.z = -0.2 * v;
                            if (hips) hips.rotation.z = 0.04 * v;

                            const v = Math.sin(t * Math.PI / 1.5) * amp;
                            if (la) { la.rotation.z = -1.3 + 0.5 * v; la.rotation.x = 0.4 * v; }
                            if (ra) { ra.rotation.z = 1.3 - 0.5 * v; ra.rotation.x = 0.4 * v; }
                            if (lla) lla.rotation.x = -0.25 * v;
                            if (rla) rla.rotation.x = -0.25 * v;

                    fidget_hands: {

                            if (ra) { ra.rotation.z = 1.3 - 0.15 * v; ra.rotation.x = -0.25 * v; }

        /**
         * Manages bone masks for AnimationAction filtering.
         * Enables clip-based animations to affect only a subset of bones,
         * allowing simultaneous upper-body gestures over continuous idle lower-body motion.
         *
         * Primary path: filterClip() returns a NEW filtered clip before action creation.
         * Secondary path: applyMask() uses Three.js internals (forward-compat risk noted).
         *
         * @example
         *   const masked = BoneMaskManager.filterClip(clip, BoneMaskManager.UPPER_BODY);
         *   clipLayer.playClip('wave', { mask: BoneMaskManager.UPPER_BODY });
         */
        class BoneMaskManager {
            /** VRM humanoid bone names belonging to the upper body. */
            static UPPER_BODY = new Set([
                'spine', 'chest', 'upperChest', 'neck', 'head',
                'leftShoulder', 'rightShoulder',
                'leftUpperArm', 'rightUpperArm',
                'leftLowerArm', 'rightLowerArm',
                'leftHand', 'rightHand',
            ]);

            /** VRM humanoid bone names belonging to the lower body. */
            static LOWER_BODY = new Set([
                'hips',
                'leftUpperLeg', 'rightUpperLeg',
                'leftLowerLeg', 'rightLowerLeg',
                'leftFoot', 'rightFoot',
                'leftToes', 'rightToes',
            ]);

            /** No mask — all bones affected (null signals full-body to callers). */
            static FULL_BODY = null;

            /**
             * Filter an AnimationClip to only include tracks for specified bones.
             * Returns a NEW cloned clip; does not mutate the original.
             *
             * Track names use scene node names (not VRM bone names), so matching
             * checks whether the node name contains any allowed bone name as a
             * case-insensitive substring (handles "_mixamorig:Hips" etc.).
             *
             * @param {THREE.AnimationClip} clip - Source clip
             * @param {Set<string>} allowedBones - VRM humanoid bone names to keep
             * @returns {THREE.AnimationClip} New filtered clip
             */
            static filterClip(clip, allowedBones) {
                if (!allowedBones) return clip;
                const masked = clip.clone();
                masked.tracks = clip.tracks.filter(track => {
                    const dot = track.name.lastIndexOf('.');
                    const nodeName = dot === -1 ? track.name : track.name.substring(0, dot);
                    const lower = nodeName.toLowerCase();
                    for (const bone of allowedBones) {
                        if (lower.includes(bone.toLowerCase())) return true;
                    }
                    return false;
                });
                masked.name = clip.name + '_masked';
                return masked;
            }

            /**
             * Apply a bone mask to an existing AnimationAction by nulling bindings for
             * excluded bones. Uses Three.js _propertyBindings internals — forward-compat risk.
             * Prefer filterClip() for new code.
             *
             * @param {THREE.AnimationAction} action - Action to mask (must be created first)
             * @param {Set<string>} allowedBones - VRM humanoid bone names to keep active
             */
            static applyMask(action, allowedBones) {
                if (!allowedBones || !action?._propertyBindings) return;
                for (const binding of action._propertyBindings) {
                    const nodeName = binding?.binding?.node?.name || '';
                    const lower = nodeName.toLowerCase();
                    let keep = false;
                    for (const bone of allowedBones) {
                        if (lower.includes(bone.toLowerCase())) { keep = true; break; }
                    }
                    if (!keep) {
                        // Zero the effective influence for this track via its mixer
                        const idx = action._propertyBindings.indexOf(binding);
                        if (idx !== -1 && action._interpolantSettings) {
                            try { action._propertyBindings[idx] = null; } catch (_) {}
                        }
                    }
                }
            }
        }

        /**
         * Inertialization-based animation transition.
         *
         * At the moment of a clip transition, capture() snapshots the current bone
         * quaternions. Each subsequent update() decays the blend weight from 1→0 using
         * a critically damped spring — the new action runs normally while the snapshot
         * is faded out via slerp, producing the smoothest possible pop-free transition.
         *
         * Usage inside ClipLayer:
         *   const blend = new InertializationBlend(vrm, boneNames);
         *   blend.capture();         // call before new action starts
         *   // ... new action plays ...
         *   blend.update(dt);        // call each frame; returns false when done
         *
         * @param {Object} vrm - The loaded VRM model
         * @param {string[]} boneNames - VRM humanoid bone names to blend
         * @param {number} [halflife=0.12] - Spring halflife for offset decay (seconds)
         */
        class InertializationBlend {
            constructor(vrm, boneNames, halflife = 0.12) {
                this.vrm = vrm;
                this.boneNames = boneNames;
                this.halflife = halflife;
                this._active = false;
                this._snapshot = {};   // boneName → THREE.Quaternion at capture time
                this._blendX = 1.0;    // blend weight: 1 = fully old, 0 = fully new
                this._blendV = 0.0;    // spring velocity
                this._tmp = new THREE.Quaternion();
            }

            /**
             * Snapshot current bone quaternions and arm the blend.
             * Call immediately BEFORE the new AnimationAction starts playing.
             */
            capture() {
                const humanoid = this.vrm?.humanoid;
                if (!humanoid) return;
                this._snapshot = {};
                for (const boneName of this.boneNames) {
                    try {
                        const node = humanoid.getNormalizedBoneNode(boneName);
                        if (node) this._snapshot[boneName] = node.quaternion.clone();
                    } catch (_) {}
                }
                this._blendX = 1.0;
                this._blendV = 0.0;
                this._active = true;
            }

            /**
             * Apply one frame of inertialization blend.
             * Must be called AFTER AnimationMixer.update() so new-action bone values are set.
             *
             * @param {number} dt - Delta time in seconds
             * @returns {boolean} true while blend is still active, false when complete
             */
            update(dt) {
                if (!this._active) return false;
                const r = springDamperExact(this._blendX, this._blendV, 0, this.halflife, dt);
                this._blendX = r.x;
                this._blendV = r.v;
                if (this._blendX < 0.005) {
                    this._active = false;
                    return false;
                }
                const humanoid = this.vrm?.humanoid;
                if (!humanoid) return false;
                for (const boneName of Object.keys(this._snapshot)) {
                    try {
                        const node = humanoid.getNormalizedBoneNode(boneName);
                        if (!node) continue;
                        // Blend: new action's output → slerped toward old snapshot
                        // As _blendX decays 1→0, pose transitions smoothly from old→new
                        this._tmp.copy(node.quaternion);
                        node.quaternion.slerpQuaternions(this._tmp, this._snapshot[boneName], this._blendX);
                    } catch (_) {}
                }
                return true;
            }
        }

        class ClipLayer extends AnimationLayer {
            /**
             * @param {Object} vrm - The loaded VRM model
             * @param {THREE.Scene} scene - The Three.js scene (needed for mixer root)
             */
            constructor(vrm, scene) {
                super(vrm, 'clip');
                this.scene = scene;
                this.mixer = new THREE.AnimationMixer(vrm.scene);
                this.clipLibrary = {};  // name → THREE.AnimationClip
                this.currentAction = null;
                this.isPlaying = false;
                this._fadeOutDuration = 0.3;
                this._loader = null;    // lazy-init GLTFLoader
                this._nodeNameCache = null; // VRM bone name → scene node name
                // Phase C: spring crossfade state
                this._crossfadeTarget = 0;
                this._crossfadeElapsed = 0;
                this._crossfadeDuration = 0;
                this._crossfadeEasingFn = 'exponential';
                this._inertBlend = null;  // InertializationBlend instance
            }

            /**
             * Build a lookup cache from VRM humanoid bone names to actual
             * scene node names. Called lazily on first retarget.
             * @returns {Object} Map of VRM bone name → node.name in scene graph
             * @private
             */
            _buildNodeNameCache() {
                if (this._nodeNameCache) return this._nodeNameCache;
                this._nodeNameCache = {};
                const humanoid = this.vrm?.humanoid;
                if (!humanoid) return this._nodeNameCache;

                // VRM 1.0: getNormalizedBoneNode(boneName) returns the Three.js Object3D
                // Merge VRM bone names from both Mixamo and BVH maps
                const vrmBoneNames = [...new Set([...Object.values(MIXAMO_BONE_MAP), ...Object.values(BVH_BONE_MAP), ...Object.values(VRM_BONE_MAP)])];
                for (const vrmName of vrmBoneNames) {
                    try {
                        const node = humanoid.getNormalizedBoneNode(vrmName);
                        if (node) {
                            this._nodeNameCache[vrmName] = node.name;
                        }
                    } catch (_) {
                        // Bone not present in this model — skip
                    }
                }
                console.log(`[ClipLayer] Node name cache built: ${Object.keys(this._nodeNameCache).length} bones mapped`);
                return this._nodeNameCache;
            }

            /**
             * Retarget an AnimationClip from Mixamo bone names to VRM humanoid bones.
             *
             * Walks every track in the clip, checks if the track's bone name matches
             * a Mixamo convention name, and remaps it to the corresponding VRM scene
             * node name. Tracks that don't match Mixamo names are left unchanged.
             *
             * @param {THREE.AnimationClip} clip - The clip to retarget (mutated in-place)
             * @returns {THREE.AnimationClip} The same clip, retargeted
             */
            retargetClip(clip) {
                const nodeNames = this._buildNodeNameCache();
                if (Object.keys(nodeNames).length === 0) return clip;

                // CRITICAL: three.js GLTFLoader sanitizes node names in animation track
                // bindings — it strips reserved chars including the colon. So a Mixamo
                // bone exported as "mixamorig:Hips" arrives in the clip as track
                // "mixamorigHips.quaternion" (no colon). MIXAMO_BONE_MAP keys keep the
                // colon, so a literal lookup matches NOTHING and retarget silently no-ops
                // (verified 2026-05-31). Build a normalization-keyed lookup so colon-less,
                // case-variant bone names still map. See docs/research/2026-05-31-retarget-pipeline.md.
                if (!this._normBoneMap) {
                    const norm = (s) => s.replace(/[^a-z0-9]/gi, '').toLowerCase();
                    this._normBoneMap = {};
                    for (const [k, v] of Object.entries(MIXAMO_BONE_MAP)) this._normBoneMap[norm(k)] = v;
                    for (const [k, v] of Object.entries(BVH_BONE_MAP)) {
                        if (!(norm(k) in this._normBoneMap)) this._normBoneMap[norm(k)] = v;
                    }
                    // VRoid raw names from normalized-space VRM-rig bakes (Bug 2 fix).
                    for (const [k, v] of Object.entries(VRM_BONE_MAP)) {
                        if (!(norm(k) in this._normBoneMap)) this._normBoneMap[norm(k)] = v;
                    }
                }
                const normName = (s) => s.replace(/[^a-z0-9]/gi, '').toLowerCase();

                // VRM humanoid motion is ROTATION-ONLY plus hips translation. Mixamo/BVH
                // clips ship per-bone .position (translation) and .scale tracks computed for
                // the SOURCE skeleton's bone lengths/proportions. Applying those to a VRM with
                // different proportions folds and stretches the rig (verified 2026-05-31:
                // a walk clip bent the avatar 90° forward). Worse, Mixamo clips are Z-up +
                // centimeters: a baked hips track carries the standing height (~104) on the
                // Z axis, and applying that raw to the VRM flings the model ~100m off-camera.
                // Rather than chase per-source scale/axis fixes, retarget ROTATION-ONLY: keep
                // every mapped bone's .quaternion track, drop ALL .position and .scale tracks.
                // The VRM's own rest pose grounds the feet; leg/spine ROTATIONS produce the
                // visible motion (stride, sway, gesture) in place. This is robust across
                // Mixamo/BVH/GLB sources regardless of their units or up-axis.
                // See docs/research/2026-05-31-retarget-pipeline.md.
                let remapped = 0;
                let dropped = 0;
                const kept = [];

                for (const track of clip.tracks) {
                    // Track names are "boneName.property" (e.g., "mixamorig:Hips.quaternion")
                    const dotIdx = track.name.indexOf('.');
                    if (dotIdx === -1) { kept.push(track); continue; }

                    const boneName = track.name.substring(0, dotIdx);
                    const property = track.name.substring(dotIdx); // includes the dot, e.g. ".quaternion"

                    // Normalized lookup (colon-/case-insensitive) — matches both the
                    // raw "mixamorig:Hips" and the GLTF-sanitized "mixamorigHips".
                    const vrmBoneName = this._normBoneMap[normName(boneName)];
                    if (!vrmBoneName) { kept.push(track); continue; } // not a known bone — leave as-is

                    const nodeName = nodeNames[vrmBoneName];
                    if (!nodeName) { dropped++; continue; } // VRM lacks this bone — drop

                    // Rotation-only: drop position + scale on every mapped bone (incl. hips).
                    if (property !== '.quaternion') {
                        dropped++;
                        continue;
                    }

                    track.name = nodeName + property;
                    kept.push(track);
                    remapped++;
                }

                clip.tracks = kept;
                if (remapped > 0 || dropped > 0) {
                    console.log(`[ClipLayer] Retargeted ${remapped} rotation tracks, dropped ${dropped} position/scale (Mixamo/BVH → VRM)`);
                }
                return clip;
            }

            /**
             * Remove animation tracks targeting spring bone joints from a clip.
             *
             * Mixamo exports sometimes include keyframes for VRM spring bone joints
             * (hair, clothing). These override Verlet simulation, freezing secondary
             * motion. Strip them before storing so physics runs on those bones freely.
             *
             * @param {THREE.AnimationClip} clip - Mutated in-place.
             * @returns {THREE.AnimationClip} The same clip, filtered.
             */
            stripSpringBoneTracks(clip) {
                if (!this.vrm?.springBoneManager?.joints?.length) return clip;
                const springBoneNames = new Set(
                    this.vrm.springBoneManager.joints.map(j => j.bone.name)
                );
                const before = clip.tracks.length;
                clip.tracks = clip.tracks.filter(track => {
                    const dotIdx = track.name.indexOf('.');
                    if (dotIdx === -1) return true;
                    return !springBoneNames.has(track.name.substring(0, dotIdx));
                });
                const removed = before - clip.tracks.length;
                if (removed > 0) console.log(`[ClipLayer] Stripped ${removed} spring bone tracks from "${clip.name}"`);
                return clip;
            }

            /**
             * Load an animation clip from a .glb/.gltf URL and store it by name.
             *
             * @param {string} url - URL of the .glb/.gltf animation file
             * @param {string} name - Friendly name to reference this clip
             * @param {Object} [opts] - Load options
             * @param {boolean} [opts.retarget=false] - Auto-retarget Mixamo bone names to VRM
             * @param {string[]} [opts.tags] - Semantic tags (e.g. ['idle', 'subtle']) for cycling filter
             * @param {string[]} [opts.mood] - Mood compatibility list (e.g. ['calm', 'neutral'])
             * @returns {Promise<{name: string, duration: number, tracks: number}>}
             *
             * @example
             *   await clipLayer.loadClip('/animations/wave.glb', 'wave', { retarget: true });
             *   await clipLayer.loadClip('/animations/idle_breathing.vrma', 'idle_breathing',
             *     { tags: ['idle', 'subtle'], mood: ['calm', 'neutral'] });
             */
            async loadClip(url, name, opts = {}) {
                const { retarget = false, tags, mood } = opts;

                // Detect BVH files → use BVHLoader instead of GLTFLoader
                if (url.toLowerCase().endsWith('.bvh')) {
                    return this._loadBVH(url, name, retarget);
                }

                if (!this._loader) {
                    // GLTFLoader is already imported at the top of the file
                    this._loader = new GLTFLoader();
                    // Register VRM loader plugin so VRMA files can be loaded too
                    this._loader.register((parser) => new VRMLoaderPlugin(parser));
                }

                const isVRMA = url.toLowerCase().endsWith('.vrma');
                return new Promise((resolve, reject) => {
                    this._loader.load(url, (gltf) => {
                        // VRMA files store animations in userData.vrmAnimations (via VRMAnimationLoaderPlugin).
                        // Fall back to gltf.animations for GLB/GLTF and unregistered VRMA.
                        const animations = (isVRMA && gltf.userData?.vrmAnimations?.length)
                            ? gltf.userData.vrmAnimations
                            : (gltf.animations || []);
                        if (animations.length === 0) {
                            reject(new Error(`No animations found in ${url}`));
                            return;
                        }

                        // Retarget Mixamo/BVH bone names → VRM humanoid bones if requested
                        if (retarget) {
                            for (const anim of animations) {
                                this.retargetClip(anim);
                            }
                        }

                        // Strip spring bone tracks so Verlet physics runs freely on hair/cloth
                        for (const anim of animations) {
                            this.stripSpringBoneTracks(anim);
                        }

                        // Pick the clip whose ORIGINAL name matches the requested name
                        // (case-/separator-insensitive), so loading a multi-clip GLB like
                        // Xbot.glb (agree/idle/walk/run/...) with name "walk" stores the walk
                        // clip — not animations[0]. Falls back to the first clip when nothing
                        // matches (single-clip files, or a custom name).
                        const normName = (s) => String(s || '').replace(/[^a-z0-9]/gi, '').toLowerCase();
                        const wanted = normName(name);
                        const matchIdx = animations.findIndex((a) => normName(a.name) === wanted);
                        const primaryIdx = matchIdx >= 0 ? matchIdx : 0;

                        const primary = animations[primaryIdx];
                        primary.name = name;
                        // Tag clips with metadata for idle clip cycling filter
                        if (tags) primary.userData.tags = tags;
                        if (mood)  primary.userData.mood  = mood;
                        this.clipLibrary[name] = primary;

                        // Store the remaining clips under their own (sanitized) original names
                        // so a multi-clip GLB exposes all of them (e.g. load once, play "run").
                        for (let i = 0; i < animations.length; i++) {
                            if (i === primaryIdx) continue;
                            const extraName = normName(animations[i].name) || `${name}_${i}`;
                            animations[i].name = extraName;
                            if (!(extraName in this.clipLibrary)) this.clipLibrary[extraName] = animations[i];
                        }

                        console.log(`[ClipLayer] Loaded "${name}" (${primary.duration.toFixed(1)}s, ${primary.tracks.length} tracks)`);
                        resolve({
                            name,
                            duration: primary.duration,
                            tracks: primary.tracks.length,
                        });
                    }, undefined, (err) => {
                        console.error(`[ClipLayer] Failed to load ${url}:`, err);
                        reject(err);
                    });
                });
            }

            /**
             * Load a BVH file by fetching it as text and parsing inline.
             *
             * Uses a lightweight BVH parser that extracts rotation channels and
             * converts Euler angles to quaternion tracks. Position channels are
             * extracted for the root bone only.
             *
             * @param {string} url - URL of the .bvh file
             * @param {string} name - Friendly name for the clip
             * @param {boolean} retarget - Whether to retarget bone names
             * @returns {Promise<{name: string, duration: number, tracks: number}>}
             * @private
             */
            async _loadBVH(url, name, retarget) {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to fetch BVH: ${response.status}`);
                const text = await response.text();

                const lines = text.split(/[\r\n]+/g);
                const bones = [];
                let idx = 0;
                const boneStack = [];

                // Parse hierarchy
                while (idx < lines.length && !lines[idx].trim().startsWith('ROOT')) idx++;

                function parseJoints() {
                    while (idx < lines.length) {
                        const line = lines[idx].trim();
                        idx++;
                        if (!line) continue;
                        const tokens = line.split(/\s+/);

                        if (tokens[0] === 'ROOT' || tokens[0] === 'JOINT' || tokens[0] === 'End') {
                            const isEnd = tokens[0] === 'End';
                            const boneName = isEnd
                                ? (boneStack.length > 0 ? boneStack[boneStack.length - 1].name + '_End' : 'End')
                                : tokens[1];
                            const bone = { name: boneName, channels: [], parent: boneStack[boneStack.length - 1] || null };
                            bones.push(bone);
                            boneStack.push(bone);
                        } else if (tokens[0] === 'CHANNELS') {
                            const current = boneStack[boneStack.length - 1];
                            const count = parseInt(tokens[1]);
                            for (let c = 0; c < count; c++) current.channels.push(tokens[c + 2]);
                        } else if (tokens[0] === '}') {
                            boneStack.pop();
                            if (boneStack.length === 0) return;
                        }
                    }
                }
                parseJoints();

                // Parse MOTION
                let frameCount = 0, frameTime = 1/30;
                while (idx < lines.length) {
                    const line = lines[idx].trim(); idx++;
                    if (line.startsWith('Frames:')) frameCount = parseInt(line.split(':')[1]);
                    else if (line.startsWith('Frame Time:')) { frameTime = parseFloat(line.split(':')[1]); break; }
                }
                const motionData = [];
                while (idx < lines.length) {
                    const line = lines[idx].trim(); idx++;
                    if (line) motionData.push(line.split(/\s+/).map(parseFloat));
                }

                // Build quaternion tracks
                const tracks = [];
                const euler = new THREE.Euler();
                const quat = new THREE.Quaternion();

                for (const bone of bones) {
                    if (bone.channels.length === 0) continue;
                    let offset = 0;
                    for (const b of bones) { if (b === bone) break; offset += b.channels.length; }

                    const times = new Float32Array(motionData.length);
                    const rotations = [];
                    const hasRot = bone.channels.some(c => c.includes('rotation'));

                    for (let f = 0; f < motionData.length; f++) {
                        times[f] = f * frameTime;
                        if (!hasRot) continue;
                        let rx = 0, ry = 0, rz = 0;
                        for (let c = 0; c < bone.channels.length; c++) {
                            const ch = bone.channels[c], val = motionData[f][offset + c];
                            if (ch === 'Xrotation') rx = val * Math.PI / 180;
                            else if (ch === 'Yrotation') ry = val * Math.PI / 180;
                            else if (ch === 'Zrotation') rz = val * Math.PI / 180;
                        }
                        const rotOrder = bone.channels.filter(c => c.includes('rotation')).map(c => c[0]).join('') || 'ZYX';
                        euler.set(rx, ry, rz, rotOrder);
                        quat.setFromEuler(euler);
                        rotations.push(quat.x, quat.y, quat.z, quat.w);
                    }

                    if (rotations.length > 0) {
                        tracks.push(new THREE.QuaternionKeyframeTrack(
                            bone.name + '.quaternion', times, new Float32Array(rotations)
                        ));
                    }
                }

                const clip = new THREE.AnimationClip(name, -1, tracks);
                if (retarget) this.retargetClip(clip);
                this.stripSpringBoneTracks(clip);
                this.clipLibrary[name] = clip;

                console.log(`[ClipLayer] Loaded BVH "${name}" (${clip.duration.toFixed(1)}s, ${clip.tracks.length} tracks)`);
                return { name, duration: clip.duration, tracks: clip.tracks.length };
            }

            /**
             * Play a previously loaded clip by name.
             *
             * @param {string} name - Clip name from loadClip()
             * @param {Object} [opts] - Playback options
             * @param {boolean} [opts.loop=false] - Loop the animation
             * @param {number} [opts.fadeIn=0.3] - Crossfade duration in seconds
             * @param {number} [opts.timeScale=1.0] - Playback speed multiplier
             * @param {number} [opts.weight=1.0] - Blend weight (0–1)
             * @returns {boolean} True if playback started
             */
            playClip(name, opts = {}) {
                const sourceClip = this.clipLibrary[name];
                if (!sourceClip) {
                    console.warn(`[ClipLayer] Clip "${name}" not found in library`);
                    return false;
                }

                const {
                    loop = false,
                    fadeIn = 0.3,
                    timeScale = 1.0,
                    weight = 1.0,
                    mask = BoneMaskManager.FULL_BODY,   // Phase C: bone mask (null = all bones)
                    easingFn = 'exponential',           // Phase C: 'linear' | 'exponential' | 'spring'
                    inertialization = true,             // Phase C: use InertializationBlend on transition
                } = opts;

                // Phase C: apply bone mask by filtering clip tracks
                const clip = mask ? BoneMaskManager.filterClip(sourceClip, mask) : sourceClip;

                // Phase C: capture inertialization snapshot BEFORE fading old action
                if (inertialization && this.currentAction) {
                    const allBones = [
                        ...BoneMaskManager.UPPER_BODY,
                        ...BoneMaskManager.LOWER_BODY,
                        'hips',
                    ];
                    this._inertBlend = new InertializationBlend(this.vrm, allBones, 0.12);
                    this._inertBlend.capture();
                }

                // Fade out any currently playing action
                if (this.currentAction) {
                    this.currentAction.fadeOut(fadeIn);
                }

                const action = this.mixer.clipAction(clip);
                action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
                action.clampWhenFinished = !loop;
                action.timeScale = timeScale;
                action.setEffectiveWeight(weight);

                if (easingFn === 'linear') {
                    action.reset().fadeIn(fadeIn).play();
                } else {
                    // Phase C: exponential ease-in instead of Three.js linear crossfade.
                    // Weight ramp is driven manually in update() using spring-based interpolation.
                    action.setEffectiveWeight(0);
                    action.reset().play();
                    this._crossfadeTarget = weight;
                    this._crossfadeElapsed = 0;
                    this._crossfadeDuration = fadeIn;
                    this._crossfadeEasingFn = easingFn;
                }

                this.currentAction = action;
                this.isPlaying = true;

                // Listen for clip completion (non-looping only)
                if (!loop) {
                    const onFinished = (e) => {
                        if (e.action === action) {
