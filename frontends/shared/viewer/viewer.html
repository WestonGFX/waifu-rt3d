                        console.log(`[Viewer] Collider debug ON: ${_colliderDebugMeshes.length} colliders`);
                    } else {
                        // Remove debug meshes
                        for (const { mesh, parent } of _colliderDebugMeshes) {
                            parent.remove(mesh);
                            mesh.geometry.dispose();
                            mesh.material.dispose();
                        }
                        _colliderDebugMeshes = [];
                        console.log('[Viewer] Collider debug OFF');
                    }
                    window.parent.postMessage({ type: 'colliderDebugState', active: _colliderDebugActive }, '*');
                }
                // ── Jiggle Physics API ──────────────────────────────
                else if (type === 'setJiggleEnabled') {
                    if (!jiggleManager) return;
                    jiggleManager.enabled = !!payload?.enabled;
                    if (currentVrm) {
                        if (jiggleManager.enabled) {
                            jiggleManager.saveOriginalParams(currentVrm);
                            jiggleManager.applyParams(currentVrm);
                        } else {
                            jiggleManager.restoreOriginalParams(currentVrm);
                        }
                    }
                }
                else if (type === 'setJiggleIntensity') {
                    // payload: { intensity: 0-1, bodyPart?: 'breast'|'butt'|'thigh' }
                    if (!jiggleManager) return;
                    if (payload?.bodyPart && payload.bodyPart in jiggleManager.bodyPartIntensity) {
                        jiggleManager.bodyPartIntensity[payload.bodyPart] = payload.intensity ?? 0.5;
                    } else {
                        jiggleManager.intensity = payload?.intensity ?? 0.5;
                    }
                    if (jiggleManager.enabled && currentVrm) jiggleManager.applyParams(currentVrm);
                }
                else if (type === 'setJigglePreset') {
                    // payload: { preset: 'subtle'|'natural'|'anime'|'bouncy'|'extreme' }
                    if (!jiggleManager) return;
                    jiggleManager.preset = payload?.preset || 'subtle';
                    if (jiggleManager.enabled && currentVrm) jiggleManager.applyParams(currentVrm);
                }
                else if (type === 'setJiggleProfile') {
                    // payload: { breast?: {...}, butt?: {...}, thigh?: {...} } direct param overrides
                    if (!jiggleManager) return;
                    if (payload?.breast) jiggleManager._customBreast = payload.breast;
                    if (payload?.butt)   jiggleManager._customButt   = payload.butt;
                    if (payload?.thigh)  jiggleManager._customThigh  = payload.thigh;
                    if (jiggleManager.enabled && currentVrm) jiggleManager.applyParams(currentVrm);
                }
                else if (type === 'getJiggleInfo') {
                    if (!jiggleManager) {
                        window.parent.postMessage({ type: 'jiggleInfo', enabled: false, detected: { breast: 0, butt: 0, thigh: 0 } }, '*');
                        return;
                    }
                    window.parent.postMessage({
                        type: 'jiggleInfo',
                        enabled: jiggleManager.enabled,
                        preset:  jiggleManager.preset,
                        intensity: jiggleManager.intensity,
                        bodyPartIntensity: { ...jiggleManager.bodyPartIntensity },
                        detected: {
                            breast: jiggleManager.bodyPartJoints.breast.length,
                            butt:   jiggleManager.bodyPartJoints.butt.length,
                            thigh:  jiggleManager.bodyPartJoints.thigh.length,
                        },
                    }, '*');
                }
                else if (type === 'setJiggleEmotionMultiplier') {
                    if (!jiggleManager) return;
                    jiggleManager.emotionMultiplier = payload?.multiplier ?? 1.0;
                    if (jiggleManager.enabled && currentVrm) jiggleManager.applyParams(currentVrm);
                }
                else if (type === 'setJiggleMovementMultiplier') {
                    if (!jiggleManager) return;
                    jiggleManager.movementMultiplier = payload?.multiplier ?? 1.0;
                    if (jiggleManager.enabled && currentVrm) jiggleManager.applyParams(currentVrm);
                }
                else if (type === 'showFpsOverlay') {
                    // Toggle the in-viewport FPS counter overlay.
                    // Does NOT require VRM to be loaded — FPS counter runs regardless.
                    const fpsEl = document.getElementById('fps-overlay');
                    if (fpsEl) {
                        fpsEl.style.display = payload?.visible ? 'block' : 'none';
                    }
                }
                else if (type === 'setFpsTarget') {
                    // Set the render loop FPS cap. 0 = unlimited.
                    // Converts "30"/"60"/"120"/"Unlimited" labels to millisecond intervals.
                    const target = payload?.fps;
                    if (!target || target === 'Unlimited' || target === 0) {
                        _fpsTargetMs = 0;  // unlimited
                    } else {
                        _fpsTargetMs = 1000 / Number(target);
                    }
                    _fpsLastRenderTime = 0;  // reset so next frame renders immediately
                }
                else if (type === 'setDiscoMode') {
                    // Party/disco lighting (#25): cycle RGB point lights hue on beat.
                    _discoActive = !!payload?.enabled;
                    const intensity = _discoActive ? 1.2 : 0;
                    discoLights.forEach(l => { l.intensity = intensity; });
                    if (!_discoActive) {
                        // Restore neutral ambient on disco off
                        ambientLight.intensity = 0.8;
                        ambientLight.color.set(0xffffff);
                    } else {
                        ambientLight.intensity = 0.3; // dim base to let colours pop
                    }
                }
                else if (type === 'setRenderQuality') {
                    // Pixel ratio control: Low=1, Medium=1.5, High=native, Ultra=2x
                    const q = payload?.quality || 'High (Native)';
                    const ratioMap = {
                        'Low (1x)': 1,
                        'Medium (1.5x)': 1.5,
                        'High (Native)': window.devicePixelRatio,
                        'Ultra (2x)': Math.max(2, window.devicePixelRatio)
                    };
                    const ratio = ratioMap[q] || window.devicePixelRatio;
                    renderer.setPixelRatio(ratio);
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    console.log(`[Viewer] Render quality: ${q} (pixel ratio: ${ratio})`);
                }
                else if (type === 'setShadowQuality') {
                    // Shadow quality toggle (#26): Off / Soft / Sharp
                    const q = payload?.quality || 'off';
                    if (q === 'off') {
                        renderer.shadowMap.enabled = false;
                        keyLight.castShadow = false;
                    } else {
                        renderer.shadowMap.enabled = true;
                        keyLight.castShadow = true;
                        renderer.shadowMap.type = q === 'sharp'
                            ? THREE.BasicShadowMap
                            : THREE.PCFSoftShadowMap;
                        keyLight.shadow.mapSize.width  = 1024;
                        keyLight.shadow.mapSize.height = 1024;
                    }
                }

                // Phase 12-P3: Camera preset commands
                else if (type === 'cameraPreset') {
                    if (controls) {
                        controls.goToPreset(payload?.preset || 'fullbody', payload?.duration || 600);
                    }
                }

            });

            // Phase 12-P3: Touch/poke detection on character
            renderer.domElement.addEventListener('click', _onCharacterTouch);

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });

            // Belt-and-suspenders: watch the canvas element directly so that
            // panel width changes driven by CSS (Framer Motion animate width)
            // still resize the renderer + camera even if window.resize fires
            // before the layout finishes — the most likely cause of the
            // "character clips to right in narrow panel" regression.
            new ResizeObserver(([entry]) => {
                const w = entry.contentRect.width;
                const h = entry.contentRect.height;
                if (w < 1 || h < 1) return;
                renderer.setSize(w, h, false); // false = don't update CSS (already sized by CSS)
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                composer.setSize(w, h);
            }).observe(canvas);
        }
        init();
    </script>

    <!-- Fix 8: Camera controls HUD — shown in bottom-left, fades in on canvas hover.
         pointer-events:none keeps it from blocking orbit/zoom/pan interactions. -->
    <style>
        #camera-hud {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            font-family: monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
            transition: color 0.3s;
        }
        #camera-hud:hover {
            color: rgba(255, 255, 255, 0.55);
        }
        .hud-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-row kbd {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            padding: 0 4px;
            font-family: monospace;
            font-size: 9px;
            min-width: 48px;
            text-align: center;
        }
    </style>
    <div id="camera-hud">
        <div class="hud-row"><kbd>L-Drag</kbd> Orbit</div>
        <div class="hud-row"><kbd>Scroll</kbd> Zoom</div>
        <div class="hud-row"><kbd>R-Drag</kbd> Pan</div>
        <div class="hud-row"><kbd>Dbl-click</kbd> Reset</div>
    </div>
</body>

</html>
