        const LIGHT_PRESETS = {
            studio: {
                key: { color: 0xffffff, intensity: 1.5, position: [1, 2, 3] },
                fill: { color: 0xffffff, intensity: 0.5, position: [-1, 1, -2] },
                ambient: { color: 0xffffff, intensity: 0.8 }
            },
            warm_sunset: {
                key: { color: 0xffaa44, intensity: 1.8, position: [2, 1, 1] },
                fill: { color: 0xff6633, intensity: 0.4, position: [-2, 0.5, -1] },
                ambient: { color: 0xffddbb, intensity: 0.6 }
            },
            cool_moonlight: {
                key: { color: 0x6688ff, intensity: 1.2, position: [-1, 3, 2] },
                fill: { color: 0x4466cc, intensity: 0.3, position: [1, 0.5, -1] },
                ambient: { color: 0x334488, intensity: 0.5 }
            },
            dramatic: {
                key: { color: 0xff0044, intensity: 2.0, position: [3, 2, 0] },
                fill: { color: 0x0044ff, intensity: 0.6, position: [-3, 1, 0] },
                ambient: { color: 0x111122, intensity: 0.3 }
            },
            neon: {
                key: { color: 0x00ffcc, intensity: 1.6, position: [1, 2, 2] },
                fill: { color: 0xff00ff, intensity: 0.8, position: [-1, 1, -1] },
                ambient: { color: 0x220033, intensity: 0.4 }
            }
        };

        // ══════════════════════════════════════════════════════════
        // Emotion → Auto-Gesture
        // ══════════════════════════════════════════════════════════

        /**
         * Maps emotion names to candidate gesture(s) triggered automatically
         * when the character's emotion changes. Arrays are randomly sampled
         * so the character doesn't always use the same motion for the same feeling.
         * Emotions absent from the map (e.g. 'angry', 'neutral') trigger nothing —
         * stillness is intentional for those states.
         */
        // Only head/body gestures — NO arm movement in auto-gestures.
        // Arm gestures (wave, clap, celebrate, etc.) are still available for
        // explicit AI-triggered playGesture() calls via postMessage.
        const EMOTION_GESTURE_MAP = {
            happy:     ['nod'],
            excited:   ['nod'],
            sad:       ['shy'],
            surprised: ['tilt'],
            thinking:  ['tilt'],
            confused:  ['tilt'],
        };

        /**
         * Conditionally play a contextual gesture when the character's emotion changes.
         *
         * Guards (all must pass):
         *   1. Emotion changed from last auto-gesture trigger — prevents re-firing
         *   2. No gesture currently playing — avoids interrupting in-progress animation
         *   3. 40% random chance — keeps gestures spontaneous, not mechanical every message
         *   4. Emotion has an entry in EMOTION_GESTURE_MAP
         *
         * @param {string|null} emotion - Incoming emotion name from setEmotion/setExpression
         */
        function _triggerAutoGesture(emotion) {
            const gl = animationDirector?.getLayer('gesture');
            if (!emotion || !gl) return;
            if (emotion === lastAutoGestureEmotion) return;  // dedup
            if (gl.isPlaying) return;                         // don't interrupt
            if (Math.random() > 0.2) return;                  // 20% chance
            const candidates = EMOTION_GESTURE_MAP[emotion];
            if (!candidates || candidates.length === 0) return;
            lastAutoGestureEmotion = emotion;
            const gesture = candidates[Math.floor(Math.random() * candidates.length)];
            gl.playGesture(gesture);
            console.log(`[Viewer] Auto-gesture: ${emotion} → ${gesture}`);
        }

        // ─────────────────────────────────────────────────────────────
        // AnimationRegistry — clip-based animation lookup tables
        // ─────────────────────────────────────────────────────────────

        /**
         * Registry that maps emotions and categories to pre-recorded animation clips.
         * Loaded from the animation manifest (/api/animations), it enables clip-based
         * animation as the primary source — falling back to procedural gestures when
         * no matching clips are available.
         */
        class AnimationRegistry {
            constructor() {
                /** @type {Map<string, Object>} clip_id → clip metadata */
                this.clips = new Map();
                /** @type {Map<string, string[]>} emotion → [clip_id, ...] */
                this.emotionIndex = new Map();
                /** @type {Map<string, string[]>} category → [clip_id, ...] */
                this.categoryIndex = new Map();
                /** @type {boolean} Whether any clips are loaded */
                this.loaded = false;
            }

            /**
             * Load clips from a manifest response (from /api/animations).
             * @param {Object} manifest - The manifest JSON with packs and clips
             */
            loadManifest(manifest) {
                this.clips.clear();
                this.emotionIndex.clear();
                this.categoryIndex.clear();

                for (const pack of (manifest.packs || [])) {
                    for (const clip of (pack.clips || [])) {
                        if (!clip.available) continue;  // Skip clips not on disk

                        const meta = { ...clip, packId: pack.id, packName: pack.name };
                        this.clips.set(clip.id, meta);

                        // Index by emotion
                        for (const emo of (clip.emotions || [])) {
                            if (!this.emotionIndex.has(emo)) this.emotionIndex.set(emo, []);
                            this.emotionIndex.get(emo).push(clip.id);
                        }

                        // Index by category
                        const cat = clip.category || 'custom';
                        if (!this.categoryIndex.has(cat)) this.categoryIndex.set(cat, []);
                        this.categoryIndex.get(cat).push(clip.id);
                    }
                }

                this.loaded = this.clips.size > 0;
                console.log(`[AnimationRegistry] Loaded ${this.clips.size} clips (${this.emotionIndex.size} emotions, ${this.categoryIndex.size} categories)`);
            }

            /**
             * Get clip metadata matching an emotion.
             * @param {string} emotion - Emotion name
             * @returns {Object[]} Array of clip metadata, randomly shuffled
             */
            getClipsForEmotion(emotion) {
                const ids = this.emotionIndex.get(emotion) || [];
                const clips = ids.map(id => this.clips.get(id)).filter(Boolean);
                // Fisher-Yates shuffle
                for (let i = clips.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [clips[i], clips[j]] = [clips[j], clips[i]];
                }
                return clips;
            }

            /**
             * Get all clips in a category.
             * @param {string} category - Category name (idle, emotion, reaction, fidget, custom)
             * @returns {Object[]} Array of clip metadata
             */
            getClipsByCategory(category) {
                const ids = this.categoryIndex.get(category) || [];
                return ids.map(id => this.clips.get(id)).filter(Boolean);
            }

            /**
             * Pick a random idle variant.
             * @returns {Object|null} Random idle clip metadata, or null if none available
             */
            pickIdleVariant() {
                const idles = this.getClipsByCategory('idle');
                return idles.length > 0 ? idles[Math.floor(Math.random() * idles.length)] : null;
            }
        }

        /** Global animation registry instance */
        const animationRegistry = new AnimationRegistry();

        /**
         * Trigger animation from clip library OR fall back to procedural gesture.
         *
         * Priority:
         *   1. Check AnimationRegistry for clips matching current emotion (40% chance)
         *   2. If no clips found, fall back to procedural GestureLayer (20% chance)
         *
         * @param {string|null} emotion - Incoming emotion from setEmotion/setExpression
         */
        function _triggerAutoAnimation(emotion) {
            if (!emotion || !animationDirector) return;
            if (emotion === lastAutoGestureEmotion) return;  // dedup

            const cl = animationDirector.getLayer('clip');
            const gl = animationDirector.getLayer('gesture');

            // Don't interrupt running animations
            if (cl?.isPlaying || gl?.isPlaying) return;

            // 1. Try clip-based animation (40% chance when clips available)
            if (animationRegistry.loaded && cl) {
                const candidates = animationRegistry.getClipsForEmotion(emotion);
                if (candidates.length > 0 && Math.random() <= 0.4) {
                    const clip = candidates[0];
                    lastAutoGestureEmotion = emotion;

                    // Lazy-load the clip if not already in the library
                    if (cl.clipLibrary[clip.id]) {
                        cl.playClip(clip.id, { loop: clip.loop || false, fadeIn: 0.4 });
                        console.log(`[Viewer] Auto-animation (clip): ${emotion} → ${clip.name}`);
                    } else {
                        // Async load + play
                        cl.loadClip(clip.url, clip.id, { retarget: true }).then(() => {
                            cl.playClip(clip.id, { loop: clip.loop || false, fadeIn: 0.4 });
                            console.log(`[Viewer] Auto-animation (lazy-loaded clip): ${emotion} → ${clip.name}`);
                        }).catch(err => {
                            console.warn(`[Viewer] Clip load failed for ${clip.id}, falling back to gesture:`, err);
                            _triggerAutoGesture(emotion);
                        });
                    }
                    return;
                }
            }

            // 2. Fall back to procedural gesture (20% chance — original behavior)
            _triggerAutoGesture(emotion);
        }

        // ══════════════════════════════════════════════════════════
        // Main Init
        // ══════════════════════════════════════════════════════════

        /**
         * Frame data stored after a VRM model loads so camera presets can
         * compute positions relative to the actual model size.
         * @type {{targetY: number, camZ: number, modelHeight: number, headY: number, faceY: number}|null}
         */
        let _vrmFrameData = null;

        async function init() {
            const canvas = document.getElementById('c');
            const bgVideo = document.getElementById('bg-video');

            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                alpha: true,
                preserveDrawingBuffer: true   // Required for screenshot toDataURL()
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Three.js r150+: outputEncoding → outputColorSpace
            if ('outputColorSpace' in renderer) {
                renderer.outputColorSpace = THREE.SRGBColorSpace;
            } else {
                renderer.outputEncoding = THREE.sRGBEncoding;
            }

            const scene = new THREE.Scene();
            // Default dark background so VRM is visible against the UI
            // (transparent renders as invisible on the dark cyberpunk layout)
            scene.background = new THREE.Color(0x0a0b14);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.25, 1.5);

            // Orbit controls
            const controls = new SimpleOrbitControls(camera, canvas);

            // ── Cinematic tone mapping (ACESFilmic gives the "film" look) ──────────
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;

            // ── 3-point lighting rig ────────────────────────────────────────────────
            // Key light: warm (3200K), upper-right-front — the main light source
            const keyLight = new THREE.DirectionalLight(0xfff4e0, 1.6);
            keyLight.position.set(1.5, 3, 2);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width  = 1024;
            keyLight.shadow.mapSize.height = 1024;
            keyLight.shadow.camera.near   = 0.5;
            keyLight.shadow.camera.far    = 20;
            keyLight.shadow.radius        = 4;        // PCFSoft blur radius
            // Fill light: cool (7000K), left-front — opens shadows without flattening
            const fillLight = new THREE.DirectionalLight(0xd0e8ff, 0.55);
            fillLight.position.set(-2, 1, 2);
            // Rim light: neutral-white, from behind — separates character from background
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.75);
            rimLight.position.set(0, 2.5, -3);
            // Ambient: reduced so lights have actual contrast
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(keyLight, fillLight, rimLight, ambientLight);

            // Soft shadows (PCFSoftShadowMap blurs shadow edges naturally)
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Disco / party lighting (#25): three RGB point lights, hidden by default.
            // Hue cycles at different speeds when disco mode is active.
            const discoLights = [
                new THREE.PointLight(0xff0000, 0, 4),
                new THREE.PointLight(0x00ff00, 0, 4),
                new THREE.PointLight(0x0000ff, 0, 4),
            ];
            discoLights[0].position.set( 1.5, 2.0,  1.0);
            discoLights[1].position.set(-1.5, 1.5,  0.5);
            discoLights[2].position.set( 0.0, 2.5, -1.0);
            discoLights.forEach(l => scene.add(l));
            let _discoActive = false;
            let _discoTime   = 0;

            /**
             * Apply a lighting configuration to the scene.
             * @param {Object} config - Lighting config with key/fill/ambient properties
             */
            function setLighting(config) {
                if (config.key) {
                    if (config.key.color !== undefined) keyLight.color.set(config.key.color);
                    if (config.key.intensity !== undefined) keyLight.intensity = config.key.intensity;
                    if (config.key.position) keyLight.position.fromArray(config.key.position);
                }
                if (config.fill) {
                    if (config.fill.color !== undefined) fillLight.color.set(config.fill.color);
                    if (config.fill.intensity !== undefined) fillLight.intensity = config.fill.intensity;
                    if (config.fill.position) fillLight.position.fromArray(config.fill.position);
                }
                if (config.ambient) {
                    if (config.ambient.color !== undefined) ambientLight.color.set(config.ambient.color);
                    if (config.ambient.intensity !== undefined) ambientLight.intensity = config.ambient.intensity;
                }
                console.log('[Viewer] Lighting updated');
            }

            // ══════════════════════════════════════════════════════════
            // Phase 5: Post-Processing Pipeline (EffectComposer)
            // ══════════════════════════════════════════════════════════

            /**
             * EffectComposer-based post-processing pipeline.
             * When _effectsEnabled is false, the renderer renders directly to screen
             * (zero overhead). When true, the composer chain applies active passes.
             *
             * Available effects:
             * - Bloom (UnrealBloomPass): eye highlights, magical glow
             * - Color grading (custom ShaderPass): tone adjustment via uniforms
             *
             * All effects are configurable via the `setEffects` postMessage command.
             */
            let _effectsEnabled = false;
            const _effectsConfig = {
                bloom: { enabled: false, strength: 0.3, radius: 0.4, threshold: 0.85 },
                colorGrade: { enabled: false, brightness: 0, contrast: 0, saturation: 0 },
                animeOutline: { enabled: false, thickness: 1.5, color: 0x000000, opacity: 0.85 },
                emotionColorGrade: { enabled: false },
                emotionGradient: { enabled: false },
                emotionAmbient: { enabled: false },
            };

            // ── Phase 12-P4: Emotion Color Grading ──────────────────────
            /**
             * Emotion-to-color-grade presets. When emotionColorGrade is enabled,
             * the colorGradePass uniforms auto-lerp to these targets on each
             * setExpression event. Values are deltas (0 = no change).
             */
            const EMOTION_COLOR_GRADES = {
                neutral:   { brightness: 0,      contrast: 0,     saturation: 0     },
                happy:     { brightness: 0.04,   contrast: 0.05,  saturation: 0.2   },
                excited:   { brightness: 0.05,   contrast: 0.08,  saturation: 0.15  },
                sad:       { brightness: -0.04,  contrast: 0.08,  saturation: -0.15 },
                angry:     { brightness: -0.02,  contrast: 0.15,  saturation: 0.1   },
                love:      { brightness: 0.03,   contrast: 0.0,   saturation: 0.25  },
                flirty:    { brightness: 0.02,   contrast: 0.0,   saturation: 0.2   },
                surprised: { brightness: 0.02,   contrast: 0.1,   saturation: 0.05  },
                proud:     { brightness: 0.03,   contrast: 0.06,  saturation: 0.12  },
                awe:       { brightness: 0.04,   contrast: 0.04,  saturation: 0.18  },
                worried:   { brightness: -0.03,  contrast: 0.06,  saturation: -0.08 },
            };
            let _emotionGradeFrom = { brightness: 0, contrast: 0, saturation: 0 };
            let _emotionGradeTo = { brightness: 0, contrast: 0, saturation: 0 };
            let _emotionGradeProgress = 1.0; // 1.0 = arrived at target
            const _EMOTION_GRADE_DURATION = 0.5; // seconds

            /**
             * Begin a smooth transition of the color grade toward the given emotion preset.
             *
             * @param {string} emotion - Emotion name (must exist in EMOTION_COLOR_GRADES)
             */
            function applyEmotionColorGrade(emotion) {
                if (!_effectsConfig.emotionColorGrade.enabled) return;
                const target = EMOTION_COLOR_GRADES[emotion] || EMOTION_COLOR_GRADES.neutral;
                // Snapshot current values as the lerp origin
                _emotionGradeFrom.brightness = colorGradePass.uniforms.brightness.value;
                _emotionGradeFrom.contrast = colorGradePass.uniforms.contrast.value;
                _emotionGradeFrom.saturation = colorGradePass.uniforms.saturation.value;
                _emotionGradeTo = { ...target };
                _emotionGradeProgress = 0;
                // Auto-enable the pass so the effect is visible
                colorGradePass.enabled = true;
                _effectsEnabled = true;
            }

            /**
             * Per-frame update for emotion-driven color grade lerp.
             * Called from animate() when emotionColorGrade is enabled.
             *
             * @param {number} dt - Delta time in seconds
             */
            function updateEmotionColorGrade(dt) {
                if (_emotionGradeProgress >= 1.0) return;
                _emotionGradeProgress = Math.min(1.0, _emotionGradeProgress + dt / _EMOTION_GRADE_DURATION);
                // smoothstep easing: t²(3 - 2t)
                const t = _emotionGradeProgress;
                const ease = t * t * (3 - 2 * t);
                colorGradePass.uniforms.brightness.value = _emotionGradeFrom.brightness + (_emotionGradeTo.brightness - _emotionGradeFrom.brightness) * ease;
                colorGradePass.uniforms.contrast.value = _emotionGradeFrom.contrast + (_emotionGradeTo.contrast - _emotionGradeFrom.contrast) * ease;
                colorGradePass.uniforms.saturation.value = _emotionGradeFrom.saturation + (_emotionGradeTo.saturation - _emotionGradeFrom.saturation) * ease;
            }

            // Build EffectComposer
            const composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Bloom pass (UnrealBloomPass)
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                _effectsConfig.bloom.strength,
                _effectsConfig.bloom.radius,
                _effectsConfig.bloom.threshold
            );
            bloomPass.enabled = false;
            composer.addPass(bloomPass);

            // Color grading pass — simple brightness/contrast/saturation shader
            const colorGradeShader = {
                uniforms: {
                    tDiffuse: { value: null },
                    brightness: { value: 0.0 },
                    contrast: { value: 0.0 },
                    saturation: { value: 0.0 },
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float brightness;
                    uniform float contrast;
                    uniform float saturation;
                    varying vec2 vUv;

                    void main() {
                        vec4 tex = texture2D(tDiffuse, vUv);
                        // Brightness
                        vec3 color = tex.rgb + vec3(brightness);
                        // Contrast
                        color = (color - 0.5) * (1.0 + contrast) + 0.5;
                        // Saturation
                        float gray = dot(color, vec3(0.299, 0.587, 0.114));
                        color = mix(vec3(gray), color, 1.0 + saturation);
                        gl_FragColor = vec4(clamp(color, 0.0, 1.0), tex.a);
                    }
                `,
            };
            const colorGradePass = new ShaderPass(colorGradeShader);
            colorGradePass.enabled = false;
            composer.addPass(colorGradePass);

            /**
             * Update post-processing pipeline from configuration.
             * Called by the setEffects postMessage handler.
             *
             * @param {Object} config - Partial effects config to merge
             */
            function updateEffects(config) {
                if (config.bloom !== undefined) {
                    Object.assign(_effectsConfig.bloom, config.bloom);
                    bloomPass.enabled = _effectsConfig.bloom.enabled;
                    bloomPass.strength = _effectsConfig.bloom.strength;
                    bloomPass.radius = _effectsConfig.bloom.radius;
                    bloomPass.threshold = _effectsConfig.bloom.threshold;
                }
                if (config.colorGrade !== undefined) {
                    Object.assign(_effectsConfig.colorGrade, config.colorGrade);
                    colorGradePass.enabled = _effectsConfig.colorGrade.enabled;
                    colorGradePass.uniforms.brightness.value = _effectsConfig.colorGrade.brightness;
                    colorGradePass.uniforms.contrast.value = _effectsConfig.colorGrade.contrast;
                    colorGradePass.uniforms.saturation.value = _effectsConfig.colorGrade.saturation;
                }
                if (config.emotionColorGrade !== undefined) {
                    Object.assign(_effectsConfig.emotionColorGrade, config.emotionColorGrade);
                    // When disabling, reset color grade to neutral
                    if (!_effectsConfig.emotionColorGrade.enabled) {
                        _emotionGradeProgress = 1.0;
                        colorGradePass.uniforms.brightness.value = 0;
                        colorGradePass.uniforms.contrast.value = 0;
                        colorGradePass.uniforms.saturation.value = 0;
                        // Only disable the pass if manual color grade is also off
                        if (!_effectsConfig.colorGrade.enabled) {
                            colorGradePass.enabled = false;
                        }
                    }
                }
                if (config.emotionGradient !== undefined) {
                    Object.assign(_effectsConfig.emotionGradient, config.emotionGradient);
                }
                if (config.emotionAmbient !== undefined) {
                    Object.assign(_effectsConfig.emotionAmbient, config.emotionAmbient);
                }
                // Enable composer only if at least one pass is active
                _effectsEnabled = bloomPass.enabled || colorGradePass.enabled;
                console.log('[Viewer] Effects updated:', _effectsConfig, 'composer:', _effectsEnabled);
            }

            // Handle window resize for composer
            const _origOnResize = window.onresize;
            window.addEventListener('resize', () => {
                composer.setSize(window.innerWidth, window.innerHeight);
            });

            // ══════════════════════════════════════════════════════════
            // Phase 5: Particle System
            // ══════════════════════════════════════════════════════════

            /**
             * GPU-instanced particle system for ambient and emotion-reactive effects.
             *
             * Uses THREE.InstancedMesh for efficient rendering of up to 500 particles.
             * Each particle has position, velocity, lifetime, opacity, and color.
             *
             * Particle types:
             * - Ambient: sakura petals, dust motes, snow (continuous, long lifetime)
             * - Emotion-reactive: hearts, sparkles, anger marks (burst, short lifetime)
             */
            const PARTICLE_BUDGET = 500;
            const _particles = [];
            let _ambientType = null;   // 'sakura' | 'dust' | 'snow' | null
            let _emotionParticlesEnabled = true;

            // Shared particle mesh (small quads)
            const particleGeom = new THREE.PlaneGeometry(0.04, 0.04);
            const particleMat = new THREE.MeshBasicMaterial({
                color: 0xffb7c5,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide,
                depthWrite: false,
            });
            const particleGroup = new THREE.Group();
            particleGroup.name = 'particleSystem';
            scene.add(particleGroup);

            /**
             * Spawn a burst of particles at a position.
             *
             * @param {Object} opts - Particle options
             * @param {string} opts.type - 'heart' | 'sparkle' | 'anger' | 'sakura' | 'dust' | 'snow'
             * @param {number} [opts.count=5] - Number of particles to spawn
             * @param {THREE.Vector3} [opts.origin] - Spawn position (defaults to model center)
             * @param {number} [opts.color] - Override color (hex)
             */
            function spawnParticles(opts = {}) {
                const type = opts.type || 'sparkle';
                const count = Math.min(opts.count || 5, PARTICLE_BUDGET - _particles.length);
                if (count <= 0) return;

                const origin = opts.origin || new THREE.Vector3(0, 1.3, 0.3);

                // Color and shape by type
                const typeConfigs = {
                    heart:    { color: 0xff4488, scale: 0.06,  lifetime: 2.0, speed: 0.3,  gravity: -0.05 },
                    sparkle:  { color: 0xffd700, scale: 0.03,  lifetime: 1.5, speed: 0.5,  gravity: 0.0 },
                    anger:    { color: 0xff2222, scale: 0.05,  lifetime: 1.0, speed: 0.8,  gravity: 0.0 },
                    sakura:   { color: 0xffb7c5, scale: 0.04,  lifetime: 5.0, speed: 0.15, gravity: -0.15 },
                    dust:     { color: 0xdddddd, scale: 0.015, lifetime: 6.0, speed: 0.05, gravity: 0.0 },
                    snow:     { color: 0xffffff, scale: 0.025, lifetime: 6.0, speed: 0.08, gravity: -0.1 },
                    // Phase 12-P4: New particle types
                    rain:     { color: 0x88bbee, scale: 0.008, lifetime: 2.0, speed: 1.2,  gravity: -2.0, scaleY: 4.0 },
                    embers:   { color: 0xff6622, scale: 0.02,  lifetime: 3.0, speed: 0.2,  gravity: 0.15, additive: true },
                    firefly:  { color: 0xccff44, scale: 0.015, lifetime: 4.0, speed: 0.08, gravity: 0.0, pulse: true },
                    confetti: { color: 0xff44ff, scale: 0.035, lifetime: 3.5, speed: 0.4,  gravity: -0.3, multicolor: true },
                };
                const cfg = typeConfigs[type] || typeConfigs.sparkle;
                const color = opts.color ?? cfg.color;

                for (let i = 0; i < count; i++) {
                    const mesh = new THREE.Mesh(particleGeom, particleMat.clone());
                    // Multicolor: randomize hue for confetti-style variety
                    if (cfg.multicolor) {
                        mesh.material.color.setHSL(Math.random(), 0.8, 0.6);
                    } else {
                        mesh.material.color.set(color);
                    }
                    mesh.material.opacity = 0.9;
                    // Additive blending for glowing particles (embers, etc.)
                    if (cfg.additive) {
                        mesh.material.blending = THREE.AdditiveBlending;
                    }

                    // Random offset from origin
                    mesh.position.set(
                        origin.x + (Math.random() - 0.5) * 0.6,
                        origin.y + (Math.random() - 0.5) * 0.4,
                        origin.z + (Math.random() - 0.5) * 0.3
                    );

                    const scale = cfg.scale * (0.7 + Math.random() * 0.6);
                    // Elongated particles (rain streaks)
                    if (cfg.scaleY) {
                        mesh.scale.set(scale, scale * cfg.scaleY, scale);
                    } else {
                        mesh.scale.setScalar(scale);
                    }

                    // Random velocity
                    const vx = (Math.random() - 0.5) * cfg.speed;
                    const vy = (Math.random() - 0.3) * cfg.speed;
                    const vz = (Math.random() - 0.5) * cfg.speed * 0.5;

                    particleGroup.add(mesh);
                    _particles.push({
                        mesh,
                        velocity: new THREE.Vector3(vx, vy, vz),
                        lifetime: cfg.lifetime,
                        maxLifetime: cfg.lifetime,
                        gravity: cfg.gravity,
                        rotSpeed: (Math.random() - 0.5) * 3,
                        pulse: cfg.pulse || false,
                        age: 0,
                    });
                }
            }

            /**
             * Update all active particles. Called once per frame from animate().
             * Removes particles whose lifetime has expired.
             *
             * @param {number} dt - Delta time in seconds
             */
            function updateParticles(dt) {
                for (let i = _particles.length - 1; i >= 0; i--) {
                    const p = _particles[i];
                    p.lifetime -= dt;

                    if (p.lifetime <= 0) {
                        particleGroup.remove(p.mesh);
                        p.mesh.material.dispose();
                        _particles.splice(i, 1);
                        continue;
                    }

                    // Apply wind force to particles
                    if (_windForce.strength > 0) {
                        p.velocity.x += _windForce.x * _windForce.strength * dt * 0.3;
                        p.velocity.z += _windForce.z * _windForce.strength * dt * 0.3;
                    }

                    // Apply gravity and velocity
                    p.velocity.y += p.gravity * dt;
                    p.mesh.position.addScaledVector(p.velocity, dt);

                    // Rotation
                    p.mesh.rotation.z += p.rotSpeed * dt;

                    // Track age for pulsing effects
                    p.age += dt;

                    // Fade out in last 30% of lifetime
                    const lifeFrac = p.lifetime / p.maxLifetime;
                    let opacity = lifeFrac < 0.3 ? lifeFrac / 0.3 * 0.9 : 0.9;
                    // Firefly pulsing: modulate opacity with sine wave
                    if (p.pulse) {
                        opacity *= 0.4 + 0.6 * Math.abs(Math.sin(p.age * 3.0));
                    }
                    p.mesh.material.opacity = opacity;
                }

                // Ambient spawning: continuously add particles if type is set
                if (_ambientType && _particles.length < PARTICLE_BUDGET * 0.8) {
                    // Spawn 1-2 particles per second
                    if (Math.random() < dt * 2) {
                        spawnParticles({
                            type: _ambientType,
                            count: 1,
                            origin: new THREE.Vector3(
                                (Math.random() - 0.5) * 2,
                                2.0 + Math.random() * 0.5,
                                (Math.random() - 0.5) * 1,
                            ),
                        });
                    }
                }
            }

            /** Clear all active particles from the scene. */
            function clearAllParticles() {
                for (const p of _particles) {
                    particleGroup.remove(p.mesh);
                    p.mesh.material.dispose();
                }
                _particles.length = 0;
            }

            /**
             * Auto-trigger emotion-reactive particles.
             * Called internally when setExpression fires for an emotion that maps
             * to a particle type.
             *
             * @param {string} emotion - The emotion name (happy, love, angry, etc.)
             */
            function triggerEmotionParticles(emotion) {
                if (!_emotionParticlesEnabled) return;
                const map = {
                    happy: { type: 'sparkle', count: 5 },
                    excited: { type: 'sparkle', count: 8 },
                    love: { type: 'heart', count: 5 },
                    flirty: { type: 'heart', count: 3 },
                    angry: { type: 'anger', count: 3 },
                    proud: { type: 'sparkle', count: 4 },
                    awe: { type: 'sparkle', count: 6 },
                };
                const cfg = map[emotion];
                if (cfg) spawnParticles(cfg);
            }

            /**
             * Set the ambient particle type. Pass null to disable.
             *
             * @param {string|null} type - 'sakura' | 'dust' | 'snow' | null
             */
            function setAmbientParticles(type) {
                _ambientType = type;
                if (!type) clearAllParticles();
                console.log('[Viewer] Ambient particles:', type);
            }

            // ── Phase 12-P4: Emotion Ambient Particle Mapping ───────────
            /**
             * Maps emotions to ambient particle types for continuous atmosphere.
             * When emotionAmbient is enabled, changing the expression also
             * switches the ambient particle type.
             */
            const EMOTION_AMBIENT_MAP = {
                happy:   'sparkle',
                sad:     'rain',
                angry:   'embers',
                love:    'heart',
                flirty:  'heart',
                excited: 'confetti',
                calm:    'firefly',
                awe:     'sparkle',
                proud:   'sparkle',
                worried: 'dust',
                neutral: null,
            };

            /**
             * Switch ambient particles based on emotion state.
             *
             * @param {string} emotion - Current emotion name
             */
            function setEmotionAmbientParticles(emotion) {
                if (!_effectsConfig.emotionAmbient.enabled) return;
                const type = EMOTION_AMBIENT_MAP[emotion] ?? null;
                if (type !== _ambientType) {
                    setAmbientParticles(type);
                }
            }

            /**
             * Set the scene background.
             * @param {string} mode - 'color', 'image', 'video', 'gradient', or 'transparent'
             * @param {string|number} value - Color hex, image URL, video URL, or gradient CSS
             */
            function setBackground(mode, value) {
                console.log("[Viewer] BG_MODE:", mode, value);
                // Hide video by default
                bgVideo.style.display = 'none';
                bgVideo.pause();

                if (mode === 'color') {
                    scene.background = new THREE.Color(value);
                    renderer.setClearAlpha(1);
                } else if (mode === 'image') {
                    new THREE.TextureLoader().load(value, (tex) => {
                        scene.background = tex;
                        renderer.setClearAlpha(1);
                    });
                } else if (mode === 'video') {
                    // Use HTML video element behind canvas
                    scene.background = null;
                    renderer.setClearAlpha(0);
                    bgVideo.src = value;
                    bgVideo.style.display = 'block';
                    bgVideo.play().catch(e => console.warn('[Viewer] Video autoplay blocked:', e));
                } else if (mode === 'gradient') {
                    // Apply CSS gradient to body, keep scene transparent
                    scene.background = null;
                    renderer.setClearAlpha(0);
                    document.body.style.background = value;
                } else {
                    // "transparent" mode — use dark fallback to match UI theme
                    scene.background = new THREE.Color(0x0a0b14);
                    renderer.setClearAlpha(1);
                    document.body.style.background = '#0a0b14';
                }
            }

            // ── Phase 12-P4: Gradient Background Shader Plane ────────
            /**
             * Fullscreen gradient quad rendered behind the scene. Uses a custom
             * ShaderMaterial with 3-stop color interpolation and optional animated
             * wave distortion. renderOrder=-9999 ensures it's always behind everything.
             *
             * Why a shader quad instead of CSS gradient? The EffectComposer samples
             * the framebuffer for bloom/god-rays — CSS gradients leave transparent
             * pixels in the buffer, breaking post-processing compositing.
             */
            const _gradientBgGeom = new THREE.PlaneGeometry(2, 2);
            const _gradientBgMat = new THREE.ShaderMaterial({
                uniforms: {
                    uTopColor:    { value: new THREE.Color(0x1a1a2e) },
                    uBottomColor: { value: new THREE.Color(0x0f3460) },
                    uMidColor:    { value: new THREE.Color(0x16213e) },
                    uMidPoint:    { value: 0.5 },
                    uTime:        { value: 0.0 },
                    uAnimSpeed:   { value: 0.3 },
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position.xy, 0.9999, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 uTopColor, uBottomColor, uMidColor;
                    uniform float uMidPoint, uTime, uAnimSpeed;
                    varying vec2 vUv;
                    void main() {
                        float t = vUv.y;
                        // Subtle animated wave distortion
                        if (uAnimSpeed > 0.0) {
                            t += sin(vUv.x * 3.14159 + uTime * uAnimSpeed) * 0.03;
                            t = clamp(t, 0.0, 1.0);
                        }
                        // 3-stop gradient: bottom → mid → top
                        vec3 color = t < uMidPoint
                            ? mix(uBottomColor, uMidColor, t / uMidPoint)
                            : mix(uMidColor, uTopColor, (t - uMidPoint) / (1.0 - uMidPoint));
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                depthWrite: false,
                depthTest: false,
            });
            const _gradientBgMesh = new THREE.Mesh(_gradientBgGeom, _gradientBgMat);
            _gradientBgMesh.renderOrder = -9999;
            _gradientBgMesh.frustumCulled = false;
            _gradientBgMesh.visible = false;
            scene.add(_gradientBgMesh);

            /** Emotion-driven gradient color presets (top / mid / bottom). */
            const EMOTION_GRADIENTS = {
                neutral:  { top: 0x1a1a2e, mid: 0x16213e, bottom: 0x0f3460 },
                happy:    { top: 0xffe4b5, mid: 0xffca85, bottom: 0xffb6d9 },
                excited:  { top: 0xffe066, mid: 0xff8c42, bottom: 0xc44dff },
                sad:      { top: 0x4a7ba7, mid: 0x3a5a7a, bottom: 0x7d8b9e },
                angry:    { top: 0xff6347, mid: 0xcc2200, bottom: 0x8b0000 },
                love:     { top: 0xffb6d9, mid: 0xff89b5, bottom: 0xffc0cb },
                flirty:   { top: 0xffc0cb, mid: 0xff69b4, bottom: 0xff89b5 },
                calm:     { top: 0x87ceeb, mid: 0xa0d8ef, bottom: 0xe0f6ff },
                proud:    { top: 0xffd700, mid: 0xdaa520, bottom: 0xb8860b },
                awe:      { top: 0xe0f6ff, mid: 0xb0c4de, bottom: 0x6495ed },
                worried:  { top: 0x696969, mid: 0x555555, bottom: 0x404040 },
            };

            // Lerp state for gradient color transitions
            let _gradientFrom = { top: new THREE.Color(), mid: new THREE.Color(), bottom: new THREE.Color() };
            let _gradientTo = { top: new THREE.Color(), mid: new THREE.Color(), bottom: new THREE.Color() };
            let _gradientProgress = 1.0;
            const _GRADIENT_DURATION = 0.8; // seconds

            /**
             * Begin a smooth transition of the gradient background to match the
             * given emotion. Only active when emotionGradient is enabled.
             *
             * @param {string} emotion - Emotion name
             */
            function applyEmotionGradient(emotion) {
                if (!_effectsConfig.emotionGradient.enabled) return;
                const preset = EMOTION_GRADIENTS[emotion] || EMOTION_GRADIENTS.neutral;
                // Snapshot current uniforms as lerp origin
                _gradientFrom.top.copy(_gradientBgMat.uniforms.uTopColor.value);
                _gradientFrom.mid.copy(_gradientBgMat.uniforms.uMidColor.value);
                _gradientFrom.bottom.copy(_gradientBgMat.uniforms.uBottomColor.value);
                _gradientTo.top.set(preset.top);
                _gradientTo.mid.set(preset.mid);
                _gradientTo.bottom.set(preset.bottom);
                _gradientProgress = 0;
                // Ensure the gradient plane is visible + scene is transparent
                if (!_gradientBgMesh.visible) {
                    _gradientBgMesh.visible = true;
                    scene.background = null;
                    renderer.setClearAlpha(0);
                    document.body.style.background = '#000';
                }
            }

            /**
             * Per-frame update for gradient color lerp.
             *
             * @param {number} dt - Delta time in seconds
             */
            function updateEmotionGradient(dt) {
                // Tick animated wave
                if (_gradientBgMesh.visible) {
                    _gradientBgMat.uniforms.uTime.value += dt;
                }
                // Lerp colors
                if (_gradientProgress >= 1.0) return;
                _gradientProgress = Math.min(1.0, _gradientProgress + dt / _GRADIENT_DURATION);
                const t = _gradientProgress;
                const ease = t * t * (3 - 2 * t);
                _gradientBgMat.uniforms.uTopColor.value.lerpColors(_gradientFrom.top, _gradientTo.top, ease);
                _gradientBgMat.uniforms.uMidColor.value.lerpColors(_gradientFrom.mid, _gradientTo.mid, ease);
                _gradientBgMat.uniforms.uBottomColor.value.lerpColors(_gradientFrom.bottom, _gradientTo.bottom, ease);
            }

            /**
             * Capture the current viewport as a PNG data URL.
             *
             * Phase 5 enhanced screenshot options:
             * - supersampled: Render at 2x resolution for higher quality
             * - transparent: Remove scene background for PNG alpha transparency
             *
             * @param {Object} [opts] - Screenshot options
             * @param {boolean} [opts.supersampled=false] - Render at 2x resolution
             * @param {boolean} [opts.transparent=false] - Capture with transparent background
             * @returns {string} Base64 PNG data URL
             */
            // ── Photo Mode state ─────────────────────────────────────────────
            let _photoMode = false;
            let _savedCameraState = null;

            /**
             * Enter Photo Mode — freeze idle behaviors and emotion auto-decay.
             * Stores camera state for restoration on exit.
             */
            function enterPhotoMode() {
                _photoMode = true;
                // Store camera state
                _savedCameraState = {
                    position: camera.position.clone(),
                    target: controls.target.clone(),
                };
                // Freeze idle fidgets and emotion auto-decay
                if (animationDirector) {
                    const idle = animationDirector.getLayer('idle');
                    if (idle) idle._frozen = true;
                    const emotion = animationDirector.getLayer('emotion');
                    if (emotion) emotion._frozen = true;
                }
                window.parent.postMessage({
                    type: 'photoModeReady',
                    cameraState: {
                        position: { x: camera.position.x, y: camera.position.y, z: camera.position.z },
                        target: { x: controls.target.x, y: controls.target.y, z: controls.target.z },
                    },
                }, '*');
            }

            /**
             * Exit Photo Mode — resume idle behaviors and emotion auto-decay.
             * Optionally tweens camera back to stored position.
             */
            function exitPhotoMode() {
                _photoMode = false;
                // Resume layers
                if (animationDirector) {
                    const idle = animationDirector.getLayer('idle');
                    if (idle) idle._frozen = false;
                    const emotion = animationDirector.getLayer('emotion');
                    if (emotion) emotion._frozen = false;
                    // Release any held gesture
                    const gesture = animationDirector.getLayer('gesture');
                    if (gesture) gesture._frozen = false;
                }
                // Tween camera back if we have saved state
                if (_savedCameraState) {
                    controls.tweenTo(_savedCameraState.position, _savedCameraState.target, 500);
                    _savedCameraState = null;
                }
            }

            /**
             * Capture a screenshot at the specified quality level.
             *
             * @param {Object} opts
             * @param {number} [opts.quality=1] - Supersampling multiplier (1, 2, or 4)
             * @param {boolean} [opts.supersampled] - Legacy: treat as quality=2
             * @param {boolean} [opts.transparent] - Remove background for alpha PNG
             * @returns {string} PNG data URL
             */
            function captureScreenshot(opts = {}) {
                const savedBg = scene.background;
                const savedAlpha = renderer.getClearAlpha();
                const w = renderer.domElement.width;
                const h = renderer.domElement.height;

                // Transparent mode: remove background and set clear alpha to 0
                if (opts.transparent) {
                    scene.background = null;
                    renderer.setClearAlpha(0);
                }

                // Determine scale: quality param takes priority, then legacy supersampled flag
                const scale = opts.quality || (opts.supersampled ? 2 : 1);

                if (scale > 1) {
                    // Render at Nx resolution to a temporary render target
                    const sw = w * scale;
                    const sh = h * scale;
                    let rt;
                    try {
                        rt = new THREE.WebGLRenderTarget(sw, sh, {
                            format: THREE.RGBAFormat,
                            type: THREE.UnsignedByteType,
                        });
                    } catch (e) {
                        // OOM on high multiplier — fall back to 1x
                        console.warn(`[Screenshot] ${scale}x render target failed, falling back to 1x:`, e);
                        renderer.render(scene, camera);
                        const fallback = renderer.domElement.toDataURL('image/png');
                        if (opts.transparent) {
                            scene.background = savedBg;
                            renderer.setClearAlpha(savedAlpha);
                        }
                        return fallback;
                    }

                    renderer.setRenderTarget(rt);
                    renderer.render(scene, camera);
                    renderer.setRenderTarget(null);

                    // Read pixels from the render target
                    const pixels = new Uint8Array(sw * sh * 4);
                    renderer.readRenderTargetPixels(rt, 0, 0, sw, sh, pixels);

                    // Draw to an offscreen canvas
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = sw;
                    offCanvas.height = sh;
                    const ctx = offCanvas.getContext('2d');
                    const imgData = ctx.createImageData(sw, sh);
                    // Flip vertically (WebGL origin is bottom-left)
                    for (let y = 0; y < sh; y++) {
                        const srcRow = (sh - 1 - y) * sw * 4;
                        const dstRow = y * sw * 4;
                        for (let x = 0; x < sw * 4; x++) {
                            imgData.data[dstRow + x] = pixels[srcRow + x];
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                    rt.dispose();

                    // Restore state
                    if (opts.transparent) {
                        scene.background = savedBg;
                        renderer.setClearAlpha(savedAlpha);
                    }
                    return offCanvas.toDataURL('image/png');
                }

                // Standard resolution capture (1x)
                renderer.render(scene, camera);
                const dataUrl = renderer.domElement.toDataURL('image/png');

                // Restore state
                if (opts.transparent) {
                    scene.background = savedBg;
                    renderer.setClearAlpha(savedAlpha);
                }
                return dataUrl;
            }

            /**
             * Get all available blend shape / expression names from the loaded VRM.
             * @returns {string[]} Array of expression names
             */
            function getAvailableBlendShapes() {
                if (!currentVrm) return [];
                const em = currentVrm.expressionManager || currentVrm.blendShapeProxy;
                if (!em) return [];

                // VRM 1.0: expressionManager has _expressionMap
                if (em._expressionMap) return Array.from(em._expressionMap.keys());
                // VRM 0.x: blendShapeProxy has _blendShapeGroups
                if (em._blendShapeGroups) return em._blendShapeGroups.map(g => g.name);
                return [];
            }

            /**
             * Set a single blend shape to a specific value (0-1).
             * @param {string} name - Blend shape name
             * @param {number} value - Value between 0 and 1
             */
            function setBlendShape(name, value) {
                if (!currentVrm) return;
                const em = currentVrm.expressionManager || currentVrm.blendShapeProxy;
                if (!em) return;
                try {
                    em.setValue(name, Math.max(0, Math.min(1, value)));
                } catch (e) {
                    console.warn('[Viewer] Blend shape not found:', name);
                }
            }

            // ── Forward declarations for entrance/exit animators ─────
            // These must be declared before animate() to avoid TDZ errors,
            // since animate() runs via requestAnimationFrame before the
            // class definitions and assignments further down.
            let entranceAnimator = null;
            let exitAnimator = null;

            // ── Animation Loop ──────────────────────────────────

            function animate() {
                requestAnimationFrame(animate);
                // FPS cap: skip rendering if the target frame interval hasn't elapsed.
                // rAF still fires at ~60Hz; we just do nothing on the skipped frames.
                if (_fpsTargetMs > 0) {
                    const _now = performance.now();
                    if (_now - _fpsLastRenderTime < _fpsTargetMs) return;
                    _fpsLastRenderTime = _now;
                }
                // Cap delta to 100ms to prevent animation pops when tab regains focus.
                // Browsers throttle rAF to ~1fps while hidden; on resume getDelta() returns
                // the full elapsed time, causing lerp snap and sin() position jumps.
                const delta = Math.min(clock.getDelta(), 0.1);

                controls.update();

                // Tick entrance animation (multi-style) for any model type
                if (entranceAnimator?.active) {
                    entranceAnimator.update(delta);
                }
                // Tick exit animation if active
                if (exitAnimator?.active) {
                    exitAnimator.update(delta);
                }

                // Apply wind to spring bone gravity (VRM only)
                if (currentVrm && _windForce.strength > 0) {
                    _windTime += delta;
                    const sbm = currentVrm.springBoneManager;
                    if (sbm?.joints) {
                        for (const joint of sbm.joints) {
                            // Save original gravity on first wind application
                            if (!_originalGravity.has(joint)) {
                                _originalGravity.set(joint, {
                                    x: joint.settings.gravityDir.x,
                                    y: joint.settings.gravityDir.y,
                                    z: joint.settings.gravityDir.z,
                                    power: joint.settings.gravityPower,
                                });
                            }
                            const orig = _originalGravity.get(joint);
                            // Perlin-ish noise: sum of sines at different frequencies
                            const noise = Math.sin(_windTime * 2.3) * 0.4
                                        + Math.sin(_windTime * 5.7 + 1.3) * 0.3
                                        + Math.sin(_windTime * 0.8 + 2.7) * 0.3;
                            const s = _windForce.strength * (0.7 + noise * 0.3);
                            joint.settings.gravityDir.x = orig.x + _windForce.x * s;
                            joint.settings.gravityDir.y = orig.y + _windForce.y * s;
                            joint.settings.gravityDir.z = orig.z + _windForce.z * s;
                        }
                    }
                }

                if (currentVrm) {
                    currentVrm.update(delta);

                    // Layered animation system (Phase 6F)
                    if (animationDirector) {
                        // Sync talk state from global isTalking flag
                        const talkLayer = animationDirector.getLayer('talk');
                        if (talkLayer) talkLayer.setTalking(isTalking);

                        animationDirector.update(delta);

                        // NOTE: A-pose arms are set by BasePoseLayer and TalkLayer.
                        // Do NOT reset arms here — it fights with TalkLayer's animated
                        // arm poses and causes visible oscillation.
                    }

                    if (blinkController) blinkController.update(delta);
                    if (saccadeController) saccadeController.update(delta);
                    if (microTremorController) {
                        // Only apply micro-tremor during idle — disable during active gestures
                        microTremorController.enabled = animationDirector?.state === 'idle';
                        microTremorController.update(delta);
                    }
                    if (microExpressionController) microExpressionController.update(delta);
                    if (expressionController) expressionController.update(delta);
                } else if (currentGlbMixer) {
                    // GLB mode: tick the AnimationMixer for embedded clip playback
                    currentGlbMixer.update(delta);
                }

                // Disco mode (#25): cycle hue of three RGB point lights at different speeds
                if (_discoActive) {
                    _discoTime += delta;
                    discoLights[0].color.setHSL((_discoTime * 0.5)        % 1, 1, 0.5);
                    discoLights[1].color.setHSL((_discoTime * 0.5 + 0.33) % 1, 1, 0.5);
                    discoLights[2].color.setHSL((_discoTime * 0.5 + 0.67) % 1, 1, 0.5);
                }

                // Phase 12-P4: Emotion-driven effects per-frame updates
                if (_effectsConfig.emotionColorGrade.enabled) {
                    updateEmotionColorGrade(delta);
                }
                updateEmotionGradient(delta);

                // Phase 5: Update particle system
                updateParticles(delta);

                // Phase 5: Render via EffectComposer or direct renderer
                if (_effectsEnabled) {
                    composer.render(delta);
                } else {
                    renderer.render(scene, camera);
                }

                // FPS counter: count frames, update display once per second.
                // Posts to parent window for the right panel, and updates the
                // in-viewport overlay if visible (toggled by showFps postMessage).
                _fpsFrameCount++;
                const _fpsNow = performance.now();
                if (_fpsNow - _fpsLastTime >= 1000) {
                    _fpsDisplay = Math.round(_fpsFrameCount * 1000 / (_fpsNow - _fpsLastTime));
                    _fpsFrameCount = 0;
                    _fpsLastTime = _fpsNow;
                    window.parent?.postMessage({ type: 'fpsUpdate', fps: _fpsDisplay }, '*');
                    const fpsEl = document.getElementById('fps-overlay');
                    if (fpsEl && fpsEl.style.display !== 'none') {
                        fpsEl.textContent = `${_fpsDisplay} FPS`;
                        fpsEl.style.color = _fpsDisplay >= 55 ? '#39ff14'
                                          : _fpsDisplay >= 30 ? '#ffcc00' : '#ff4444';
                    }
                }
            }
            animate();

            // Load model from URL parameter if provided (direct link mode)
            const urlParam = new URLSearchParams(location.search).get('url');
            if (urlParam) {
                loadModel(urlParam, scene, camera);
            }

            // ── Pet Mode ─────────────────────────────────────────────────
            // Detect ?pet=1 URL param. When true the viewer runs as a floating
            // popup window with a minimal chat overlay at the bottom.
            // User input is relayed to the main window via window.opener.postMessage()
            // and AI replies are received back as {type:'petReply', text} messages.
            const PET_MODE = new URLSearchParams(location.search).get('pet') === '1';
            const NO_CHAT_OVERLAY = new URLSearchParams(location.search).get('noChatOverlay') === '1';

            if (PET_MODE) {
                document.body.classList.add('pet-mode');

                // Build chat overlay DOM only for standalone browser pet mode.
                // In Electron pet mode (?noChatOverlay=1), PetSpeechBubble.tsx
                // provides the interaction UI instead.
                if (!NO_CHAT_OVERLAY) {
                    const petOverlay = document.createElement('div');
                    petOverlay.id = 'pet-overlay';
                    petOverlay.innerHTML = `
                        <div id="pet-bubble" class="pet-bubble hidden"></div>
                        <div id="pet-input-row">
                            <input id="pet-input" type="text" placeholder="Say something\u2026" autocomplete="off">
                            <button id="pet-send">\u2192</button>
                        </div>`;
                    document.body.appendChild(petOverlay);

                    /**
                     * Show a transient chat bubble in the pet overlay.
                     * Auto-hides after 8 seconds.
                     *
                     * @param {string} text - Message text to display
                     * @param {'user'|'assistant'} role - Bubble style variant
                     */
                    function showPetBubble(text, role) {
                        const bubble = document.getElementById('pet-bubble');
                        if (!bubble) return;
                        bubble.textContent = text;
                        bubble.className = `pet-bubble ${role}`;
                        bubble.classList.remove('hidden');
                        clearTimeout(bubble._hideTimer);
                        bubble._hideTimer = setTimeout(() => bubble.classList.add('hidden'), 8000);
                    }

                    /**
                     * Read the pet input, relay the text to the main window via
                     * window.opener.postMessage, and show a user bubble immediately
                     * for instant visual feedback before the AI responds.
                     */
                    function sendPetMessage() {
                        const petInput = document.getElementById('pet-input');
                        const text = petInput?.value?.trim();
                        if (!text) return;
                        petInput.value = '';
                        showPetBubble('You: ' + text, 'user');
                        window.opener?.postMessage({ type: 'petMessage', text }, '*');
                    }

                    document.getElementById('pet-send')?.addEventListener('click', sendPetMessage);
                    document.getElementById('pet-input')?.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') sendPetMessage();
                    });

                    // Handle AI replies and audio commands forwarded from the main window
                    window.addEventListener('message', (evt) => {
                        if (evt.data?.type === 'petReply') {
                            showPetBubble(evt.data.text, 'assistant');
                        }
                    });
                }
            }

            /**
             * Apply a natural standing pose to a VRM model.
             * VRM models load in T-pose (arms out). This relaxes the skeleton
             * into a comfortable A-pose / idle standing position with arms at sides,
             * slight hand curl, and natural spine posture.
             *
             * @param {Object} vrm - Loaded VRM instance
             */
            function applyNaturalPose(vrm) {
                // Reset all normalised bone poses to the model's standard T-pose.
                // This is model-agnostic and avoids the bind-pose mismatch that caused
                // arms to point upward on non-standard VRM bind poses. Arms stay in
                // the T-pose (horizontal); proper idle animation should come from VRMA.
                if (vrm.humanoid.resetNormalizedPose) {
                    vrm.humanoid.resetNormalizedPose();
                }
                console.log('[Viewer] Natural pose applied via resetNormalizedPose');
            }

            /**
             * Load a VRM model from URL into the scene.
             * Notifies parent window on success or failure via postMessage.
             *
             * @param {string} modelUrl - Path to the .vrm file
             * @param {THREE.Scene} scene - Three.js scene
             * @param {THREE.PerspectiveCamera} camera - Camera to frame the model
             */
            // ── Walk-On Entrance Animation ─────────────────────
            // Slides the model in from off-screen with ease-out
            // cubic easing, walk bob, and optional spine lean.

            /** @type {{ enabled: boolean, direction: 'left'|'right', duration: number, style: string, emotion: string }} */
            let entranceConfig = { enabled: true, direction: 'right', duration: 1.2, style: 'walk', emotion: 'neutral' };
            // entranceAnimator declared above animate() to avoid TDZ
            /** Queued gesture to play after entrance completes. */

            // ── Spring Bone Wind & Debug State ───────────────
            /** Wind force vector applied to spring bone gravity. */
            let _windForce = { x: 0, y: 0, z: 0, strength: 0 };
            /** Original gravity values per joint (saved when wind is first applied). */
            let _originalGravity = new Map();
            /** Elapsed time for wind noise variation. */
            let _windTime = 0;
            /** Whether collider debug wireframes are shown. */
            let _colliderDebugActive = false;
            /** Collider debug mesh references for cleanup. */
            let _colliderDebugMeshes = [];
            let _pendingGreetingGesture = null;

            // ── Easing Functions ──────────────────────────────────
            const _easings = {
                cubicOut:    (t) => 1 - Math.pow(1 - t, 3),
                quinticOut:  (t) => 1 - Math.pow(1 - t, 5),
                bounceOut:   (t) => {
                    if (t < 1/2.75) return 7.5625 * t * t;
                    if (t < 2/2.75) { t -= 1.5/2.75; return 7.5625 * t * t + 0.75; }
                    if (t < 2.5/2.75) { t -= 2.25/2.75; return 7.5625 * t * t + 0.9375; }
                    t -= 2.625/2.75; return 7.5625 * t * t + 0.984375;
                },
                elasticOut:  (t) => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t - 0.075) * (2 * Math.PI) / 0.3) + 1,
                linear:      (t) => t,
                easeInOut:   (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
            };

            /**
             * Multi-style entrance animator for 3D models.
             *
             * Supported styles:
             *   - walk: Cubic ease-out slide + walk bob + spine lean (original)
             *   - run:  Faster slide + higher bob freq + forward lean
             *   - jump: Parabolic Y arc + bounce on landing
             *   - fade: Opacity 0→1, no positional movement
             *   - teleport: Flash + scale 0→1.1→1.0 (elastic)
             *
             * Emotion modulation:
             *   - happy: +30% bob amplitude
             *   - sad:   -20% speed (longer duration)
             *   - shy:   ease-in-out hesitation curve
             */
            class EntranceAnimator {
                /**
                 * @param {THREE.Object3D} modelScene - The model's scene root
                 * @param {object} vrm - VRM instance (or null for GLB)
                 * @param {object} opts - Animation options
                 * @param {'left'|'right'} opts.direction - Entrance direction
                 * @param {number} opts.duration - Animation duration in seconds
                 * @param {string} opts.style - Entrance style (walk|run|jump|fade|teleport)
                 * @param {string} [opts.emotion] - Emotion for modulation
                 * @param {Function} [opts.onComplete] - Called when entrance finishes
                 */
                constructor(modelScene, vrm, opts = {}) {
                    this.scene = modelScene;
                    this.vrm = vrm;
                    this.direction = opts.direction || 'right';
                    this.style = opts.style || 'walk';
                    this.emotion = opts.emotion || 'neutral';
                    this.onComplete = opts.onComplete || null;
                    this.active = true;
                    this.elapsed = 0;

                    // Emotion modulation
                    let durationMult = 1.0;
                    this.bobMult = 1.0;
                    if (this.emotion === 'happy') this.bobMult = 1.3;
                    if (this.emotion === 'sad') durationMult = 1.2;

                    // Style-specific defaults
                    const styleDurations = { walk: 1.2, run: 0.7, jump: 1.0, fade: 0.8, teleport: 0.3 };
                    this.duration = (opts.duration || styleDurations[this.style] || 1.2) * durationMult;

                    this.targetX = modelScene.position.x;
                    this.targetY = modelScene.position.y || 0;

                    // Positional styles start off-screen
                    if (this.style === 'walk' || this.style === 'run' || this.style === 'jump') {
                        this.startX = this.direction === 'right' ? 2.5 : -2.5;
                        modelScene.position.x = this.startX;
                    } else {
                        this.startX = this.targetX;
                    }

                    // Fade style: set initial opacity
                    if (this.style === 'fade') {
                        modelScene.traverse((child) => {
                            if (child.isMesh && child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(m => { m.transparent = true; m.opacity = 0; });
                            }
                        });
                    }

                    // Teleport style: start at scale 0
                    if (this.style === 'teleport') {
                        modelScene.scale.setScalar(0.01);
                    }

                    // Cache spine bone for lean effect (VRM only)
                    this.spineBone = null;
                    if (vrm?.humanoid) {
                        this.spineBone = vrm.humanoid.getNormalizedBoneNode?.('spine')
                            || vrm.humanoid.getBoneNode?.('spine')
                            || null;
                    }
                }

                update(delta) {
                    if (!this.active) return;
                    this.elapsed += delta;
                    const t = Math.min(this.elapsed / this.duration, 1.0);

                    switch (this.style) {
                        case 'walk': {
                            const easeFunc = this.emotion === 'shy' ? _easings.easeInOut : _easings.cubicOut;
                            const eased = easeFunc(t);
                            this.scene.position.x = this.startX + (this.targetX - this.startX) * eased;
                            const bobAmp = 0.015 * this.bobMult * (1 - eased);
                            this.scene.position.y = this.targetY + Math.sin(this.elapsed * 8 * Math.PI * 2) * bobAmp;
                            if (this.spineBone) {
                                const lean = 0.08 * (1 - eased) * (this.direction === 'right' ? -1 : 1);
                                this.spineBone.rotation.z = lean;
                            }
                            break;
                        }
                        case 'run': {
                            const eased = _easings.quinticOut(t);
                            this.scene.position.x = this.startX + (this.targetX - this.startX) * eased;
                            const bobAmp = 0.022 * this.bobMult * (1 - eased);
                            this.scene.position.y = this.targetY + Math.sin(this.elapsed * 14 * Math.PI * 2) * bobAmp;
                            if (this.spineBone) {
                                const lean = 0.14 * (1 - eased) * (this.direction === 'right' ? -1 : 1);
                                this.spineBone.rotation.z = lean;
                            }
                            break;
                        }
                        case 'jump': {
                            const eased = _easings.bounceOut(t);
                            this.scene.position.x = this.startX + (this.targetX - this.startX) * Math.min(t * 1.5, 1);
                            // Parabolic arc: peak at t=0.4
                            const arcHeight = 0.5 * this.bobMult;
                            const arcT = Math.min(t / 0.4, 1);
                            const arc = arcT < 1 ? arcHeight * Math.sin(arcT * Math.PI) : 0;
                            this.scene.position.y = this.targetY + arc * (1 - eased * 0.3);
                            break;
                        }
                        case 'fade': {
                            const eased = _easings.linear(t);
                            this.scene.traverse((child) => {
                                if (child.isMesh && child.material) {
                                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach(m => { m.opacity = eased; });
                                }
                            });
                            break;
                        }
                        case 'teleport': {
                            const eased = _easings.elasticOut(t);
                            // Scale 0 → 1.1 → 1.0 via elastic easing
                            this.scene.scale.setScalar(Math.max(0.01, eased));
                            break;
                        }
                    }

                    if (t >= 1.0) {
                        this.active = false;
                        this.scene.position.x = this.targetX;
                        this.scene.position.y = this.targetY;
                        this.scene.scale.setScalar(1);
                        if (this.spineBone) this.spineBone.rotation.z = 0;
                        // Restore full opacity for fade style
                        if (this.style === 'fade') {
                            this.scene.traverse((child) => {
                                if (child.isMesh && child.material) {
                                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach(m => { m.opacity = 1; m.transparent = false; });
                                }
                            });
                        }
                        if (this.onComplete) this.onComplete();
                    }
                }
            }

            /**
             * Exit animator — reverse of entrance, supports walk/fade/teleport styles.
             * Posts 'exitComplete' to parent when finished.
             */
            class ExitAnimator {
                /**
                 * @param {THREE.Object3D} modelScene - The model's scene root
                 * @param {object} opts - Animation options
                 * @param {'left'|'right'} opts.direction - Exit direction
                 * @param {string} opts.style - Exit style (walk|fade|teleport)
                 * @param {number} [opts.duration] - Override duration
                 * @param {Function} [opts.onComplete] - Called when exit finishes
                 */
                constructor(modelScene, opts = {}) {
                    this.scene = modelScene;
                    this.style = opts.style || 'fade';
                    this.direction = opts.direction || 'right';
                    this.onComplete = opts.onComplete || null;
                    this.active = true;
                    this.elapsed = 0;

                    const styleDurations = { walk: 1.0, fade: 0.6, teleport: 0.25 };
                    this.duration = opts.duration || styleDurations[this.style] || 0.6;
                    this.startX = modelScene.position.x;
                    this.targetX = this.direction === 'right' ? 2.5 : -2.5;
                }

                update(delta) {
                    if (!this.active) return;
                    this.elapsed += delta;
                    const t = Math.min(this.elapsed / this.duration, 1.0);

                    switch (this.style) {
                        case 'walk': {
                            const eased = _easings.cubicOut(t);
                            this.scene.position.x = this.startX + (this.targetX - this.startX) * eased;
                            break;
                        }
                        case 'fade': {
                            this.scene.traverse((child) => {
                                if (child.isMesh && child.material) {
                                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach(m => { m.transparent = true; m.opacity = 1 - t; });
                                }
                            });
                            break;
                        }
                        case 'teleport': {
                            const eased = 1 - _easings.elasticOut(1 - t);
                            this.scene.scale.setScalar(Math.max(0.01, 1 - eased));
                            break;
                        }
                    }

                    if (t >= 1.0) {
                        this.active = false;
                        window.parent.postMessage({ type: 'exitComplete' }, '*');
                        if (this.onComplete) this.onComplete();
                    }
                }
            }
