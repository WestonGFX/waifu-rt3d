<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>WAIFU.EXE</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #loading {
            display: none;
        }

        /* Video background layer (behind canvas) */
        #bg-video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        /* ── Pet Mode Overlay ──────────────────────────────────────── */
        body.pet-mode { background: transparent; }

        #pet-overlay {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 8px; z-index: 100;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: none;
        }
        #pet-overlay > * { pointer-events: auto; }

        .pet-bubble {
            background: rgba(0,0,0,0.75); color: #e0e0ff;
            padding: 6px 12px; border-radius: 12px;
            font: 13px/1.45 system-ui; max-width: 88%;
            word-break: break-word;
            opacity: 1; transition: opacity 0.4s ease;
        }
        .pet-bubble.user {
            align-self: flex-end;
            background: rgba(120,80,255,0.78);
        }
        .pet-bubble.hidden { opacity: 0; pointer-events: none; }

        #pet-input-row { display: flex; gap: 6px; }

        #pet-input {
            flex: 1; background: rgba(0,0,0,0.65); color: #fff;
            border: 1px solid rgba(120,80,255,0.5); border-radius: 10px;
            padding: 7px 12px; font: 13px system-ui; outline: none;
        }
        #pet-input:focus { border-color: rgba(120,80,255,0.9); }

        #pet-send {
            background: rgba(120,80,255,0.85); color: #fff;
            border: none; border-radius: 10px; padding: 7px 14px;
            cursor: pointer; font: 15px system-ui; line-height: 1;
        }
        #pet-send:hover { background: rgba(140,100,255,0.95); }
    </style>
</head>

<body>
    <div id="loading">UPLINKING_VISUAL_FEED...</div>
    <video id="bg-video" loop muted playsinline></video>
    <canvas id="c"></canvas>
    <!-- FPS overlay — hidden by default, shown via showFps postMessage or settings toggle -->
    <div id="fps-overlay" style="
        position:fixed; bottom:8px; right:8px; z-index:9999;
        font-family:monospace; font-size:11px; color:#39ff14;
        background:rgba(0,0,0,0.55); padding:2px 8px; border-radius:3px;
        display:none; pointer-events:none; letter-spacing:0.5px;
    "></div>
    <script type="importmap">
        {
            "imports": {
                "three": "/shared/lib/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from '/shared/lib/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '/shared/lib/three-vrm.module.min.js';
        // Phase 5: Post-processing pipeline addons
        import { EffectComposer } from '/shared/lib/postprocessing/EffectComposer.js';
        import { RenderPass } from '/shared/lib/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from '/shared/lib/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from '/shared/lib/postprocessing/ShaderPass.js';

        let currentVrm = null;
        let currentGlb = null;        // Currently loaded GLB scene (null when VRM or empty)
        let currentGlbMixer = null;   // THREE.AnimationMixer for GLB embedded animations
        let currentGlbClips = [];     // Embedded AnimationClip[] from GLB
        let _currentGlbAction = null; // Currently playing GLB AnimationAction (for crossfade)
        let clock = new THREE.Clock();
        let lipSync = null;
        let blinkController = null;
        let saccadeController = null;
        let microTremorController = null;
        let microExpressionController = null;
        let headMovement = null;
        let expressionController = null;
        let gestureController = null;
        let proceduralAnimator = null;
        let mouseTracker = null;
        let animationDirector = null;
        // Tracks the last emotion that triggered an auto-gesture, preventing
        // repeat gestures when the same emotion fires on consecutive messages.
        let lastAutoGestureEmotion = null;
        // FPS counter state — updated once per second in the render loop
        let _fpsFrameCount = 0;
        let _fpsLastTime = 0;
        let _fpsDisplay = 0;
        // FPS cap state — 0 means unlimited (default). Set via setFpsTarget postMessage.
        // When set, the animate() loop skips rendering until the target interval elapses.
        let _fpsTargetMs = 0;
        let _fpsLastRenderTime = 0;

        // ══════════════════════════════════════════════════════════
        // Inline OrbitControls (minimal implementation)
        // Provides: left-drag orbit, scroll zoom, right-drag pan
        // ══════════════════════════════════════════════════════════

        /**
         * Minimal orbit camera controller for Three.js.
         * Supports left-click orbit, right-click pan, scroll zoom.
         * No external dependency — written inline to avoid missing lib issues.
         */
        class SimpleOrbitControls {
            constructor(camera, domElement) {
                this.camera = camera;
                this.domElement = domElement;
                this.enabled = true;

                // Orbit state
                this.target = new THREE.Vector3(0, 1.2, 0);
                this.spherical = new THREE.Spherical();
                this.sphericalDelta = new THREE.Spherical();
                this.panOffset = new THREE.Vector3();

                // Limits
                this.minDistance = 0.5;
                this.maxDistance = 5;
                this.minPolarAngle = 0.1;
                this.maxPolarAngle = Math.PI - 0.1;
                this.rotateSpeed = 1.0;
                this.panSpeed = 1.0;
                this.zoomSpeed = 1.0;

                // Internal state
                this._rotateStart = new THREE.Vector2();
                this._panStart = new THREE.Vector2();
                this._isRotating = false;
                this._isPanning = false;
                this._zoomVelocity = 0;

                this._bindEvents();
                this._updateSpherical();
            }

            /** Sync internal spherical from current camera position. */
            _updateSpherical() {
                const offset = new THREE.Vector3().copy(this.camera.position).sub(this.target);
                this.spherical.setFromVector3(offset);
            }

            _bindEvents() {
                const el = this.domElement;
                el.addEventListener('pointerdown', (e) => this._onPointerDown(e));
                el.addEventListener('pointermove', (e) => this._onPointerMove(e));
                el.addEventListener('pointerup', () => this._onPointerUp());
                el.addEventListener('pointerleave', () => this._onPointerUp());
                el.addEventListener('wheel', (e) => this._onWheel(e), { passive: false });
                el.addEventListener('contextmenu', (e) => e.preventDefault());
                el.addEventListener('dblclick', () => this._onDoubleClick());
            }

            _onPointerDown(e) {
                if (!this.enabled) return;
                if (e.button === 0) {
                    this._isRotating = true;
                    this._rotateStart.set(e.clientX, e.clientY);
                } else if (e.button === 2) {
                    this._isPanning = true;
                    this._panStart.set(e.clientX, e.clientY);
                }
            }

            _onPointerMove(e) {
                if (!this.enabled) return;
                if (this._isRotating) {
                    const dx = (e.clientX - this._rotateStart.x) / this.domElement.clientHeight * Math.PI * this.rotateSpeed;
                    const dy = (e.clientY - this._rotateStart.y) / this.domElement.clientHeight * Math.PI * this.rotateSpeed;
                    this.sphericalDelta.theta -= dx;
                    this.sphericalDelta.phi -= dy;
                    this._rotateStart.set(e.clientX, e.clientY);
                }
                if (this._isPanning) {
                    const distanceScale = Math.max(this.spherical.radius / 2.0, 0.3);
                    const dx = (e.clientX - this._panStart.x) * this.panSpeed * 0.002 * distanceScale;
                    const dy = (e.clientY - this._panStart.y) * this.panSpeed * 0.002 * distanceScale;
                    const right = new THREE.Vector3();
                    const up = new THREE.Vector3();
                    right.setFromMatrixColumn(this.camera.matrix, 0);
                    up.setFromMatrixColumn(this.camera.matrix, 1);
                    this.panOffset.addScaledVector(right, -dx);
                    this.panOffset.addScaledVector(up, dy);
                    this._panStart.set(e.clientX, e.clientY);
                }
            }

            _onPointerUp() {
                this._isRotating = false;
                this._isPanning = false;
            }

            _onWheel(e) {
                if (!this.enabled) return;
                e.preventDefault();
                // Logarithmic zoom: finer when close, coarser when far
                const zoomFactor = 1 + 0.05 * this.zoomSpeed * Math.max(this.spherical.radius / 2, 0.5);
                if (e.deltaY > 0) {
                    this._zoomVelocity += 0.02 * this.zoomSpeed;
                } else {
                    this._zoomVelocity -= 0.02 * this.zoomSpeed;
                }
            }

            /** Call each frame to apply accumulated deltas and advance any active tween. */
            update() {
                if (!this.enabled) return;

                // Drive smooth camera tween (set by tweenTo). Uses smoothstep easing.
                if (this._tween) {
                    const t = Math.min((performance.now() - this._tween.startTime) / this._tween.duration, 1);
                    // Smoothstep easing: t² × (3 − 2t)
                    const s = t * t * (3 - 2 * t);
                    this.camera.position.lerpVectors(this._tween.fromPos, this._tween.toPos, s);
                    this.target.lerpVectors(this._tween.fromTarget, this._tween.toTarget, s);
                    this._updateSpherical();
                    if (t >= 1) this._tween = null; // tween complete
                    this.camera.lookAt(this.target);
                    return; // skip manual-delta handling while tweening
                }

                // Apply zoom damping (momentum from scroll wheel)
                if (Math.abs(this._zoomVelocity) > 0.0005) {
                    this.spherical.radius *= (1 + this._zoomVelocity);
                    this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius));
                    this._zoomVelocity *= 0.85; // decay
                } else {
                    this._zoomVelocity = 0;
                }

                // Apply pan
                this.target.add(this.panOffset);
                this.panOffset.set(0, 0, 0);

                // Apply rotation
                this.spherical.theta += this.sphericalDelta.theta;
                this.spherical.phi += this.sphericalDelta.phi;
                this.spherical.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, this.spherical.phi));
                this.sphericalDelta.set(0, 0, 0);

                // Compute new camera position
                const offset = new THREE.Vector3().setFromSpherical(this.spherical);
                this.camera.position.copy(this.target).add(offset);
                this.camera.lookAt(this.target);
            }

            /** Reset camera to a specific position + target (instant, no tween). */
            reset(position, target) {
                this._tween = null; // cancel any active tween
                this.target.copy(target || new THREE.Vector3(0, 1.2, 0));
                this.camera.position.copy(position || new THREE.Vector3(0, 1.4, 1.2));
                this._updateSpherical();
            }

            /**
             * Smoothly animate the camera to a new position and target.
             *
             * @param {THREE.Vector3} toPos - Destination camera position
             * @param {THREE.Vector3} toTarget - Destination orbit target (look-at point)
             * @param {number} [durationMs=500] - Animation duration in milliseconds
             */
            tweenTo(toPos, toTarget, durationMs = 500) {
                this._tween = {
                    fromPos:    this.camera.position.clone(),
                    fromTarget: this.target.clone(),
                    toPos:      toPos.clone(),
                    toTarget:   toTarget.clone(),
                    duration:   durationMs,
                    elapsed:    0,
                    startTime:  performance.now(),
                };
            }

            /** Double-click recenters camera to fullbody default view. */
            _onDoubleClick() {
                if (!this.enabled || !_vrmFrameData) return;
                const { targetY, camZ, modelHeight } = _vrmFrameData;
                this.tweenTo(
                    new THREE.Vector3(0, targetY + modelHeight * 0.05, camZ * 1.15),
                    new THREE.Vector3(0, targetY, 0),
                    400
                );
            }

            /** Get serializable camera state for presets. */
            getState() {
                return {
                    position: this.camera.position.toArray(),
                    target: this.target.toArray(),
                    radius: this.spherical.radius
                };
            }

            /** Restore camera state from preset. */
            setState(preset) {
                if (preset.position) this.camera.position.fromArray(preset.position);
                if (preset.target) this.target.fromArray(preset.target);
                this._updateSpherical();
            }

            /**
             * Smoothly transition to a named camera preset.
             * Uses VRM frame data for model-relative positioning.
             *
             * @param {string} presetName - 'fullbody'|'upper'|'face'|'side'|'low'
             * @param {number} [durationMs=600] - Transition duration
             */
            goToPreset(presetName, durationMs = 600) {
                if (!_vrmFrameData) return;
                const { targetY, camZ, modelHeight } = _vrmFrameData;
                const presets = {
                    fullbody: {
                        pos: [0, targetY + modelHeight * 0.05, camZ * 1.15],
                        target: [0, targetY, 0],
                    },
                    upper: {
                        pos: [0, targetY + modelHeight * 0.2, camZ * 0.7],
                        target: [0, targetY + modelHeight * 0.15, 0],
                    },
                    face: {
                        pos: [0, targetY + modelHeight * 0.35, camZ * 0.35],
                        target: [0, targetY + modelHeight * 0.35, 0],
                    },
                    side: {
                        pos: [camZ * 0.8, targetY + modelHeight * 0.1, camZ * 0.6],
                        target: [0, targetY + modelHeight * 0.05, 0],
                    },
                    low: {
                        pos: [0, targetY - modelHeight * 0.1, camZ * 1.0],
                        target: [0, targetY + modelHeight * 0.1, 0],
                    },
                };
                const preset = presets[presetName] || presets.fullbody;
                this.tweenTo(
                    new THREE.Vector3(...preset.pos),
                    new THREE.Vector3(...preset.target),
                    durationMs
                );
            }
        }

        // ══════════════════════════════════════════════════════════
        // Character Touch/Poke Raycaster (Phase 12-P3)
        // ══════════════════════════════════════════════════════════
        // Detects clicks on the character model and maps hit position
        // to body zones (head, cheeks, shoulders, torso).

        const _raycaster = new THREE.Raycaster();
        const _pointerNDC = new THREE.Vector2();
        let _touchCooldowns = {};

        /**
         * Handle pointer click on canvas — raycast to detect character touch.
         * Maps hit Y-coordinate to body zone and posts event to parent.
         *
         * @param {PointerEvent} event
         */
        function _onCharacterTouch(event) {
            if (!currentVrm || !camera) return;

            // Convert screen coords to NDC (-1 to +1)
            const rect = renderer.domElement.getBoundingClientRect();
            _pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            _pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            _raycaster.setFromCamera(_pointerNDC, camera);

            // Get all meshes from VRM scene
            const meshes = [];
            currentVrm.scene.traverse(child => {
                if (child.isMesh) meshes.push(child);
            });

            const hits = _raycaster.intersectObjects(meshes, false);
            if (hits.length === 0) return;

            const hit = hits[0];
            const worldY = hit.point.y;

            // Map world Y to body zone using model bounding box
            const bbox = new THREE.Box3().setFromObject(currentVrm.scene);
            const modelBottom = bbox.min.y;
            const modelTop = bbox.max.y;
            const normalizedY = (worldY - modelBottom) / (modelTop - modelBottom);

            let zone = 'torso';
            if (normalizedY > 0.85) zone = 'head';
            else if (normalizedY > 0.75) zone = 'face';
            else if (normalizedY > 0.65) zone = 'shoulders';
            else if (normalizedY > 0.3) zone = 'torso';
            else zone = 'legs';

            // Cooldown check
            const now = performance.now();
            if (_touchCooldowns[zone] && now - _touchCooldowns[zone] < 2000) return;
            _touchCooldowns[zone] = now;

            // Notify parent frame
            window.parent.postMessage({
                type: 'characterTouch',
                zone: zone,
                normalizedY: normalizedY,
                worldPosition: hit.point.toArray(),
            }, '*');

            console.log(`[Touch] Zone: ${zone} (Y: ${normalizedY.toFixed(2)})`);
        }


        // ══════════════════════════════════════════════════════════
        // Layered Animation System — Phase 6F + Clip Extension
        // 7 layers processed per frame in order:
        //   L0 BasePose, L1 IdleBehavior, L2 EmotionModifier,
        //   L3 TalkBehavior, L4 GestureOverride, L5 LookAt,
        //   L6 ClipPlayback (AnimationMixer)
        // ══════════════════════════════════════════════════════════

        /**
         * Default animation personality profile.
         * All values 0–1. Used when character has no custom profile.
         */
        const DEFAULT_PERSONALITY = {
            energy: 0.5, confidence: 0.5, nervousness: 0.3,
            expressiveness: 0.5, playfulness: 0.5,
        };

        /**
         * Base class for all animation layers.
         * Each layer writes to specific bones using set (=) or additive (+=) mode.
         * @abstract
         */
        class AnimationLayer {
            /**
             * @param {Object} vrm - The loaded VRM model instance
             * @param {string} name - Layer name for debugging
             */
            constructor(vrm, name) {
                this.vrm = vrm;
                this.name = name;
                this.personality = { ...DEFAULT_PERSONALITY };
                this.enabled = true;
                this.weight = 1.0;
                this.time = 0;
            }

            /**
             * Resolve a VRM humanoid bone by name.
             * @param {string} boneName - Humanoid bone name (e.g. 'spine', 'hips')
             * @returns {Object|null} The bone node or null
             */
            getBone(boneName) {
                return this.vrm.humanoid.getNormalizedBoneNode?.(boneName)
                    || this.vrm.humanoid.getBoneNode?.(boneName)
                    || null;
            }

            /**
             * Update personality parameters from profile object.
             * @param {Object} profile - {energy, confidence, nervousness, expressiveness, playfulness}
             */
            setPersonality(profile) {
                this.personality = { ...DEFAULT_PERSONALITY, ...profile };
            }

            /**
             * Per-frame update. Subclasses override this.
             * @param {number} dt - Delta time in seconds
             */
            update(dt) { this.time += dt; }
        }

        /**
         * Orchestrates all 6 animation layers per frame.
         * Manages suppression rules:
         *   - L3 (Talk) suppresses L1 (Idle) when active
         *   - L4 (Gesture) suppresses L1 and L3 on affected bones during playback
         *   - L5 (LookAt) is always additive
         */
        /* ═══════════════════════════════════════════════════════════════════
           Animation State Machine — Phase 6.5
           Formalizes which layers are active in each state and how transitions
           work. Replaces ad-hoc suppression logic in AnimationDirector.update().

           States:
           ┌──────────┬────────────────────────────────────────────────────────┐
           │ State    │ Active layers                                         │
           ├──────────┼────────────────────────────────────────────────────────┤
           │ idle     │ basePose, idle, emotion, lookAt                       │
           │ talk     │ basePose, emotion, talk, lookAt                       │
           │ gesture  │ basePose, emotion, gesture, lookAt                    │
           │ clip     │ clip, lookAt                                          │
           │ mocap    │ lookAt only (mocap overrides via lookAt layer)        │
           └──────────┴────────────────────────────────────────────────────────┘

           lookAt always runs. clip always updates its mixer (even when
           not the active state) so fadeouts complete naturally.
           ═══════════════════════════════════════════════════════════════════ */

        /**
         * Per-state layer activation table. Each key is a state name;
         * its value is the set of layer names that should be enabled.
         * Layers not listed are disabled. 'lookAt' and 'clip' have
         * special handling (see AnimationDirector.update).
         */
        const STATE_LAYER_TABLE = {
            idle:    new Set(['basePose', 'idle', 'emotion']),
            talk:    new Set(['basePose', 'emotion', 'talk']),
            gesture: new Set(['basePose', 'emotion', 'gesture']),
            clip:    new Set([]),  // clip mixer runs separately
            mocap:   new Set([]),  // mocap drives via lookAt overrides
        };

        /** Crossfade duration (seconds) between states. */
        const STATE_TRANSITIONS = {
            'idle→talk':     0.2,
            'idle→gesture':  0.15,
            'idle→clip':     0.3,
            'idle→mocap':    0.2,
            'talk→idle':     0.3,
            'talk→gesture':  0.15,
            'gesture→idle':  0.25,
            'gesture→talk':  0.2,
            'clip→idle':     0.3,
            'clip→talk':     0.3,
            'mocap→idle':    0.3,
        };

        class AnimationDirector {
            /**
             * @param {Object} vrm - The loaded VRM model
             */
            constructor(vrm) {
                this.vrm = vrm;
                this.layers = [];
                this.personality = { ...DEFAULT_PERSONALITY };
                /** Current animation state name. */
                this._state = 'idle';
                /** Transition fade progress (0 = start, 1 = done). */
                this._transitionProgress = 1.0;
                /** Transition duration in seconds. */
                this._transitionDuration = 0;
            }

            /** @returns {string} Current state name */
            get state() { return this._state; }

            /**
             * Transition to a new animation state with crossfade.
             * If already in the requested state, this is a no-op.
             *
             * @param {string} newState - Target state ('idle'|'talk'|'gesture'|'clip'|'mocap')
             * @param {number} [fadeDuration] - Override crossfade duration (seconds)
             */
            transitionTo(newState, fadeDuration) {
                if (newState === this._state) return;
                if (!STATE_LAYER_TABLE[newState]) {
                    console.warn(`[AnimationDirector] Unknown state: "${newState}"`);
                    return;
                }

                const key = `${this._state}→${newState}`;
                this._transitionDuration = fadeDuration ?? STATE_TRANSITIONS[key] ?? 0.25;
                this._transitionProgress = 0;
                this._state = newState;

                console.log(`[AnimationDirector] State → ${newState} (fade ${this._transitionDuration.toFixed(2)}s)`);
            }

            /**
             * Register a layer. Layers are processed in array order (index = priority).
             * @param {AnimationLayer} layer
             */
            addLayer(layer) {
                layer.setPersonality(this.personality);
                this.layers.push(layer);
            }

            /**
             * Retrieve a layer by name.
             * @param {string} name - Layer name
             * @returns {AnimationLayer|undefined}
             */
            getLayer(name) {
                return this.layers.find(l => l.name === name);
            }

            /**
             * Apply a personality profile to all layers.
             * @param {Object|null} profile - Personality JSON or null for defaults
             */
            setPersonality(profile) {
                this.personality = { ...DEFAULT_PERSONALITY, ...(profile || {}) };
                for (const layer of this.layers) {
                    layer.setPersonality(this.personality);
                }
            }

            /**
             * Per-frame update — uses state machine to determine active layers.
             *
             * The state machine controls which layers are enabled/disabled.
             * It also auto-detects state transitions from layer activity:
             *   - ClipLayer.isPlaying → auto-enter 'clip' state
             *   - GestureLayer.isPlaying → auto-enter 'gesture' state
             *   - TalkLayer.active → auto-enter 'talk' state
             *   - Otherwise → 'idle' state
             *
             * LookAt (L5) always runs regardless of state.
             * Clip mixer always ticks so fadeouts complete even when not in 'clip' state.
             *
             * @param {number} dt - Delta time in seconds
             */
            update(dt) {
                const clip = this.getLayer('clip');
                const gesture = this.getLayer('gesture');
                const talk = this.getLayer('talk');

                // ── Auto-detect state from layer activity ──
                // Priority: clip > gesture > talk > idle
                if (clip && clip.isPlaying && this._state !== 'clip') {
                    this.transitionTo('clip');
                } else if (!clip?.isPlaying && this._state === 'clip') {
                    this.transitionTo('idle');
                } else if (gesture && gesture.isPlaying && this._state === 'idle') {
                    this.transitionTo('gesture');
                } else if (!gesture?.isPlaying && this._state === 'gesture') {
                    this.transitionTo('idle');
                } else if (talk && talk.active && this._state === 'idle') {
                    this.transitionTo('talk');
                } else if (!talk?.active && this._state === 'talk') {
                    this.transitionTo('idle');
                }

                // ── Advance transition ──
                if (this._transitionProgress < 1.0 && this._transitionDuration > 0) {
                    this._transitionProgress = Math.min(1.0,
                        this._transitionProgress + dt / this._transitionDuration);
                }

                // ── Apply layer activation from state table ──
                const activeLayers = STATE_LAYER_TABLE[this._state] || STATE_LAYER_TABLE.idle;
                for (const layer of this.layers) {
                    if (layer.name === 'lookAt') {
                        // LookAt always runs
                        layer.enabled = true;
                    } else if (layer.name === 'clip') {
                        // Clip mixer always ticks (for fadeouts), but only
                        // drives bones when in 'clip' state
                        layer.enabled = true;
                    } else {
                        layer.enabled = activeLayers.has(layer.name);
                    }
                }

                // ── Update all enabled layers ──
                for (const layer of this.layers) {
                    if (layer.enabled) layer.update(dt);
                }
            }
        }

        /**
         * Smooth value noise — returns value in [-1, 1] that never repeats within a session.
         * Uses a quintic smoothstep between pseudo-random lattice values.
         * Replaces Math.sin() for organic, non-repeating idle motion.
         *
         * @param {number} t - Time coordinate (use elapsed seconds * frequency)
         * @param {number} seed - Seed offset so different channels don't correlate
         * @returns {number} Smooth noise in [-1, 1]
         */
        function noise1D(t, seed = 0) {
            const i = Math.floor(t) + seed * 1000;
            const f = t - Math.floor(t);
            // Quintic smoothstep: 6f^5 - 15f^4 + 10f^3 (zero first and second derivative at edges)
            const u = f * f * f * (f * (f * 6 - 15) + 10);
            // Simple integer hash → float in [0, 1]
            const h = (n) => {
                const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
                return x - Math.floor(x);
            };
            return (h(i) * (1 - u) + h(i + 1) * u) * 2 - 1;
        }

        /**
         * L0: Base pose — breathing rhythm and weight distribution.
         * Write mode: SET (=) on chest/spine.
         * Personality influence:
         *   energy → breath speed/depth
         *   confidence → chest-out posture, wider stance
         *   nervousness → faster breathing
         */
        class BasePoseLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'basePose');
            }

            update(dt) {
                super.update(dt);
                const t = this.time;
                const p = this.personality;

                // Breath rate: base Hz varies organically with energy/nervousness.
                // noise1D(t*0.8) drives the main breath cycle (~1.25s period).
                // noise1D(t*0.25) adds a slower drift (deeper/shallower breathing).
                // Using different seeds (0, 1) ensures X and Z rotations are
                // independent — this prevents the "wobbling ship" correlated ellipse.
                const rateScale = 1 + (p.energy - 0.5) * 0.6 + p.nervousness * 0.4;
                const breathAmpX = (0.022 + p.energy * 0.012) * rateScale;
                const breathAmpZ = (0.010 + p.energy * 0.006) * rateScale;

                // Forward/back breath (X) and lateral sway (Z) use DIFFERENT seeds
                // so they are uncorrelated — real breathing has independent axes.
                const breathX = noise1D(t * 0.8, 0) * breathAmpX
                              + noise1D(t * 0.25, 2) * breathAmpX * 0.35;
                const breathZ = noise1D(t * 0.55, 1) * breathAmpZ
                              + noise1D(t * 0.18, 3) * breathAmpZ * 0.4;

                const chest = this.getBone('chest') || this.getBone('spine');
                if (chest) {
                    chest.rotation.x = breathX;
                    chest.rotation.z = breathZ;    // independent from X — no more ship wobble
                }

                // Spine confidence posture
                const spine = this.getBone('spine');
                if (spine && p.confidence > 0.5) {
                    spine.rotation.x -= (p.confidence - 0.5) * 0.03;
                }

                // Head micro-drift — two independent low-frequency noises per axis.
                // Amplitudes are intentionally tiny: below conscious notice but
                // subconsciously read as "the character is alive and thinking."
                const head = this.getBone('head');
                if (head) {
                    head.rotation.x += noise1D(t * 0.2, 10) * 0.010;  // slow forward/back tilt
                    head.rotation.y += noise1D(t * 0.15, 11) * 0.014; // slow side-to-side turn
                }

                // Arm drape — maintained every frame so no other code needs to
                // re-initialise the pose. After resetNormalizedPose(), the normalised
                // leftUpperArm at rotation (0,0,0) is the T-pose (arm pointing outward).
                // Z rotation of ±1.4 (≈80°) brings it to a natural hanging position.
                // X rotation of 0.08 adds a slight forward lean for a relaxed look.
                // These are SET (not additive) values; EmotionLayer / IdleLayer add
                // small deltas on top.
                const lArm  = this.getBone('leftUpperArm');
                const rArm  = this.getBone('rightUpperArm');
                const lFore = this.getBone('leftLowerArm');
                const rFore = this.getBone('rightLowerArm');
                const BASE_Z = 1.4;
                if (lArm)  { lArm.rotation.z  = -BASE_Z; lArm.rotation.x  =  0.08; lArm.rotation.y  =  0.0; }
                if (rArm)  { rArm.rotation.z  =  BASE_Z; rArm.rotation.x  =  0.08; rArm.rotation.y  =  0.0; }
                if (lFore) { lFore.rotation.z = -0.08;   lFore.rotation.y = -0.04; lFore.rotation.x =  0.0; }
                if (rFore) { rFore.rotation.z =  0.08;   rFore.rotation.y =  0.04; rFore.rotation.x =  0.0; }
            }
        }

        /**
         * L1: Idle behavior — personality-driven fidget library.
         * Write mode: SET (=) on affected bones.
         * Suppressed when Talk (L3) or Gesture (L4) is active.
         *
         * A random timer (3–8s, scaled by energy) selects from eligible fidgets
         * based on personality thresholds. Each fidget is a micro-animation
         * lasting 1–3 seconds that modifies specific bones.
         */
        class IdleBehaviorLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'idle');
                this._fidgetTimer = 6 + Math.random() * 9;
                this._activeFidget = null;
                this._fidgetTime = 0;
                this._fidgetDuration = 0;
            }

            /** @type {Array<{name:string, duration:number, requires?:(p:Object)=>boolean, apply:(t:number,p:Object,getBone:(s:string)=>any)=>void}>} */
            static get FIDGETS() {
                // Subtle multi-bone body movements for natural idle behavior.
                // Arm-based gestures (wave, point, etc.) are handled by GestureLayer (L4)
                // or ClipLayer (L6) for proper clip-driven arm animation.
                // Each fidget coordinates 2–4 bones for realistic weight distribution.
                return [
                    {
                        name: 'weight_shift', duration: 2.5,
                        apply(t, p, B) {
                            // Full-body weight shift: hips lead, spine counter-rotates,
                            // shoulders follow to maintain balance
                            const phase = Math.sin(t * Math.PI * 0.8);
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            if (hips) {
                                hips.rotation.y = phase * 0.04;
                                hips.rotation.z = phase * 0.02;
                            }
                            if (spine) spine.rotation.z = phase * -0.015;
                            if (chest) chest.rotation.z = phase * -0.01;
                        }
                    },
                    {
                        name: 'shoulder_roll', duration: 2,
                        apply(t, p, B) {
                            // Asymmetric shoulder roll with neck sympathy
                            const ls = B('leftShoulder'), rs = B('rightShoulder');
                            const neck = B('neck');
                            const phase = t * Math.PI;
                            const v = Math.sin(phase) * 0.05;
                            if (ls) ls.rotation.z = v;
                            if (rs) rs.rotation.z = -v * 0.5;   // delayed follower
                            if (neck) neck.rotation.z = v * 0.2; // neck sympathizes
                        }
                    },
                    {
                        name: 'head_tilt', duration: 1.5,
                        apply(t, p, B) {
                            // Head tilt with subtle neck follow-through
                            const head = B('head'), neck = B('neck');
                            const tilt = Math.sin(t * Math.PI / 1.5) * 0.08;
                            if (neck) neck.rotation.z = tilt * 0.3;
                            if (head) head.rotation.z = tilt;
                        }
                    },
                    {
                        name: 'look_around', duration: 2.5,
                        apply(t, p, B) {
                            // Curious look: neck turns first, head follows with slight delay
                            const head = B('head'), neck = B('neck');
                            const yaw = Math.sin(t * Math.PI * 0.8) * 0.15;
                            const pitch = Math.sin(t * Math.PI * 0.5) * 0.05;
                            if (neck) neck.rotation.y = yaw * 0.4;
                            if (head) {
                                head.rotation.y = yaw;
                                head.rotation.x = pitch;
                            }
                        }
                    },
                    {
                        name: 'deep_breath', duration: 3.5,
                        apply(t, p, B) {
                            // Full deep breath: chest expands, shoulders lift slightly
                            const chest = B('chest') || B('spine');
                            const ls = B('leftShoulder'), rs = B('rightShoulder');
                            const inhale = Math.sin(t * Math.PI * 0.571) * 0.015;
                            if (chest) chest.rotation.x = inhale;
                            // Shoulders lift on inhale (positive phase)
                            const shoulderLift = Math.max(0, inhale) * 2;
                            if (ls) ls.rotation.z = shoulderLift * 0.03;
                            if (rs) rs.rotation.z = -shoulderLift * 0.03;
                        }
                    },
                    {
                        name: 'subtle_sway', duration: 3,
                        apply(t, p, B) {
                            // Gentle pendulum sway: hips and spine counter-rotate
                            const hips = B('hips'), spine = B('spine');
                            const head = B('head');
                            const s = Math.sin(t * Math.PI * 0.667) * 0.02;
                            if (hips) hips.rotation.z = s;
                            if (spine) spine.rotation.z = s * -0.5;
                            if (head) head.rotation.z = s * -0.3; // head stays level
                        }
                    },
                    {
                        name: 'ankle_cross', duration: 3,
                        apply(t, p, B) {
                            // Leg cross with compensating hip shift
                            const lLeg = B('leftUpperLeg'), hips = B('hips');
                            const v = Math.sin(t * Math.PI * 0.5) * 0.04;
                            if (lLeg) lLeg.rotation.z = v;
                            if (hips) hips.rotation.z = v * 0.3; // lean into it
                        }
                    },
                    {
                        name: 'hip_cock', duration: 2.5,
                        requires: (p) => p.confidence > 0.6,
                        apply(t, p, B) {
                            // Sassy hip pop: hips shift, spine and chest counter-balance
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            const blend = Math.sin(t * Math.PI * 0.4);
                            if (hips) { hips.rotation.z = blend * 0.06; hips.rotation.y = blend * 0.03; }
                            if (spine) spine.rotation.z = blend * -0.03;
                            if (chest) chest.rotation.z = blend * -0.02;
                        }
                    },
                    {
                        name: 'curtsy_bob', duration: 2,
                        requires: (p) => p.playfulness > 0.5,
                        apply(t, p, B) {
                            // Small dip with head bob — playful personality only
                            const hips = B('hips'), spine = B('spine'), head = B('head');
                            const dip = Math.sin(t * Math.PI * 0.5);
                            if (hips) hips.position.y = -dip * 0.02;
                            if (spine) spine.rotation.x = dip * 0.04;
                            if (head) head.rotation.x = dip * 0.03;
                        }
                    },
                    {
                        name: 'bounce', duration: 1.2,
                        requires: (p) => p.energy > 0.6,
                        apply(t, p, B) {
                            // Energetic bounce: hips bob, shoulders bounce in sync
                            const hips = B('hips'), ls = B('leftShoulder'), rs = B('rightShoulder');
                            const v = Math.abs(Math.sin(t * Math.PI * 1.67)) * 0.015;
                            if (hips) hips.position.y = v;
                            if (ls) ls.rotation.z = v * 1.5;
                            if (rs) rs.rotation.z = -v * 1.5;
                        }
                    },
                    {
                        name: 'foot_tap', duration: 2,
                        requires: (p) => p.energy > 0.4,
                        apply(t, p, B) {
                            // Foot tap with matching hip micro-bounce
                            const leg = B('rightUpperLeg'), hips = B('hips');
                            const tap = Math.abs(Math.sin(t * Math.PI * 3)) * 0.03;
                            if (leg) leg.rotation.x = tap;
                            if (hips) hips.position.y = tap * 0.15; // tiny sympathetic lift
                        }
                    },
                    {
                        name: 'neck_stretch', duration: 2,
                        apply(t, p, B) {
                            // Neck roll/stretch — subtle self-comfort behavior
                            const neck = B('neck'), head = B('head');
                            const ls = B('leftShoulder');
                            const phase = t * Math.PI * 0.5;
                            if (neck) {
                                neck.rotation.z = Math.sin(phase) * 0.08;
                                neck.rotation.x = Math.sin(phase * 0.7) * 0.03;
                            }
                            if (head) head.rotation.z = Math.sin(phase) * 0.04;
                            if (ls) ls.rotation.z = -Math.abs(Math.sin(phase)) * 0.03; // dip shoulder
                        }
                    },
                    {
                        name: 'settle', duration: 2,
                        apply(t, p, B) {
                            // Full-body settle: micro-squat then return — like resettling stance
                            const hips = B('hips'), spine = B('spine'), chest = B('chest');
                            const dip = Math.sin(t * Math.PI * 0.5);
                            if (hips) hips.position.y = -Math.abs(dip) * 0.01;
                            if (spine) spine.rotation.x = dip * 0.01;
                            if (chest) chest.rotation.x = dip * -0.005;
                        }
                    },
                    {
                        name: 'head_nod_slow', duration: 2,
                        requires: (p) => p.nervousness < 0.5,
                        apply(t, p, B) {
                            // Slow contemplative nod, as if lost in thought
                            const head = B('head'), neck = B('neck');
                            const v = Math.sin(t * Math.PI * 0.5) * 0.06;
                            if (neck) neck.rotation.x = v * 0.3;
                            if (head) head.rotation.x = v;
                        }
                    },
                    {
                        name: 'gentle_arm_sway', duration: 3.5,
                        apply(t, p, B) {
                            // Subtle pendulum arm swing — complements breathing.
                            // Adds to the BasePoseLayer drape (which sets the base).
                            const lArm = B('leftUpperArm'), rArm = B('rightUpperArm');
                            const amp = 0.05 * (0.6 + p.energy * 0.8);
                            const phase = Math.sin(t * Math.PI * 0.57);
                            // Arms sway slightly counter-phase (natural balanced stance)
                            if (lArm) { lArm.rotation.x += phase * amp;       lArm.rotation.z += phase * -0.015; }
                            if (rArm) { rArm.rotation.x += phase * -amp * 0.7; rArm.rotation.z += phase *  0.015; }
                        }
                    },
                    {
                        name: 'arm_self_hug', duration: 3,
                        requires: (p) => p.nervousness > 0.35,
                        apply(t, p, B) {
                            // Nervous self-hug: arms pull slightly inward and forearms fold in.
                            const lArm = B('leftUpperArm'), rArm = B('rightUpperArm');
                            const lFore = B('leftLowerArm'), rFore = B('rightLowerArm');
                            const blend = Math.sin(t * Math.PI * 0.33) * 0.5 + 0.5;
                            const s = p.nervousness * 0.5;
                            if (lArm)  { lArm.rotation.y  += blend * 0.15 * s; lArm.rotation.z  -= blend * 0.07 * s; }
                            if (rArm)  { rArm.rotation.y  -= blend * 0.15 * s; rArm.rotation.z  += blend * 0.07 * s; }
                            if (lFore) lFore.rotation.y -= blend * 0.35 * s;
                            if (rFore) rFore.rotation.y += blend * 0.35 * s;
                        }
                    },
                    {
                        name: 'hand_to_chin', duration: 2.2,
                        requires: (p) => p.expressiveness > 0.3,
                        apply(t, p, B) {
                            // Thoughtful pose: left arm raises, forearm folds toward chin.
                            const lArm = B('leftUpperArm'), lFore = B('leftLowerArm');
                            const blend = Math.sin(t * Math.PI * 0.45);
                            if (lArm)  { lArm.rotation.z  += blend * -0.18; lArm.rotation.x += blend * 0.12; }
                            if (lFore) lFore.rotation.y -= blend * 0.55;
                        }
                    },
                ];
            }

            update(dt) {
                // Photo Mode: skip fidget scheduling when frozen
                if (this._frozen) return;
                super.update(dt);
                const p = this.personality;

                if (this._activeFidget) {
                    this._fidgetTime += dt;
                    const progress = this._fidgetTime / this._fidgetDuration;
                    if (progress >= 1) {
                        this._activeFidget = null;
                        this._fidgetTime = 0;
                        const baseWait = 6 + Math.random() * 9;
                        this._fidgetTimer = baseWait * (1.3 - p.energy * 0.6);
                    } else {
                        let envelope = 1;
                        if (progress < 0.15) envelope = progress / 0.15;
                        else if (progress > 0.85) envelope = (1 - progress) / 0.15;

                        this._activeFidget.apply(
                            this._fidgetTime * envelope,
                            p,
                            (name) => this.getBone(name)
                        );
                    }
                    return;
                }

                this._fidgetTimer -= dt;
                if (this._fidgetTimer <= 0) {
                    const inPetMode = new URLSearchParams(location.search).get('pet') === '1';
                    const eligible = IdleBehaviorLayer.FIDGETS.filter(
                        f => (!f.requires || f.requires(p)) && (!f.petModeOnly || inPetMode)
                    );
                    if (eligible.length > 0) {
                        const pick = eligible[Math.floor(Math.random() * eligible.length)];
                        this._activeFidget = pick;
                        this._fidgetTime = 0;
                        // Blend-in/out duration: minimum 0.6s for slow, natural entrances
                        this._fidgetDuration = Math.max(pick.duration, 0.6) * (0.8 + p.expressiveness * 0.4);
                    }
                    // Increased minimum wait: 8–18s so fidgets feel occasional, not mechanical.
                    // Energy personality reduces wait (energetic chars fidget more).
                    const baseWait = 8 + Math.random() * 10;
                    this._fidgetTimer = baseWait * (1.3 - p.energy * 0.5);
                }
            }
        }

        /**
         * L2: Emotion modifier — posture bias from current emotion.
         * Write mode: ADDITIVE (+=) on spine, hips, shoulders.
         * Replaces the old ProceduralAnimator class.
         */
        class EmotionLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'emotion');
                this.currentEmotion = 'neutral';
                this.intensity = 0.7;
            }

            setEmotion(emotion, intensity = 0.7) {
                this.currentEmotion = emotion || 'neutral';
                this.intensity = Math.max(0, Math.min(1, intensity));
            }

            update(dt) {
                // Photo Mode: hold current emotion posture when frozen
                if (this._frozen) return;
                super.update(dt);
                const t = this.time;
                const p = this.personality;
                const hips = this.getBone('hips');
                const spine = this.getBone('spine');
                const expressScale = 0.5 + p.expressiveness * 1.0;
                const intensity = this.intensity * expressScale;

                // Emotion layer uses assignment (=) not additive (+=).
                // These are absolute offsets from neutral, not per-frame deltas.
                if (hips) {
                    const swayNoise = 1 + Math.sin(t * 0.09) * 0.2;
                    hips.rotation.y = Math.sin(t * 0.3) * 0.02 * swayNoise * intensity;
                }

                const emo = this.currentEmotion;
                const effectiveEmo = (p.playfulness > 0.6 && emo === 'angry') ? 'pouty' : emo;

                switch (effectiveEmo) {
                    case 'happy':
                    case 'excited': {
                        const scale = emo === 'excited' ? 1.3 : 1.0;
                        const happyBoost = 1 + p.playfulness * 0.5;
                        if (hips) hips.position.y = Math.sin(t * 3) * 0.008 * intensity * scale * happyBoost;
                        if (spine) spine.rotation.z = Math.sin(t * 1.5) * 0.02 * intensity * happyBoost;
                        break;
                    }
                    case 'sad': {
                        const nervBoost = 1 + p.nervousness * 0.5;
                        if (spine) {
                            spine.rotation.x = 0.03 * intensity * nervBoost;
                            spine.rotation.z = Math.sin(t * 0.5) * 0.005 * intensity;
                        }
                        break;
                    }
                    case 'angry': {
                        const nervBoost = 1 + p.nervousness * 0.4;
                        if (spine) spine.rotation.z = Math.sin(t * 8) * 0.003 * intensity * nervBoost;
                        break;
                    }
                    case 'pouty': {
                        if (spine) spine.rotation.z = Math.sin(t * 1.2) * 0.015 * intensity;
                        if (hips) hips.rotation.y = Math.sin(t * 0.8) * 0.015 * intensity;
                        break;
                    }
                    case 'embarrassed':
                    case 'shy': {
                        if (spine) spine.rotation.x = 0.04 * intensity;
                        const ls = this.getBone('leftShoulder'), rs = this.getBone('rightShoulder');
                        if (ls) ls.rotation.z = 0.03 * intensity;
                        if (rs) rs.rotation.z = -0.03 * intensity;
                        break;
                    }
                }

                // ── Emotion-driven arm language (additive onto BasePoseLayer drape) ──
                // BasePoseLayer sets the base arm position each frame; these are small
                // deltas layered on top so arms always stay within a natural range.
                const lArm  = this.getBone('leftUpperArm');
                const rArm  = this.getBone('rightUpperArm');
                const lFore = this.getBone('leftLowerArm');
                const rFore = this.getBone('rightLowerArm');

                switch (this.currentEmotion) {
                    case 'happy':
                    case 'excited': {
                        // Open, expansive — arms lift slightly (positive z delta raises arm)
                        const lift = 0.13 * intensity * (this.currentEmotion === 'excited' ? 1.4 : 1.0);
                        if (lArm) lArm.rotation.z += lift;
                        if (rArm) rArm.rotation.z -= lift;
                        break;
                    }
                    case 'sad': {
                        // Arms heavier, drooped further down, slight inward turn
                        if (lArm)  { lArm.rotation.z  -= 0.09 * intensity; lArm.rotation.x  -= 0.04 * intensity; }
                        if (rArm)  { rArm.rotation.z  += 0.09 * intensity; rArm.rotation.x  -= 0.04 * intensity; }
                        if (lFore) lFore.rotation.z -= 0.04 * intensity;
                        if (rFore) rFore.rotation.z += 0.04 * intensity;
                        break;
                    }
                    case 'embarrassed':
                    case 'shy': {
                        // Arms pulled close to body — protective, self-conscious posture
                        if (lArm) { lArm.rotation.y +=  0.14 * intensity; lArm.rotation.z -= 0.06 * intensity; }
                        if (rArm) { rArm.rotation.y -= 0.14 * intensity; rArm.rotation.z += 0.06 * intensity; }
                        break;
                    }
                    case 'angry': {
                        // Tense, arms raised slightly — confrontational stance
                        if (lArm) { lArm.rotation.z += 0.08 * intensity; lArm.rotation.y -= 0.05 * intensity; }
                        if (rArm) { rArm.rotation.z -= 0.08 * intensity; rArm.rotation.y += 0.05 * intensity; }
                        break;
                    }
                    case 'surprised': {
                        // Slight arm startle — both arms pull in briefly
                        const startle = Math.min(1, this.time * 2) * intensity * 0.07;
                        if (lArm) lArm.rotation.x += startle;
                        if (rArm) rArm.rotation.x += startle;
                        break;
                    }
                }
            }
        }

        /**
         * L3: Talk behavior — conversational body language when isTalking is true.
         * Write mode: SET (=) on hands, head, spine.
         * Suppresses L1 (Idle) when active.
         */
        class TalkLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'talk');
                this.active = false;
                this._nodTimer = 0;
                this._nodCooldown = 1.5 + Math.random() * 2;
                this._shiftTimer = 0;
            }

            setTalking(talking) {
                this.active = !!talking;
                if (!talking) {
                    this._nodTimer = 0;
                    this._shiftTimer = 0;
                }
            }

            update(dt) {
                if (!this.active) return;
                super.update(dt);
                const t = this.time;
                const p = this.personality;
                const expressScale = 0.5 + p.expressiveness;
                const spread = 0.5 + p.confidence * 0.5 - p.nervousness * 0.3;

                // Arms: subtle gestural movement while speaking.
                // Upper arms oscillate at slightly different frequencies for asymmetry.
                const lArm = this.getBone('leftUpperArm');
                const rArm = this.getBone('rightUpperArm');
                const handAmp = 0.08 * spread * expressScale;
                if (lArm) {
                    lArm.rotation.z = -1.3 + Math.sin(t * 1.8) * handAmp;
                    lArm.rotation.x = Math.sin(t * 1.3) * handAmp * 0.5;
                }
                if (rArm) {
                    rArm.rotation.z = 1.3 - Math.sin(t * 2.1 + 1) * handAmp;
                    rArm.rotation.x = Math.sin(t * 1.5 + 0.5) * handAmp * 0.5;
                }

                // Forearms: gentle wrist rotation that accompanies speech gestures
                const lFore = this.getBone('leftLowerArm');
                const rFore = this.getBone('rightLowerArm');
                if (lFore) lFore.rotation.y = 0.15 + Math.sin(t * 1.4) * handAmp * 0.3;
                if (rFore) rFore.rotation.y = -0.15 - Math.sin(t * 1.7 + 0.8) * handAmp * 0.3;

                // Head nods: periodic agreement nods, more frequent with playfulness
                this._nodTimer += dt;
                const head = this.getBone('head');
                const neck = this.getBone('neck');
                if (this._nodTimer >= this._nodCooldown && head) {
                    const nodProgress = (this._nodTimer - this._nodCooldown) / 0.3;
                    if (nodProgress < 1) {
                        const nodV = Math.sin(nodProgress * Math.PI) * 0.08;
                        head.rotation.x = nodV;
                        if (neck) neck.rotation.x = nodV * 0.3; // neck follows head
                    } else {
                        this._nodTimer = 0;
                        const playBoost = 1 + p.playfulness * 0.5;
                        this._nodCooldown = (1.2 + Math.random() * 1.5) / playBoost;
                    }
                }

                // Playful head tilt while talking
                if (head && p.playfulness > 0.4) {
                    head.rotation.z = Math.sin(t * 0.7) * 0.04 * p.playfulness;
                }

                // Spine: slight forward lean (engaged posture) during speech
                const spine = this.getBone('spine');
                if (spine) {
                    spine.rotation.x = -0.015 * expressScale;
                }

                // Shoulders: micro-movement that accompanies expressive speech
                const ls = this.getBone('leftShoulder');
                const rs = this.getBone('rightShoulder');
                if (ls) ls.rotation.z = Math.sin(t * 1.1) * 0.015 * expressScale;
                if (rs) rs.rotation.z = -Math.sin(t * 1.3 + 0.5) * 0.015 * expressScale;

                // Periodic weight shift (every ~4s) — restless energy while speaking
                this._shiftTimer += dt;
                if (this._shiftTimer > 4) {
                    const hips = this.getBone('hips');
                    const shiftProgress = (this._shiftTimer - 4) / 2;
                    if (shiftProgress < 1 && hips) {
                        hips.rotation.y = Math.sin(shiftProgress * Math.PI) * 0.03;
                    } else {
                        this._shiftTimer = 0;
                    }
                }
            }
        }

        /**
         * L4: Gesture override — triggered animations (wave, dance, etc.).
         * Write mode: SET (=) on affected bones during playback.
         * Suppresses L1 and L3 on affected bones when playing.
         * Uses smooth 3-phase blend: 15% ease-in, 70% hold, 15% ease-out.
         */
        class GestureLayer extends AnimationLayer {
            constructor(vrm) {
                super(vrm, 'gesture');
                this.isPlaying = false;
                this.currentGesture = null;
                this._gestureTime = 0;
                this._gestureDuration = 0;
                this._gestureSequence = [];
                this._sequenceIndex = 0;
            }

            _envelope(progress) {
                if (progress < 0.15) return progress / 0.15;
                if (progress > 0.85) return (1 - progress) / 0.15;
                return 1;
            }

            playGesture(gestureName) {
                const gestureDef = GestureLayer.GESTURES[gestureName];
                if (!gestureDef) return;
                this.currentGesture = gestureName;
                this.isPlaying = true;
                this._gestureTime = 0;
                this._gestureDuration = gestureDef.duration;
            }

            playSequence(sequence) {
                if (!Array.isArray(sequence) || sequence.length === 0) return;
                this._gestureSequence = sequence;
                this._sequenceIndex = 0;
                this.playGesture(sequence[0].gesture || sequence[0]);
            }

            update(dt) {
                if (!this.isPlaying || !this.currentGesture) return;
                // Photo Mode: hold gesture at current frame when frozen
                if (this._frozen) {
                    const gestureDef = GestureLayer.GESTURES[this.currentGesture];
                    if (gestureDef) {
                        const progress = this._gestureTime / this._gestureDuration;
                        const envelope = this._envelope(Math.min(progress, 0.5));
                        const expressScale = 0.5 + this.personality.expressiveness;
                        gestureDef.apply(this._gestureTime, envelope * expressScale, (name) => this.getBone(name));
                    }
                    return;
                }
                super.update(dt);

                this._gestureTime += dt;
                const progress = this._gestureTime / this._gestureDuration;

                if (progress >= 1) {
                    this.isPlaying = false;
                    this.currentGesture = null;
                    this._gestureTime = 0;

                    if (this._gestureSequence.length > 0) {
                        this._sequenceIndex++;
                        if (this._sequenceIndex < this._gestureSequence.length) {
                            const next = this._gestureSequence[this._sequenceIndex];
                            const delay = next.delay || 0.3;
                            setTimeout(() => {
                                this.playGesture(next.gesture || next);
                            }, delay * 1000);
                        } else {
                            this._gestureSequence = [];
                            this._sequenceIndex = 0;
                        }
                    }
                    return;
                }

                const envelope = this._envelope(progress);
                const expressScale = 0.5 + this.personality.expressiveness;
                const amp = envelope * expressScale;
                const t = this._gestureTime;
                const gestureDef = GestureLayer.GESTURES[this.currentGesture];
                if (gestureDef) {
                    gestureDef.apply(t, amp, (name) => this.getBone(name));
                }
            }

            static get GESTURES() {
                return {
                    nod: {
                        duration: 0.8,
                        apply(t, amp, B) {
                            const head = B('head');
                            if (head) head.rotation.x = Math.sin(t * Math.PI * 2.5) * 0.15 * amp;
                        }
                    },
                    tilt: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const head = B('head');
                            if (head) head.rotation.z = Math.sin(t * Math.PI) * 0.2 * amp;
                        }
                    },
                    wave: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const arm = B('rightUpperArm');
                            if (arm) {
                                arm.rotation.z = (1.3 - 1.3 * amp);
                                arm.rotation.x = Math.sin(t * Math.PI * 3) * 0.3 * amp;
                            }
                        }
                    },
                    shrug: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ls = B('leftShoulder'), rs = B('rightShoulder');
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const v = Math.sin(t * Math.PI / 1.2) * amp;
                            if (ls) ls.rotation.y = -0.15 * v;
                            if (rs) rs.rotation.y = 0.15 * v;
                            if (la) la.rotation.z = -1.3 + 0.2 * v;
                            if (ra) ra.rotation.z = 1.3 - 0.2 * v;
                        }
                    },
                    bow: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const spine = B('spine'), head = B('head');
                            const v = Math.sin(t * Math.PI / 2) * amp;
                            if (spine) spine.rotation.x = 0.3 * v;
                            if (head) head.rotation.x = 0.15 * v;
                        }
                    },
                    clap: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const cycle = Math.sin(t * Math.PI * 4) * amp;
                            if (la) { la.rotation.z = -1.3 + 0.5 * amp; la.rotation.x = 0.3 * amp + cycle * 0.1; }
                            if (ra) { ra.rotation.z = 1.3 - 0.5 * amp; ra.rotation.x = 0.3 * amp - cycle * 0.1; }
                        }
                    },
                    think: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            if (ra) { ra.rotation.z = 1.3 - 0.6 * amp; ra.rotation.x = 0.3 * amp; }
                            if (head) head.rotation.z = Math.sin(t * 0.5) * 0.1 * amp;
                        }
                    },
                    point: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm');
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.9 * amp;
                                ra.rotation.x = -0.2 * amp;
                            }
                        }
                    },
                    celebrate: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const hips = B('hips');
                            if (la) la.rotation.z = -1.3 - 0.8 * amp;
                            if (ra) ra.rotation.z = 1.3 + 0.8 * amp;
                            if (hips) hips.position.y = Math.sin(t * Math.PI * 3) * 0.01 * amp;
                        }
                    },
                    shy: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const head = B('head'), spine = B('spine');
                            if (head) { head.rotation.x = 0.15 * amp; head.rotation.z = 0.1 * amp; }
                            if (spine) spine.rotation.x = 0.05 * amp;
                        }
                    },
                    dance: {
                        duration: 3.0,
                        apply(t, amp, B) {
                            const hips = B('hips'), la = B('leftUpperArm'), ra = B('rightUpperArm');
                            if (hips) {
                                hips.rotation.y = Math.sin(t * Math.PI * 2) * 0.1 * amp;
                                hips.position.y = Math.abs(Math.sin(t * Math.PI * 3)) * 0.015 * amp;
                            }
                            if (la) la.rotation.z = -1.3 + Math.sin(t * Math.PI * 2.5) * 0.4 * amp;
                            if (ra) ra.rotation.z = 1.3 - Math.sin(t * Math.PI * 2.5 + 1) * 0.4 * amp;
                        }
                    },
                    foot_tap: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const leg = B('rightUpperLeg');
                            if (leg) leg.rotation.x = Math.abs(Math.sin(t * Math.PI * 3)) * 0.06 * amp;
                        }
                    },
                    crossed_arms: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            if (la) { la.rotation.z = -1.3 + 0.4 * amp; la.rotation.x = 0.5 * amp; }
                            if (ra) { ra.rotation.z = 1.3 - 0.4 * amp; ra.rotation.x = 0.5 * amp; }
                        }
                    },
                    shake: {
                        duration: 0.8,
                        apply(t, amp, B) {
                            const head = B('head');
                            if (head) head.rotation.y = Math.sin(t * Math.PI * 5) * 0.12 * amp;
                        }
                    },
                    // ── Phase 6: Expanded Gesture Library (15 new gestures) ──
                    facepalm: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.5) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.7 * v; ra.rotation.x = 0.4 * v; }
                            if (head) head.rotation.x = 0.2 * v;
                        }
                    },
                    stretch: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), spine = B('spine');
                            const v = Math.sin(t * Math.PI / 2.5) * amp;
                            if (la) la.rotation.z = -1.3 - 0.6 * v;
                            if (ra) ra.rotation.z = 1.3 + 0.6 * v;
                            if (spine) spine.rotation.x = -0.1 * v;
                        }
                    },
                    wink: {
                        duration: 0.6,
                        apply(t, amp, B) {
                            // Wink is expression-based (handled via expressionController)
                            // but we add a slight head tilt for physicality
                            const head = B('head');
                            if (head) head.rotation.z = Math.sin(t * Math.PI) * 0.06 * amp;
                        }
                    },
                    yawn: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), head = B('head'), spine = B('spine');
                            const v = Math.sin(t * Math.PI / 2) * amp;
                            if (la) la.rotation.z = -1.3 - 0.5 * v;
                            if (ra) ra.rotation.z = 1.3 + 0.5 * v;
                            if (head) head.rotation.x = -0.1 * v;
                            if (spine) spine.rotation.x = -0.05 * v;
                        }
                    },
                    // ── Pet-mode exclusive fidgets ──────────────────────────────────────
                    // These are NOT auto-scheduled by IdleBehaviorLayer. They are triggered
                    // externally from PetView.tsx via postMessage({ type: 'playGesture', gesture: '...' }).
                    // petModeOnly: true — excluded from the random auto-scheduler's eligible pool.
                    doze: {
                        duration: 4.0,
                        petModeOnly: true,
                        apply(t, amp, B) {
                            // Gradual head droop with slow hold — simulates the character dozing.
                            // Head tips forward over the first 60% then holds slightly drooped.
                            const head = B('head'), spine = B('spine'), neck = B('neck');
                            const droop = Math.min(1.0, t / 0.6);  // ramp in over first 60%
                            const breathe = Math.sin(t * Math.PI * 1.5) * 0.015;  // slow breathing
                            if (head) { head.rotation.x = droop * 0.35 * amp; head.rotation.z = droop * 0.05 * amp; }
                            if (neck) neck.rotation.x = droop * 0.18 * amp;
                            if (spine) spine.rotation.x = droop * 0.08 * amp + breathe;
                        }
                    },
                    wake_up: {
                        duration: 1.2,
                        petModeOnly: true,
                        apply(t, amp, B) {
                            // Quick startle — head snaps up, then settles back to neutral.
                            // Sharp surprised recoil in first 30%, gradual settle in remaining 70%.
                            const head = B('head'), spine = B('spine'), neck = B('neck');
                            const la = B('leftUpperArm'), ra = B('rightUpperArm');
                            const snapT = t < 0.3 ? t / 0.3 : 1.0 - (t - 0.3) / 0.7;
                            const recoil = Math.sin(snapT * Math.PI) * amp;
                            if (head) { head.rotation.x = -recoil * 0.25; head.rotation.y = recoil * 0.04; }
                            if (neck) neck.rotation.x = -recoil * 0.12;
                            if (spine) spine.rotation.x = -recoil * 0.06;
                            // Arms raise slightly from the startle before settling
                            if (la) la.rotation.z = -1.3 - recoil * 0.2;
                            if (ra) ra.rotation.z = 1.3 + recoil * 0.2;
                        }
                    },
                    wave_at_cursor: {
                        duration: 2.5,
                        petModeOnly: true,
                        apply(t, amp, B) {
                            // Friendly wave toward the user's cursor.
                            // Right arm raises (first 25%), then waves 2.5 cycles, then lowers.
                            const ra = B('rightUpperArm'), rLower = B('rightLowerArm'), head = B('head');
                            const raiseT = Math.min(1.0, t / 0.25);              // arm-up ramp
                            const wave = Math.sin(t * Math.PI * 5) * 0.22;       // wave oscillation
                            const lowerT = t > 0.75 ? (t - 0.75) / 0.25 : 0;   // arm-down ramp
                            const armUp = (raiseT - lowerT) * amp;
                            if (ra) {
                                ra.rotation.z = (1.3 - 0.95 * armUp);
                                ra.rotation.x = armUp * 0.3 + wave * armUp;
                            }
                            if (rLower) rLower.rotation.x = armUp * 0.4;
                            // Slight head turn toward the wave (friendly acknowledgment)
                            if (head) head.rotation.z = -armUp * 0.06;
                        }
                    },
                    scratch: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.2) * amp;
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.6 * v;
                                ra.rotation.x = Math.sin(t * Math.PI * 4) * 0.1 * amp;
                            }
                            if (head) head.rotation.z = 0.08 * v;
                        }
                    },
                    peek: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const head = B('head'), spine = B('spine');
                            const v = Math.sin(t * Math.PI) * amp;
                            if (spine) spine.rotation.x = 0.15 * v;
                            if (head) { head.rotation.x = 0.1 * v; head.rotation.z = 0.05 * v; }
                        }
                    },
                    hug_self: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), spine = B('spine');
                            const v = Math.sin(t * Math.PI / 1.5) * amp;
                            if (la) { la.rotation.z = -1.3 + 0.6 * v; la.rotation.x = 0.4 * v; }
                            if (ra) { ra.rotation.z = 1.3 - 0.6 * v; ra.rotation.x = 0.4 * v; }
                            if (spine) spine.rotation.x = 0.05 * v;
                        }
                    },
                    finger_wag: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm');
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.7 * amp;
                                ra.rotation.y = Math.sin(t * Math.PI * 4) * 0.15 * amp;
                            }
                        }
                    },
                    peace_sign: {
                        duration: 1.2,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
