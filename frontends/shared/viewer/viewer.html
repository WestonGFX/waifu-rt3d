             * @param {THREE.DirectionalLight} rim - Rim light reference
             * @param {THREE.AmbientLight} ambient - Ambient light reference
             */
            constructor(key, fill, rim, ambient) {
                this.keyLight = key;
                this.fillLight = fill;
                this.rimLight = rim;
                this.ambientLight = ambient;
                this.currentHour = 12; // default noon
                this.autoMode = false;
                this._autoInterval = null;
                this._tempColor = new THREE.Color();
            }

            /**
             * Set lighting to match a specific hour.
             * Interpolates between the two surrounding presets.
             *
             * @param {number} hour - Hour 0-23 (fractional OK, e.g. 14.5)
             * @param {boolean} [animate=true] - Whether to lerp or snap
             */
            setHour(hour, animate = true) {
                this.currentHour = hour;
                const { from, to, t } = getTimeOfDayBlend(hour);
                const a = TIME_OF_DAY_PRESETS[from];
                const b = TIME_OF_DAY_PRESETS[to];

                this._lerpLight(this.keyLight,     a.key,     b.key,     t);
                this._lerpLight(this.fillLight,    a.fill,    b.fill,    t);
                this._lerpLight(this.rimLight,     a.rim,     b.rim,     t);
                this._lerpLight(this.ambientLight, a.ambient, b.ambient, t);
            }

            /**
             * Enable auto mode — syncs lighting to the user's local clock.
             * Updates every 60 seconds.
             */
            enableAuto() {
                this.autoMode = true;
                this._syncToRealTime();
                this._autoInterval = setInterval(() => this._syncToRealTime(), 60000);
            }

            /**
             * Disable auto mode — freezes at current lighting.
             */
            disableAuto() {
                this.autoMode = false;
                if (this._autoInterval) {
                    clearInterval(this._autoInterval);
                    this._autoInterval = null;
                }
            }

            /**
             * Sync lighting to the user's local clock time.
             */
            _syncToRealTime() {
                const now = new Date();
                const hour = now.getHours() + now.getMinutes() / 60;
                this.setHour(hour);
            }

            /**
             * Interpolate a single light's color and intensity between two presets.
             *
             * @param {THREE.Light} light - The light to modify
             * @param {{color: number, intensity: number}} a - From preset
             * @param {{color: number, intensity: number}} b - To preset
             * @param {number} t - Blend factor 0-1
             */
            _lerpLight(light, a, b, t) {
                const colorA = this._tempColor.set(a.color);
                const colorB = new THREE.Color(b.color);
                light.color.copy(colorA).lerp(colorB, t);
                light.intensity = a.intensity + (b.intensity - a.intensity) * t;
            }
        }

        // ══════════════════════════════════════════════════════════
        // Procedural Pose System (Phase 11A)
        // ══════════════════════════════════════════════════════════

        /**
         * Pose definitions — each specifies bone rotations (Euler angles in radians)
         * and a camera preset suggestion.
         *
         * Bone names follow the VRM humanoid specification:
         *   hips, spine, chest, upperChest, neck, head,
         *   leftUpperLeg, leftLowerLeg, rightUpperLeg, rightLowerLeg,
         *   leftUpperArm, leftLowerArm, rightUpperArm, rightLowerArm
         *
         * Only bones that differ from the default standing pose are listed.
         * The PoseController lerps from current rotations to target rotations.
         *
         * @type {Object<string, {bones: Object<string, {x?: number, y?: number, z?: number}>, camera: string, yOffset: number, description: string}>}
         */
        const POSE_DEFINITIONS = {
            standing: {
                bones: {},  // default T-pose reset
                camera: 'fullbody',
                yOffset: 0,
                description: "You're standing together, facing each other",
            },
            sitting_couch: {
                bones: {
                    hips:          { x: -0.5 },                     // tilt pelvis back
                    spine:         { x: 0.15 },                     // slight lean back
                    leftUpperLeg:  { x: -1.4, z: 0.1 },            // thighs forward+spread
                    rightUpperLeg: { x: -1.4, z: -0.1 },
                    leftLowerLeg:  { x: 1.2 },                     // knees bent ~70°
                    rightLowerLeg: { x: 1.2 },
                    leftUpperArm:  { x: 0, z: 0.3 },               // arms resting at sides
                    rightUpperArm: { x: 0, z: -0.3 },
                    leftLowerArm:  { x: -0.3 },                    // forearms on lap
                    rightLowerArm: { x: -0.3 },
                },
                camera: 'bust',
                yOffset: -0.35,  // lower character for seated position
                description: "You're both sitting on the couch together, relaxing",
            },
            sitting_desk: {
                bones: {
                    hips:          { x: -0.4 },
                    spine:         { x: 0.25 },                     // leaning slightly forward
                    chest:         { x: 0.05 },
                    leftUpperLeg:  { x: -1.57 },                   // 90° thighs
                    rightUpperLeg: { x: -1.57 },
                    leftLowerLeg:  { x: 1.57 },                    // 90° knees
                    rightLowerLeg: { x: 1.57 },
                    leftUpperArm:  { x: -0.3, z: 0.2 },            // arms forward on desk
                    rightUpperArm: { x: -0.3, z: -0.2 },
                    leftLowerArm:  { x: -0.8 },                    // forearms on desk
                    rightLowerArm: { x: -0.8 },
                },
                camera: 'bust',
                yOffset: -0.35,
                description: "You're sitting at the desk together, close by",
            },
            lying_bed: {
                bones: {
                    hips:          { x: -1.57 },                   // lying flat
                    spine:         { x: 0.1 },                     // slight arch
                    neck:          { x: 0.2 },                     // head propped
                    head:          { x: 0.15 },
                    leftUpperLeg:  { x: 0 },                       // legs straight
                    rightUpperLeg: { x: 0 },
                    leftLowerLeg:  { x: 0.1 },                     // slight knee bend
                    rightLowerLeg: { x: 0.1 },
                    leftUpperArm:  { x: 0, z: 0.5 },               // arms splayed
                    rightUpperArm: { x: 0, z: -0.5 },
                    leftLowerArm:  { x: -0.4 },
                    rightLowerArm: { x: -0.4 },
                },
                camera: 'bust',
                yOffset: -0.6,  // lower for lying
                description: "You're lying on the bed together, comfortable and cozy",
            },
        };

        /**
         * Controls character poses by smoothly interpolating VRM bone rotations.
         *
         * Uses per-frame lerp for smooth transitions (0.3-0.5s crossfade)
         * rather than snapping. Each pose also suggests a camera preset
         * and Y-offset for the character's root position.
         *
         * The controller stores starting rotations when a transition begins,
         * then interpolates toward the target on each update() tick.
         */
        class PoseController {
            /**
             * @param {Object} vrm - Loaded VRM model with humanoid bone access
             */
            constructor(vrm) {
                this.vrm = vrm;
                this.currentPose = 'standing';
                this.targetPose = 'standing';
                this.transitioning = false;
                this.transitionProgress = 0;
                this.transitionDuration = 0.4; // seconds
                this._startRotations = {};     // bone → {x,y,z} snapshot at transition start
                this._targetRotations = {};    // bone → {x,y,z} target
            }

            /**
             * Initiate a pose transition.
             * @param {string} poseName - Key in POSE_DEFINITIONS
             * @returns {{camera: string, yOffset: number, description: string}|null} Pose metadata, or null if unknown pose
             */
            setPose(poseName) {
                const def = POSE_DEFINITIONS[poseName];
                if (!def) {
                    console.warn(`[PoseController] Unknown pose: ${poseName}`);
                    return null;
                }
                if (poseName === this.currentPose && !this.transitioning) return def;

                // Snapshot current bone rotations
                this._startRotations = {};
                const allBones = new Set([
                    ...Object.keys(POSE_DEFINITIONS[this.currentPose]?.bones || {}),
                    ...Object.keys(def.bones),
                ]);

                for (const boneName of allBones) {
                    const node = this._getBone(boneName);
                    if (node) {
                        this._startRotations[boneName] = {
                            x: node.rotation.x,
                            y: node.rotation.y,
                            z: node.rotation.z,
                        };
                    }
                }

                // Set target rotations (bones not in the target def → default 0)
                this._targetRotations = {};
                for (const boneName of allBones) {
                    this._targetRotations[boneName] = {
                        x: def.bones[boneName]?.x ?? 0,
                        y: def.bones[boneName]?.y ?? 0,
                        z: def.bones[boneName]?.z ?? 0,
                    };
                }

                this.targetPose = poseName;
                this.transitioning = true;
                this.transitionProgress = 0;
                return def;
            }

            /**
             * Per-frame update — call from the animation loop.
             * Advances the transition by deltaTime and applies interpolated rotations.
             *
             * @param {number} deltaTime - Seconds since last frame
             */
            update(deltaTime) {
                if (!this.transitioning) return;

                this.transitionProgress += deltaTime / this.transitionDuration;
                // Smooth step easing for natural feel
                const raw = Math.min(this.transitionProgress, 1);
                const t = raw * raw * (3 - 2 * raw); // smoothstep

                for (const boneName of Object.keys(this._targetRotations)) {
                    const node = this._getBone(boneName);
                    if (!node) continue;

                    const from = this._startRotations[boneName] || { x: 0, y: 0, z: 0 };
                    const to = this._targetRotations[boneName];

                    node.rotation.x = from.x + (to.x - from.x) * t;
                    node.rotation.y = from.y + (to.y - from.y) * t;
                    node.rotation.z = from.z + (to.z - from.z) * t;
                }

                if (raw >= 1) {
                    this.transitioning = false;
                    this.currentPose = this.targetPose;
                }
            }

            /**
             * Get a VRM bone node by humanoid name.
             * Handles VRM 0.x and 1.0 API differences.
             *
             * @param {string} name - VRM humanoid bone name
             * @returns {THREE.Object3D|null}
             */
            _getBone(name) {
                return this.vrm.humanoid.getNormalizedBoneNode?.(name)
                    || this.vrm.humanoid.getBoneNode?.(name)
                    || null;
            }
        }

        // ══════════════════════════════════════════════════════════
        // Idle vs. Talking Motion Parameters (Phase 6D)
        // ══════════════════════════════════════════════════════════

        /**
         * Global talking state — set true when TTS audio begins, false when it ends.
         * Read by IdleHeadMovement to pick the appropriate motion parameter set.
         */
        let isTalking = false;

        /**
         * Motion parameters for idle (silent) state.
         * Calm, slow, minimal range — the character is at rest.
         * @type {{nodRange: number, turnRange: number, tiltRange: number, moveInterval: [number,number], lerpSpeed: number}}
         */
        const MOTION_IDLE = {
            nodRange:      0.08,   // X-axis (pitch)
            turnRange:     0.12,   // Y-axis (yaw)
            tiltRange:     0.05,   // Z-axis (roll)
            minInterval:   4,      // seconds between head target updates (min)
            maxInterval:   9,      // seconds between head target updates (max)
            lerpSpeed:     0.4,    // per-frame lerp alpha (lower = smoother/slower)
        };

        /**
         * Motion parameters for talking state.
         * More frequent, wider range — the character is engaged and expressive.
         * @type {{nodRange: number, turnRange: number, tiltRange: number, moveInterval: [number,number], lerpSpeed: number}}
         */
        const MOTION_TALK = {
            nodRange:      0.15,
            turnRange:     0.18,
            tiltRange:     0.10,
            minInterval:   1,
            maxInterval:   3,
            lerpSpeed:     0.6,
        };

        // ══════════════════════════════════════════════════════════
        // Enhanced Blink Controller (Phase 12-P1)
        // ══════════════════════════════════════════════════════════
        // Features: Poisson-distributed intervals, emotion modulation,
        // asymmetric L/R timing, 15% double-blink chance, variable speed.

        class BlinkController {
            constructor(vrm) {
                this.vrm = vrm;
                this.isBlinking = false;
                this.blinkProgress = 0;
                this.doubleBlink = false;
                this.blinkSpeed = 8;  // base close/open speed
                // _emotionMod MUST be initialised BEFORE _poissonDelay() is
                // called — _poissonDelay reads _emotionMod.rateMul, so the
                // earlier ordering crashed every model load with TypeError:
                // "Cannot read properties of undefined (reading 'rateMul')".
                this._emotionMod = { rateMul: 1.0, speedMul: 1.0 };
                this.nextBlinkTime = this._poissonDelay();
            }

            /**
             * Set emotion modulation for blink behavior.
             * @param {string} emotion - Current emotion name
             */
            setEmotion(emotion) {
                const mods = {
                    nervous:   { rateMul: 1.8, speedMul: 1.3 },
                    excited:   { rateMul: 1.5, speedMul: 1.2 },
                    happy:     { rateMul: 1.1, speedMul: 1.0 },
                    calm:      { rateMul: 0.7, speedMul: 0.9 },
                    sad:       { rateMul: 0.6, speedMul: 0.7 },
                    tired:     { rateMul: 0.5, speedMul: 0.6 },
                    neutral:   { rateMul: 1.0, speedMul: 1.0 },
                };
                this._emotionMod = mods[emotion] || mods.neutral;
            }

            update(deltaTime) {
                const speed = this.blinkSpeed * this._emotionMod.speedMul;
                if (this.isBlinking) {
                    this.blinkProgress += deltaTime * speed;
                    // Asymmetric: right eye leads by ~15ms (1 frame at 60fps)
                    const rightVal = Math.min(1, this.blinkProgress < 0.5
                        ? this.blinkProgress * 2 : 1.0 - ((this.blinkProgress - 0.5) * 2));
                    const leftDelay = Math.max(0, this.blinkProgress - 0.02);
                    const leftVal = Math.min(1, leftDelay < 0.5
                        ? leftDelay * 2 : 1.0 - ((leftDelay - 0.5) * 2));
                    this._setBlinkLR(leftVal, rightVal);

                    if (this.blinkProgress >= 1.0) {
                        this.isBlinking = false;
                        this.blinkProgress = 0;
                        this._setBlinkLR(0, 0);
                        // 15% chance of immediate double-blink
                        if (!this.doubleBlink && Math.random() < 0.15) {
                            this.doubleBlink = true;
                            this.nextBlinkTime = 0.08; // near-instant second blink
                        } else {
                            this.doubleBlink = false;
                            this.nextBlinkTime = this._poissonDelay();
                        }
                    }
                } else {
                    this.nextBlinkTime -= deltaTime;
                    if (this.nextBlinkTime <= 0) this.isBlinking = true;
                }
            }

            _setBlinkLR(leftVal, rightVal) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;
                // Try per-eye first, fall back to combined blink
                if (em.setValue) {
                    try { em.setValue('blinkLeft', leftVal); em.setValue('blinkRight', rightVal); return; }
                    catch { /* per-eye not supported */ }
                    em.setValue('blink', rightVal); // fallback to combined
                }
            }

            /** Poisson-distributed blink interval (~4.5 blinks/min = 13.3s mean).
             *  Emotion modulation scales the rate. */
            _poissonDelay() {
                const baseMean = 13.3 / this._emotionMod.rateMul;
                // Exponential distribution (memoryless, natural feel)
                return -baseMean * Math.log(1 - Math.random()) * 0.5 + 1.5;
            }
        }

        // ══════════════════════════════════════════════════════════
        // Eye Saccade Controller (Phase 12-P1)
        // ══════════════════════════════════════════════════════════
        // Random gaze fixation shifts every 2-5 seconds.
        // Creates the "looking around, alive" feeling.

        class SaccadeController {
            constructor(vrm) {
                this.vrm = vrm;
                this._isTalking = false;
                this.nextSaccadeTime = 2 + Math.random() * 3;
                // Spring state: position + velocity per axis
                this._yaw   = { x: 0, v: 0, goal: 0 };
                this._pitch = { x: 0, v: 0, goal: 0 };
                // ~60ms halflife = fast saccade snap without the linear-lerp direction snap
                this._halflife = 0.06;
            }

            /** Narrow gaze range during talking so eyes stay near camera. */
            setTalking(talking) { this._isTalking = talking; }

            update(dt) {
                this.nextSaccadeTime -= dt;
                if (this.nextSaccadeTime <= 0) {
                    const range = this._isTalking ? 0.05 : 0.15;
                    this._yaw.goal   = (Math.random() - 0.5) * range;
                    this._pitch.goal = (Math.random() - 0.5) * range * 0.5;
                    this.nextSaccadeTime = 2 + Math.random() * 3;
                }

                const yw = springDamperExact(this._yaw.x, this._yaw.v, this._yaw.goal, this._halflife, dt);
                const pt = springDamperExact(this._pitch.x, this._pitch.v, this._pitch.goal, this._halflife, dt);
                this._yaw.x = yw.x; this._yaw.v = yw.v;
                this._pitch.x = pt.x; this._pitch.v = pt.v;

                if (!this.vrm?.humanoid) return;
                const leftEye  = this.vrm.humanoid.getNormalizedBoneNode('leftEye');
                const rightEye = this.vrm.humanoid.getNormalizedBoneNode('rightEye');
                if (leftEye)  { leftEye.rotation.y  += this._yaw.x; leftEye.rotation.x  += this._pitch.x; }
                if (rightEye) { rightEye.rotation.y += this._yaw.x; rightEye.rotation.x += this._pitch.x; }
            }

            /**
             * Trigger an immediate gaze flick (character notices user typing).
             * Bypasses the timer — fires a new saccade target immediately with a
             * slight downward bias (as if glancing toward keyboard).
             */
            triggerGazeFlick() {
                const range = 0.08;
                this._yaw.goal   = (Math.random() - 0.5) * range;
                this._pitch.goal = -0.03 - Math.random() * 0.04; // slight downward
                this.nextSaccadeTime = 1.5 + Math.random() * 2;
            }
        }

        // ══════════════════════════════════════════════════════════
        // Micro-Tremor Controller (Phase 12-P1)
        // ══════════════════════════════════════════════════════════
        // High-frequency, imperceptible jitter on idle bones.
        // Prevents the "perfectly still = dead" perception.
        // Only active during idle state — disabled during gestures.

        class MicroTremorController {
            constructor(vrm) {
                this.vrm = vrm;
                this.enabled = true;
                this._time = Math.random() * 100; // random phase offset
            }

            update(deltaTime) {
                if (!this.enabled || !this.vrm?.humanoid) return;
                this._time += deltaTime;

                const t = this._time;
                // Apply tiny high-frequency noise to core bones
                const bones = ['spine', 'chest', 'head', 'neck'];
                for (const name of bones) {
                    const bone = this.vrm.humanoid.getNormalizedBoneNode(name);
                    if (!bone) continue;
                    // Different frequency per bone + axis for organic feel
                    const seed = name.charCodeAt(0) * 0.1;
                    const amp = name === 'head' ? 0.002 : 0.001; // head tremors slightly more
                    bone.rotation.x += Math.sin(t * 11.3 + seed) * amp;
                    bone.rotation.y += Math.sin(t * 9.7 + seed + 1.5) * amp * 0.7;
                    bone.rotation.z += Math.sin(t * 13.1 + seed + 3.0) * amp * 0.5;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Micro-Expression Controller (Phase 12-P2)
        // ══════════════════════════════════════════════════════════
        // Random, subtle facial micro-expressions that fire occasionally.
        // Eyebrow twitches, lip quivers, nose scrunches — the tiny
        // involuntary movements that make a face look alive.

        class MicroExpressionController {
            constructor(vrm) {
                this.vrm = vrm;
                this._time = 0;
                this._activeExpr = null;
                this._exprProgress = 0;
                this._exprDuration = 0;
                this._nextCheckTime = 2 + Math.random() * 3;
                this._emotionMod = 1.0; // emotion probability multiplier
                // Micro-expression definitions: target blend shape, amplitude, duration
                this._expressions = [
                    { name: 'eyebrow_raise', targets: [{shape: 'surprised', amp: 0.15}], duration: 0.3, probability: 0.03 },
                    { name: 'slight_smile', targets: [{shape: 'happy', amp: 0.12}], duration: 0.4, probability: 0.025 },
                    { name: 'slight_frown', targets: [{shape: 'sad', amp: 0.1}], duration: 0.35, probability: 0.015 },
                    { name: 'nose_scrunch', targets: [{shape: 'angry', amp: 0.08}], duration: 0.25, probability: 0.01 },
                    { name: 'lip_part', targets: [{shape: 'aa', amp: 0.1}], duration: 0.2, probability: 0.02 },
                ];
            }

            /** Adjust micro-expression frequency based on emotion state. */
            setEmotion(emotion) {
                const mods = {
                    nervous: 2.5, excited: 2.0, happy: 1.3,
                    calm: 0.5, tired: 0.3, neutral: 1.0, sad: 0.7,
                };
                this._emotionMod = mods[emotion] || 1.0;
            }

            update(deltaTime) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;

                this._time += deltaTime;

                // If a micro-expression is active, animate it
                if (this._activeExpr) {
                    this._exprProgress += deltaTime;
                    const t = this._exprProgress / this._exprDuration;
                    // Bell curve: ramp up then down
                    const blend = t < 0.5
                        ? Math.sin(t * Math.PI)     // 0→1 in first half
                        : Math.sin(t * Math.PI);    // 1→0 in second half

                    for (const target of this._activeExpr.targets) {
                        try { em.setValue(target.shape, target.amp * blend); } catch {}
                    }

                    if (this._exprProgress >= this._exprDuration) {
                        // Clean up — zero out the blend shapes we touched
                        for (const target of this._activeExpr.targets) {
                            try { em.setValue(target.shape, 0); } catch {}
                        }
                        this._activeExpr = null;
                        this._exprProgress = 0;
                        this._nextCheckTime = 1.5 + Math.random() * 3;
                    }
                    return;
                }

                // Check for new micro-expression trigger
                this._nextCheckTime -= deltaTime;
                if (this._nextCheckTime > 0) return;
                this._nextCheckTime = 0.5 + Math.random() * 1.5;

                // Roll dice for each possible expression
                for (const expr of this._expressions) {
                    if (Math.random() < expr.probability * this._emotionMod) {
                        this._activeExpr = expr;
                        this._exprProgress = 0;
                        this._exprDuration = expr.duration;
                        break;
                    }
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Idle Head Movement
        // ══════════════════════════════════════════════════════════

        // @deprecated — Replaced by LookAtLayer (L5) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class IdleHeadMovement {
            constructor(vrm) {
                this.vrm = vrm;
                this.headTarget = { x: 0, y: 0, z: 0 };
                this.headCurrent = { x: 0, y: 0, z: 0 };
                this.nextMoveTime = 5;
            }

            update(deltaTime) {
                // Pick motion params based on global isTalking flag (Phase 6D).
                // During speech: more frequent, wider-range head movement signals engagement.
                const mp = isTalking ? MOTION_TALK : MOTION_IDLE;

                this.nextMoveTime -= deltaTime;
                if (this.nextMoveTime <= 0) {
                    this.headTarget = {
                        x: (Math.random() - 0.5) * mp.nodRange  * 2,
                        y: (Math.random() - 0.5) * mp.turnRange * 2,
                        z: (Math.random() - 0.5) * mp.tiltRange * 2,
                    };
                    this.nextMoveTime = mp.minInterval + Math.random() * (mp.maxInterval - mp.minInterval);
                }
                const lerpSpeed = deltaTime * mp.lerpSpeed;
                this.headCurrent.x += (this.headTarget.x - this.headCurrent.x) * lerpSpeed;
                this.headCurrent.y += (this.headTarget.y - this.headCurrent.y) * lerpSpeed;
                this.headCurrent.z += (this.headTarget.z - this.headCurrent.z) * lerpSpeed;

                const head = this.vrm.humanoid.getNormalizedBoneNode ?
                             this.vrm.humanoid.getNormalizedBoneNode('head') :
                             this.vrm.humanoid.getBoneNode('head');

                if (head) {
                    head.rotation.x = this.headCurrent.x;
                    head.rotation.y = this.headCurrent.y;
                    head.rotation.z = this.headCurrent.z;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Mouse Tracking Controller (Eyes + Subtle Head Follow)
        // ══════════════════════════════════════════════════════════

        /**
         * Tracks mouse cursor position to drive eye bone rotations
         * and add subtle additive head rotation for a "looking at you" effect.
         * Runs AFTER IdleHeadMovement so head follow is additive (+=).
         */
        // @deprecated — Replaced by LookAtLayer (L5) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class MouseTrackingController {
            constructor(vrm, canvas) {
                this.vrm = vrm;
                this.canvas = canvas;
                /** @type {{x: number, y: number}} Normalized cursor -1..1 */
                this.cursor = { x: 0, y: 0 };
                /** @type {{x: number, y: number}} Smoothed eye target */
                this.eyeCurrent = { x: 0, y: 0 };
                /** @type {{x: number, y: number}} Smoothed head offset */
                this.headOffset = { x: 0, y: 0 };
                this.active = true;

                this._onMouseMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.cursor.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    this.cursor.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    this.active = true;
                };
                this._onMouseLeave = () => {
                    this.active = false;
                    this.cursor.x = 0;
                    this.cursor.y = 0;
                };

                canvas.addEventListener('mousemove', this._onMouseMove);
                canvas.addEventListener('mouseleave', this._onMouseLeave);
            }

            /**
             * Per-frame update — lerp eyes and head toward cursor.
             * @param {number} deltaTime - Seconds since last frame
             */
            update(deltaTime) {
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                    this.vrm.humanoid.getNormalizedBoneNode(name) :
                    this.vrm.humanoid.getBoneNode(name);

                const targetX = this.active ? this.cursor.x : 0;
                const targetY = this.active ? this.cursor.y : 0;

                // Eye tracking — fast lerp (responsive feel)
                const eyeSpeed = deltaTime * 3;
                this.eyeCurrent.x += (targetX - this.eyeCurrent.x) * eyeSpeed;
                this.eyeCurrent.y += (targetY - this.eyeCurrent.y) * eyeSpeed;

                const leftEye = getBone('leftEye');
                const rightEye = getBone('rightEye');
                if (leftEye) {
                    leftEye.rotation.y = this.eyeCurrent.x * 0.3;
                    leftEye.rotation.x = -this.eyeCurrent.y * 0.15;
                }
                if (rightEye) {
                    rightEye.rotation.y = this.eyeCurrent.x * 0.3;
                    rightEye.rotation.x = -this.eyeCurrent.y * 0.15;
                }

                // Subtle head follow — slow lerp, ADDITIVE (+=) to blend with idle
                const headSpeed = deltaTime * 1;
                this.headOffset.x += (targetX * 0.12 - this.headOffset.x) * headSpeed;
                this.headOffset.y += (targetY * 0.08 - this.headOffset.y) * headSpeed;

                const head = getBone('head');
                if (head) {
                    head.rotation.y += this.headOffset.x;
                    head.rotation.x += -this.headOffset.y;
                }
            }

            dispose() {
                this.canvas.removeEventListener('mousemove', this._onMouseMove);
                this.canvas.removeEventListener('mouseleave', this._onMouseLeave);
            }
        }

        // ══════════════════════════════════════════════════════════
        // Expression Controller
        // ══════════════════════════════════════════════════════════

        class ExpressionController {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentExpression = "neutral";
                this.targetExpression = "neutral";
                this.currentIntensity = 0;
                this.targetIntensity = 0;
                this.transitionProgress = 1.0;
                this.transitionDuration = 0.3; // 0.3s default (#24) — snappy but smooth
            }

            setExpression(emotion, intensity = 1.0, duration = 0.5) {
                if (emotion === this.targetExpression) return;
                this.targetExpression = emotion;
                this.targetIntensity = Math.min(Math.max(intensity, 0), 1);
                this.transitionDuration = duration;
                this.transitionProgress = 0;
            }

            update(deltaTime) {
                if (this.transitionProgress < 1.0) {
                    this.transitionProgress += deltaTime / this.transitionDuration;
                    const t = Math.min(this.transitionProgress, 1.0);
                    const eased = t * t * (3 - 2 * t);
                    const blendedIntensity = this.currentIntensity + (this.targetIntensity - this.currentIntensity) * eased;
                    this.applyExpression(this.targetExpression, blendedIntensity);
                    if (this.transitionProgress >= 1.0) {
                        this.currentExpression = this.targetExpression;
                        this.currentIntensity = this.targetIntensity;
                    }
                }
            }

            applyExpression(emotion, intensity) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;

                ['happy', 'sad', 'surprised', 'angry', 'relaxed'].forEach(expr => {
                    try { em.setValue(expr, 0); } catch(e) {}
                });

                try {
                    if (emotion === "happy") em.setValue('happy', intensity);
                    else if (emotion === "sad") em.setValue('sad', intensity);
                    else if (emotion === "surprised") em.setValue('surprised', intensity);
                    else if (emotion === "angry") em.setValue('angry', intensity);
                    else if (emotion === "confused") {
                        em.setValue('surprised', intensity * 0.4);
                        const head = this.vrm.humanoid.getNormalizedBoneNode ?
                                     this.vrm.humanoid.getNormalizedBoneNode('head') :
                                     this.vrm.humanoid.getBoneNode('head');
                        if (head) head.rotation.z = 0.15 * intensity;
                    }
                    else if (emotion === "thinking") em.setValue('relaxed', intensity * 0.6);
                } catch (e) { console.warn('Expression not available:', emotion); }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Gesture Controller (expanded with new gestures)
        // ══════════════════════════════════════════════════════════

        // @deprecated — Replaced by GestureLayer (L4) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class GestureController {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentGesture = null;
                this.gestureProgress = 0;
                this.gestureDuration = 0;
                this.gestureQueue = [];
            }

            /**
             * Play a gesture animation on the VRM model.
             * Supports: nod, tilt, wave, shrug, bow, clap, think, point, celebrate, shy, dance
             * @param {string} gesture - Gesture name
             */
            playGesture(gesture) {
                if (this.currentGesture) {
                    this.gestureQueue.push(gesture);
                    return;
                }
                this.currentGesture = gesture;
                this.gestureProgress = 0;
                // Duration varies per gesture
                const durations = {
                    nod: 0.6, tilt: 0.5, wave: 1.0, shrug: 0.8,
                    bow: 1.2, clap: 0.8, think: 1.5, point: 0.7,
                    celebrate: 1.2, shy: 1.0, dance: 2.0,
                    foot_tap: 1.8, crossed_arms: 2.0, shake: 0.8,
                    // Pet-mode idle animations (externally triggered from PetView.tsx)
                    doze: 4.0, wake_up: 1.2, wave_at_cursor: 2.5,
                };
                this.gestureDuration = durations[gesture] || 0.6;
            }

            /**
             * Play a sequence of gestures with timing.
             * @param {Array<{gesture: string, delay?: number}>} sequence
             */
            playSequence(sequence) {
                if (!Array.isArray(sequence) || sequence.length === 0) return;
                this.playGesture(sequence[0].gesture);
                for (let i = 1; i < sequence.length; i++) {
                    this.gestureQueue.push(sequence[i].gesture);
                }
            }

            update(deltaTime) {
                if (!this.currentGesture) return;
                this.gestureProgress += deltaTime;

                if (this.gestureProgress >= this.gestureDuration) {
                    this.resetGesture();
                    this.currentGesture = null;
                    // Check queue
                    if (this.gestureQueue.length > 0) {
                        this.playGesture(this.gestureQueue.shift());
                    }
                    return;
                }

                const t = this.gestureProgress / this.gestureDuration;
                const eased = Math.sin(t * Math.PI);

                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                switch (this.currentGesture) {
                    case 'nod': {
                        const neck = getBone('neck');
                        if (neck) neck.rotation.x = eased * 0.3;
                        break;
                    }
                    case 'tilt': {
                        const head = getBone('head');
                        if (head) head.rotation.z = eased * 0.35;
                        break;
                    }
                    case 'wave': {
                        const rightArm = getBone('rightUpperArm');
                        const rightHand = getBone('rightHand');
                        if (rightArm) {
                            rightArm.rotation.z = -eased * 1.3;
                            rightArm.rotation.x = eased * 0.3;
                        }
                        if (rightHand) rightHand.rotation.z = Math.sin(t * Math.PI * 4) * 0.4;
                        break;
                    }
                    case 'shrug': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        const headBone = getBone('head');
                        if (headBone) headBone.rotation.z = Math.sin(t * Math.PI) * 0.1;
                        break;
                    }
                    case 'bow': {
                        const spine = getBone('spine');
                        const neck = getBone('neck');
                        if (spine) spine.rotation.x = eased * 0.4;
                        if (neck) neck.rotation.x = eased * 0.2;
                        break;
                    }
                    case 'clap': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lForearm = getBone('leftLowerArm');
                        const rForearm = getBone('rightLowerArm');
                        const clapCycle = Math.sin(t * Math.PI * 6); // 3 claps
                        if (lArm) lArm.rotation.z = 0.5 + clapCycle * 0.15;
                        if (rArm) rArm.rotation.z = -0.5 - clapCycle * 0.15;
                        if (lForearm) lForearm.rotation.y = -0.8 + clapCycle * 0.2;
                        if (rForearm) rForearm.rotation.y = 0.8 - clapCycle * 0.2;
                        break;
                    }
                    case 'think': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        const head = getBone('head');
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (rForearm) rForearm.rotation.y = eased * 1.2;
                        if (head) {
                            head.rotation.z = eased * 0.12;
                            head.rotation.x = eased * 0.08;
                        }
                        break;
                    }
                    case 'point': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        if (rArm) {
                            rArm.rotation.z = -eased * 0.8;
                            rArm.rotation.x = eased * 0.3;
                        }
                        if (rForearm) rForearm.rotation.y = eased * 0.4;
                        break;
                    }
                    case 'celebrate': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lHand = getBone('leftHand');
                        const rHand = getBone('rightHand');
                        if (lArm) lArm.rotation.z = eased * 1.5;
                        if (rArm) rArm.rotation.z = -eased * 1.5;
                        if (lHand) lHand.rotation.z = Math.sin(t * Math.PI * 6) * 0.4;
                        if (rHand) rHand.rotation.z = Math.sin(t * Math.PI * 6 + 1) * 0.4;
                        break;
                    }
                    case 'shy': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const head = getBone('head');
                        const spine = getBone('spine');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (head) head.rotation.x = eased * 0.2;
                        if (spine) spine.rotation.z = eased * 0.05;
                        break;
                    }
                    case 'dance': {
                        const hips = getBone('hips');
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const danceBeat = Math.sin(t * Math.PI * 4);
                        if (hips) hips.position.y = danceBeat * 0.02;
                        if (lArm) lArm.rotation.z = 0.3 + danceBeat * 0.4;
                        if (rArm) rArm.rotation.z = -0.3 - danceBeat * 0.4;
                        break;
                    }

                    case 'foot_tap': {
                        // Rapid foot-tap: right leg lifts and drops 3 times.
                        // Each cycle is 0.6s → 3 taps in 1.8s total.
                        const tapFreq = 3;  // taps per gesture duration
                        const tapBeat = Math.sin(t * Math.PI * 2 * tapFreq);
                        const rLeg = getBone('rightUpperLeg');
                        const rLower = getBone('rightLowerLeg');
                        const rFoot = getBone('rightFoot');
                        if (rLeg)   rLeg.rotation.x   = tapBeat * 0.12;   // slight hip kick
                        if (rLower) rLower.rotation.x  = -tapBeat * 0.1;  // knee flex
                        if (rFoot)  rFoot.rotation.x   = tapBeat * 0.15;  // foot strike
                        break;
                    }

                    case 'crossed_arms': {
                        // Bring both upper arms forward and across the chest.
                        // Hold position for the full duration (sustained pose).
                        const holdT = Math.min(1.0, eased * 2.0);  // fast ramp-in, hold, ramp-out at end
                        const releaseT = t > 0.8 ? (1.0 - t) / 0.2 : 1.0;
                        const blend = holdT * releaseT;
                        const lUpper = getBone('leftUpperArm');
                        const rUpper = getBone('rightUpperArm');
                        const lLower = getBone('leftLowerArm');
                        const rLower2 = getBone('rightLowerArm');
                        // Pull arms inward across chest
                        if (lUpper) { lUpper.rotation.x = blend * 1.1; lUpper.rotation.z = blend * -0.5; }
                        if (rUpper) { rUpper.rotation.x = blend * 1.1; rUpper.rotation.z = blend * 0.5; }
                        // Forearms fold to complete the cross
                        if (lLower)  lLower.rotation.x  = blend * 1.2;
                        if (rLower2) rLower2.rotation.x = blend * 1.2;
                        break;
                    }

                    case 'shake': {
                        // Head shake left-right (disagreement / "no" gesture)
                        const shakeBeat = Math.sin(t * Math.PI * 3);
                        const neck = getBone('neck');
                        const head = getBone('head');
                        if (neck) neck.rotation.y = shakeBeat * 0.25;
                        if (head) head.rotation.y = shakeBeat * 0.15;
                        break;
                    }

                    // ── Pet-mode exclusive gestures ─────────────────────────────────
                    // Triggered externally from PetView.tsx via postMessage playGesture.

                    case 'doze': {
                        // Gradual head droop — character dozing off during long idle sessions.
                        // Slow ramp-in over first 60%, then holds with gentle breathing motion.
                        const dozeHead = getBone('head'), dozeNeck = getBone('neck'), dozeSpine = getBone('spine');
                        const droop = Math.min(1.0, t / 0.6);
                        const breathe = Math.sin(t * Math.PI * 1.5) * 0.015;
                        if (dozeHead) { dozeHead.rotation.x = droop * 0.35; dozeHead.rotation.z = droop * 0.05; }
                        if (dozeNeck) dozeNeck.rotation.x = droop * 0.18;
                        if (dozeSpine) dozeSpine.rotation.x = droop * 0.08 + breathe;
                        break;
                    }

                    case 'wake_up': {
                        // Quick startle from doze — head snaps back up, arms raise, then settle.
                        // Sharp recoil in first 30%, gradual settle in remaining 70%.
                        const wakeHead = getBone('head'), wakeNeck = getBone('neck'), wakeSpine = getBone('spine');
                        const wakeLa = getBone('leftUpperArm'), wakeRa = getBone('rightUpperArm');
                        const snapT = t < 0.3 ? t / 0.3 : 1.0 - (t - 0.3) / 0.7;
                        const recoil = Math.sin(snapT * Math.PI);
                        if (wakeHead) { wakeHead.rotation.x = -recoil * 0.25; wakeHead.rotation.y = recoil * 0.04; }
                        if (wakeNeck) wakeNeck.rotation.x = -recoil * 0.12;
                        if (wakeSpine) wakeSpine.rotation.x = -recoil * 0.06;
                        if (wakeLa) wakeLa.rotation.z = -1.3 - recoil * 0.2;
                        if (wakeRa) wakeRa.rotation.z = 1.3 + recoil * 0.2;
                        break;
                    }

                    case 'wave_at_cursor': {
                        // Friendly wave toward the cursor when it approaches the pet window.
                        // Arm raises (first 25%), waves 2.5 cycles, then lowers (last 25%).
                        const waveRa = getBone('rightUpperArm'), waveRLower = getBone('rightLowerArm'), waveHead = getBone('head');
                        const raiseT = Math.min(1.0, t / 0.25);
                        const wave = Math.sin(t * Math.PI * 5) * 0.22;
                        const lowerT = t > 0.75 ? (t - 0.75) / 0.25 : 0;
                        const armUp = raiseT - lowerT;
                        if (waveRa) { waveRa.rotation.z = 1.3 - 0.95 * armUp; waveRa.rotation.x = armUp * 0.3 + wave * armUp; }
                        if (waveRLower) waveRLower.rotation.x = armUp * 0.4;
                        if (waveHead) waveHead.rotation.z = -armUp * 0.06;
                        break;
                    }
                }
            }

            resetGesture() {
                if (!this.vrm) return;
                const bones = ['neck', 'head', 'spine', 'hips',
                               'leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm',
                               'leftHand', 'rightHand',
                               'rightUpperLeg', 'rightLowerLeg', 'rightFoot'];
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                bones.forEach(boneName => {
                    const bone = getBone(boneName);
                    if (bone) {
                        bone.rotation.x = 0;
                        bone.rotation.y = 0;
                        bone.rotation.z = 0;
                        if (bone.position) {
                            bone.position.x = 0;
                            bone.position.y = 0;
                            bone.position.z = 0;
                        }
                    }
                });
            }
        }

        // ══════════════════════════════════════════════════════════
        // Lighting Presets
        // ══════════════════════════════════════════════════════════

        const LIGHT_PRESETS = {
            studio: {
                key: { color: 0xffffff, intensity: 1.5, position: [1, 2, 3] },
                fill: { color: 0xffffff, intensity: 0.5, position: [-1, 1, -2] },
                ambient: { color: 0xffffff, intensity: 0.8 }
            },
            warm_sunset: {
                key: { color: 0xffaa44, intensity: 1.8, position: [2, 1, 1] },
                fill: { color: 0xff6633, intensity: 0.4, position: [-2, 0.5, -1] },
                ambient: { color: 0xffddbb, intensity: 0.6 }
            },
            cool_moonlight: {
                key: { color: 0x6688ff, intensity: 1.2, position: [-1, 3, 2] },
                fill: { color: 0x4466cc, intensity: 0.3, position: [1, 0.5, -1] },
                ambient: { color: 0x334488, intensity: 0.5 }
            },
            dramatic: {
                key: { color: 0xff0044, intensity: 2.0, position: [3, 2, 0] },
                fill: { color: 0x0044ff, intensity: 0.6, position: [-3, 1, 0] },
                ambient: { color: 0x111122, intensity: 0.3 }
            },
            neon: {
                key: { color: 0x00ffcc, intensity: 1.6, position: [1, 2, 2] },
                fill: { color: 0xff00ff, intensity: 0.8, position: [-1, 1, -1] },
                ambient: { color: 0x220033, intensity: 0.4 }
            }
        };

        // ══════════════════════════════════════════════════════════
        // Emotion → Auto-Gesture
        // ══════════════════════════════════════════════════════════

        /**
         * Maps emotion names to candidate gesture(s) triggered automatically
         * when the character's emotion changes. Arrays are randomly sampled
         * so the character doesn't always use the same motion for the same feeling.
         * Emotions absent from the map (e.g. 'angry', 'neutral') trigger nothing —
         * stillness is intentional for those states.
         */
        // Only head/body gestures — NO arm movement in auto-gestures.
        // Arm gestures (wave, clap, celebrate, etc.) are still available for
        // explicit AI-triggered playGesture() calls via postMessage.
        const EMOTION_GESTURE_MAP = {
            happy:     ['nod'],
            excited:   ['nod'],
            sad:       ['shy'],
            surprised: ['tilt'],
            thinking:  ['tilt'],
            confused:  ['tilt'],
        };

        /**
         * Conditionally play a contextual gesture when the character's emotion changes.
         *
         * Guards (all must pass):
         *   1. Emotion changed from last auto-gesture trigger — prevents re-firing
         *   2. No gesture currently playing — avoids interrupting in-progress animation
         *   3. 40% random chance — keeps gestures spontaneous, not mechanical every message
         *   4. Emotion has an entry in EMOTION_GESTURE_MAP
         *
         * @param {string|null} emotion - Incoming emotion name from setEmotion/setExpression
         */
        function _triggerAutoGesture(emotion) {
            const gl = animationDirector?.getLayer('gesture');
            if (!emotion || !gl) return;
            if (emotion === lastAutoGestureEmotion) return;  // dedup
            if (gl.isPlaying) return;                         // don't interrupt
            if (Math.random() > 0.2) return;                  // 20% chance
            const candidates = EMOTION_GESTURE_MAP[emotion];
            if (!candidates || candidates.length === 0) return;
            lastAutoGestureEmotion = emotion;
            const gesture = candidates[Math.floor(Math.random() * candidates.length)];
            gl.playGesture(gesture);
            console.log(`[Viewer] Auto-gesture: ${emotion} → ${gesture}`);
        }

        // ─────────────────────────────────────────────────────────────
        // AnimationRegistry — clip-based animation lookup tables
        // ─────────────────────────────────────────────────────────────

        /**
         * Registry that maps emotions and categories to pre-recorded animation clips.
         * Loaded from the animation manifest (/api/animations), it enables clip-based
         * animation as the primary source — falling back to procedural gestures when
         * no matching clips are available.
         */
        class AnimationRegistry {
            constructor() {
                /** @type {Map<string, Object>} clip_id → clip metadata */
                this.clips = new Map();
                /** @type {Map<string, string[]>} emotion → [clip_id, ...] */
                this.emotionIndex = new Map();
                /** @type {Map<string, string[]>} category → [clip_id, ...] */
                this.categoryIndex = new Map();
                /** @type {boolean} Whether any clips are loaded */
                this.loaded = false;
            }

            /**
             * Load clips from a manifest response (from /api/animations).
             * @param {Object} manifest - The manifest JSON with packs and clips
             */
            loadManifest(manifest) {
                this.clips.clear();
                this.emotionIndex.clear();
                this.categoryIndex.clear();

                for (const pack of (manifest.packs || [])) {
                    for (const clip of (pack.clips || [])) {
                        if (!clip.available) continue;  // Skip clips not on disk

                        const meta = { ...clip, packId: pack.id, packName: pack.name };
                        this.clips.set(clip.id, meta);

                        // Index by emotion
                        for (const emo of (clip.emotions || [])) {
                            if (!this.emotionIndex.has(emo)) this.emotionIndex.set(emo, []);
                            this.emotionIndex.get(emo).push(clip.id);
                        }

                        // Index by category
                        const cat = clip.category || 'custom';
                        if (!this.categoryIndex.has(cat)) this.categoryIndex.set(cat, []);
                        this.categoryIndex.get(cat).push(clip.id);
                    }
                }

                this.loaded = this.clips.size > 0;
                console.log(`[AnimationRegistry] Loaded ${this.clips.size} clips (${this.emotionIndex.size} emotions, ${this.categoryIndex.size} categories)`);
            }

            /**
             * Get clip metadata matching an emotion.
             * @param {string} emotion - Emotion name
             * @returns {Object[]} Array of clip metadata, randomly shuffled
             */
            getClipsForEmotion(emotion) {
                const ids = this.emotionIndex.get(emotion) || [];
                const clips = ids.map(id => this.clips.get(id)).filter(Boolean);
                // Fisher-Yates shuffle
                for (let i = clips.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [clips[i], clips[j]] = [clips[j], clips[i]];
                }
                return clips;
            }

            /**
             * Get all clips in a category.
             * @param {string} category - Category name (idle, emotion, reaction, fidget, custom)
             * @returns {Object[]} Array of clip metadata
             */
            getClipsByCategory(category) {
                const ids = this.categoryIndex.get(category) || [];
                return ids.map(id => this.clips.get(id)).filter(Boolean);
            }

            /**
             * Pick a random idle variant.
             * @returns {Object|null} Random idle clip metadata, or null if none available
             */
            pickIdleVariant() {
                const idles = this.getClipsByCategory('idle');
                return idles.length > 0 ? idles[Math.floor(Math.random() * idles.length)] : null;
            }
        }

        /** Global animation registry instance */
        const animationRegistry = new AnimationRegistry();

        /**
         * Trigger animation from clip library OR fall back to procedural gesture.
         *
         * Priority:
         *   1. Check AnimationRegistry for clips matching current emotion (40% chance)
         *   2. If no clips found, fall back to procedural GestureLayer (20% chance)
         *
         * @param {string|null} emotion - Incoming emotion from setEmotion/setExpression
         */
        function _triggerAutoAnimation(emotion) {
            if (!emotion || !animationDirector) return;
            if (emotion === lastAutoGestureEmotion) return;  // dedup

            const cl = animationDirector.getLayer('clip');
            const gl = animationDirector.getLayer('gesture');

            // Don't interrupt running animations
            if (cl?.isPlaying || gl?.isPlaying) return;

            // 1. Try clip-based animation (40% chance when clips available)
            if (animationRegistry.loaded && cl) {
                const candidates = animationRegistry.getClipsForEmotion(emotion);
                if (candidates.length > 0 && Math.random() <= 0.4) {
                    const clip = candidates[0];
                    lastAutoGestureEmotion = emotion;

                    // Lazy-load the clip if not already in the library
                    if (cl.clipLibrary[clip.id]) {
                        cl.playClip(clip.id, { loop: clip.loop || false, fadeIn: 0.4 });
                        console.log(`[Viewer] Auto-animation (clip): ${emotion} → ${clip.name}`);
                    } else {
                        // Async load + play
                        cl.loadClip(clip.url, clip.id, { retarget: true }).then(() => {
                            cl.playClip(clip.id, { loop: clip.loop || false, fadeIn: 0.4 });
                            console.log(`[Viewer] Auto-animation (lazy-loaded clip): ${emotion} → ${clip.name}`);
                        }).catch(err => {
                            console.warn(`[Viewer] Clip load failed for ${clip.id}, falling back to gesture:`, err);
                            _triggerAutoGesture(emotion);
                        });
                    }
                    return;
                }
            }

            // 2. Fall back to procedural gesture (20% chance — original behavior)
            _triggerAutoGesture(emotion);
        }

        // ══════════════════════════════════════════════════════════
        // Main Init
        // ══════════════════════════════════════════════════════════

        /**
         * Frame data stored after a VRM model loads so camera presets can
         * compute positions relative to the actual model size.
         * @type {{targetY: number, camZ: number, modelHeight: number, headY: number, faceY: number}|null}
         */
        let _vrmFrameData = null;

        async function init() {
            const canvas = document.getElementById('c');
            const bgVideo = document.getElementById('bg-video');

            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                alpha: true,
                preserveDrawingBuffer: true   // Required for screenshot toDataURL()
            });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Three.js r150+: outputEncoding → outputColorSpace
            if ('outputColorSpace' in renderer) {
                renderer.outputColorSpace = THREE.SRGBColorSpace;
            } else {
                renderer.outputEncoding = THREE.sRGBEncoding;
            }

            const scene = new THREE.Scene();
            // Default dark background so VRM is visible against the UI
            // (transparent renders as invisible on the dark cyberpunk layout)
            scene.background = new THREE.Color(0x0a0b14);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.25, 1.5);

            // Orbit controls
            const controls = new SimpleOrbitControls(camera, canvas);

            // ── Cinematic tone mapping (ACESFilmic gives the "film" look) ──────────
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;

            // ── 3-point lighting rig ────────────────────────────────────────────────
            // Key light: warm (3200K), upper-right-front — the main light source
            const keyLight = new THREE.DirectionalLight(0xfff4e0, 1.6);
            keyLight.position.set(1.5, 3, 2);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width  = 1024;
            keyLight.shadow.mapSize.height = 1024;
            keyLight.shadow.camera.near   = 0.5;
            keyLight.shadow.camera.far    = 20;
            keyLight.shadow.radius        = 4;        // PCFSoft blur radius
            // Fill light: cool (7000K), left-front — opens shadows without flattening
            const fillLight = new THREE.DirectionalLight(0xd0e8ff, 0.55);
            fillLight.position.set(-2, 1, 2);
            // Rim light: neutral-white, from behind — separates character from background
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.75);
            rimLight.position.set(0, 2.5, -3);
            // Ambient: reduced so lights have actual contrast
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(keyLight, fillLight, rimLight, ambientLight);

            // Phase 11A: Initialize time-of-day lighting controller
            timeOfDayLighting = new TimeOfDayLighting(keyLight, fillLight, rimLight, ambientLight);

            // Soft shadows (PCFSoftShadowMap blurs shadow edges naturally)
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Disco / party lighting (#25): three RGB point lights, hidden by default.
            // Hue cycles at different speeds when disco mode is active.
            const discoLights = [
                new THREE.PointLight(0xff0000, 0, 4),
                new THREE.PointLight(0x00ff00, 0, 4),
                new THREE.PointLight(0x0000ff, 0, 4),
            ];
            discoLights[0].position.set( 1.5, 2.0,  1.0);
            discoLights[1].position.set(-1.5, 1.5,  0.5);
            discoLights[2].position.set( 0.0, 2.5, -1.0);
            discoLights.forEach(l => scene.add(l));
            let _discoActive = false;
            let _discoTime   = 0;

            /**
             * Apply a lighting configuration to the scene.
             * @param {Object} config - Lighting config with key/fill/ambient properties
             */
            function setLighting(config) {
                if (config.key) {
                    if (config.key.color !== undefined) keyLight.color.set(config.key.color);
                    if (config.key.intensity !== undefined) keyLight.intensity = config.key.intensity;
                    if (config.key.position) keyLight.position.fromArray(config.key.position);
                }
                if (config.fill) {
                    if (config.fill.color !== undefined) fillLight.color.set(config.fill.color);
                    if (config.fill.intensity !== undefined) fillLight.intensity = config.fill.intensity;
                    if (config.fill.position) fillLight.position.fromArray(config.fill.position);
                }
                if (config.ambient) {
                    if (config.ambient.color !== undefined) ambientLight.color.set(config.ambient.color);
                    if (config.ambient.intensity !== undefined) ambientLight.intensity = config.ambient.intensity;
                }
                console.log('[Viewer] Lighting updated');
            }

            // ══════════════════════════════════════════════════════════
            // Phase 5: Post-Processing Pipeline (EffectComposer)
            // ══════════════════════════════════════════════════════════

            /**
             * EffectComposer-based post-processing pipeline.
             * When _effectsEnabled is false, the renderer renders directly to screen
             * (zero overhead). When true, the composer chain applies active passes.
             *
             * Available effects:
             * - Bloom (UnrealBloomPass): eye highlights, magical glow
             * - Color grading (custom ShaderPass): tone adjustment via uniforms
             *
             * All effects are configurable via the `setEffects` postMessage command.
             */
            let _effectsEnabled = false;
            const _effectsConfig = {
                bloom: { enabled: false, strength: 0.3, radius: 0.4, threshold: 0.85 },
                colorGrade: { enabled: false, brightness: 0, contrast: 0, saturation: 0 },
                animeOutline: { enabled: false, thickness: 1.5, color: 0x000000, opacity: 0.85 },
                emotionColorGrade: { enabled: false },
                emotionGradient: { enabled: false },
                emotionAmbient: { enabled: false },
                toonShading: { enabled: false, levels: 3, softness: 0.02, shadowBias: 0.3 },
                // Task 3B: Specialty shaders
                hairShading: { enabled: false, shiftPrimary: 0.0, shiftSecondary: 0.3, specPower: 80, specPowerSecondary: 20 },
                eyeSparkle: { enabled: false, intensity: 0.6, size: 0.15, points: 4, shimmerSpeed: 0.3 },
            };

            // ── Phase 12-P4: Emotion Color Grading ──────────────────────
            /**
             * Emotion-to-color-grade presets. When emotionColorGrade is enabled,
             * the colorGradePass uniforms auto-lerp to these targets on each
             * setExpression event. Values are deltas (0 = no change).
             */
            const EMOTION_COLOR_GRADES = {
                neutral:   { brightness: 0,      contrast: 0,     saturation: 0     },
                happy:     { brightness: 0.04,   contrast: 0.05,  saturation: 0.2   },
                excited:   { brightness: 0.05,   contrast: 0.08,  saturation: 0.15  },
                sad:       { brightness: -0.04,  contrast: 0.08,  saturation: -0.15 },
                angry:     { brightness: -0.02,  contrast: 0.15,  saturation: 0.1   },
                love:      { brightness: 0.03,   contrast: 0.0,   saturation: 0.25  },
                flirty:    { brightness: 0.02,   contrast: 0.0,   saturation: 0.2   },
                surprised: { brightness: 0.02,   contrast: 0.1,   saturation: 0.05  },
                proud:     { brightness: 0.03,   contrast: 0.06,  saturation: 0.12  },
                awe:       { brightness: 0.04,   contrast: 0.04,  saturation: 0.18  },
                worried:   { brightness: -0.03,  contrast: 0.06,  saturation: -0.08 },
            };
            let _emotionGradeFrom = { brightness: 0, contrast: 0, saturation: 0 };
            let _emotionGradeTo = { brightness: 0, contrast: 0, saturation: 0 };
            let _emotionGradeProgress = 1.0; // 1.0 = arrived at target
            const _EMOTION_GRADE_DURATION = 0.5; // seconds

            /**
             * Begin a smooth transition of the color grade toward the given emotion preset.
             *
             * @param {string} emotion - Emotion name (must exist in EMOTION_COLOR_GRADES)
             */
            function applyEmotionColorGrade(emotion) {
                if (!_effectsConfig.emotionColorGrade.enabled) return;
                const target = EMOTION_COLOR_GRADES[emotion] || EMOTION_COLOR_GRADES.neutral;
                // Snapshot current values as the lerp origin
                _emotionGradeFrom.brightness = colorGradePass.uniforms.brightness.value;
                _emotionGradeFrom.contrast = colorGradePass.uniforms.contrast.value;
                _emotionGradeFrom.saturation = colorGradePass.uniforms.saturation.value;
                _emotionGradeTo = { ...target };
                _emotionGradeProgress = 0;
                // Auto-enable the pass so the effect is visible
                colorGradePass.enabled = true;
                _effectsEnabled = true;
            }

            /**
             * Per-frame update for emotion-driven color grade lerp.
             * Called from animate() when emotionColorGrade is enabled.
             *
             * @param {number} dt - Delta time in seconds
             */
            function updateEmotionColorGrade(dt) {
                if (_emotionGradeProgress >= 1.0) return;
                _emotionGradeProgress = Math.min(1.0, _emotionGradeProgress + dt / _EMOTION_GRADE_DURATION);
                // smoothstep easing: t²(3 - 2t)
                const t = _emotionGradeProgress;
                const ease = t * t * (3 - 2 * t);
                colorGradePass.uniforms.brightness.value = _emotionGradeFrom.brightness + (_emotionGradeTo.brightness - _emotionGradeFrom.brightness) * ease;
                colorGradePass.uniforms.contrast.value = _emotionGradeFrom.contrast + (_emotionGradeTo.contrast - _emotionGradeFrom.contrast) * ease;
                colorGradePass.uniforms.saturation.value = _emotionGradeFrom.saturation + (_emotionGradeTo.saturation - _emotionGradeFrom.saturation) * ease;
            }

            // Build EffectComposer
            const composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Bloom pass (UnrealBloomPass)
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                _effectsConfig.bloom.strength,
                _effectsConfig.bloom.radius,
                _effectsConfig.bloom.threshold
            );
            bloomPass.enabled = false;
            composer.addPass(bloomPass);

            // Color grading pass — simple brightness/contrast/saturation shader
            const colorGradeShader = {
                uniforms: {
                    tDiffuse: { value: null },
                    brightness: { value: 0.0 },
                    contrast: { value: 0.0 },
                    saturation: { value: 0.0 },
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float brightness;
                    uniform float contrast;
                    uniform float saturation;
                    varying vec2 vUv;

                    void main() {
                        vec4 tex = texture2D(tDiffuse, vUv);
                        // Brightness
                        vec3 color = tex.rgb + vec3(brightness);
                        // Contrast
                        color = (color - 0.5) * (1.0 + contrast) + 0.5;
                        // Saturation
                        float gray = dot(color, vec3(0.299, 0.587, 0.114));
                        color = mix(vec3(gray), color, 1.0 + saturation);
                        gl_FragColor = vec4(clamp(color, 0.0, 1.0), tex.a);
                    }
                `,
            };
            const colorGradePass = new ShaderPass(colorGradeShader);
            colorGradePass.enabled = false;
            composer.addPass(colorGradePass);

            // Phase 12-P4: Anime Outline Pass
            // Inserted into composer. Pass order: Render → Outline → Bloom → GodRays → ColorGrade
            const outlinePass = new OutlinePass(scene, camera, {
                thickness: _effectsConfig.animeOutline.thickness,
                color: _effectsConfig.animeOutline.color,
                opacity: _effectsConfig.animeOutline.opacity,
            });
            outlinePass.enabled = false;
            composer.insertPass(outlinePass, 1); // After RenderPass, before Bloom

            // Phase 12-P4: God Rays Pass
            const godRaysPass = new ShaderPass(GodRaysShader);
            godRaysPass.enabled = false;
            // Insert after Bloom (index 3 now: 0=Render, 1=Outline, 2=Bloom, 3=GodRays, 4=ColorGrade)
            composer.insertPass(godRaysPass, 3);

            // God ray state
            const _godRaysConfig = { enabled: false, intensity: 0.4, decay: 0.96, density: 0.8 };

            // Emotion-tinted god ray presets
            const EMOTION_GODRAY_TINTS = {
                neutral:  new THREE.Color(0xffffee),
                happy:    new THREE.Color(0xffe4b5),
                excited:  new THREE.Color(0xffe066),
                sad:      new THREE.Color(0x4a7ba7),
                angry:    new THREE.Color(0xff6347),
                love:     new THREE.Color(0xffb6d9),
                calm:     new THREE.Color(0x87ceeb),
                proud:    new THREE.Color(0xffd700),
                awe:      new THREE.Color(0xe0f6ff),
            };

            /**
             * Update god ray light position from character head bone.
             * Called per frame when god rays are enabled.
             *
             * @param {THREE.Camera} cam - Active camera
             */
            function updateGodRayLightPos(cam) {
                if (!godRaysPass.enabled) return;
                // Find head bone from current VRM
                const headBone = currentVrm?.humanoid?.getNormalizedBoneNode('head')
                    || currentVrm?.humanoid?.getBoneNode?.('head');
                if (!headBone) return;
                // Project to screen NDC (0-1 range)
                const pos = new THREE.Vector3();
                headBone.getWorldPosition(pos);
                pos.project(cam);
                // Convert from NDC (-1 to 1) to UV (0 to 1)
                godRaysPass.uniforms.uLightPos.value.set(
                    pos.x * 0.5 + 0.5,
                    pos.y * 0.5 + 0.5
                );
            }

            /**
             * Apply emotion tint to god rays.
             *
             * @param {string} emotion - Current emotion
             */
            function applyEmotionGodRayTint(emotion) {
                if (!godRaysPass.enabled) return;
                const tint = EMOTION_GODRAY_TINTS[emotion] || EMOTION_GODRAY_TINTS.neutral;
                godRaysPass.uniforms.uTint.value.copy(tint);
            }

            /**
             * Update post-processing pipeline from configuration.
             * Called by the setEffects postMessage handler.
             *
             * @param {Object} config - Partial effects config to merge
             */
            function updateEffects(config) {
                if (config.bloom !== undefined) {
                    Object.assign(_effectsConfig.bloom, config.bloom);
                    bloomPass.enabled = _effectsConfig.bloom.enabled;
                    bloomPass.strength = _effectsConfig.bloom.strength;
                    bloomPass.radius = _effectsConfig.bloom.radius;
                    bloomPass.threshold = _effectsConfig.bloom.threshold;
                }
                if (config.colorGrade !== undefined) {
                    Object.assign(_effectsConfig.colorGrade, config.colorGrade);
                    colorGradePass.enabled = _effectsConfig.colorGrade.enabled;
                    colorGradePass.uniforms.brightness.value = _effectsConfig.colorGrade.brightness;
                    colorGradePass.uniforms.contrast.value = _effectsConfig.colorGrade.contrast;
                    colorGradePass.uniforms.saturation.value = _effectsConfig.colorGrade.saturation;
                }
                if (config.animeOutline !== undefined) {
                    Object.assign(_effectsConfig.animeOutline, config.animeOutline);
                    outlinePass.enabled = _effectsConfig.animeOutline.enabled;
                    outlinePass.updateConfig(_effectsConfig.animeOutline);
                }
                if (config.godRays !== undefined) {
                    Object.assign(_godRaysConfig, config.godRays);
                    godRaysPass.enabled = _godRaysConfig.enabled;
                    if (_godRaysConfig.intensity !== undefined) godRaysPass.uniforms.uIntensity.value = _godRaysConfig.intensity;
                    if (_godRaysConfig.decay !== undefined) godRaysPass.uniforms.uDecay.value = _godRaysConfig.decay;
                    if (_godRaysConfig.density !== undefined) godRaysPass.uniforms.uDensity.value = _godRaysConfig.density;
                }
