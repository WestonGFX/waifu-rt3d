                            const v = Math.sin(t * Math.PI / 1.2) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.8 * v; ra.rotation.x = -0.1 * v; }
                            if (head) head.rotation.z = -0.08 * v;
                        }
                    },
                    thumbs_up: {
                        duration: 1.0,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm');
                            const v = Math.sin(t * Math.PI) * amp;
                            if (ra) { ra.rotation.z = 1.3 - 0.7 * v; ra.rotation.x = -0.15 * v; }
                        }
                    },
                    blow_kiss: {
                        duration: 1.5,
                        apply(t, amp, B) {
                            const ra = B('rightUpperArm'), head = B('head');
                            const v = Math.sin(t * Math.PI / 1.5) * amp;
                            if (ra) {
                                ra.rotation.z = 1.3 - 0.6 * v;
                                ra.rotation.x = 0.3 * v;
                            }
                            // Blow phase: arm extends outward in second half
                            if (t > 0.5 && ra) ra.rotation.z -= 0.3 * (t - 0.5) * 2 * amp;
                            if (head) head.rotation.z = -0.05 * v;
                        }
                    },
                    head_bang: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const head = B('head'), spine = B('spine');
                            const v = Math.sin(t * Math.PI * 4) * amp;
                            if (head) head.rotation.x = 0.2 * v;
                            if (spine) spine.rotation.x = 0.05 * v;
                        }
                    },
                    curtsy: {
                        duration: 2.0,
                        apply(t, amp, B) {
                            const spine = B('spine'), head = B('head');
                            const ll = B('leftUpperLeg'), rl = B('rightUpperLeg');
                            const v = Math.sin(t * Math.PI / 2) * amp;
                            if (spine) spine.rotation.x = 0.2 * v;
                            if (head) head.rotation.x = 0.1 * v;
                            if (ll) ll.rotation.x = -0.15 * v;
                            if (rl) rl.rotation.x = -0.15 * v;
                        }
                    },
                    jumping_jack: {
                        duration: 2.5,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), hips = B('hips');
                            const cycle = Math.sin(t * Math.PI * 3) * amp;
                            if (la) la.rotation.z = -1.3 - 0.7 * Math.abs(cycle);
                            if (ra) ra.rotation.z = 1.3 + 0.7 * Math.abs(cycle);
                            if (hips) hips.position.y = Math.abs(cycle) * 0.02;
                        }
                    },
                    tai_chi: {
                        duration: 3.0,
                        apply(t, amp, B) {
                            const la = B('leftUpperArm'), ra = B('rightUpperArm'), spine = B('spine');
                            const slow = Math.sin(t * Math.PI * 0.8) * amp;
                            const offset = Math.sin(t * Math.PI * 0.8 + 1.5) * amp;
                            if (la) { la.rotation.z = -1.3 + 0.4 * slow; la.rotation.x = 0.3 * offset; }
                            if (ra) { ra.rotation.z = 1.3 - 0.4 * offset; ra.rotation.x = 0.3 * slow; }
                            if (spine) spine.rotation.y = slow * 0.08;
                        }
                    },
                };
            }
        }

        /**
         * L6: Clip playback — plays Three.js AnimationClips via AnimationMixer.
         * Supports .glb/.gltf animation files (and VRMA when loader is installed).
         * Write mode: OVERRIDE — suppresses L0–L4 on all bones while playing.
         *
         * Usage flow:
         *   1. loadClip(url, name) → fetches .glb, extracts AnimationClip, stores in library
         *   2. playClip(name, opts) → creates/plays an AnimationAction with crossfade
         *   3. stopClip() → fades out current action, returns control to procedural layers
         *
         * The mixer writes directly to the VRM scene's bones. While a clip is playing,
         * the AnimationDirector suppresses lower layers to prevent fighting.
         */
        /**
         * Bone name mapping: Mixamo convention → VRM Humanoid bone name.
         * Used by ClipLayer.retargetClip() to remap animation tracks so
         * Mixamo-exported GLB animations play correctly on VRM models.
         */
        const MIXAMO_BONE_MAP = {
            'mixamorig:Hips':             'hips',
            'mixamorig:Spine':            'spine',
            'mixamorig:Spine1':           'chest',
            'mixamorig:Spine2':           'upperChest',
            'mixamorig:Neck':             'neck',
            'mixamorig:Head':             'head',
            'mixamorig:LeftShoulder':     'leftShoulder',
            'mixamorig:LeftArm':          'leftUpperArm',
            'mixamorig:LeftForeArm':      'leftLowerArm',
            'mixamorig:LeftHand':         'leftHand',
            'mixamorig:RightShoulder':    'rightShoulder',
            'mixamorig:RightArm':         'rightUpperArm',
            'mixamorig:RightForeArm':     'rightLowerArm',
            'mixamorig:RightHand':        'rightHand',
            'mixamorig:LeftUpLeg':        'leftUpperLeg',
            'mixamorig:LeftLeg':          'leftLowerLeg',
            'mixamorig:LeftFoot':         'leftFoot',
            'mixamorig:LeftToeBase':      'leftToes',
            'mixamorig:RightUpLeg':       'rightUpperLeg',
            'mixamorig:RightLeg':         'rightLowerLeg',
            'mixamorig:RightFoot':        'rightFoot',
            'mixamorig:RightToeBase':     'rightToes',
            'mixamorig:LeftEye':          'leftEye',
            'mixamorig:RightEye':         'rightEye',
        };

        /**
         * CMU Motion Capture bone name → VRM humanoid bone name mapping.
         * Used by ClipLayer.retargetClip() when loading BVH files converted
         * from the Carnegie Mellon University MoCap database.
         */
        const BVH_BONE_MAP = {
            'Hips':             'hips',
            'LHipJoint':        'leftUpperLeg',
            'LeftUpLeg':        'leftUpperLeg',
            'LeftLeg':          'leftLowerLeg',
            'LeftFoot':         'leftFoot',
            'LeftToeBase':      'leftToes',
            'RHipJoint':        'rightUpperLeg',
            'RightUpLeg':       'rightUpperLeg',
            'RightLeg':         'rightLowerLeg',
            'RightFoot':        'rightFoot',
            'RightToeBase':     'rightToes',
            'LowerBack':        'spine',
            'Spine':            'chest',
            'Spine1':           'upperChest',
            'Neck':             'neck',
            'Neck1':            'neck',
            'Head':             'head',
            'LeftShoulder':     'leftShoulder',
            'LeftArm':          'leftUpperArm',
            'LeftForeArm':      'leftLowerArm',
            'LeftHand':         'leftHand',
            'RightShoulder':    'rightShoulder',
            'RightArm':         'rightUpperArm',
            'RightForeArm':     'rightLowerArm',
            'RightHand':        'rightHand',
        };

        class ClipLayer extends AnimationLayer {
            /**
             * @param {Object} vrm - The loaded VRM model
             * @param {THREE.Scene} scene - The Three.js scene (needed for mixer root)
             */
            constructor(vrm, scene) {
                super(vrm, 'clip');
                this.scene = scene;
                this.mixer = new THREE.AnimationMixer(vrm.scene);
                this.clipLibrary = {};  // name → THREE.AnimationClip
                this.currentAction = null;
                this.isPlaying = false;
                this._fadeOutDuration = 0.3;
                this._loader = null;    // lazy-init GLTFLoader
                this._nodeNameCache = null; // VRM bone name → scene node name
            }

            /**
             * Build a lookup cache from VRM humanoid bone names to actual
             * scene node names. Called lazily on first retarget.
             * @returns {Object} Map of VRM bone name → node.name in scene graph
             * @private
             */
            _buildNodeNameCache() {
                if (this._nodeNameCache) return this._nodeNameCache;
                this._nodeNameCache = {};
                const humanoid = this.vrm?.humanoid;
                if (!humanoid) return this._nodeNameCache;

                // VRM 1.0: getNormalizedBoneNode(boneName) returns the Three.js Object3D
                // Merge VRM bone names from both Mixamo and BVH maps
                const vrmBoneNames = [...new Set([...Object.values(MIXAMO_BONE_MAP), ...Object.values(BVH_BONE_MAP)])];
                for (const vrmName of vrmBoneNames) {
                    try {
                        const node = humanoid.getNormalizedBoneNode(vrmName);
                        if (node) {
                            this._nodeNameCache[vrmName] = node.name;
                        }
                    } catch (_) {
                        // Bone not present in this model — skip
                    }
                }
                console.log(`[ClipLayer] Node name cache built: ${Object.keys(this._nodeNameCache).length} bones mapped`);
                return this._nodeNameCache;
            }

            /**
             * Retarget an AnimationClip from Mixamo bone names to VRM humanoid bones.
             *
             * Walks every track in the clip, checks if the track's bone name matches
             * a Mixamo convention name, and remaps it to the corresponding VRM scene
             * node name. Tracks that don't match Mixamo names are left unchanged.
             *
             * @param {THREE.AnimationClip} clip - The clip to retarget (mutated in-place)
             * @returns {THREE.AnimationClip} The same clip, retargeted
             */
            retargetClip(clip) {
                const nodeNames = this._buildNodeNameCache();
                if (Object.keys(nodeNames).length === 0) return clip;

                let remapped = 0;
                for (const track of clip.tracks) {
                    // Track names are "boneName.property" (e.g., "mixamorig:Hips.quaternion")
                    const dotIdx = track.name.indexOf('.');
                    if (dotIdx === -1) continue;

                    const boneName = track.name.substring(0, dotIdx);
                    const property = track.name.substring(dotIdx); // includes the dot

                    // Try Mixamo map first, then CMU/BVH map
                    const vrmBoneName = MIXAMO_BONE_MAP[boneName] || BVH_BONE_MAP[boneName];
                    if (!vrmBoneName) continue; // not a known bone — leave as-is

                    const nodeName = nodeNames[vrmBoneName];
                    if (!nodeName) continue; // VRM model doesn't have this bone

                    track.name = nodeName + property;
                    remapped++;
                }

                if (remapped > 0) {
                    console.log(`[ClipLayer] Retargeted ${remapped}/${clip.tracks.length} tracks (Mixamo/BVH → VRM)`);
                }
                return clip;
            }

            /**
             * Load an animation clip from a .glb/.gltf URL and store it by name.
             *
             * @param {string} url - URL of the .glb/.gltf animation file
             * @param {string} name - Friendly name to reference this clip
             * @param {Object} [opts] - Load options
             * @param {boolean} [opts.retarget=false] - Auto-retarget Mixamo bone names to VRM
             * @returns {Promise<{name: string, duration: number, tracks: number}>}
             *
             * @example
             *   await clipLayer.loadClip('/animations/wave.glb', 'wave', { retarget: true });
             */
            async loadClip(url, name, opts = {}) {
                const { retarget = false } = opts;

                // Detect BVH files → use BVHLoader instead of GLTFLoader
                if (url.toLowerCase().endsWith('.bvh')) {
                    return this._loadBVH(url, name, retarget);
                }

                if (!this._loader) {
                    // GLTFLoader is already imported at the top of the file
                    this._loader = new GLTFLoader();
                    // Register VRM loader plugin so VRMA files can be loaded too
                    this._loader.register((parser) => new VRMLoaderPlugin(parser));
                }

                return new Promise((resolve, reject) => {
                    this._loader.load(url, (gltf) => {
                        // VRMA files store animations in userData.vrmAnimations
                        // Standard GLB/GLTF stores them in gltf.animations
                        const animations = gltf.animations || [];
                        if (animations.length === 0) {
                            reject(new Error(`No animations found in ${url}`));
                            return;
                        }

                        // Retarget Mixamo/BVH bone names → VRM humanoid bones if requested
                        if (retarget) {
                            for (const anim of animations) {
                                this.retargetClip(anim);
                            }
                        }

                        // Store all clips; the first one gets the requested name
                        const primary = animations[0];
                        primary.name = name;
                        this.clipLibrary[name] = primary;

                        // Store extras with indexed names (wave_1, wave_2, etc.)
                        for (let i = 1; i < animations.length; i++) {
                            const extraName = `${name}_${i}`;
                            animations[i].name = extraName;
                            this.clipLibrary[extraName] = animations[i];
                        }

                        console.log(`[ClipLayer] Loaded "${name}" (${primary.duration.toFixed(1)}s, ${primary.tracks.length} tracks)`);
                        resolve({
                            name,
                            duration: primary.duration,
                            tracks: primary.tracks.length,
                        });
                    }, undefined, (err) => {
                        console.error(`[ClipLayer] Failed to load ${url}:`, err);
                        reject(err);
                    });
                });
            }

            /**
             * Load a BVH file by fetching it as text and parsing inline.
             *
             * Uses a lightweight BVH parser that extracts rotation channels and
             * converts Euler angles to quaternion tracks. Position channels are
             * extracted for the root bone only.
             *
             * @param {string} url - URL of the .bvh file
             * @param {string} name - Friendly name for the clip
             * @param {boolean} retarget - Whether to retarget bone names
             * @returns {Promise<{name: string, duration: number, tracks: number}>}
             * @private
             */
            async _loadBVH(url, name, retarget) {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to fetch BVH: ${response.status}`);
                const text = await response.text();

                const lines = text.split(/[\r\n]+/g);
                const bones = [];
                let idx = 0;
                const boneStack = [];

                // Parse hierarchy
                while (idx < lines.length && !lines[idx].trim().startsWith('ROOT')) idx++;

                function parseJoints() {
                    while (idx < lines.length) {
                        const line = lines[idx].trim();
                        idx++;
                        if (!line) continue;
                        const tokens = line.split(/\s+/);

                        if (tokens[0] === 'ROOT' || tokens[0] === 'JOINT' || tokens[0] === 'End') {
                            const isEnd = tokens[0] === 'End';
                            const boneName = isEnd
                                ? (boneStack.length > 0 ? boneStack[boneStack.length - 1].name + '_End' : 'End')
                                : tokens[1];
                            const bone = { name: boneName, channels: [], parent: boneStack[boneStack.length - 1] || null };
                            bones.push(bone);
                            boneStack.push(bone);
                        } else if (tokens[0] === 'CHANNELS') {
                            const current = boneStack[boneStack.length - 1];
                            const count = parseInt(tokens[1]);
                            for (let c = 0; c < count; c++) current.channels.push(tokens[c + 2]);
                        } else if (tokens[0] === '}') {
                            boneStack.pop();
                            if (boneStack.length === 0) return;
                        }
                    }
                }
                parseJoints();

                // Parse MOTION
                let frameCount = 0, frameTime = 1/30;
                while (idx < lines.length) {
                    const line = lines[idx].trim(); idx++;
                    if (line.startsWith('Frames:')) frameCount = parseInt(line.split(':')[1]);
                    else if (line.startsWith('Frame Time:')) { frameTime = parseFloat(line.split(':')[1]); break; }
                }
                const motionData = [];
                while (idx < lines.length) {
                    const line = lines[idx].trim(); idx++;
                    if (line) motionData.push(line.split(/\s+/).map(parseFloat));
                }

                // Build quaternion tracks
                const tracks = [];
                const euler = new THREE.Euler();
                const quat = new THREE.Quaternion();

                for (const bone of bones) {
                    if (bone.channels.length === 0) continue;
                    let offset = 0;
                    for (const b of bones) { if (b === bone) break; offset += b.channels.length; }

                    const times = new Float32Array(motionData.length);
                    const rotations = [];
                    const hasRot = bone.channels.some(c => c.includes('rotation'));

                    for (let f = 0; f < motionData.length; f++) {
                        times[f] = f * frameTime;
                        if (!hasRot) continue;
                        let rx = 0, ry = 0, rz = 0;
                        for (let c = 0; c < bone.channels.length; c++) {
                            const ch = bone.channels[c], val = motionData[f][offset + c];
                            if (ch === 'Xrotation') rx = val * Math.PI / 180;
                            else if (ch === 'Yrotation') ry = val * Math.PI / 180;
                            else if (ch === 'Zrotation') rz = val * Math.PI / 180;
                        }
                        const rotOrder = bone.channels.filter(c => c.includes('rotation')).map(c => c[0]).join('') || 'ZYX';
                        euler.set(rx, ry, rz, rotOrder);
                        quat.setFromEuler(euler);
                        rotations.push(quat.x, quat.y, quat.z, quat.w);
                    }

                    if (rotations.length > 0) {
                        tracks.push(new THREE.QuaternionKeyframeTrack(
                            bone.name + '.quaternion', times, new Float32Array(rotations)
                        ));
                    }
                }

                const clip = new THREE.AnimationClip(name, -1, tracks);
                if (retarget) this.retargetClip(clip);
                this.clipLibrary[name] = clip;

                console.log(`[ClipLayer] Loaded BVH "${name}" (${clip.duration.toFixed(1)}s, ${clip.tracks.length} tracks)`);
                return { name, duration: clip.duration, tracks: clip.tracks.length };
            }

            /**
             * Play a previously loaded clip by name.
             *
             * @param {string} name - Clip name from loadClip()
             * @param {Object} [opts] - Playback options
             * @param {boolean} [opts.loop=false] - Loop the animation
             * @param {number} [opts.fadeIn=0.3] - Crossfade duration in seconds
             * @param {number} [opts.timeScale=1.0] - Playback speed multiplier
             * @param {number} [opts.weight=1.0] - Blend weight (0–1)
             * @returns {boolean} True if playback started
             */
            playClip(name, opts = {}) {
                const clip = this.clipLibrary[name];
                if (!clip) {
                    console.warn(`[ClipLayer] Clip "${name}" not found in library`);
                    return false;
                }

                const {
                    loop = false,
                    fadeIn = 0.3,
                    timeScale = 1.0,
                    weight = 1.0,
                } = opts;

                // Fade out any currently playing action
                if (this.currentAction) {
                    this.currentAction.fadeOut(fadeIn);
                }

                const action = this.mixer.clipAction(clip);
                action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
                action.clampWhenFinished = !loop;
                action.timeScale = timeScale;
                action.setEffectiveWeight(weight);
                action.reset().fadeIn(fadeIn).play();

                this.currentAction = action;
                this.isPlaying = true;

                // Listen for clip completion (non-looping only)
                if (!loop) {
                    const onFinished = (e) => {
                        if (e.action === action) {
                            this.mixer.removeEventListener('finished', onFinished);
                            this.isPlaying = false;
                            this.currentAction = null;
                            console.log(`[ClipLayer] Clip "${name}" finished`);
                        }
                    };
                    this.mixer.addEventListener('finished', onFinished);
                }

                console.log(`[ClipLayer] Playing "${name}" (loop=${loop}, speed=${timeScale})`);
                return true;
            }

            /**
             * Stop the currently playing clip with a fade-out.
             * @param {number} [fadeDuration=0.3] - Fade-out duration
             */
            stopClip(fadeDuration = 0.3) {
                if (this.currentAction) {
                    this.currentAction.fadeOut(fadeDuration);
                    // Delayed cleanup after fade completes
                    setTimeout(() => {
                        if (this.currentAction) {
                            this.currentAction.stop();
                            this.currentAction = null;
                        }
                        this.isPlaying = false;
                    }, fadeDuration * 1000 + 50);
                }
            }

            /**
             * List all loaded clips in the library.
             * @returns {Array<{name: string, duration: number, tracks: number}>}
             */
            listClips() {
                return Object.entries(this.clipLibrary).map(([name, clip]) => ({
                    name,
                    duration: clip.duration,
                    tracks: clip.tracks.length,
                }));
            }

            /**
             * Per-frame update — advances the AnimationMixer.
             * @param {number} dt - Delta time in seconds
             */
            update(dt) {
                if (this.mixer) {
                    this.mixer.update(dt);
                }
            }
        }

        /**
         * L5: LookAt — always additive (+=) on eyes + head.
         * Absorbs MouseTrackingController + IdleHeadMovement into one layer.
         * When mouse is active: track cursor (head + eye gaze). When idle: gentle gaze wander.
         * This layer ALWAYS runs (never suppressed).
         *
         * Phase 6 enhancement: drives VRM lookAt target for eye gaze tracking
         * in addition to head bone rotation. The VRM lookAt system handles eye
         * blend shapes or eye bone rotation depending on the model's setup.
         */
        class LookAtLayer extends AnimationLayer {
            constructor(vrm, canvas) {
                super(vrm, 'lookAt');
                this._mouseX = 0;
                this._mouseY = 0;
                this._mouseActive = false;
                this._mouseTimeout = null;
                /** Phase 6: Whether eye gaze IK is enabled (driven by postMessage). */
                this._eyeGazeEnabled = true;
                /** Persistent Object3D used as the VRM lookAt target (must have getWorldPosition). */
                this._gazeObject3D = new THREE.Object3D();

                if (canvas) {
                    canvas.addEventListener('mousemove', (e) => {
                        const rect = canvas.getBoundingClientRect();
                        this._mouseX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
                        this._mouseY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
                        this._mouseActive = true;
                        clearTimeout(this._mouseTimeout);
                        this._mouseTimeout = setTimeout(() => { this._mouseActive = false; }, 3000);
                    });
                    canvas.addEventListener('mouseleave', () => { this._mouseActive = false; });
                }

                this._gazeTarget = { x: 0, y: 0 };
                this._gazeCurrent = { x: 0, y: 0 };
                this._gazeTimer = 2 + Math.random() * 3;
                this._headTarget = { x: 0, y: 0, z: 0 };
                this._headCurrent = { x: 0, y: 0, z: 0 };
                this._headTimer = 1 + Math.random() * 3;
            }

            update(dt) {
                super.update(dt);
                const head = this.getBone('head');
                const neck = this.getBone('neck');

                // LookAt is L5 (highest priority, last layer) — uses assignment (=)
                // not additive (+=), because these are absolute offsets from neutral
                // that should be the final head pose each frame.
                //
                // Phase 6: Also drives VRM eye lookAt target for eye gaze tracking.
                // The VRM lookAt system (vrm.lookAt) internally handles eye bone
                // rotation or eye blend shapes depending on the model's lookAtType.
                if (this._mouseActive) {
                    if (head) {
                        head.rotation.y = this._mouseX * 0.15;
                        head.rotation.x = this._mouseY * -0.08;
                    }
                    // Phase 6: Eye gaze IK — set VRM lookAt target from mouse position
                    if (this._eyeGazeEnabled && this.vrm.lookAt) {
                        // Map mouse (-1..1) to world-space gaze target ~1m in front of character
                        const gazeX = this._mouseX * 0.8;   // horizontal gaze range
                        const gazeY = -this._mouseY * 0.5 + 1.3; // vertical (head height)
                        this._gazeObject3D.position.set(gazeX, gazeY, 2.0);
                        this.vrm.lookAt.target = this._gazeObject3D;
                    }
                } else {
                    // Gaze wander: pick a new imaginary "point of interest" every 2–5s.
                    // Spread increased to ±0.45 rad yaw (≈26°) and ±0.18 rad pitch (≈10°)
                    // so the head visibly turns — the original ±0.1 was imperceptible.
                    this._gazeTimer -= dt;
                    if (this._gazeTimer <= 0) {
                        this._gazeTarget.x = (Math.random() - 0.5) * 0.9;   // yaw ±26°
                        this._gazeTarget.y = (Math.random() - 0.5) * 0.36;  // pitch ±10°
                        this._gazeTimer = 2 + Math.random() * 3;
                    }
                    // Smooth interpolation — slow lerp (dt*1.2) gives a 1–2s easing to target
                    this._gazeCurrent.x += (this._gazeTarget.x - this._gazeCurrent.x) * dt * 1.2;
                    this._gazeCurrent.y += (this._gazeTarget.y - this._gazeCurrent.y) * dt * 1.2;
                    if (head) {
                        head.rotation.y = this._gazeCurrent.x;
                        head.rotation.x = this._gazeCurrent.y;
                    }
                }

                this._headTimer -= dt;
                if (this._headTimer <= 0) {
                    const isTalkingNow = typeof isTalking !== 'undefined' && isTalking;
                    const range = isTalkingNow ? 0.06 : 0.04;
                    this._headTarget.x = (Math.random() - 0.5) * range;
                    this._headTarget.y = (Math.random() - 0.5) * range;
                    this._headTarget.z = (Math.random() - 0.5) * range * 0.5;
                    const speed = isTalkingNow ? 0.8 : 2;
                    this._headTimer = speed + Math.random() * speed;
                }
                const lerpSpeed = dt * 1.5;
                this._headCurrent.x += (this._headTarget.x - this._headCurrent.x) * lerpSpeed;
                this._headCurrent.y += (this._headTarget.y - this._headCurrent.y) * lerpSpeed;
                this._headCurrent.z += (this._headTarget.z - this._headCurrent.z) * lerpSpeed;
                if (neck) {
                    neck.rotation.x = this._headCurrent.x;
                    neck.rotation.y = this._headCurrent.y;
                    neck.rotation.z = this._headCurrent.z;
                }
            }
        }
        // ══════════════════════════════════════════════════════════
        // Procedural Animation — emotion-driven idle modifiers
        // ══════════════════════════════════════════════════════════

        /**
         * Emotion-driven idle animation modifiers.
         * Blends with existing blink/breathing controllers to make the
         * character feel more alive based on current emotion.
         */
        // @deprecated — Replaced by EmotionLayer (L2) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class ProceduralAnimator {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentEmotion = 'neutral';
                /** @type {number} Amplitude scaling factor (0–1) for all procedural motion */
                this.intensity = 0.7;
                this.breathScale = 1.0;
                this.bounceOffset = 0;
                this.swayAmount = 0;
                this.time = 0;
            }

            /**
             * Set the current emotion and intensity to adjust idle behavior.
             * @param {string} emotion - Emotion name (happy, sad, angry, excited, neutral)
             * @param {number} [intensity=0.7] - Motion amplitude scale (0–1)
             */
            setEmotion(emotion, intensity = 0.7) {
                this.currentEmotion = emotion || 'neutral';
                this.intensity = Math.min(Math.max(intensity, 0), 1);
            }

            /**
             * Per-frame update — applies subtle procedural motion to bones.
             * @param {number} deltaTime - Seconds since last frame
             */
            update(deltaTime) {
                this.time += deltaTime;
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                    this.vrm.humanoid.getNormalizedBoneNode(name) :
                    this.vrm.humanoid.getBoneNode(name);

                const spine = getBone('spine');
                const hips = getBone('hips');
                const intensity = this.intensity;

                // Hip sway — slow weight shift, always active (0.3Hz ± noise)
                if (hips) {
                    const swayNoise = 1 + Math.sin(this.time * 0.09) * 0.2;
                    hips.rotation.y = Math.sin(this.time * 0.3) * 0.02 * swayNoise * intensity;
                }

                switch (this.currentEmotion) {
                    case 'happy':
                    case 'excited':
                        // Subtle bounce + wider sway
                        if (hips) hips.position.y = Math.sin(this.time * 3) * 0.008 * intensity;
                        if (spine) spine.rotation.z = Math.sin(this.time * 1.5) * 0.02 * intensity;
                        break;
                    case 'sad':
                        // Droopy posture, slow breathing
                        if (spine) {
                            spine.rotation.x = 0.03 * intensity;
                            spine.rotation.z = Math.sin(this.time * 0.5) * 0.005 * intensity;
                        }
                        break;
                    case 'angry':
                        // Tense, minimal movement, subtle tremor
                        if (spine) spine.rotation.z = Math.sin(this.time * 8) * 0.003 * intensity;
                        break;
                    case 'thinking':
                        // Slow tilt
                        if (spine) spine.rotation.z = Math.sin(this.time * 0.8) * 0.015 * intensity;
                        break;
                    default:
                        // Neutral — very subtle sway
                        if (spine) spine.rotation.z = Math.sin(this.time * 0.7) * 0.005 * intensity;
                        break;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Audio Lip Sync
        // ══════════════════════════════════════════════════════════

        /**
         * Real-time audio-driven lip sync using Web Audio API.
         * Analyzes audio frequency data to drive the 'aa' blend shape.
         */
        /**
         * Real-time audio-driven lip sync using Web Audio API FFT analysis.
         *
         * Splits the frequency spectrum into three speech-formant bands and maps
         * each to a distinct VRM viseme for more natural mouth movement than
         * the previous single-band volume-to-'aa' approach.
         *
         * Band → viseme mapping (at 44.1kHz, fftSize=512 → ~86Hz/bin):
         *   Low  (bins 0–5,   0–430 Hz)  → 'aa'  F1 dominant, open vowels
         *   Mid  (bins 6–23,  516–1978Hz) → 'ou'  F2/F3 range, rounded vowels
         *   High (bins 24–63, 2064–5418Hz)→ 'ee'  fricatives / sibilants
         *
         * Each viseme has independent EMA smoothing to prevent jitter while
         * allowing high-frequency content (fricatives) to be more responsive.
         */
        class AudioLipSync {
            constructor(vrm) {
                this.vrm = vrm;
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                // 512-point FFT → 256 bins at ~86Hz/bin (was 256 → 128 bins at ~172Hz/bin)
                this.analyser.fftSize = 512;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.isPlaying = false;
                this.currentSource = null;
                // Per-viseme EMA state (separate smoothing for each shape)
                this.smoothAa = 0;  // low band  → open mouth
                this.smoothOu = 0;  // mid band  → rounded lips
                this.smoothEe = 0;  // high band → spread / fricative
            }

            /**
             * Play audio and drive multi-viseme lip sync from FFT analysis.
             * @param {string} audioUrl - URL of the audio file to play
             */
            async playAudioWithLipSync(audioUrl) {
                try {
                    this.stop();
                    const response = await fetch(audioUrl);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);

                    const source = this.audioContext.createBufferSource();
                    source.buffer = audioBuffer;
                    source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);

                    this.currentSource = source;
                    this.isPlaying = true;
                    isTalking = true;  // Phase 6D: switch to talk motion params
                    if (saccadeController) saccadeController.setTalking(true);
                    source.start(0);

                    source.onended = () => {
                        this.isPlaying = false;
                        this.currentSource = null;
                        isTalking = false;  // Phase 6D: revert to idle motion params
                        if (saccadeController) saccadeController.setTalking(false);
                        this._zeroAllVisemes();
                    };

                    this.updateLipSync();
                } catch (error) {
                    console.error('LIPSYNC_ERROR:', error);
                    this.isPlaying = false;
                    this._zeroAllVisemes();
                }
            }

            /**
             * Per-frame lip sync update — computes band energies and drives visemes.
             * Called via requestAnimationFrame while audio is playing.
             */
            updateLipSync() {
                if (!this.isPlaying) return;
                this.analyser.getByteFrequencyData(this.dataArray);

                // Low band: bins 0–5 (~0–430 Hz), captures F1 for open vowels
                let lowSum = 0;
                for (let i = 0; i <= 5; i++) lowSum += this.dataArray[i];

                // Mid band: bins 6–23 (~516–1978 Hz), captures F2/F3 for rounded vowels
                let midSum = 0;
                for (let i = 6; i <= 23; i++) midSum += this.dataArray[i];

                // High band: bins 24–63 (~2064–5418 Hz), captures fricatives/sibilants
                let highSum = 0;
                for (let i = 24; i <= 63; i++) highSum += this.dataArray[i];

                // Normalize: bin values are 0–255, /128 gives 0–2 range, clamp to 0–1.
                // The /128 threshold biases toward active speech rather than ambient noise.
                const aaRaw = Math.min(lowSum  / 6  / 128, 1.0);
                const ouRaw = Math.min(midSum  / 18 / 128, 1.0);
                const eeRaw = Math.min(highSum / 40 / 128, 1.0);

                // Per-viseme EMA — alphas tuned to physiological movement speed:
                //   'aa' (jaw): moderately responsive, alpha=0.4
                //   'ou' (lip rounding): slowest — sustained posture, alpha=0.35
                //   'ee' (lip spread): most responsive — tracks fast fricatives, alpha=0.5
                this.smoothAa = aaRaw * 0.4  + this.smoothAa * 0.6;
                this.smoothOu = ouRaw * 0.35 + this.smoothOu * 0.65;
                this.smoothEe = eeRaw * 0.5  + this.smoothEe * 0.5;

                this._applyVisemes(this.smoothAa, this.smoothOu, this.smoothEe);
                requestAnimationFrame(() => this.updateLipSync());
            }

            /**
             * Apply computed viseme values to the VRM expression manager.
             * Each viseme uses an individual try/catch so a VRM missing one
             * blend shape doesn't prevent the others from being applied.
             *
             * @param {number} aa - 0–1, open mouth ('aa')
             * @param {number} ou - 0–1, rounded lips ('ou')
             * @param {number} ee - 0–1, spread lips / fricative ('ee')
             */
            _applyVisemes(aa, ou, ee) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;
                try { em.setValue('aa', aa); } catch (e) {}
                try { em.setValue('ou', ou); } catch (e) {}
                try { em.setValue('ee', ee); } catch (e) {}
            }

            /**
             * Zero all viseme blend shapes and reset EMA state.
             * Resets smoothing state so the next utterance starts from 0,
             * not from the decayed value of the previous one.
             */
            _zeroAllVisemes() {
                this.smoothAa = 0;
                this.smoothOu = 0;
                this.smoothEe = 0;
                this._applyVisemes(0, 0, 0);
            }

            /**
             * Stop audio playback and clear all viseme state.
             */
            stop() {
                if (this.currentSource) {
                    try { this.currentSource.stop(); } catch (e) {}
                    this.currentSource = null;
                }
                this.isPlaying = false;
                this._zeroAllVisemes();
            }
        }

        // ══════════════════════════════════════════════════════════
        // Idle vs. Talking Motion Parameters (Phase 6D)
        // ══════════════════════════════════════════════════════════

        /**
         * Global talking state — set true when TTS audio begins, false when it ends.
         * Read by IdleHeadMovement to pick the appropriate motion parameter set.
         */
        let isTalking = false;

        /**
         * Motion parameters for idle (silent) state.
         * Calm, slow, minimal range — the character is at rest.
         * @type {{nodRange: number, turnRange: number, tiltRange: number, moveInterval: [number,number], lerpSpeed: number}}
         */
        const MOTION_IDLE = {
            nodRange:      0.08,   // X-axis (pitch)
            turnRange:     0.12,   // Y-axis (yaw)
            tiltRange:     0.05,   // Z-axis (roll)
            minInterval:   4,      // seconds between head target updates (min)
            maxInterval:   9,      // seconds between head target updates (max)
            lerpSpeed:     0.4,    // per-frame lerp alpha (lower = smoother/slower)
        };

        /**
         * Motion parameters for talking state.
         * More frequent, wider range — the character is engaged and expressive.
         * @type {{nodRange: number, turnRange: number, tiltRange: number, moveInterval: [number,number], lerpSpeed: number}}
         */
        const MOTION_TALK = {
            nodRange:      0.15,
            turnRange:     0.18,
            tiltRange:     0.10,
            minInterval:   1,
            maxInterval:   3,
            lerpSpeed:     0.6,
        };

        // ══════════════════════════════════════════════════════════
        // Enhanced Blink Controller (Phase 12-P1)
        // ══════════════════════════════════════════════════════════
        // Features: Poisson-distributed intervals, emotion modulation,
        // asymmetric L/R timing, 15% double-blink chance, variable speed.

        class BlinkController {
            constructor(vrm) {
                this.vrm = vrm;
                this.nextBlinkTime = this._poissonDelay();
                this.isBlinking = false;
                this.blinkProgress = 0;
                this.doubleBlink = false;
                this.blinkSpeed = 8;  // base close/open speed
                /** Emotion state affects blink rate and speed.
                 *  Set externally via setEmotion(). */
                this._emotionMod = { rateMul: 1.0, speedMul: 1.0 };
            }

            /**
             * Set emotion modulation for blink behavior.
             * @param {string} emotion - Current emotion name
             */
            setEmotion(emotion) {
                const mods = {
                    nervous:   { rateMul: 1.8, speedMul: 1.3 },
                    excited:   { rateMul: 1.5, speedMul: 1.2 },
                    happy:     { rateMul: 1.1, speedMul: 1.0 },
                    calm:      { rateMul: 0.7, speedMul: 0.9 },
                    sad:       { rateMul: 0.6, speedMul: 0.7 },
                    tired:     { rateMul: 0.5, speedMul: 0.6 },
                    neutral:   { rateMul: 1.0, speedMul: 1.0 },
                };
                this._emotionMod = mods[emotion] || mods.neutral;
            }

            update(deltaTime) {
                const speed = this.blinkSpeed * this._emotionMod.speedMul;
                if (this.isBlinking) {
                    this.blinkProgress += deltaTime * speed;
                    // Asymmetric: right eye leads by ~15ms (1 frame at 60fps)
                    const rightVal = Math.min(1, this.blinkProgress < 0.5
                        ? this.blinkProgress * 2 : 1.0 - ((this.blinkProgress - 0.5) * 2));
                    const leftDelay = Math.max(0, this.blinkProgress - 0.02);
                    const leftVal = Math.min(1, leftDelay < 0.5
                        ? leftDelay * 2 : 1.0 - ((leftDelay - 0.5) * 2));
                    this._setBlinkLR(leftVal, rightVal);

                    if (this.blinkProgress >= 1.0) {
                        this.isBlinking = false;
                        this.blinkProgress = 0;
                        this._setBlinkLR(0, 0);
                        // 15% chance of immediate double-blink
                        if (!this.doubleBlink && Math.random() < 0.15) {
                            this.doubleBlink = true;
                            this.nextBlinkTime = 0.08; // near-instant second blink
                        } else {
                            this.doubleBlink = false;
                            this.nextBlinkTime = this._poissonDelay();
                        }
                    }
                } else {
                    this.nextBlinkTime -= deltaTime;
                    if (this.nextBlinkTime <= 0) this.isBlinking = true;
                }
            }

            _setBlinkLR(leftVal, rightVal) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;
                // Try per-eye first, fall back to combined blink
                if (em.setValue) {
                    try { em.setValue('blinkLeft', leftVal); em.setValue('blinkRight', rightVal); return; }
                    catch { /* per-eye not supported */ }
                    em.setValue('blink', rightVal); // fallback to combined
                }
            }

            /** Poisson-distributed blink interval (~4.5 blinks/min = 13.3s mean).
             *  Emotion modulation scales the rate. */
            _poissonDelay() {
                const baseMean = 13.3 / this._emotionMod.rateMul;
                // Exponential distribution (memoryless, natural feel)
                return -baseMean * Math.log(1 - Math.random()) * 0.5 + 1.5;
            }
        }

        // ══════════════════════════════════════════════════════════
        // Eye Saccade Controller (Phase 12-P1)
        // ══════════════════════════════════════════════════════════
        // Random gaze fixation shifts every 2-5 seconds.
        // Creates the "looking around, alive" feeling.

        class SaccadeController {
            constructor(vrm) {
                this.vrm = vrm;
                this.nextSaccadeTime = 2 + Math.random() * 3;
                this.targetYaw = 0;
                this.targetPitch = 0;
                this.currentYaw = 0;
                this.currentPitch = 0;
                this._saccadeSpeed = 0.15; // lerp factor per frame
                this._isTalking = false;
            }

            /** When character is talking, eyes stay more fixed on camera. */
            setTalking(talking) { this._isTalking = talking; }

            update(deltaTime) {
                this.nextSaccadeTime -= deltaTime;
                if (this.nextSaccadeTime <= 0) {
                    // Pick new gaze target
                    const range = this._isTalking ? 0.05 : 0.15; // narrower during speech
                    this.targetYaw = (Math.random() - 0.5) * range;
                    this.targetPitch = (Math.random() - 0.5) * range * 0.5;
                    this.nextSaccadeTime = 2 + Math.random() * 3;
                }

                // Smooth pursuit toward target (fast saccade, not drift)
                this.currentYaw += (this.targetYaw - this.currentYaw) * this._saccadeSpeed;
                this.currentPitch += (this.targetPitch - this.currentPitch) * this._saccadeSpeed;

                // Apply to eye bones
                if (!this.vrm?.humanoid) return;
                const leftEye = this.vrm.humanoid.getNormalizedBoneNode('leftEye');
                const rightEye = this.vrm.humanoid.getNormalizedBoneNode('rightEye');
                if (leftEye) {
                    leftEye.rotation.y += this.currentYaw;
                    leftEye.rotation.x += this.currentPitch;
                }
                if (rightEye) {
                    rightEye.rotation.y += this.currentYaw;
                    rightEye.rotation.x += this.currentPitch;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Micro-Tremor Controller (Phase 12-P1)
        // ══════════════════════════════════════════════════════════
        // High-frequency, imperceptible jitter on idle bones.
        // Prevents the "perfectly still = dead" perception.
        // Only active during idle state — disabled during gestures.

        class MicroTremorController {
            constructor(vrm) {
                this.vrm = vrm;
                this.enabled = true;
                this._time = Math.random() * 100; // random phase offset
            }

            update(deltaTime) {
                if (!this.enabled || !this.vrm?.humanoid) return;
                this._time += deltaTime;

                const t = this._time;
                // Apply tiny high-frequency noise to core bones
                const bones = ['spine', 'chest', 'head', 'neck'];
                for (const name of bones) {
                    const bone = this.vrm.humanoid.getNormalizedBoneNode(name);
                    if (!bone) continue;
                    // Different frequency per bone + axis for organic feel
                    const seed = name.charCodeAt(0) * 0.1;
                    const amp = name === 'head' ? 0.002 : 0.001; // head tremors slightly more
                    bone.rotation.x += Math.sin(t * 11.3 + seed) * amp;
                    bone.rotation.y += Math.sin(t * 9.7 + seed + 1.5) * amp * 0.7;
                    bone.rotation.z += Math.sin(t * 13.1 + seed + 3.0) * amp * 0.5;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Micro-Expression Controller (Phase 12-P2)
        // ══════════════════════════════════════════════════════════
        // Random, subtle facial micro-expressions that fire occasionally.
        // Eyebrow twitches, lip quivers, nose scrunches — the tiny
        // involuntary movements that make a face look alive.

        class MicroExpressionController {
            constructor(vrm) {
                this.vrm = vrm;
                this._time = 0;
                this._activeExpr = null;
                this._exprProgress = 0;
                this._exprDuration = 0;
                this._nextCheckTime = 2 + Math.random() * 3;
                this._emotionMod = 1.0; // emotion probability multiplier
                // Micro-expression definitions: target blend shape, amplitude, duration
                this._expressions = [
                    { name: 'eyebrow_raise', targets: [{shape: 'surprised', amp: 0.15}], duration: 0.3, probability: 0.03 },
                    { name: 'slight_smile', targets: [{shape: 'happy', amp: 0.12}], duration: 0.4, probability: 0.025 },
                    { name: 'slight_frown', targets: [{shape: 'sad', amp: 0.1}], duration: 0.35, probability: 0.015 },
                    { name: 'nose_scrunch', targets: [{shape: 'angry', amp: 0.08}], duration: 0.25, probability: 0.01 },
                    { name: 'lip_part', targets: [{shape: 'aa', amp: 0.1}], duration: 0.2, probability: 0.02 },
                ];
            }

            /** Adjust micro-expression frequency based on emotion state. */
            setEmotion(emotion) {
                const mods = {
                    nervous: 2.5, excited: 2.0, happy: 1.3,
                    calm: 0.5, tired: 0.3, neutral: 1.0, sad: 0.7,
                };
                this._emotionMod = mods[emotion] || 1.0;
            }

            update(deltaTime) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;

                this._time += deltaTime;

                // If a micro-expression is active, animate it
                if (this._activeExpr) {
                    this._exprProgress += deltaTime;
                    const t = this._exprProgress / this._exprDuration;
                    // Bell curve: ramp up then down
                    const blend = t < 0.5
                        ? Math.sin(t * Math.PI)     // 0→1 in first half
                        : Math.sin(t * Math.PI);    // 1→0 in second half

                    for (const target of this._activeExpr.targets) {
                        try { em.setValue(target.shape, target.amp * blend); } catch {}
                    }

                    if (this._exprProgress >= this._exprDuration) {
                        // Clean up — zero out the blend shapes we touched
                        for (const target of this._activeExpr.targets) {
                            try { em.setValue(target.shape, 0); } catch {}
                        }
                        this._activeExpr = null;
                        this._exprProgress = 0;
                        this._nextCheckTime = 1.5 + Math.random() * 3;
                    }
                    return;
                }

                // Check for new micro-expression trigger
                this._nextCheckTime -= deltaTime;
                if (this._nextCheckTime > 0) return;
                this._nextCheckTime = 0.5 + Math.random() * 1.5;

                // Roll dice for each possible expression
                for (const expr of this._expressions) {
                    if (Math.random() < expr.probability * this._emotionMod) {
                        this._activeExpr = expr;
                        this._exprProgress = 0;
                        this._exprDuration = expr.duration;
                        break;
                    }
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Idle Head Movement
        // ══════════════════════════════════════════════════════════

        // @deprecated — Replaced by LookAtLayer (L5) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class IdleHeadMovement {
            constructor(vrm) {
                this.vrm = vrm;
                this.headTarget = { x: 0, y: 0, z: 0 };
                this.headCurrent = { x: 0, y: 0, z: 0 };
                this.nextMoveTime = 5;
            }

            update(deltaTime) {
                // Pick motion params based on global isTalking flag (Phase 6D).
                // During speech: more frequent, wider-range head movement signals engagement.
                const mp = isTalking ? MOTION_TALK : MOTION_IDLE;

                this.nextMoveTime -= deltaTime;
                if (this.nextMoveTime <= 0) {
                    this.headTarget = {
                        x: (Math.random() - 0.5) * mp.nodRange  * 2,
                        y: (Math.random() - 0.5) * mp.turnRange * 2,
                        z: (Math.random() - 0.5) * mp.tiltRange * 2,
                    };
                    this.nextMoveTime = mp.minInterval + Math.random() * (mp.maxInterval - mp.minInterval);
                }
                const lerpSpeed = deltaTime * mp.lerpSpeed;
                this.headCurrent.x += (this.headTarget.x - this.headCurrent.x) * lerpSpeed;
                this.headCurrent.y += (this.headTarget.y - this.headCurrent.y) * lerpSpeed;
                this.headCurrent.z += (this.headTarget.z - this.headCurrent.z) * lerpSpeed;

                const head = this.vrm.humanoid.getNormalizedBoneNode ?
                             this.vrm.humanoid.getNormalizedBoneNode('head') :
                             this.vrm.humanoid.getBoneNode('head');

                if (head) {
                    head.rotation.x = this.headCurrent.x;
                    head.rotation.y = this.headCurrent.y;
                    head.rotation.z = this.headCurrent.z;
                }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Mouse Tracking Controller (Eyes + Subtle Head Follow)
        // ══════════════════════════════════════════════════════════

        /**
         * Tracks mouse cursor position to drive eye bone rotations
         * and add subtle additive head rotation for a "looking at you" effect.
         * Runs AFTER IdleHeadMovement so head follow is additive (+=).
         */
        // @deprecated — Replaced by LookAtLayer (L5) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class MouseTrackingController {
            constructor(vrm, canvas) {
                this.vrm = vrm;
                this.canvas = canvas;
                /** @type {{x: number, y: number}} Normalized cursor -1..1 */
                this.cursor = { x: 0, y: 0 };
                /** @type {{x: number, y: number}} Smoothed eye target */
                this.eyeCurrent = { x: 0, y: 0 };
                /** @type {{x: number, y: number}} Smoothed head offset */
                this.headOffset = { x: 0, y: 0 };
                this.active = true;

                this._onMouseMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.cursor.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    this.cursor.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    this.active = true;
                };
                this._onMouseLeave = () => {
                    this.active = false;
                    this.cursor.x = 0;
                    this.cursor.y = 0;
                };

                canvas.addEventListener('mousemove', this._onMouseMove);
                canvas.addEventListener('mouseleave', this._onMouseLeave);
            }

            /**
             * Per-frame update — lerp eyes and head toward cursor.
             * @param {number} deltaTime - Seconds since last frame
             */
            update(deltaTime) {
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                    this.vrm.humanoid.getNormalizedBoneNode(name) :
                    this.vrm.humanoid.getBoneNode(name);

                const targetX = this.active ? this.cursor.x : 0;
                const targetY = this.active ? this.cursor.y : 0;

                // Eye tracking — fast lerp (responsive feel)
                const eyeSpeed = deltaTime * 3;
                this.eyeCurrent.x += (targetX - this.eyeCurrent.x) * eyeSpeed;
                this.eyeCurrent.y += (targetY - this.eyeCurrent.y) * eyeSpeed;

                const leftEye = getBone('leftEye');
                const rightEye = getBone('rightEye');
                if (leftEye) {
                    leftEye.rotation.y = this.eyeCurrent.x * 0.3;
                    leftEye.rotation.x = -this.eyeCurrent.y * 0.15;
                }
                if (rightEye) {
                    rightEye.rotation.y = this.eyeCurrent.x * 0.3;
                    rightEye.rotation.x = -this.eyeCurrent.y * 0.15;
                }

                // Subtle head follow — slow lerp, ADDITIVE (+=) to blend with idle
                const headSpeed = deltaTime * 1;
                this.headOffset.x += (targetX * 0.12 - this.headOffset.x) * headSpeed;
                this.headOffset.y += (targetY * 0.08 - this.headOffset.y) * headSpeed;

                const head = getBone('head');
                if (head) {
                    head.rotation.y += this.headOffset.x;
                    head.rotation.x += -this.headOffset.y;
                }
            }

            dispose() {
                this.canvas.removeEventListener('mousemove', this._onMouseMove);
                this.canvas.removeEventListener('mouseleave', this._onMouseLeave);
            }
        }

        // ══════════════════════════════════════════════════════════
        // Expression Controller
        // ══════════════════════════════════════════════════════════

        class ExpressionController {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentExpression = "neutral";
                this.targetExpression = "neutral";
                this.currentIntensity = 0;
                this.targetIntensity = 0;
                this.transitionProgress = 1.0;
                this.transitionDuration = 0.3; // 0.3s default (#24) — snappy but smooth
            }

            setExpression(emotion, intensity = 1.0, duration = 0.5) {
                if (emotion === this.targetExpression) return;
                this.targetExpression = emotion;
                this.targetIntensity = Math.min(Math.max(intensity, 0), 1);
                this.transitionDuration = duration;
                this.transitionProgress = 0;
            }

            update(deltaTime) {
                if (this.transitionProgress < 1.0) {
                    this.transitionProgress += deltaTime / this.transitionDuration;
                    const t = Math.min(this.transitionProgress, 1.0);
                    const eased = t * t * (3 - 2 * t);
                    const blendedIntensity = this.currentIntensity + (this.targetIntensity - this.currentIntensity) * eased;
                    this.applyExpression(this.targetExpression, blendedIntensity);
                    if (this.transitionProgress >= 1.0) {
                        this.currentExpression = this.targetExpression;
                        this.currentIntensity = this.targetIntensity;
                    }
                }
            }

            applyExpression(emotion, intensity) {
                if (!this.vrm) return;
                const em = this.vrm.expressionManager || this.vrm.blendShapeProxy;
                if (!em) return;

                ['happy', 'sad', 'surprised', 'angry', 'relaxed'].forEach(expr => {
                    try { em.setValue(expr, 0); } catch(e) {}
                });

                try {
                    if (emotion === "happy") em.setValue('happy', intensity);
                    else if (emotion === "sad") em.setValue('sad', intensity);
                    else if (emotion === "surprised") em.setValue('surprised', intensity);
                    else if (emotion === "angry") em.setValue('angry', intensity);
                    else if (emotion === "confused") {
                        em.setValue('surprised', intensity * 0.4);
                        const head = this.vrm.humanoid.getNormalizedBoneNode ?
                                     this.vrm.humanoid.getNormalizedBoneNode('head') :
                                     this.vrm.humanoid.getBoneNode('head');
                        if (head) head.rotation.z = 0.15 * intensity;
                    }
                    else if (emotion === "thinking") em.setValue('relaxed', intensity * 0.6);
                } catch (e) { console.warn('Expression not available:', emotion); }
            }
        }

        // ══════════════════════════════════════════════════════════
        // Gesture Controller (expanded with new gestures)
        // ══════════════════════════════════════════════════════════

        // @deprecated — Replaced by GestureLayer (L4) in AnimationDirector (Phase 6F).
        // Kept temporarily for reference. Safe to remove in future cleanup.
        class GestureController {
            constructor(vrm) {
                this.vrm = vrm;
                this.currentGesture = null;
                this.gestureProgress = 0;
                this.gestureDuration = 0;
                this.gestureQueue = [];
            }

            /**
             * Play a gesture animation on the VRM model.
             * Supports: nod, tilt, wave, shrug, bow, clap, think, point, celebrate, shy, dance
             * @param {string} gesture - Gesture name
             */
            playGesture(gesture) {
                if (this.currentGesture) {
                    this.gestureQueue.push(gesture);
                    return;
                }
                this.currentGesture = gesture;
                this.gestureProgress = 0;
                // Duration varies per gesture
                const durations = {
                    nod: 0.6, tilt: 0.5, wave: 1.0, shrug: 0.8,
                    bow: 1.2, clap: 0.8, think: 1.5, point: 0.7,
                    celebrate: 1.2, shy: 1.0, dance: 2.0,
                    foot_tap: 1.8, crossed_arms: 2.0, shake: 0.8,
                    // Pet-mode idle animations (externally triggered from PetView.tsx)
                    doze: 4.0, wake_up: 1.2, wave_at_cursor: 2.5,
                };
                this.gestureDuration = durations[gesture] || 0.6;
            }

            /**
             * Play a sequence of gestures with timing.
             * @param {Array<{gesture: string, delay?: number}>} sequence
             */
            playSequence(sequence) {
                if (!Array.isArray(sequence) || sequence.length === 0) return;
                this.playGesture(sequence[0].gesture);
                for (let i = 1; i < sequence.length; i++) {
                    this.gestureQueue.push(sequence[i].gesture);
                }
            }

            update(deltaTime) {
                if (!this.currentGesture) return;
                this.gestureProgress += deltaTime;

                if (this.gestureProgress >= this.gestureDuration) {
                    this.resetGesture();
                    this.currentGesture = null;
                    // Check queue
                    if (this.gestureQueue.length > 0) {
                        this.playGesture(this.gestureQueue.shift());
                    }
                    return;
                }

                const t = this.gestureProgress / this.gestureDuration;
                const eased = Math.sin(t * Math.PI);

                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                switch (this.currentGesture) {
                    case 'nod': {
                        const neck = getBone('neck');
                        if (neck) neck.rotation.x = eased * 0.3;
                        break;
                    }
                    case 'tilt': {
                        const head = getBone('head');
                        if (head) head.rotation.z = eased * 0.35;
                        break;
                    }
                    case 'wave': {
                        const rightArm = getBone('rightUpperArm');
                        const rightHand = getBone('rightHand');
                        if (rightArm) {
                            rightArm.rotation.z = -eased * 1.3;
                            rightArm.rotation.x = eased * 0.3;
                        }
                        if (rightHand) rightHand.rotation.z = Math.sin(t * Math.PI * 4) * 0.4;
                        break;
                    }
                    case 'shrug': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        const headBone = getBone('head');
                        if (headBone) headBone.rotation.z = Math.sin(t * Math.PI) * 0.1;
                        break;
                    }
                    case 'bow': {
                        const spine = getBone('spine');
                        const neck = getBone('neck');
                        if (spine) spine.rotation.x = eased * 0.4;
                        if (neck) neck.rotation.x = eased * 0.2;
                        break;
                    }
                    case 'clap': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lForearm = getBone('leftLowerArm');
                        const rForearm = getBone('rightLowerArm');
                        const clapCycle = Math.sin(t * Math.PI * 6); // 3 claps
                        if (lArm) lArm.rotation.z = 0.5 + clapCycle * 0.15;
                        if (rArm) rArm.rotation.z = -0.5 - clapCycle * 0.15;
                        if (lForearm) lForearm.rotation.y = -0.8 + clapCycle * 0.2;
                        if (rForearm) rForearm.rotation.y = 0.8 - clapCycle * 0.2;
                        break;
                    }
                    case 'think': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        const head = getBone('head');
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (rForearm) rForearm.rotation.y = eased * 1.2;
                        if (head) {
                            head.rotation.z = eased * 0.12;
                            head.rotation.x = eased * 0.08;
                        }
                        break;
                    }
                    case 'point': {
                        const rArm = getBone('rightUpperArm');
                        const rForearm = getBone('rightLowerArm');
                        if (rArm) {
                            rArm.rotation.z = -eased * 0.8;
                            rArm.rotation.x = eased * 0.3;
                        }
                        if (rForearm) rForearm.rotation.y = eased * 0.4;
                        break;
                    }
                    case 'celebrate': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const lHand = getBone('leftHand');
                        const rHand = getBone('rightHand');
                        if (lArm) lArm.rotation.z = eased * 1.5;
                        if (rArm) rArm.rotation.z = -eased * 1.5;
                        if (lHand) lHand.rotation.z = Math.sin(t * Math.PI * 6) * 0.4;
                        if (rHand) rHand.rotation.z = Math.sin(t * Math.PI * 6 + 1) * 0.4;
                        break;
                    }
                    case 'shy': {
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const head = getBone('head');
                        const spine = getBone('spine');
                        if (lArm) lArm.rotation.z = eased * 0.3;
                        if (rArm) rArm.rotation.z = -eased * 0.3;
                        if (head) head.rotation.x = eased * 0.2;
                        if (spine) spine.rotation.z = eased * 0.05;
                        break;
                    }
                    case 'dance': {
                        const hips = getBone('hips');
                        const lArm = getBone('leftUpperArm');
                        const rArm = getBone('rightUpperArm');
                        const danceBeat = Math.sin(t * Math.PI * 4);
                        if (hips) hips.position.y = danceBeat * 0.02;
                        if (lArm) lArm.rotation.z = 0.3 + danceBeat * 0.4;
                        if (rArm) rArm.rotation.z = -0.3 - danceBeat * 0.4;
                        break;
                    }

                    case 'foot_tap': {
                        // Rapid foot-tap: right leg lifts and drops 3 times.
                        // Each cycle is 0.6s → 3 taps in 1.8s total.
                        const tapFreq = 3;  // taps per gesture duration
                        const tapBeat = Math.sin(t * Math.PI * 2 * tapFreq);
                        const rLeg = getBone('rightUpperLeg');
                        const rLower = getBone('rightLowerLeg');
                        const rFoot = getBone('rightFoot');
                        if (rLeg)   rLeg.rotation.x   = tapBeat * 0.12;   // slight hip kick
                        if (rLower) rLower.rotation.x  = -tapBeat * 0.1;  // knee flex
                        if (rFoot)  rFoot.rotation.x   = tapBeat * 0.15;  // foot strike
                        break;
                    }

                    case 'crossed_arms': {
                        // Bring both upper arms forward and across the chest.
                        // Hold position for the full duration (sustained pose).
                        const holdT = Math.min(1.0, eased * 2.0);  // fast ramp-in, hold, ramp-out at end
                        const releaseT = t > 0.8 ? (1.0 - t) / 0.2 : 1.0;
                        const blend = holdT * releaseT;
                        const lUpper = getBone('leftUpperArm');
                        const rUpper = getBone('rightUpperArm');
                        const lLower = getBone('leftLowerArm');
                        const rLower2 = getBone('rightLowerArm');
                        // Pull arms inward across chest
                        if (lUpper) { lUpper.rotation.x = blend * 1.1; lUpper.rotation.z = blend * -0.5; }
                        if (rUpper) { rUpper.rotation.x = blend * 1.1; rUpper.rotation.z = blend * 0.5; }
                        // Forearms fold to complete the cross
                        if (lLower)  lLower.rotation.x  = blend * 1.2;
                        if (rLower2) rLower2.rotation.x = blend * 1.2;
                        break;
                    }

                    case 'shake': {
                        // Head shake left-right (disagreement / "no" gesture)
                        const shakeBeat = Math.sin(t * Math.PI * 3);
                        const neck = getBone('neck');
                        const head = getBone('head');
                        if (neck) neck.rotation.y = shakeBeat * 0.25;
                        if (head) head.rotation.y = shakeBeat * 0.15;
                        break;
                    }

                    // ── Pet-mode exclusive gestures ─────────────────────────────────
                    // Triggered externally from PetView.tsx via postMessage playGesture.

                    case 'doze': {
                        // Gradual head droop — character dozing off during long idle sessions.
                        // Slow ramp-in over first 60%, then holds with gentle breathing motion.
                        const dozeHead = getBone('head'), dozeNeck = getBone('neck'), dozeSpine = getBone('spine');
                        const droop = Math.min(1.0, t / 0.6);
                        const breathe = Math.sin(t * Math.PI * 1.5) * 0.015;
                        if (dozeHead) { dozeHead.rotation.x = droop * 0.35; dozeHead.rotation.z = droop * 0.05; }
                        if (dozeNeck) dozeNeck.rotation.x = droop * 0.18;
                        if (dozeSpine) dozeSpine.rotation.x = droop * 0.08 + breathe;
                        break;
                    }

                    case 'wake_up': {
                        // Quick startle from doze — head snaps back up, arms raise, then settle.
                        // Sharp recoil in first 30%, gradual settle in remaining 70%.
                        const wakeHead = getBone('head'), wakeNeck = getBone('neck'), wakeSpine = getBone('spine');
                        const wakeLa = getBone('leftUpperArm'), wakeRa = getBone('rightUpperArm');
                        const snapT = t < 0.3 ? t / 0.3 : 1.0 - (t - 0.3) / 0.7;
                        const recoil = Math.sin(snapT * Math.PI);
                        if (wakeHead) { wakeHead.rotation.x = -recoil * 0.25; wakeHead.rotation.y = recoil * 0.04; }
                        if (wakeNeck) wakeNeck.rotation.x = -recoil * 0.12;
                        if (wakeSpine) wakeSpine.rotation.x = -recoil * 0.06;
                        if (wakeLa) wakeLa.rotation.z = -1.3 - recoil * 0.2;
                        if (wakeRa) wakeRa.rotation.z = 1.3 + recoil * 0.2;
                        break;
                    }

                    case 'wave_at_cursor': {
                        // Friendly wave toward the cursor when it approaches the pet window.
                        // Arm raises (first 25%), waves 2.5 cycles, then lowers (last 25%).
                        const waveRa = getBone('rightUpperArm'), waveRLower = getBone('rightLowerArm'), waveHead = getBone('head');
                        const raiseT = Math.min(1.0, t / 0.25);
                        const wave = Math.sin(t * Math.PI * 5) * 0.22;
                        const lowerT = t > 0.75 ? (t - 0.75) / 0.25 : 0;
                        const armUp = raiseT - lowerT;
                        if (waveRa) { waveRa.rotation.z = 1.3 - 0.95 * armUp; waveRa.rotation.x = armUp * 0.3 + wave * armUp; }
                        if (waveRLower) waveRLower.rotation.x = armUp * 0.4;
                        if (waveHead) waveHead.rotation.z = -armUp * 0.06;
                        break;
                    }
                }
            }

            resetGesture() {
                if (!this.vrm) return;
                const bones = ['neck', 'head', 'spine', 'hips',
                               'leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm',
                               'leftHand', 'rightHand',
                               'rightUpperLeg', 'rightLowerLeg', 'rightFoot'];
                const getBone = (name) => this.vrm.humanoid.getNormalizedBoneNode ?
                                          this.vrm.humanoid.getNormalizedBoneNode(name) :
                                          this.vrm.humanoid.getBoneNode(name);

                bones.forEach(boneName => {
                    const bone = getBone(boneName);
                    if (bone) {
                        bone.rotation.x = 0;
                        bone.rotation.y = 0;
                        bone.rotation.z = 0;
                        if (bone.position) {
                            bone.position.x = 0;
                            bone.position.y = 0;
                            bone.position.z = 0;
                        }
                    }
                });
            }
        }

        // ══════════════════════════════════════════════════════════
        // Lighting Presets
        // ══════════════════════════════════════════════════════════
